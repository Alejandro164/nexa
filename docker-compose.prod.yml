services:
  redis:
    image: redis:7-alpine
    container_name: nexa_redis_prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexa_prod_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_prod
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${APP_PORT:-8082}:8080"
    volumes:
      - datos_nexa_prod:/home/datos-nexa
    restart: unless-stopped
    networks:
      - nexa_prod_net

networks:
  nexa_prod_net:

volumes:
  redis_data_prod:
  datos_nexa_prod:
