<div th:fragment="content" id="niveles-panel" xmlns:th="http://www.thymeleaf.org">
    <div class="card">
        <div class="card-header">
            <div>
                <h3 class="card-title">Niveles y secciones</h3>
                <p class="academic-help">Administra los grupos que recibirán materias y horarios.</p>
            </div>
            <button class="btn btn-primary"
                    hx-get="/configuracion-academica/niveles/form"
                    hx-target="#modal-container"
                    onclick="abrirModalAcademico()">+ Nuevo nivel</button>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Grado</th>
                        <th>Sección</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${niveles == null or niveles.empty}">
                        <td colspan="5" class="academic-empty">No hay niveles registrados.</td>
                    </tr>
                    <tr th:each="nivel : ${niveles}">
                        <td th:text="${nivel.id}">1</td>
                        <td><strong th:text="${nivel.grado}">Sétimo</strong></td>
                        <td th:text="${nivel.seccion}">A</td>
                        <td>
                            <span th:if="${nivel.activo}" class="badge badge-success">Activo</span>
                            <span th:unless="${nivel.activo}" class="badge badge-secondary">Inactivo</span>
                        </td>
                        <td>
                            <div class="academic-actions">
                                <button class="btn btn-secondary btn-sm"
                                        th:attr="hx-get=|/configuracion-academica/niveles/form/${nivel.id}|"
                                        hx-target="#modal-container"
                                        onclick="abrirModalAcademico()">Editar</button>
                                <button type="button" class="btn btn-destructive btn-sm"
                                        th:attr="data-delete-url=|/configuracion-academica/niveles/${nivel.id}|,
                                                 data-delete-message=|¿Deseas eliminar ${nivel.grado} - ${nivel.seccion}? También se eliminarán sus lecciones asignadas.|"
                                        data-delete-title="Eliminar nivel"
                                        data-delete-target="#niveles-panel"
                                        data-delete-swap="outerHTML"
                                        onclick="abrirConfirmacionAcademica(this)">Eliminar</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
