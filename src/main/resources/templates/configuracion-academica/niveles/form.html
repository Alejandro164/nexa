<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form-content">
    <div class="modal-backdrop">
        <div class="modal-dialog" style="max-width: 560px;">
            <div class="modal-loading-overlay htmx-indicator" id="modal-loading-overlay">
                <div class="spinner"></div>
                <span>Cargando...</span>
            </div>
            <div class="modal-header">
                <h3 class="modal-title" th:text="${nivel.id == null ? 'Registrar nivel' : 'Editar nivel'}">Nivel</h3>
                <button type="button" class="close-btn" onclick="cerrarModalAcademico()">&times;</button>
            </div>
            <div class="modal-body">
                <form hx-post="/configuracion-academica/niveles"
                      hx-target="#niveles-panel"
                      hx-swap="outerHTML"
                      hx-indicator="#modal-loading-overlay">
                    <input type="hidden" name="id" th:value="${nivel.id}">
                    <div class="academic-form-grid">
                        <div class="form-group">
                            <label class="form-label">Grado</label>
                            <select class="form-input" name="grado" required onchange="sugerirCicloNivel(this)">
                                <option value="" disabled hidden th:selected="${nivel.grado == null}">
                                    Seleccione un grado
                                </option>
                                <option th:each="g : ${#numbers.sequence(1, 12)}"
                                        th:value="${g}" th:text="${g}"
                                        th:selected="${nivel.grado != null and nivel.grado == g}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Sección</label>
                            <input class="form-input" name="seccion" maxlength="20" required
                                   th:value="${nivel.seccion}" placeholder="Ej. A">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label class="form-label">Ciclo</label>
                            <select class="form-input" name="ciclo" required>
                                <option value="" disabled hidden th:selected="${nivel.cicloEfectivo == null}">
                                    Seleccione un ciclo
                                </option>
                                <option th:each="c : ${ciclos}"
                                        th:value="${c.name()}"
                                        th:text="${c.etiqueta + ' (' + c.gradoDesde + '.º a ' + c.gradoHasta + '.º)'}"
                                        th:attr="data-grado-desde=${c.gradoDesde}, data-grado-hasta=${c.gradoHasta}"
                                        th:selected="${nivel.cicloEfectivo == c}">Primer Ciclo</option>
                            </select>
                            <p class="academic-help">Se sugiere según el grado. Define qué escala de notas usan sus estudiantes.</p>
                        </div>
                    </div>
                    <input type="hidden" name="_activo" value="on">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" class="custom-checkbox" name="activo" th:checked="${nivel.id == null or nivel.activo}">
                            <span class="custom-checkbox-control">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </span>
                            <span>Nivel activo</span>
                        </label>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="cerrarModalAcademico()">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar nivel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        function sugerirCicloNivel(selectGrado) {
            const form = selectGrado.closest('form');
            const ciclo = form ? form.querySelector('select[name="ciclo"]') : null;
            const grado = Number(selectGrado.value);
            if (!ciclo || !Number.isFinite(grado)) {
                return;
            }
            const sugerido = Array.from(ciclo.options).find(function (opcion) {
                return grado >= Number(opcion.dataset.gradoDesde) && grado <= Number(opcion.dataset.gradoHasta);
            });
            if (sugerido && ciclo.value !== sugerido.value) {
                ciclo.value = sugerido.value;
                ciclo.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }
    </script>
</div>
</body>
</html>
