<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form-content">
    <div class="modal-backdrop">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${materia.id == null ? 'Registrar materia' : 'Editar materia'}">Materia</h3>
                <button type="button" class="close-btn" onclick="cerrarModalAcademico()">&times;</button>
            </div>
            <div class="modal-body">
                <form hx-post="/configuracion-academica/materias"
                      hx-target="#materias-panel"
                      hx-swap="outerHTML">
                    <input type="hidden" name="id" th:value="${materia.id}">
                    <div class="academic-form-grid">
                        <div class="form-group">
                            <label class="form-label">Código</label>
                            <input class="form-input" name="codigo" maxlength="30" required
                                   th:value="${materia.codigo}" placeholder="Ej. MAT-01">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nombre</label>
                            <input class="form-input" name="nombre" maxlength="120" required
                                   th:value="${materia.nombre}" placeholder="Ej. Matemáticas">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Área</label>
                            <input class="form-input" name="area" maxlength="100" required
                                   th:value="${materia.area}" placeholder="Ej. Ciencias exactas">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tipo</label>
                            <select class="form-input" name="tipo" required>
                                <option value="" disabled hidden th:selected="${materia.tipo == null or materia.tipo.isBlank()}">
                                    Seleccione un tipo
                                </option>
                                <option th:selected="${materia.tipo == 'Básica'}">Básica</option>
                                <option th:selected="${materia.tipo == 'Complementaria'}">Complementaria</option>
                                <option th:selected="${materia.tipo == 'Especialidad'}">Especialidad</option>
                                <option th:selected="${materia.tipo == 'Taller'}">Taller</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Color</label>
                            <div class="color-field">
                                <input type="color" name="color"
                                       th:value="${materia.color != null ? materia.color : '#2d5a87'}"
                                       oninput="this.nextElementSibling.style.setProperty('--subject-color', this.value)">
                                <span class="subject-chip subject-chip-preview"
                                      th:style="|--subject-color:${materia.color != null ? materia.color : '#2d5a87'}|"
                                      th:text="${materia.nombre ?: 'Vista previa'}">Vista previa</span>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" name="_activo" value="on">
                    <label class="academic-check">
                        <input type="checkbox" name="activo" th:checked="${materia.id == null or materia.activo}">
                        Materia activa
                    </label>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="cerrarModalAcademico()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar materia</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
