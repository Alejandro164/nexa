<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form-content">
    <div class="modal-backdrop">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${materia.id == null ? 'Registrar materia' : 'Editar materia'}">Materia</h3>
                <button type="button" class="close-btn" onclick="cerrarModalAcademico()">&times;</button>
            </div>
            <div class="modal-body">
                <form hx-post="/configuracion-academica/materias"
                      hx-target="#materias-panel"
                      hx-swap="outerHTML">
                    <input type="hidden" name="id" th:value="${materia.id}">
                    <div class="academic-form-grid">
                        <div class="form-group">
                            <label class="form-label">Código</label>
                            <input class="form-input" name="codigo" maxlength="30" required
                                   th:value="${materia.codigo}" placeholder="Ej. MAT-01">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nombre</label>
                            <input class="form-input" name="nombre" maxlength="120" required
                                   th:value="${materia.nombre}" placeholder="Ej. Matemáticas">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Área</label>
                            <input class="form-input" name="area" maxlength="100" required
                                   th:value="${materia.area}" placeholder="Ej. Ciencias exactas">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tipo</label>
                            <select class="form-input" name="tipo" required>
                                <option value="" disabled hidden th:selected="${materia.tipo == null or materia.tipo.isBlank()}">
                                    Seleccione un tipo
                                </option>
                                <option th:selected="${materia.tipo == 'Básica'}">Básica</option>
                                <option th:selected="${materia.tipo == 'Complementaria'}">Complementaria</option>
                                <option th:selected="${materia.tipo == 'Especialidad'}">Especialidad</option>
                                <option th:selected="${materia.tipo == 'Taller'}">Taller</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Color</label>
                            <div class="academic-color-picker"
                                 th:style="|--selected-color:${materia.color != null ? materia.color : '#2d5a87'}|">
                                <input type="color" class="academic-native-color" name="color"
                                       th:value="${materia.color != null ? materia.color : '#2d5a87'}"
                                       oninput="actualizarColorAcademico(this.closest('.academic-color-picker'), this.value)">
                                <button type="button" class="academic-color-trigger"
                                        onclick="abrirSelectorColorAcademico(this)">
                                    <span class="academic-color-swatch"></span>
                                    <span class="academic-color-value"
                                          th:text="${materia.color != null ? materia.color : '#2d5a87'}">#2d5a87</span>
                                    <svg class="academic-color-icon" viewBox="0 0 24 24" fill="none"
                                         stroke="currentColor" stroke-width="2" aria-hidden="true">
                                        <path d="M12 22a9 9 0 1 0 0-18c-4.97 0-9 3.58-9 8 0 2.21 1.79 4 4 4h1.5a1.5 1.5 0 0 1 0 3H8a2 2 0 0 0 2 2h2z"></path>
                                        <circle cx="7.5" cy="10.5" r=".5" fill="currentColor"></circle>
                                        <circle cx="10.5" cy="7.5" r=".5" fill="currentColor"></circle>
                                        <circle cx="14.5" cy="7.5" r=".5" fill="currentColor"></circle>
                                        <circle cx="17" cy="11" r=".5" fill="currentColor"></circle>
                                    </svg>
                                </button>
                                <span class="subject-chip subject-chip-preview academic-color-preview"
                                      th:style="|--subject-color:${materia.color != null ? materia.color : '#2d5a87'}|"
                                      th:text="${materia.nombre ?: 'Vista previa'}">Vista previa</span>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" name="_activo" value="on">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" class="custom-checkbox" name="activo" th:checked="${materia.id == null or materia.activo}">
                            <span class="custom-checkbox-control">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </span>
                            <span>Materia activa</span>
                        </label>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="cerrarModalAcademico()">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar materia</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
