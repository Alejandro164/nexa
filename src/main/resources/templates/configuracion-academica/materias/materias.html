<div th:fragment="content" id="materias-panel" xmlns:th="http://www.thymeleaf.org">
    <div class="card">
        <div class="card-header">
            <div>
                <h3 class="card-title">Catálogo de materias</h3>
                <p class="academic-help">El color identifica la materia dentro del horario.</p>
            </div>
            <button class="btn-primary"
                    hx-get="/configuracion-academica/materias/form"
                    hx-target="#modal-container"
                    onclick="abrirModalAcademico()">+ Nueva materia</button>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Área</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${materias == null or materias.empty}">
                        <td colspan="6" class="table-empty">No hay materias registradas.</td>
                    </tr>
                    <tr th:each="materia : ${materias}">
                        <td><strong th:text="${materia.codigo}">MAT-01</strong></td>
                        <td>
                            <span class="subject-chip subject-chip-preview"
                                  th:style="|--subject-color: ${materia.color}|"
                                  th:text="${materia.nombre}">Matemáticas</span>
                        </td>
                        <td th:text="${materia.area}">Ciencias exactas</td>
                        <td th:text="${materia.tipo}">Básica</td>
                        <td>
                            <span th:if="${materia.activo}" class="badge badge-success">Activa</span>
                            <span th:unless="${materia.activo}" class="badge badge-secondary">Inactiva</span>
                        </td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-xs btn-ghost"
                                        th:attr="hx-get=|/configuracion-academica/materias/form/${materia.id}|"
                                        hx-target="#modal-container"
                                        onclick="abrirModalAcademico()"
                                        title="Editar">✏️</button>
                                <button type="button" class="btn-xs btn-danger-ghost"
                                        th:attr="data-delete-url=|/configuracion-academica/materias/${materia.id}|,
                                                 data-delete-message=|¿Deseas eliminar la materia ${materia.nombre}? También se eliminarán sus lecciones asignadas.|"
                                        data-delete-title="Eliminar materia"
                                        data-delete-target="#materias-panel"
                                        data-delete-swap="outerHTML"
                                        onclick="abrirConfirmacionAcademica(this)"
                                        title="Eliminar">🗑️</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
