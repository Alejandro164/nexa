<div th:fragment="content" id="periodos-panel" xmlns:th="http://www.thymeleaf.org">
    <div class="card">
        <div class="card-header">
            <div>
                <h3 class="card-title">Períodos académicos</h3>
                <p class="academic-help">Define las fechas de los ciclos lectivos de la institución.</p>
            </div>
            <button class="btn btn-primary"
                    hx-get="/configuracion-academica/periodos/form"
                    hx-target="#modal-container"
                    onclick="abrirModalAcademico()">
                + Nuevo período
            </button>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Fecha inicio</th>
                        <th>Fecha fin</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${periodos == null or periodos.empty}">
                        <td colspan="6" class="table-empty">No hay períodos registrados.</td>
                    </tr>
                    <tr th:each="periodo : ${periodos}">
                        <td><strong th:text="${periodo.codigo}">2026-I</strong></td>
                        <td th:text="${periodo.descripcion}">Primer período</td>
                        <td th:text="${#temporals.format(periodo.fechaInicio, 'dd/MM/yyyy')}">01/02/2026</td>
                        <td th:text="${#temporals.format(periodo.fechaFin, 'dd/MM/yyyy')}">30/06/2026</td>
                        <td>
                            <span th:if="${periodo.activo}" class="badge badge-success">Activo</span>
                            <span th:unless="${periodo.activo}" class="badge badge-secondary">Inactivo</span>
                        </td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-xs btn-ghost"
                                        th:attr="hx-get=|/configuracion-academica/periodos/form/${periodo.id}|"
                                        hx-target="#modal-container"
                                        onclick="abrirModalAcademico()"
                                        title="Editar">✏️</button>
                                <button type="button" class="btn-xs btn-danger-ghost"
                                        th:attr="data-delete-url=|/configuracion-academica/periodos/${periodo.id}|,
                                                 data-delete-message=|¿Deseas eliminar el período ${periodo.codigo}? También se eliminarán sus lecciones asignadas.|"
                                        data-delete-title="Eliminar período"
                                        data-delete-target="#periodos-panel"
                                        data-delete-swap="outerHTML"
                                        onclick="abrirConfirmacionAcademica(this)"
                                        title="Eliminar">🗑️</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
