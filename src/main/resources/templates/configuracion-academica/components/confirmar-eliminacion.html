<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal" id="academic-delete-modal" class="modal-backdrop"
     style="display: none; z-index: 10000;"
     onclick="if (event.target === this) cerrarConfirmacionAcademica()">
    <div class="modal-dialog academic-delete-dialog">
        <div class="modal-header">
            <div>
                <h3 id="academic-delete-title" class="modal-title">Confirmar eliminación</h3>
                <p class="academic-help">Esta acción no se puede deshacer.</p>
            </div>
            <button type="button" class="close-btn" onclick="cerrarConfirmacionAcademica()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="academic-delete-message">
                <div class="academic-delete-icon">!</div>
                <p id="academic-delete-message">¿Deseas eliminar este registro?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="cerrarConfirmacionAcademica()">
                    Cancelar
                </button>
                <button type="button" id="academic-delete-confirm-btn" class="btn btn-destructive" onclick="confirmarEliminacionAcademica()">
                    Eliminar
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
