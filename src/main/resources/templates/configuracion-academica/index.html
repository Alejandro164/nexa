<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Configuración Académica — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Configuración Académica</h2>
    <p layout:fragment="page-subtitle">Administra la estructura académica y los programas de estudio</p>

    <th:block th:fragment="htmx-content">
    <!-- OOB: al navegar por htmx solo se reemplaza .content-area, así que el título del topbar
         (fuera de ese contenedor) se sincroniza aparte para que no se quede con el de la página anterior. -->
    <h2 id="topbar-page-title" hx-swap-oob="true">Configuración Académica</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Administra la estructura académica y los programas de estudio</p>
    <main layout:fragment="content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }
            .config-tabs-container::-webkit-scrollbar {
                display: none;
            }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 12px;
                font-size: 0.82rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .tab-pane {
                animation: fadeIn 0.35s ease-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes academicModalBackdropIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes academicModalDialogIn {
                from {
                    opacity: 0;
                    transform: translateY(18px) scale(0.97);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }
            @keyframes academicModalBackdropOut {
                from { opacity: 1; }
                to { opacity: 0; }
            }
            @keyframes academicModalDialogOut {
                from {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
                to {
                    opacity: 0;
                    transform: translateY(12px) scale(0.98);
                }
            }
            #modal-container.show .modal-backdrop,
            #academic-delete-modal.modal-visible {
                animation: academicModalBackdropIn 180ms ease-out both;
            }
            #modal-container.show .modal-dialog,
            #academic-delete-modal.modal-visible .modal-dialog {
                animation: academicModalDialogIn 240ms cubic-bezier(.22, 1, .36, 1) both;
            }
            #modal-container.modal-closing .modal-backdrop,
            #academic-delete-modal.modal-closing {
                animation: academicModalBackdropOut 180ms ease-in both;
            }
            #modal-container.modal-closing .modal-dialog,
            #academic-delete-modal.modal-closing .modal-dialog {
                animation: academicModalDialogOut 180ms ease-in both;
            }
            .academic-help {
                color: var(--text-secondary);
                font-size: 0.84rem;
                margin-top: 0.3rem;
            }
            .academic-empty {
                padding: 2rem !important;
                text-align: center;
                color: var(--text-secondary);
            }
            .academic-empty-block {
                margin: 1.5rem;
                border: 1px dashed var(--border);
                border-radius: 10px;
                background: var(--input-bg);
            }
            .academic-actions {
                display: flex;
                gap: 0.4rem;
                white-space: nowrap;
            }
            .academic-form-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }
            .academic-native-select {
                position: absolute !important;
                width: 1px !important;
                height: 1px !important;
                padding: 0 !important;
                margin: -1px !important;
                overflow: hidden !important;
                clip: rect(0, 0, 0, 0) !important;
                white-space: nowrap !important;
                border: 0 !important;
            }
            .academic-select {
                position: relative;
                width: 100%;
            }
            .academic-select-trigger {
                width: 100%;
                min-height: 38px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                padding: 0.5rem 10px 0.5rem 0.75rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--surface-solid);
                color: var(--text-primary);
                font-family: inherit;
                font-size: 0.875rem;
                text-align: left;
                cursor: pointer;
                transition: border-color 0.2s, box-shadow 0.2s;
            }
            .academic-select-trigger:hover {
                border-color: #cbd5e1;
            }
            .academic-select.open .academic-select-trigger,
            .academic-select-trigger:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1);
                outline: none;
            }
            .academic-select-placeholder {
                color: var(--text-light);
            }
            .academic-select-arrow {
                width: 16px;
                height: 16px;
                flex: 0 0 16px;
                color: var(--text-secondary);
                transition: transform 0.2s;
            }
            .academic-select.open .academic-select-arrow {
                transform: rotate(180deg);
            }
            .academic-select-options {
                position: absolute;
                z-index: 10020;
                top: calc(100% + 6px);
                left: 0;
                right: 0;
                max-height: 240px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: #cbd5e1 #ffffff;
                padding: 0.35rem;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: white;
                box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
                visibility: hidden;
                opacity: 0;
                transform: translateY(-7px) scale(0.98);
                transform-origin: top center;
                pointer-events: none;
                transition:
                    opacity 150ms ease,
                    transform 180ms cubic-bezier(.22, 1, .36, 1),
                    visibility 0s linear 180ms;
            }
            .academic-select-options::-webkit-scrollbar {
                width: 12px;
            }
            .academic-select-options::-webkit-scrollbar-track {
                background: #ffffff;
            }
            .academic-select-options::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                background-clip: padding-box;
                border-left: 3px solid transparent;
                border-right: 5px solid transparent;
                border-radius: 999px;
            }
            .academic-select-options::-webkit-scrollbar-thumb:hover {
                background-color: #94a3b8;
            }
            .academic-select.open .academic-select-options {
                visibility: visible;
                opacity: 1;
                transform: translateY(0) scale(1);
                pointer-events: auto;
                transition-delay: 0s;
            }
            .academic-select-option {
                width: 100%;
                padding: 0.6rem 0.7rem;
                border: 0;
                border-radius: 7px;
                background: transparent;
                color: var(--text-primary);
                font-family: inherit;
                font-size: 0.84rem;
                text-align: left;
                cursor: pointer;
            }
            .academic-select-option:hover,
            .academic-select-option:focus {
                background: var(--input-bg);
                color: var(--primary);
                outline: none;
            }
            .academic-select-option.selected {
                background: rgba(45, 90, 135, 0.1);
                color: var(--primary);
                font-weight: 700;
            }
            .subject-chip {
                --subject-color: #2d5a87;
                display: inline-flex;
                align-items: center;
                gap: 0.45rem;
                padding: 0.3rem 0.65rem;
                border-radius: 999px;
                background: color-mix(in srgb, var(--subject-color) 14%, white);
                color: color-mix(in srgb, var(--subject-color) 78%, black);
                font-size: 0.8rem;
                font-weight: 700;
                border: 1px solid color-mix(in srgb, var(--subject-color) 25%, white);
            }
            .subject-chip::before {
                content: "";
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--subject-color);
            }
            .subject-chip-preview::before {
                display: none;
            }
            .color-preview {
                display: inline-block;
                width: 16px;
                height: 16px;
                margin-right: 0.35rem;
                border-radius: 4px;
                vertical-align: middle;
                border: 1px solid rgba(0, 0, 0, 0.12);
            }
            .academic-color-picker {
                --selected-color: #2d5a87;
                position: relative;
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }
            .academic-color-trigger {
                min-width: 145px;
                min-height: 38px;
                display: flex;
                align-items: center;
                gap: 0.6rem;
                padding: 0.45rem 0.75rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: white;
                color: var(--text-primary);
                font-family: inherit;
                cursor: pointer;
                transition:
                    border-color 0.18s,
                    box-shadow 0.18s,
                    transform 0.18s;
            }
            .academic-color-trigger:hover,
            .academic-color-trigger:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1);
                outline: none;
            }
            .academic-color-picker.color-opening .academic-color-trigger {
                transform: translateY(-1px) scale(1.015);
            }
            .academic-color-picker.color-selected .academic-color-trigger {
                animation: academicColorSelected 260ms cubic-bezier(.22, 1, .36, 1);
            }
            .academic-color-swatch {
                width: 20px;
                height: 20px;
                flex: 0 0 20px;
                border-radius: 5px;
                background: var(--selected-color);
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
                transition: background-color 180ms ease, transform 180ms ease;
            }
            .academic-color-picker.color-opening .academic-color-swatch {
                transform: scale(1.12);
            }
            .academic-color-value {
                flex: 1;
                font-size: 0.82rem;
                font-weight: 600;
                text-transform: uppercase;
            }
            .academic-color-icon {
                width: 17px;
                height: 17px;
                flex: 0 0 17px;
                color: var(--text-secondary);
            }
            .academic-native-color {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                opacity: 0;
                pointer-events: none;
            }
            .academic-color-preview {
                white-space: nowrap;
                transition:
                    background-color 180ms ease,
                    color 180ms ease,
                    border-color 180ms ease,
                    transform 180ms ease;
            }
            .academic-color-picker.color-selected .academic-color-preview {
                transform: scale(1.04);
            }
            @keyframes academicColorSelected {
                0% { transform: scale(1); }
                45% { transform: scale(1.025); }
                100% { transform: scale(1); }
            }
            .schedule-filters {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
                padding: 1.25rem 1.5rem;
                background: var(--input-bg);
                border-bottom: 1px solid var(--border);
            }
            .schedule-filters .form-group {
                margin: 0;
            }
            .schedule-scroll {
                overflow-x: auto;
                padding: 1.5rem;
            }
            .schedule-grid {
                min-width: 920px;
                display: grid;
                grid-template-columns: 100px repeat(var(--schedule-days, 5), minmax(150px, 1fr));
                border-top: 1px solid var(--border);
                border-left: 1px solid var(--border);
            }
            .schedule-head,
            .schedule-hour,
            .schedule-slot {
                border-right: 1px solid var(--border);
                border-bottom: 1px solid var(--border);
            }
            .schedule-head {
                padding: 0.8rem;
                text-align: center;
                background: #f1f5f9;
                font-size: 0.82rem;
                font-weight: 700;
            }
            .schedule-hour {
                min-height: 92px;
                padding: 0.75rem 0.5rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0.2rem;
                text-align: center;
                background: #f8fafc;
                color: var(--text-secondary);
                font-size: 0.76rem;
            }
            .schedule-hour small {
                font-size: 0.68rem;
                font-weight: 600;
                color: #94a3b8;
            }
            .schedule-head.schedule-hour {
                min-height: auto;
            }
            .schedule-break {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 0 14px;
                min-height: 28px;
                background: #cfe0ef;
                border-right: 1px solid var(--border);
                border-bottom: 1px solid #b4cce0;
                font-size: 0.7rem;
                font-weight: 700;
                color: #2d5a87;
            }
            .schedule-break-copy {
                display: flex;
                align-items: baseline;
                gap: 0.55rem;
                min-width: 0;
            }
            .schedule-break-name {
                text-transform: uppercase;
                letter-spacing: 0.07em;
            }
            .schedule-break-time {
                font-variant-numeric: tabular-nums;
                font-weight: 700;
                letter-spacing: 0;
            }
            .schedule-break-mins {
                font-size: 0.68rem;
                font-weight: 600;
                color: inherit;
                opacity: 0.72;
            }
            .schedule-break-mins::before {
                content: '·';
                margin-right: 0.4rem;
                opacity: 0.55;
            }
            .schedule-lunch {
                background: #fff7ed;
                color: #c2410c;
                border-bottom-color: #fed7aa;
            }
            .jornada-card {
                position: relative;
            }
            .jornada-body {
                display: grid;
                grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.85fr);
                gap: 0;
                align-items: stretch;
            }
            .jornada-form {
                padding: 1.35rem 1.5rem 1.6rem;
                border-right: 1px solid var(--border);
            }
            .jornada-section + .jornada-section {
                margin-top: 1.6rem;
            }
            .jornada-section-head h4 {
                margin: 0;
                font-size: 0.92rem;
                font-weight: 700;
                color: var(--text-primary);
            }
            .jornada-section-head p {
                margin: 0.25rem 0 0.9rem;
                color: var(--text-secondary);
                font-size: 0.82rem;
                line-height: 1.45;
            }
            .jornada-days {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .jornada-day {
                position: relative;
                min-width: 58px;
                padding: 0.55rem 0.7rem;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: #fff;
                text-align: center;
                font-size: 0.82rem;
                font-weight: 700;
                color: var(--text-secondary);
                cursor: pointer;
                transition: border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
            }
            .jornada-day input {
                position: absolute;
                opacity: 0;
                pointer-events: none;
            }
            .jornada-day:hover {
                border-color: #cbd5e1;
            }
            .jornada-day.is-on {
                color: #fff;
                background: var(--primary);
                border-color: var(--primary);
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.22);
            }
            .jornada-fields {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }
            .jornada-field-wide {
                grid-column: 1 / -1;
            }
            .jornada-recreos {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }
            .jornada-recreo-min {
                display: flex;
                align-items: center;
                gap: 0.45rem;
            }
            .jornada-recreo-min span {
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-secondary);
            }
            @media (max-width: 640px) {
                .jornada-recreos {
                    grid-template-columns: 1fr;
                }
            }
            .jornada-preview {
                padding: 1.35rem 1.35rem 1.6rem;
                background: #f8fafc;
            }
            .jornada-preview-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 0.75rem;
                margin-bottom: 0.9rem;
            }
            .jornada-preview-head h4 {
                margin: 0;
                font-size: 0.92rem;
                font-weight: 700;
            }
            .jornada-preview-head span {
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-secondary);
            }
            .jornada-timeline {
                list-style: none;
                margin: 0;
                padding: 0;
                max-height: 520px;
                overflow: auto;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: #fff;
            }
            .jornada-timeline li {
                display: grid;
                grid-template-columns: 118px 1fr;
                gap: 0.6rem;
                align-items: center;
                padding: 0.55rem 0.8rem;
                border-bottom: 1px solid var(--border);
                font-size: 0.8rem;
            }
            .jornada-timeline li:last-child {
                border-bottom: 0;
            }
            .jornada-timeline .jornada-time {
                font-variant-numeric: tabular-nums;
                font-weight: 700;
                color: var(--text-secondary);
            }
            .jornada-timeline .is-lesson .jornada-label {
                font-weight: 600;
            }
            .jornada-timeline .is-break {
                background: #cfe0ef;
                color: #2d5a87;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                font-size: 0.72rem;
                font-weight: 700;
            }
            .jornada-timeline .is-lunch {
                background: #fff7ed;
                color: #c2410c;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                font-size: 0.72rem;
                font-weight: 700;
            }
            @media (max-width: 900px) {
                .jornada-body {
                    grid-template-columns: 1fr;
                }
                .jornada-form {
                    border-right: 0;
                    border-bottom: 1px solid var(--border);
                }
            }
            .schedule-slot {
                min-height: 92px;
                padding: 0.55rem;
                position: relative;
                text-align: left;
            }
            button.schedule-slot {
                width: 100%;
                border-top: 0;
                border-left: 0;
                background: white;
                font: inherit;
                cursor: pointer;
            }
            .schedule-slot-empty {
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-light);
            }
            .schedule-slot-empty:hover {
                background: rgba(45, 90, 135, 0.05);
                color: var(--primary);
            }
            .schedule-slot-filled {
                --subject-color: #2d5a87;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 0.2rem;
                padding-left: 0.8rem;
                background: color-mix(in srgb, var(--subject-color) 10%, white);
                border-left: 4px solid var(--subject-color);
                cursor: pointer;
            }
            .schedule-slot-filled strong {
                color: var(--text-primary);
                font-size: 0.82rem;
            }
            .schedule-slot-filled span,
            .schedule-slot-filled small {
                color: var(--text-secondary);
                font-size: 0.7rem;
            }
            .schedule-slot-multi {
                display: flex;
                gap: 3px;
                padding: 3px;
                align-items: stretch;
            }
            .schedule-slot-item {
                --subject-color: #2d5a87;
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 2px;
                padding: 5px 6px 5px 8px;
                border-radius: 6px;
                border-left: 3px solid var(--subject-color);
                background: color-mix(in srgb, var(--subject-color) 10%, white);
                cursor: pointer;
                position: relative;
                overflow: hidden;
            }
            .schedule-slot-item:hover {
                filter: brightness(0.96);
            }
            .schedule-slot-item strong {
                font-size: 0.72rem;
                font-weight: 700;
                color: var(--text-primary);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .schedule-slot-item span,
            .schedule-slot-item small {
                font-size: 0.65rem;
                color: var(--text-secondary);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .schedule-slot-add {
                flex-shrink: 0;
                width: 22px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 1px dashed #cbd5e1;
                border-radius: 6px;
                background: transparent;
                color: #94a3b8;
                cursor: pointer;
                font-size: 1.1rem;
                line-height: 1;
                padding: 0;
                transition: all 0.15s;
            }
            .schedule-slot-add:hover {
                border-color: var(--primary);
                color: var(--primary);
                background: rgba(45, 90, 135, 0.05);
            }
            .schedule-remove {
                position: absolute;
                top: 5px;
                right: 5px;
                width: 22px;
                height: 22px;
                border: 0;
                border-radius: 5px;
                background: rgba(15, 23, 42, 0.08);
                color: var(--text-secondary);
                cursor: pointer;
            }
            .schedule-remove:hover {
                background: var(--error);
                color: white;
            }
            .academic-delete-dialog {
                max-width: 460px;
                border-top: 4px solid var(--error);
            }
            .academic-delete-message {
                display: flex;
                align-items: flex-start;
                gap: 1rem;
                padding: 1rem;
                border: 1px solid #fecaca;
                border-radius: 10px;
                background: #fef2f2;
                color: #7f1d1d;
                line-height: 1.55;
            }
            .academic-delete-icon {
                width: 30px;
                height: 30px;
                flex: 0 0 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                background: var(--error);
                color: white;
                font-weight: 800;
            }
            @media (max-width: 700px) {
                .academic-form-grid,
                .schedule-filters {
                    grid-template-columns: 1fr;
                }
                .config-tabs-container {
                    overflow-x: auto;
                }
                .config-tab-btn {
                    min-width: 135px;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #modal-container.show .modal-backdrop,
                #modal-container.show .modal-dialog,
                #modal-container.modal-closing .modal-backdrop,
                #modal-container.modal-closing .modal-dialog,
                #academic-delete-modal.modal-visible,
                #academic-delete-modal.modal-visible .modal-dialog,
                #academic-delete-modal.modal-closing,
                #academic-delete-modal.modal-closing .modal-dialog {
                    animation: none;
                }
                .academic-select-options,
                .academic-color-trigger,
                .academic-color-swatch,
                .academic-color-preview {
                    transition: none;
                    animation: none !important;
                }
            }
        </style>

        <div x-data="{ activeTab: 'periodos' }">
            <!-- Menú Horizontal de 4 Botones -->
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'periodos' }" @click="activeTab = 'periodos'">
                        Períodos
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'niveles' }" @click="activeTab = 'niveles'">
                        Niveles
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'materias' }" @click="activeTab = 'materias'">
                        Materias
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'aulas' }" @click="activeTab = 'aulas'">
                        Aulas
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'horario' }"
                            @click="activeTab = 'horario'; recargarHorarioAcademico()">
                        Horario
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'jornada' }"
                            @click="activeTab = 'jornada'">
                        Jornada
                    </button>
                </div>
            </div>

            <!-- Contenido Visual de Períodos -->
            <div x-show="activeTab === 'periodos'" class="tab-pane">
                <div th:replace="~{configuracion-academica/periodos/periodos :: content}"></div>
            </div>

            <!-- Contenido Visual de Niveles -->
            <div x-show="activeTab === 'niveles'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-academica/niveles/niveles :: content}"></div>
            </div>

            <!-- Contenido Visual de Materias -->
            <div x-show="activeTab === 'materias'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-academica/materias/materias :: content}"></div>
            </div>

            <!-- Contenido Visual de Aulas -->
            <div x-show="activeTab === 'aulas'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-academica/aulas/aulas :: content}"></div>
            </div>

            <!-- Contenido Visual de Horario -->
            <div x-show="activeTab === 'horario'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-academica/horario/horario :: content}"></div>
            </div>

            <div x-show="activeTab === 'jornada'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-academica/jornada/jornada :: content}"></div>
            </div>

        </div>
        <div th:replace="~{configuracion-academica/components/confirmar-eliminacion :: modal}"></div>
        <script>
            window.academicDeleteRequest = null;

            function abrirModalAcademico() {
                var modal = document.getElementById('modal-container');
                modal.classList.remove('modal-closing');
                modal.classList.add('show');
            }

            function cerrarModalAcademico() {
                var modal = document.getElementById('modal-container');
                if (!modal || !modal.classList.contains('show')) {
                    return;
                }
                modal.classList.add('modal-closing');
                window.setTimeout(function () {
                    modal.classList.remove('show', 'modal-closing');
                    modal.innerHTML = '';
                }, 180);
            }

            function recargarHorarioAcademico() {
                var panel = document.getElementById('horario-panel');
                var periodo = panel ? panel.querySelector('[name="periodoId"]') : null;
                var nivel = panel ? panel.querySelector('[name="nivelId"]') : null;
                var parametros = new URLSearchParams();

                if (periodo && periodo.value) {
                    parametros.set('periodoId', periodo.value);
                }
                if (nivel && nivel.value) {
                    parametros.set('nivelId', nivel.value);
                }

                var url = '/configuracion-academica/horario';
                if (parametros.toString()) {
                    url += '?' + parametros.toString();
                }
                htmx.ajax('GET', url, {target: '#horario-panel', swap: 'outerHTML'});
            }

            function jornadaLectiva(el) {
                var d = el && el.dataset ? el.dataset : {};
                return {
                    cantidadLecciones: Number(d.cantidadLecciones || 12),
                    inicioJornada: d.inicioJornada || '07:00',
                    minutosLeccion: Number(d.minutosLeccion || 40),
                    minutosRecreo: Number(d.minutosRecreo || 10),
                    minutosRecreos: parseDuracionesRecreos(d.duracionesRecreos),
                    leccionesPorBloque: Number(d.leccionesPorBloque || 2),
                    leccionAlmuerzo: Number(d.leccionAlmuerzo || 6),
                    minutosAlmuerzo: d.minutosAlmuerzo == null || d.minutosAlmuerzo === '' ? 40 : Number(d.minutosAlmuerzo),
                    diasSeleccionados: (d.dias || '').split(',').filter(Boolean),
                    init: function () {
                        var self = this;
                        this.alinearRecreos();
                        this.$watch('cantidadLecciones', function () { self.alinearRecreos(); });
                        this.$watch('leccionesPorBloque', function () { self.alinearRecreos(); });
                        this.$watch('leccionAlmuerzo', function () { self.alinearRecreos(); });
                        this.$watch('minutosAlmuerzo', function () { self.alinearRecreos(); });
                    },
                    alinearRecreos: function () {
                        var n = this.huecosRecreo.length;
                        var respaldo = Number(this.minutosRecreo) || 10;
                        while (this.minutosRecreos.length < n) {
                            var ultimo = this.minutosRecreos.length
                                ? this.minutosRecreos[this.minutosRecreos.length - 1]
                                : respaldo;
                            this.minutosRecreos.push(ultimo);
                        }
                    },
                    etiquetaHueco: function (hueco) {
                        var bloque = Number(this.leccionesPorBloque) || 1;
                        var hasta = hueco.leccion;
                        var desde = Math.max(1, hasta - bloque + 1);
                        var bloqueTexto = desde === hasta
                            ? 'lección ' + hasta
                            : (hasta === desde + 1
                                ? 'lecciones ' + desde + ' y ' + hasta
                                : 'lecciones ' + desde + ' a ' + hasta);
                        return 'Receso ' + hueco.orden + ' · ' + bloqueTexto;
                    },
                    sumarMinutos: function (hora, minutos) {
                        var partes = String(hora || '07:00').split(':');
                        var total = ((Number(partes[0]) || 0) * 60 + (Number(partes[1]) || 0) + Number(minutos || 0)) % 1440;
                        total = (total + 1440) % 1440;
                        return String(Math.floor(total / 60)).padStart(2, '0') + ':'
                            + String(total % 60).padStart(2, '0');
                    },
                    get huecosRecreo() {
                        var n = Number(this.cantidadLecciones) || 0;
                        var bloque = Number(this.leccionesPorBloque) || 1;
                        var minAlmuerzo = Number(this.minutosAlmuerzo) || 0;
                        var leccionAlmuerzo = Number(this.leccionAlmuerzo) || 0;
                        var huecos = [];
                        if (bloque <= 0) {
                            return huecos;
                        }
                        for (var i = 1; i < n; i++) {
                            var hayAlmuerzo = minAlmuerzo > 0 && leccionAlmuerzo === i;
                            if (!hayAlmuerzo && i % bloque === 0) {
                                huecos.push({ leccion: i, orden: huecos.length + 1 });
                            }
                        }
                        return huecos;
                    },
                    get lineas() {
                        var n = Number(this.cantidadLecciones) || 0;
                        var duracion = Number(this.minutosLeccion) || 0;
                        var bloque = Number(this.leccionesPorBloque) || 1;
                        var minAlmuerzo = Number(this.minutosAlmuerzo) || 0;
                        var leccionAlmuerzo = Number(this.leccionAlmuerzo) || 0;
                        var cursor = this.inicioJornada || '07:00';
                        var out = [];
                        var indiceRecreo = 0;
                        for (var i = 1; i <= n; i++) {
                            var ini = cursor;
                            var fin = this.sumarMinutos(ini, duracion);
                            out.push({
                                clave: 'l-' + i,
                                tipo: 'leccion',
                                inicio: ini,
                                fin: fin,
                                etiqueta: 'Lección ' + i
                            });
                            cursor = fin;
                            var hayAlmuerzo = minAlmuerzo > 0 && leccionAlmuerzo === i && i !== n;
                            var esHueco = !hayAlmuerzo && bloque > 0 && i % bloque === 0 && i !== n;
                            if (hayAlmuerzo) {
                                var finAlmuerzo = this.sumarMinutos(cursor, minAlmuerzo);
                                out.push({
                                    clave: 'a-' + i,
                                    tipo: 'almuerzo',
                                    inicio: cursor,
                                    fin: finAlmuerzo,
                                    etiqueta: 'Almuerzo · ' + minAlmuerzo + ' min'
                                });
                                cursor = finAlmuerzo;
                            } else if (esHueco) {
                                var recreo = Number(this.minutosRecreos[indiceRecreo]) || 0;
                                indiceRecreo += 1;
                                if (recreo > 0) {
                                    var finRecreo = this.sumarMinutos(cursor, recreo);
                                    out.push({
                                        clave: 'r-' + i,
                                        tipo: 'recreo',
                                        inicio: cursor,
                                        fin: finRecreo,
                                        etiqueta: 'Receso · ' + recreo + ' min'
                                    });
                                    cursor = finRecreo;
                                }
                            }
                        }
                        return out;
                    },
                    get finJornada() {
                        var lineas = this.lineas;
                        return lineas.length ? lineas[lineas.length - 1].fin : '—';
                    }
                };
            }

            function parseDuracionesRecreos(raw) {
                if (!raw || !String(raw).trim()) {
                    return [];
                }
                return String(raw).split(',').map(function (valor) {
                    var minutos = Number(String(valor).trim());
                    return Number.isFinite(minutos) ? minutos : 10;
                });
            }

            function cerrarSelectoresAcademicos(excepto) {
                document.querySelectorAll('.academic-select.open').forEach(function (select) {
                    if (select !== excepto) {
                        select.classList.remove('open');
                        select.querySelector('.academic-select-trigger').setAttribute('aria-expanded', 'false');
                    }
                });
            }

            function abrirSelectorColorAcademico(trigger) {
                var picker = trigger.closest('.academic-color-picker');
                cerrarSelectoresAcademicos();
                picker.classList.add('color-opening');
                window.setTimeout(function () {
                    picker.classList.remove('color-opening');
                }, 180);
                picker.querySelector('input[type="color"]').click();
            }

            function actualizarColorAcademico(picker, color) {
                if (!picker || !/^#[0-9a-fA-F]{6}$/.test(color)) {
                    return;
                }
                color = color.toLowerCase();
                picker.style.setProperty('--selected-color', color);
                picker.querySelector('input[name="color"]').value = color;
                picker.querySelector('.academic-color-value').textContent = color;
                picker.querySelector('.academic-color-preview')
                    .style.setProperty('--subject-color', color);
                picker.classList.remove('color-selected');
                void picker.offsetWidth;
                picker.classList.add('color-selected');
                window.setTimeout(function () {
                    picker.classList.remove('color-selected');
                }, 260);
            }

            function inicializarSelectoresColorAcademicos(root) {
                var scope = root || document;
                scope.querySelectorAll('.academic-color-picker').forEach(function (picker) {
                    actualizarColorAcademico(picker, picker.querySelector('input[name="color"]').value);
                });
            }

            function inicializarSelectoresAcademicos(root) {
                var scope = root || document;
                scope.querySelectorAll('select.form-input:not([data-academic-select])').forEach(function (nativeSelect) {
                    nativeSelect.dataset.academicSelect = 'true';
                    nativeSelect.classList.add('academic-native-select');

                    var component = document.createElement('div');
                    component.className = 'academic-select';

                    var trigger = document.createElement('button');
                    trigger.type = 'button';
                    trigger.className = 'academic-select-trigger';
                    trigger.setAttribute('aria-haspopup', 'listbox');
                    trigger.setAttribute('aria-expanded', 'false');

                    var label = document.createElement('span');
                    var arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    arrow.setAttribute('class', 'academic-select-arrow');
                    arrow.setAttribute('viewBox', '0 0 24 24');
                    arrow.setAttribute('fill', 'none');
                    arrow.setAttribute('stroke', 'currentColor');
                    arrow.setAttribute('stroke-width', '2');
                    arrow.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
                    trigger.append(label, arrow);

                    var options = document.createElement('div');
                    options.className = 'academic-select-options';
                    options.setAttribute('role', 'listbox');

                    function actualizarSeleccion() {
                        var selected = nativeSelect.options[nativeSelect.selectedIndex];
                        label.textContent = selected ? selected.textContent.trim() : '';
                        label.classList.toggle('academic-select-placeholder', !selected || !selected.value);
                        options.querySelectorAll('.academic-select-option').forEach(function (option) {
                            option.classList.toggle('selected', option.dataset.value === nativeSelect.value);
                            option.setAttribute('aria-selected', String(option.dataset.value === nativeSelect.value));
                        });
                    }

                    Array.from(nativeSelect.options).forEach(function (nativeOption) {
                        if (nativeOption.hidden || nativeOption.disabled || !nativeOption.value) {
                            return;
                        }
                        var option = document.createElement('button');
                        option.type = 'button';
                        option.className = 'academic-select-option';
                        option.dataset.value = nativeOption.value;
                        option.textContent = nativeOption.textContent.trim();
                        option.setAttribute('role', 'option');
                        option.addEventListener('click', function () {
                            nativeSelect.value = option.dataset.value;
                            actualizarSeleccion();
                            component.classList.remove('open');
                            trigger.setAttribute('aria-expanded', 'false');
                            nativeSelect.dispatchEvent(new Event('change', { bubbles: true }));
                        });
                        options.appendChild(option);
                    });

                    trigger.addEventListener('click', function () {
                        var abrir = !component.classList.contains('open');
                        cerrarSelectoresAcademicos(component);
                        component.classList.toggle('open', abrir);
                        trigger.setAttribute('aria-expanded', String(abrir));
                    });

                    nativeSelect.addEventListener('change', actualizarSeleccion);
                    nativeSelect.parentNode.insertBefore(component, nativeSelect);
                    component.append(nativeSelect, trigger, options);
                    actualizarSeleccion();
                });
            }

            if (!window.academicSelectEventsRegistered) {
                document.addEventListener('click', function (event) {
                    if (!event.target.closest('.academic-select')) {
                        cerrarSelectoresAcademicos();
                    }
                });
                document.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape') {
                        cerrarSelectoresAcademicos();
                    }
                });
                document.addEventListener('DOMContentLoaded', function () {
                    inicializarSelectoresAcademicos(document);
                    inicializarSelectoresColorAcademicos(document);
                });
                document.addEventListener('htmx:load', function (event) {
                    inicializarSelectoresAcademicos(event.detail.elt);
                    inicializarSelectoresColorAcademicos(event.detail.elt);
                });
                window.academicSelectEventsRegistered = true;
            }
            inicializarSelectoresAcademicos(document);
            inicializarSelectoresColorAcademicos(document);

            function abrirConfirmacionAcademica(trigger) {
                window.academicDeleteRequest = {
                    url: trigger.dataset.deleteUrl,
                    target: trigger.dataset.deleteTarget,
                    swap: trigger.dataset.deleteSwap || 'outerHTML'
                };

                document.getElementById('academic-delete-title').textContent =
                    trigger.dataset.deleteTitle || 'Confirmar eliminación';
                document.getElementById('academic-delete-message').textContent =
                    trigger.dataset.deleteMessage || '¿Deseas eliminar este registro?';
                var modal = document.getElementById('academic-delete-modal');
                modal.style.display = 'flex';
                modal.classList.remove('modal-visible', 'modal-closing');
                void modal.offsetWidth;
                modal.classList.add('modal-visible');
            }

            function cerrarConfirmacionAcademica() {
                var modal = document.getElementById('academic-delete-modal');
                if (modal && modal.style.display !== 'none') {
                    modal.classList.remove('modal-visible');
                    modal.classList.add('modal-closing');
                    window.setTimeout(function () {
                        modal.style.display = 'none';
                        modal.classList.remove('modal-closing');
                    }, 180);
                }
                window.academicDeleteRequest = null;
            }

            function confirmarEliminacionAcademica() {
                var request = window.academicDeleteRequest;
                if (!request || !request.url || !request.target) {
                    cerrarConfirmacionAcademica();
                    return;
                }

                htmx.ajax('DELETE', request.url, {
                    target: request.target,
                    swap: request.swap
                }).then(function () {
                    cerrarConfirmacionAcademica();
                    if (typeof showNotification === 'function') {
                        showNotification('Registro eliminado correctamente');
                    }
                });
            }

            if (!window.academicoEventsRegistrados) {
                document.body.addEventListener('htmx:afterSwap', function (event) {
                    var panel = event.detail && event.detail.elt;
                    if (panel && panel.id === 'jornada-panel' && window.Alpine && !panel._x_dataStack) {
                        Alpine.initTree(panel);
                    }
                });
                document.addEventListener('academicoGuardado', function (event) {
                    cerrarModalAcademico();
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje);
                    }
                    if (event.detail && event.detail.recargarHorario && typeof recargarHorarioAcademico === 'function') {
                        recargarHorarioAcademico();
                    }
                });
                document.addEventListener('academicoError', function (event) {
                    // No se cierra el modal: se deja abierto para que el usuario corrija el formulario.
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje, 'error');
                    }
                });
                window.academicoEventsRegistrados = true;
            }
        </script>
    </main>
    </th:block>
</body>
