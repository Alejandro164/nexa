<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">

    <p th:if="${errorPadre}" class="est-min-error" th:text="${errorPadre}"></p>

    <div style="margin-bottom:1.15rem;">
        <p th:if="${padresVinculados == null or padresVinculados.empty}" class="est-min-hint" style="margin-bottom:0;">
            Todavía no hay padres o encargados vinculados.
        </p>
        <div th:each="p : ${padresVinculados}" class="est-parent-row">
            <div>
                <div class="est-detail-value" th:text="${p.nombre}">Nombre</div>
                <div class="est-min-subtitle">
                    <span th:text="${p.email}">email</span>
                    <span th:if="${p.cedula != null}"> · <span th:text="${p.cedula}">cédula</span></span>
                </div>
            </div>
            <span class="est-tooltip-wrap" data-tooltip="Desvincular">
                <button type="button" class="btn-xs btn-danger-ghost est-action-btn"
                        aria-label="Desvincular"
                        onclick="abrirConfirmacionDesactivar(this)"
                        th:attr="data-delete-url=${padresBaseUrl} + '/' + ${p.id},data-delete-target=${padresPanelId},data-delete-title='Desvincular encargado',data-delete-confirm-label='Desvincular',data-delete-message='¿Deseas desvincular a ' + ${p.nombre} + '? La cuenta del encargado no se elimina.'">🗑️</button>
            </span>
        </div>
    </div>

    <div style="border-top:1px solid #f1f5f9;padding-top:1rem;"
         x-data="{ estado: 'inicial', padreEncontradoId: null, padreEncontradoNombre: '', nombreSugerido: '', cedulaBuscada: '' }">
        <label class="est-min-label">Agregar padre o encargado por cédula</label>
        <div class="est-lookup-row">
            <input type="text" x-ref="cedula" class="est-min-input" placeholder="Ej. 1-2345-6789"
                   @keydown.enter.prevent="$refs.btnBuscarPadre.click()">
            <button type="button" x-ref="btnBuscarPadre" class="est-btn-outline"
                    @click="
                        estado = 'buscando';
                        const cedula = $refs.cedula.value.trim();
                        cedulaBuscada = cedula;
                        if (!cedula) { estado = 'inicial'; return; }
                        fetch('/estudiantes/buscar-padre?cedula=' + encodeURIComponent(cedula))
                            .then(r => r.json())
                            .then(data => {
                                if (data.encontrado) {
                                    padreEncontradoId = data.padreId;
                                    padreEncontradoNombre = data.nombre;
                                    estado = 'encontrado-local';
                                    return;
                                }
                                fetch('/estudiantes/buscar-hacienda?identificacion=' + encodeURIComponent(cedula))
                                    .then(r => r.json())
                                    .then(h => {
                                        nombreSugerido = h.encontrado ? h.nombre : '';
                                        estado = h.encontrado ? 'crear-con-nombre' : 'crear-manual';
                                    })
                                    .catch(() => { nombreSugerido = ''; estado = 'crear-manual'; });
                            })
                            .catch(() => { estado = 'error'; });
                    ">Buscar</button>
        </div>

        <p x-show="estado === 'buscando'" x-cloak class="est-min-hint" style="margin-top:6px;">Buscando...</p>
        <p x-show="estado === 'error'" x-cloak class="est-min-error" style="margin-top:8px;">Error al buscar. Intenta de nuevo.</p>

        <div x-show="estado === 'encontrado-local'" x-cloak
             style="margin-top:10px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:0.75rem;">
            <div>
                <div class="est-min-subtitle" style="margin:0;">Registrado en el sistema</div>
                <div class="est-detail-value" x-text="padreEncontradoNombre"></div>
            </div>
            <form th:attr="hx-post=${padresBaseUrl} + '/vincular', hx-target=${padresPanelId}" hx-swap="innerHTML">
                <input type="hidden" name="padreId" :value="padreEncontradoId">
                <button type="submit" class="est-btn-solid">Vincular</button>
            </form>
        </div>

        <div x-show="estado === 'crear-con-nombre' || estado === 'crear-manual'" x-cloak
             style="margin-top:10px;padding:12px;border:1px solid #e2e8f0;border-radius:8px;">
            <p class="est-min-hint" style="margin-bottom:0.75rem;">
                <span x-show="estado === 'crear-con-nombre'">Encontrado en Hacienda. Revisa y completa los datos para crear la cuenta.</span>
                <span x-show="estado === 'crear-manual'">No se encontró registro previo. Completa los datos para crear la cuenta.</span>
            </p>
            <form th:attr="hx-post=${padresBaseUrl} + '/crear', hx-target=${padresPanelId}" hx-swap="innerHTML">
                <div class="est-min-form-grid">
                    <div class="est-min-field">
                        <label class="est-min-label">Nombre completo *</label>
                        <input class="est-min-input" type="text" name="nombre" required maxlength="100" :value="nombreSugerido">
                    </div>
                    <div class="est-min-field">
                        <label class="est-min-label">Cédula</label>
                        <input class="est-min-input" type="text" name="cedula" maxlength="30" :value="cedulaBuscada">
                    </div>
                    <div class="est-min-field est-detail-span-2">
                        <label class="est-min-label">Correo electrónico *</label>
                        <input class="est-min-input" type="email" name="email" required maxlength="150" placeholder="correo@ejemplo.com">
                    </div>
                    <div class="est-min-field">
                        <label class="est-min-label">Usuario *</label>
                        <input class="est-min-input" type="text" name="usuario" required maxlength="60" placeholder="ej. juan.perez">
                    </div>
                    <div class="est-min-field">
                        <label class="est-min-label">Contraseña *</label>
                        <input class="est-min-input" type="password" name="password" required placeholder="Contraseña inicial">
                    </div>
                </div>
                <div class="est-min-footer est-min-footer-inline" style="margin-top:0.85rem;padding-top:0.75rem;">
                    <button type="submit" class="est-btn-solid">Crear y vincular</button>
                </div>
            </form>
        </div>
    </div>

</div>
