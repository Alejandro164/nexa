<div th:fragment="content" class="tab-pane" xmlns:th="http://www.thymeleaf.org"
     th:data-q-inicial="${q != null ? q : ''}"
     th:data-campo-inicial="${campo != null ? campo : 'todas'}"
     th:data-periodo-inicial="${periodo != null ? periodo : ''}"
     x-data="{
         q: $el.dataset.qInicial || '',
         campo: $el.dataset.campoInicial || 'todas',
         periodo: $el.dataset.periodoInicial || '',
         _onEstudianteGuardado: null,
         _onEstudianteActualizado: null,
         placeholders: {
             todas: 'Buscar por nombre, correo, cédula, sección...',
             nombre: 'Buscar por nombre del estudiante...',
             email: 'Buscar por correo electrónico...',
             cedula: 'Buscar por número de cédula...',
             seccion: 'Buscar por sección (ej. 7 - A)...',
             periodo: 'Buscar por año de matrícula (ej. 2026)...',
             estado: 'Buscar por estado (Activo / Inactivo)...'
         },
         init() {
             this._onEstudianteGuardado = (evt) => {
                 const anio = evt.detail && evt.detail.periodo;
                 if (!anio) return;
                 const select = document.getElementById('est-filtro-periodo');
                 if (!select) return;
                 const valor = String(anio);
                 const existe = Array.from(select.options).some(o => o.value === valor);
                 if (!existe) {
                     const opt = document.createElement('option');
                     opt.value = valor;
                     opt.textContent = valor;
                     let insertado = false;
                     for (let i = 1; i < select.options.length; i++) {
                         if (Number(select.options[i].value) < Number(anio)) {
                             select.insertBefore(opt, select.options[i]);
                             insertado = true;
                             break;
                         }
                     }
                     if (!insertado) {
                         select.appendChild(opt);
                     }
                 }
             };
             document.body.addEventListener('estudianteGuardado', this._onEstudianteGuardado);
             this._onEstudianteActualizado = () => {
                 if (!window.htmx || !this.$refs.filtrosForm) return;
                 const params = new URLSearchParams(new FormData(this.$refs.filtrosForm));
                 const pagInput = document.getElementById('est-pagina-actual');
                 if (pagInput && pagInput.value) {
                     params.set('pagina', pagInput.value);
                 }
                 window.htmx.ajax('GET', '/estudiantes/expedientes/lista?' + params.toString(), {
                     target: '#estudiantes-dir-content',
                     swap: 'innerHTML'
                 });
             };
             document.body.addEventListener('estudianteActualizado', this._onEstudianteActualizado);
         },
         destroy() {
             if (this._onEstudianteGuardado) {
                 document.body.removeEventListener('estudianteGuardado', this._onEstudianteGuardado);
             }
             if (this._onEstudianteActualizado) {
                 document.body.removeEventListener('estudianteActualizado', this._onEstudianteActualizado);
             }
         },
         placeholderActual() {
             return this.placeholders[this.campo] || this.placeholders.todas;
         },
         hayFiltrosActivos() {
             return this.q.trim() !== '' || this.campo !== 'todas' || this.periodo !== '';
         },
         buscar() {
             this.$nextTick(() => {
                 if (this.$refs.filtrosForm && window.htmx) {
                     window.htmx.trigger(this.$refs.filtrosForm, 'filtrar');
                 }
             });
         },
         alCambiarCampo() {
             if (this.q.trim() !== '') {
                 this.buscar();
             }
             this.$nextTick(() => {
                 if (this.$refs.inputBuscar) {
                     this.$refs.inputBuscar.focus();
                 }
             });
         },
         limpiarBusqueda() {
             this.q = '';
             this.buscar();
             this.$nextTick(() => {
                 if (this.$refs.inputBuscar) {
                     this.$refs.inputBuscar.focus();
                 }
             });
         },
         limpiarFiltros() {
             this.q = '';
             this.campo = 'todas';
             this.periodo = '';
             this.buscar();
         },
         openModal(id) {
             const el = document.getElementById(id);
             el.style.display = 'block';
             setTimeout(() => {
                 void el.offsetWidth;
                 el.classList.remove('dir-modal-closing');
                 el.classList.add('dir-modal-visible');
             }, 0);
         },
         closeModal(id) {
             const el = document.getElementById(id);
             el.classList.remove('dir-modal-visible');
             el.classList.add('dir-modal-closing');
             setTimeout(() => {
                 el.style.display = 'none';
                 el.classList.remove('dir-modal-closing');
             }, 180);
         }
     }"
     @open-modal.window="openModal('estudiantes-modal-container')"
     @close-modal.window="closeModal('estudiantes-modal-container')"
     @open-ficha.window="openModal('estudiantes-ficha-container')"
     @close-ficha.window="closeModal('estudiantes-ficha-container')"
     @keydown.escape.window="closeModal('estudiantes-modal-container'); closeModal('estudiantes-ficha-container')">

    <style>
        .est-toolbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            padding: 1rem 1.5rem;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .est-search-group {
            flex: 1 1 340px;
            max-width: 580px;
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            min-height: 40px;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }
        .est-search-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.12);
        }
        .est-campo-wrap {
            position: relative;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            background: #f1f5f9;
            border-right: 1px solid #e2e8f0;
            align-self: stretch;
        }
        .est-campo-select {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            background: transparent;
            color: #334155;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0 28px 0 12px;
            height: 100%;
            min-height: 38px;
            cursor: pointer;
            outline: none;
        }
        .est-campo-select:hover {
            color: var(--primary);
        }
        .est-select-chevron {
            position: absolute;
            right: 9px;
            pointer-events: none;
            color: #64748b;
            width: 14px;
            height: 14px;
        }
        .est-input-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .est-search-icon {
            position: absolute;
            left: 11px;
            width: 16px;
            height: 16px;
            color: #94a3b8;
            pointer-events: none;
            flex-shrink: 0;
        }
        .est-search-input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.86rem;
            padding: 8px 34px 8px 34px;
            outline: none;
            min-width: 0;
        }
        .est-search-input::placeholder {
            color: #94a3b8;
        }
        .est-clear-btn {
            position: absolute;
            right: 8px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: #e2e8f0;
            color: #475569;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            padding: 0;
            transition: background 0.15s, color 0.15s;
        }
        .est-clear-btn:hover {
            background: #cbd5e1;
            color: #0f172a;
        }
        .est-periodo-group {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 0 10px 0 12px;
            min-height: 40px;
            position: relative;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        .est-periodo-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.12);
        }
        .est-periodo-group.is-active {
            border-color: var(--primary);
            background: rgba(45, 90, 135, 0.04);
        }
        .est-filter-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            white-space: nowrap;
            margin: 0;
            cursor: pointer;
        }
        .est-periodo-group.is-active .est-filter-label {
            color: var(--primary);
        }
        .est-periodo-select {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            background: transparent;
            color: #0f172a;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 600;
            padding: 6px 22px 6px 4px;
            cursor: pointer;
            outline: none;
            min-width: 78px;
        }
        .est-reset-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            min-height: 40px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .est-reset-btn:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
            color: #0f172a;
        }
        .est-add-btn {
            margin-left: auto;
            min-height: 40px;
            font-size: 0.85rem;
            padding: 8px 16px;
            white-space: nowrap;
        }
        .est-periodo-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 6px;
            background: #f1f5f9;
            color: #334155;
            font-size: 0.78rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .est-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1;
        }
        .est-deactivate-btn:disabled {
            opacity: 0.42;
            cursor: not-allowed;
            pointer-events: none;
        }
        .est-pagination-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 0.85rem 1.5rem;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .est-pagination-info {
            font-size: 0.82rem;
            color: #64748b;
            font-variant-numeric: tabular-nums;
        }
        .est-pagination-info strong {
            color: #1e293b;
            font-weight: 600;
        }
        .est-pagination-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .est-page-size {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: #64748b;
        }
        .est-page-size-select {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #1e293b;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 5px 10px;
            cursor: pointer;
            outline: none;
        }
        .est-page-size-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.12);
        }
        .est-pagination-nav {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0;
        }
        .est-pagination-nav .pagination-item {
            min-width: 34px;
            height: 34px;
            font-size: 0.82rem;
            border-color: #cbd5e1;
        }
        .est-pagination-ellipsis {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 34px;
            color: #94a3b8;
            font-size: 0.85rem;
            user-select: none;
        }
        #estudiantes-dir-content {
            transition: opacity 0.15s ease;
        }
        #estudiantes-dir-content.htmx-request {
            opacity: 0.55;
        }
        @media (max-width: 640px) {
            .est-toolbar,
            .est-pagination-bar {
                padding: 0.85rem 1rem;
            }
            .est-search-group {
                flex-basis: 100%;
                max-width: none;
            }
            .est-periodo-group {
                flex: 1;
                justify-content: space-between;
            }
            .est-add-btn {
                width: 100%;
                margin-left: 0;
                justify-content: center;
            }
        }
    </style>

    <div class="module-card">
        <form id="estudiantes-filtros-form"
              x-ref="filtrosForm"
              class="est-toolbar"
              hx-get="/estudiantes/expedientes/lista"
              hx-target="#estudiantes-dir-content"
              hx-swap="innerHTML"
              hx-trigger="filtrar"
              hx-indicator="#estudiantes-dir-content"
              @submit.prevent="buscar()">

            <input type="hidden" id="est-tamano-input" name="tamano" th:value="${tamano != null ? tamano : 10}">

            <div class="est-search-group">
                <div class="est-campo-wrap">
                    <select name="campo" class="est-campo-select"
                            x-model="campo"
                            @change="alCambiarCampo()"
                            aria-label="Buscar por columna"
                            title="Seleccionar columna de búsqueda">
                        <option value="todas" th:selected="${campo == null or campo == 'todas'}">Todas</option>
                        <option value="nombre" th:selected="${campo == 'nombre'}">Nombre</option>
                        <option value="email" th:selected="${campo == 'email'}">Email</option>
                        <option value="cedula" th:selected="${campo == 'cedula'}">Cédula</option>
                        <option value="seccion" th:selected="${campo == 'seccion'}">Sección</option>
                        <option value="periodo" th:selected="${campo == 'periodo'}">Período</option>
                        <option value="estado" th:selected="${campo == 'estado'}">Estado</option>
                    </select>
                    <svg class="est-select-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 8l4 4 4-4"/>
                    </svg>
                </div>

                <div class="est-input-wrap">
                    <svg class="est-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M20 20l-3.5-3.5"/>
                    </svg>
                    <input type="text"
                           name="q"
                           x-ref="inputBuscar"
                           x-model="q"
                           class="est-search-input"
                           th:value="${q}"
                           :placeholder="placeholderActual()"
                           @input.debounce.350ms="buscar()"
                           @keydown.enter.prevent="buscar()"
                           autocomplete="off"
                           aria-label="Buscar expedientes estudiantiles">
                    <button type="button"
                            class="est-clear-btn"
                            x-show="q.length > 0"
                            x-cloak
                            @click="limpiarBusqueda()"
                            title="Limpiar búsqueda"
                            aria-label="Limpiar búsqueda">&times;</button>
                </div>
            </div>

            <div class="est-periodo-group" :class="{ 'is-active': periodo !== '' }">
                <label for="est-filtro-periodo" class="est-filter-label">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18"/>
                    </svg>
                    Período
                </label>
                <select id="est-filtro-periodo"
                        name="periodo"
                        class="est-periodo-select"
                        x-model="periodo"
                        @change="buscar()"
                        aria-label="Filtrar por período (año de matrícula)">
                    <option value="">Todos</option>
                    <option th:each="anio : ${periodos}"
                            th:value="${anio}"
                            th:text="${anio}"
                            th:selected="${periodo != null and periodo == anio}">2026</option>
                </select>
                <svg class="est-select-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 8l4 4 4-4"/>
                </svg>
            </div>

            <button type="button"
                    class="est-reset-btn"
                    x-show="hayFiltrosActivos()"
                    x-cloak
                    @click="limpiarFiltros()"
                    title="Restablecer búsqueda y filtros">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                Limpiar
            </button>

            <button type="button" class="btn-primary est-add-btn"
                    hx-get="/estudiantes/expedientes/form"
                    hx-target="#estudiantes-modal-container" hx-swap="innerHTML"
                    hx-on:htmx:after-request="window.dispatchEvent(new CustomEvent('open-modal'))">+ Agregar estudiante</button>
        </form>

        <div id="estudiantes-dir-content" th:insert="~{estudiantes/expedientes/lista :: content}"></div>
    </div>

    <div id="estudiantes-modal-container" style="display:none;"></div>
    <div id="estudiantes-ficha-container" style="display:none;"></div>
</div>
