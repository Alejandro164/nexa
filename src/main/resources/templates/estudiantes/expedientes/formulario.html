<div th:fragment="form-content" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-backdrop" @click.self="$dispatch('close-modal')"
         x-data="crearEstadoFormularioEstudiantes()">
        <div class="modal-dialog est-min-dialog" style="max-width:560px;">
            <div class="est-min-header">
                <h3 class="est-min-title" th:text="${usuario.id == null ? 'Agregar estudiante' : 'Editar estudiante'}">Estudiante</h3>
                <button type="button" class="est-min-close" @click="$dispatch('close-modal')" aria-label="Cerrar">&times;</button>
            </div>
            <div class="est-min-body">
                <div class="est-min-tabs">
                    <button type="button" class="est-min-tab" :class="{active: tab === 'general'}" @click="tab = 'general'">
                        Información general
                    </button>
                    <button type="button" class="est-min-tab" :class="{active: tab === 'padres'}"
                            th:if="${usuario.id == null}"
                            @click="tab = 'padres'">
                        Padres / Encargados (<span x-text="padresSeleccionados.length">0</span>)
                    </button>
                    <button type="button" class="est-min-tab" :class="{active: tab === 'padres'}"
                            th:if="${usuario.id != null}"
                            th:attr="hx-get='/estudiantes/expedientes/' + ${usuario.id} + '/padres'"
                            hx-target="#estudiante-padres-panel" hx-swap="innerHTML"
                            @click="tab = 'padres'">
                        Padres / Encargados
                    </button>
                </div>

                <form th:action="@{/estudiantes/expedientes}" method="post"
                      hx-post="/estudiantes/expedientes"
                      hx-include="#estudiantes-filtros-form, #est-pagina-actual"
                      hx-target="#estudiantes-dir-content" hx-swap="innerHTML"
                      @invalid.capture="tab = 'general'"
                      hx-on:htmx:after-request="if(event.detail.successful && !event.detail.xhr.getResponseHeader('HX-Retarget')) this.dispatchEvent(new CustomEvent('close-modal',{bubbles:true}))">
                    <input type="hidden" name="id" th:value="${usuario.id}">
                    <template x-for="p in padresSeleccionados" :key="'hid-' + p.id">
                        <input type="hidden" name="padreIds" :value="p.id">
                    </template>

                    <div x-show="tab === 'general'">
                        <p th:if="${error}" class="est-min-error" th:text="${error}"></p>

                        <div class="est-min-form-grid">
                            <div class="est-min-field est-detail-span-2">
                                <label class="est-min-label">Nombre completo *</label>
                                <input class="est-min-input" type="text" name="nombre" required maxlength="100"
                                       th:value="${usuario.nombre}" placeholder="Ej. Sofía Alpízar Soto">
                            </div>
                            <div class="est-min-field">
                                <label class="est-min-label">Cédula</label>
                                <input class="est-min-input" type="text" name="cedula" maxlength="30"
                                       th:value="${usuario.cedula}" placeholder="1-2345-6789">
                            </div>
                            <div class="est-min-field">
                                <label class="est-min-label">Período (Año) *</label>
                                <input class="est-min-input" type="number" name="anioMatricula" required
                                       min="1990" max="2100" step="1"
                                       th:value="${usuario.anioMatricula != null ? usuario.anioMatricula : anioActual}"
                                       placeholder="2026">
                            </div>
                            <div class="est-min-field est-detail-span-2">
                                <label class="est-min-label">Correo electrónico *</label>
                                <input class="est-min-input" type="email" name="email" required maxlength="150"
                                       th:value="${usuario.email}" placeholder="correo@ejemplo.com">
                            </div>
                            <div class="est-min-field">
                                <label class="est-min-label">Usuario *</label>
                                <input class="est-min-input" type="text" name="usuario" required maxlength="60"
                                       th:value="${usuario.usuario}" placeholder="sofia.alpizar">
                            </div>
                            <div class="est-min-field">
                                <label class="est-min-label"
                                       th:text="${usuario.id == null ? 'Contraseña *' : 'Contraseña'}">Contraseña</label>
                                <input class="est-min-input" type="password" name="password"
                                       th:required="${usuario.id == null}"
                                       th:placeholder="${usuario.id == null ? 'Contraseña inicial' : 'Dejar vacío para no cambiar'}">
                            </div>
                            <div class="est-min-field est-detail-span-2">
                                <label class="est-min-label">Sección *</label>
                                <select class="est-min-input" name="nivelId" required>
                                    <option value="" disabled th:selected="${usuario.nivelAcademico == null}">Seleccione una sección</option>
                                    <option th:each="nivel : ${niveles}" th:value="${nivel.id}"
                                            th:text="${nivel.nombreCompleto}"
                                            th:selected="${usuario.nivelAcademico != null and usuario.nivelAcademico.id == nivel.id}"></option>
                                </select>
                                <p th:if="${niveles == null or niveles.empty}" class="est-min-hint" style="margin-top:4px;">
                                    No hay secciones activas configuradas. Créalas en Configuración Académica.
                                </p>
                            </div>
                            <div class="est-min-field est-detail-span-2">
                                <label class="est-min-check">
                                    <input type="checkbox" name="activo" value="true"
                                           th:checked="${usuario.activo == null or usuario.activo == true}">
                                    <span>Estudiante activo</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div x-show="tab === 'padres'" x-cloak th:if="${usuario.id == null}">
                        <div th:replace="~{estudiantes/components/padres-selector :: selector}"></div>
                    </div>

                    <div class="est-min-footer est-min-footer-inline" th:if="${usuario.id == null}" x-show="tab === 'general' || tab === 'padres'">
                        <button type="button" class="est-btn-outline" @click="$dispatch('close-modal')">Cancelar</button>
                        <button type="submit" class="est-btn-solid">Guardar</button>
                    </div>
                    <div class="est-min-footer est-min-footer-inline" th:if="${usuario.id != null}" x-show="tab === 'general'">
                        <button type="button" class="est-btn-outline" @click="$dispatch('close-modal')">Cancelar</button>
                        <button type="submit" class="est-btn-solid">Guardar</button>
                    </div>
                </form>

                <div x-show="tab === 'padres'" x-cloak th:if="${usuario.id != null}" id="estudiante-padres-panel"></div>
            </div>
        </div>
    </div>
</div>
