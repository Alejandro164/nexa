<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Nexa — Portal Educativo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <script>
        document.addEventListener('htmx:configRequest', function (evt) {
            var token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            var header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
            if (token) evt.detail.headers[header] = token;
        });

        function updateActiveSidebar() {
            var path = window.location.pathname;
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(function (item) {
                var href = item.getAttribute('href');
                if (href && (path === href || path.startsWith(href + '/'))) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
        document.addEventListener('DOMContentLoaded', updateActiveSidebar);
        document.addEventListener('htmx:afterSettle', updateActiveSidebar);
        document.addEventListener('htmx:historyRestore', updateActiveSidebar);
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        *::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        *::-webkit-scrollbar-track {
            background: #ffffff;
        }

        *::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            background-clip: padding-box;
            border: 4px solid transparent;
            border-radius: 999px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }

        html {
            scrollbar-color: #94a3b8 #ffffff;
        }

        html::-webkit-scrollbar-thumb {
            background-color: #94a3b8;
        }

        html::-webkit-scrollbar-thumb:hover {
            background-color: #64748b;
        }

        :root {
            --sidebar-width: 280px;
            --sidebar-collapsed: 78px;
            --topbar-height: 79px;
            --sidebar-bg: #ffffff;
            --sidebar-bg-hover: #f1f5f9;
            --sidebar-bg-active: rgba(45, 90, 135, 0.08);
            --sidebar-text: #64748b;
            --sidebar-text-active: #1e293b;
            --sidebar-accent: #2d5a87;
            --sidebar-accent-glow: rgba(45, 90, 135, 0.08);
            --sidebar-border: #e2e8f0;
            --main-bg: #f8fafc;
            --primary: #2d5a87;
            --primary-light: #60a5fa;
            --accent: #60a5fa;
            --warm: #f59e0b;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --success: #22c55e;
            --error: #dc2626;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-solid: #FFFFFF;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--main-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* ═══════════════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════════════ */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: width 0.3s cubic-bezier(.4, 0, .2, 1);
            overflow: visible;
            border-right: 1px solid var(--sidebar-border);
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar-header {
            height: var(--topbar-height);
            min-height: var(--topbar-height);
            padding: 16px 58px 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #2d5a87, #60a5fa);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-logo svg {
            width: 22px;
            height: 22px;
            color: white;
        }

        .sidebar-brand {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--sidebar-text-active);
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .sidebar-brand {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar.collapsed .sidebar-header {
            padding: 16px 20px;
        }

        .sidebar-toggle {
            position: absolute;
            right: 16px;
            top: calc((var(--topbar-height) - 28px) / 2);
            width: 28px;
            height: 28px;
            background: #2d5a87;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            z-index: 101;
            box-shadow: 0 2px 8px rgba(45, 90, 135, 0.24);
            transition:
                right 0.3s cubic-bezier(.4, 0, .2, 1),
                transform 0.3s,
                background 0.2s;
        }

        .sidebar.collapsed .sidebar-toggle {
            right: -14px;
        }

        .sidebar-toggle:hover {
            background: var(--primary-light);
        }

        .sidebar-toggle svg {
            width: 14px;
            height: 14px;
            transition: transform 0.3s;
        }

        .sidebar.collapsed .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 12px;
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--sidebar-border);
            border-radius: 4px;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-section-title {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            padding: 0 12px;
            margin-bottom: 8px;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .nav-section-title {
            opacity: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.15s;
            margin-bottom: 2px;
            cursor: pointer;
            position: relative;
        }

        .nav-item:hover {
            background: var(--sidebar-bg-hover);
            color: var(--sidebar-text-active);
        }

        .nav-item.htmx-request {
            opacity: 0.7;
            pointer-events: none;
        }

        .nav-item.active {
            background: #2d5a87;
            color: #ffffff;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: #60a5fa;
            border-radius: 0 3px 3px 0;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .nav-item-text {
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .nav-item-text {
            opacity: 0;
            pointer-events: none;
        }

        .nav-badge {
            margin-left: auto;
            background: var(--sidebar-accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            opacity: 1;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .nav-badge {
            opacity: 0;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--sidebar-border);
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            transition: background 0.15s;
            cursor: pointer;
            position: relative;
        }

        .sidebar-user:hover {
            background: var(--sidebar-bg-hover);
        }

        .sidebar-user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #2d5a87, #60a5fa);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: white;
            flex-shrink: 0;
        }

        .sidebar-user-info {
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.2s;
        }

        .sidebar.collapsed .sidebar-user-info {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-user-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--sidebar-text-active);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-user-role {
            font-size: 0.72rem;
            color: #94a3b8;
            white-space: nowrap;
        }

        .user-dropdown-menu {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #FFFFFF;
            border: 1px solid var(--sidebar-border);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            display: none;
        }

        .user-dropdown-menu.show {
            display: block;
        }

        .user-dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--sidebar-text);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            background: none;
            width: 100%;
            font-family: inherit;
        }

        .user-dropdown-item:hover {
            background: var(--sidebar-bg-hover);
            color: var(--sidebar-text-active);
        }

        .user-dropdown-item.danger {
            color: var(--error);
        }

        .user-dropdown-item.danger:hover {
            background: rgba(220, 38, 38, 0.12);
        }

        .user-dropdown-item svg {
            width: 18px;
            height: 18px;
        }

        /* ═══════════════════════════════════════════
           MAIN CONTENT
        ═══════════════════════════════════════════ */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            transition: margin-left 0.3s cubic-bezier(.4, 0, .2, 1);
        }

        .sidebar.collapsed~.main-wrapper {
            margin-left: var(--sidebar-collapsed);
        }

        .topbar {
            min-height: var(--topbar-height);
            background: var(--surface-solid);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            padding: 8px;
            border-radius: 8px;
        }

        .mobile-menu-btn:hover {
            background: var(--input-bg);
        }

        .mobile-menu-btn svg {
            width: 24px;
            height: 24px;
        }

        .topbar-title h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .topbar-title p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: var(--input-bg);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .topbar-icon-btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .topbar-icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .notification-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: var(--error);
            border-radius: 50%;
            border: 2px solid var(--surface-solid);
        }

        /* Fixed collapsed sidebar user menu */
        .sidebar.collapsed .user-dropdown-menu {
            width: 220px;
            left: 12px;
            right: auto;
        }

        /* Topbar Profile Dropdown */
        .topbar-profile {
            position: relative;
            margin-left: 8px;
        }

        .profile-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 9999px;
            background: var(--surface-solid);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: var(--text-primary);
        }

        .profile-btn:hover {
            background: var(--input-bg);
            border-color: var(--text-light);
        }

        .profile-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .profile-name {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .chevron-icon {
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
        }

        .profile-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 220px;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 100;
        }

        .dropdown-header {
            padding: 10px 12px;
        }

        .dropdown-user-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .dropdown-user-role {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .dropdown-item:hover {
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .dropdown-item.danger {
            color: var(--error);
        }

        .dropdown-item.danger:hover {
            background: rgba(220, 38, 38, 0.08);
            color: var(--error);
        }

        .dropdown-item svg {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 640px) {
            .profile-name {
                display: none;
            }
        }

        .content-area {
            padding: 15px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: hsl(0, 0%, 0%, 0.5);
            z-index: 99;
        }

        .sidebar-overlay.show {
            display: block;
        }

        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(.4, 0, .2, 1);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .sidebar-toggle {
                display: none;
            }

            .main-wrapper {
                margin-left: 0 !important;
            }

            .mobile-menu-btn {
                display: flex;
            }



            .topbar {
                padding: 16px;
            }
        }

        /* ═══════════════════════════════════════════
           EXISTING COMPONENTS
        ═══════════════════════════════════════════ */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .py-8 {
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        .mt-6 {
            margin-top: 1.5rem;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .card {
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            background: var(--surface-solid);
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 300px;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            color: var(--text-light);
        }

        .form-input {
            width: 100%;
            padding: 0.5rem 0.75rem 0.5rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--surface-solid);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .table th,
        .table td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .table th {
            background-color: var(--input-bg);
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-primary {
            background-color: rgba(45, 90, 135, 0.1);
            color: var(--primary);
        }

        .badge-success {
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .badge-danger {
            background-color: rgba(220, 38, 38, 0.1);
            color: var(--error);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.375rem;
        }

        .status-active {
            background-color: var(--success);
        }

        .status-inactive {
            background-color: var(--error);
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 24, 39, 0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-dialog {
            background-color: var(--surface-solid);
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .modal-body .form-input {
            padding-left: 0.75rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 2rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            font-weight: 500;
            font-size: 0.875rem;
            background: var(--surface-solid);
            border: 1px solid var(--border);
        }

        .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
        }

        .htmx-request .htmx-indicator {
            opacity: 1;
        }

        .htmx-request.htmx-indicator {
            opacity: 1;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(45, 90, 135, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .ml-2 {
            margin-left: 0.5rem;
        }

        .shadow-sm {
            box-shadow: var(--shadow-sm);
        }

        .hover-scale:hover {
            transform: translateY(-1px);
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .text-muted {
            color: var(--text-secondary);
        }

        .text-dark {
            color: var(--text-primary);
        }

        .font-medium {
            font-weight: 500;
        }

        .text-sm {
            font-size: 0.875rem;
        }

        .d-flex {
            display: flex;
        }

        .align-items-center {
            align-items: center;
        }

        .me-3 {
            margin-right: 0.75rem;
        }

        .gap-1 {
            gap: 0.25rem;
        }

        .flex-wrap {
            flex-wrap: wrap;
        }

        .hover-bg:hover {
            background-color: #f1f5f9;
        }

        .transition-colors {
            transition: background-color 0.2s ease;
        }

        .empty-state {
            padding: 2rem;
            text-align: center;
        }

        .avatar-sm {
            width: 32px;
            height: 32px;
            background: var(--input-bg);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .badge-info {
            background-color: rgba(96, 165, 250, 0.1);
            color: var(--primary-light);
        }

        .badge-secondary {
            background-color: rgba(100, 116, 139, 0.1);
            color: var(--text-secondary);
        }

        .btn-icon {
            padding: 0.4rem;
            background: transparent;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-icon:hover {
            background-color: var(--input-bg);
        }

        .hover-primary:hover {
            color: var(--primary);
        }

        .hover-danger:hover {
            color: var(--error);
            background-color: rgba(220, 38, 38, 0.1);
        }

        [x-cloak] {
            display: none !important;
        }

        /* ── Multiselect ─────────────────────────────────────── */
        .multiselect-trigger { width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;background:#fff;color:#334155;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left;font-family:inherit;box-sizing:border-box; }
        .multiselect-trigger:hover,.multiselect-trigger[aria-expanded="true"] { border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,90,135,0.1); }
        .multiselect-arrow { flex-shrink:0;color:#94a3b8;transition:transform 0.2s ease; }
        .multiselect-arrow.rotated { transform:rotate(180deg); }
        .multiselect-panel { position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 28px rgba(15,23,42,0.14);z-index:9999;max-height:200px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#cbd5e1 #fff;opacity:0;transform:translateY(-7px) scale(0.98);transform-origin:top center;visibility:hidden;pointer-events:none;transition:opacity 150ms ease,transform 180ms cubic-bezier(.22,1,.36,1),visibility 0s linear 180ms; }
        .multiselect-panel::-webkit-scrollbar { width:12px; }
        .multiselect-panel::-webkit-scrollbar-track { background:#fff; }
        .multiselect-panel::-webkit-scrollbar-thumb { background:#cbd5e1;background-clip:padding-box;border-left:3px solid transparent;border-right:5px solid transparent;border-radius:999px; }
        .multiselect-panel::-webkit-scrollbar-thumb:hover { background-color:#94a3b8; }
        .multiselect-panel.ms-open { opacity:1;transform:translateY(0) scale(1);visibility:visible;pointer-events:auto;transition-delay:0s; }
        .multiselect-option { display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:0.88rem;color:#334155;transition:background 0.15s;user-select:none; }
        .multiselect-option:hover { background:#f8fafc; }
        .multiselect-option.ms-selected { background:#eff6ff;color:#1d4ed8;font-weight:500; }
        .multiselect-check { flex-shrink:0;color:transparent; }
        .multiselect-option.ms-selected .multiselect-check { color:var(--primary); }

        /* ── Custom Select (academic-select) ─────────────────── */
        .academic-native-select { position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important; }
        .academic-select { position:relative;width:100%; }
        .academic-select-trigger { width:100%;min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.5rem 10px 0.5rem 0.75rem;border:1px solid var(--border);border-radius:8px;background:var(--surface-solid,#fff);color:var(--text-primary);font-family:inherit;font-size:0.875rem;text-align:left;cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s; }
        .academic-select-trigger:hover { border-color:#cbd5e1; }
        .academic-select.open .academic-select-trigger,.academic-select-trigger:focus { border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,90,135,0.1);outline:none; }
        .academic-select-placeholder { color:var(--text-light,#94a3b8); }
        .academic-select-arrow { width:16px;height:16px;flex:0 0 16px;color:var(--text-secondary);transition:transform 0.2s; }
        .academic-select.open .academic-select-arrow { transform:rotate(180deg); }
        .academic-select-options { position:absolute;z-index:10020;max-width:100vw;top:calc(100% + 6px);left:0;right:0;max-height:200px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#cbd5e1 #fff;padding:0.35rem;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:0 12px 28px rgba(15,23,42,0.14);visibility:hidden;opacity:0;transform:translateY(-7px) scale(0.98);transform-origin:top center;pointer-events:none;transition:opacity 150ms ease,transform 180ms cubic-bezier(.22,1,.36,1),visibility 0s linear 180ms; }
        .academic-select-options::-webkit-scrollbar { width:12px; }
        .academic-select-options::-webkit-scrollbar-track { background:#fff; }
        .academic-select-options::-webkit-scrollbar-thumb { background:#cbd5e1;background-clip:padding-box;border-left:3px solid transparent;border-right:5px solid transparent;border-radius:999px; }
        .academic-select-options::-webkit-scrollbar-thumb:hover { background-color:#94a3b8; }
        .academic-select.open .academic-select-options,
        .academic-select-options.is-open { visibility:visible;opacity:1;transform:translateY(0) scale(1);pointer-events:auto;transition-delay:0s; }
        .academic-select-option { width:100%;padding:0.6rem 0.7rem;border:0;border-radius:7px;background:transparent;color:var(--text-primary);font-family:inherit;font-size:0.84rem;text-align:left;cursor:pointer; }
        .academic-select-option:hover,.academic-select-option:focus { background:var(--input-bg);color:var(--primary);outline:none; }
        .academic-select-option.selected { background:rgba(45,90,135,0.1);color:var(--primary);font-weight:700; }
    </style>

    <script th:src="@{/js/componentes.js}" defer></script>

    <th:block layout:fragment="head-extra"></th:block>
</head>

<body x-data="{ sidebarCollapsed: false, mobileMenuOpen: false, userMenuOpen: false }">

    <div class="sidebar-overlay" :class="{ 'show': mobileMenuOpen }" @click="mobileMenuOpen = false"></div>

    <th:block th:replace="~{layout/aside :: aside}" />

    <div class="main-wrapper">
        <th:block th:replace="~{layout/header :: header}" />
        <main class="content-area" layout:fragment="content"></main>
    </div>

    <th:block th:replace="~{layout/toast :: toast}" />

    <div id="modal-container" class="modal-overlay"></div>
    <div th:replace="~{configuracion-academica/components/confirmar-eliminacion :: modal}"></div>

    <style>
        .modal-overlay { display: none; }
        .modal-overlay.show { display: block; }
        @keyframes academicModalBackdropIn  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes academicModalBackdropOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes academicModalDialogIn    { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes academicModalDialogOut   { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(12px) scale(0.98); } }
        #modal-container.show .modal-backdrop,
        #academic-delete-modal.modal-visible { animation: academicModalBackdropIn 180ms ease-out both; }
        #modal-container.show .modal-dialog,
        #academic-delete-modal.modal-visible .modal-dialog { animation: academicModalDialogIn 240ms cubic-bezier(.22, 1, .36, 1) both; }
        #modal-container.modal-closing .modal-backdrop,
        #academic-delete-modal.modal-closing { animation: academicModalBackdropOut 180ms ease-in both; }
        #modal-container.modal-closing .modal-dialog,
        #academic-delete-modal.modal-closing .modal-dialog { animation: academicModalDialogOut 180ms ease-in both; }
        .academic-delete-dialog { max-width: 460px; border-top: 4px solid var(--error); }
        .academic-delete-message { display:flex;align-items:flex-start;gap:1rem;padding:1rem;border:1px solid #fecaca;border-radius:10px;background:#fef2f2;color:#7f1d1d;line-height:1.55; }
        .academic-delete-icon { width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--error);color:white;font-weight:800; }
        .academic-help { color:var(--text-secondary);font-size:0.84rem;margin-top:0.3rem; }
        .btn-destructive { padding:9px 18px;background:var(--error);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:0.85rem;cursor:pointer; }
        .btn-destructive:hover { opacity:0.9; }
    </style>

</body>

</html>
