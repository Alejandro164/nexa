<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="modal-content">
        <div class="modal-backdrop"
             @click.self="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h3 class="modal-title">Editar perfil</h3>
                    <button type="button" class="close-btn"
                            @click="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">
                        &times;
                    </button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/perfil}" method="post"
                          hx-post="/perfil"
                          hx-target="#perfil-content" hx-swap="outerHTML">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div th:if="${error}" class="form-alert-error" th:text="${error}"></div>

                        <div class="form-group">
                            <label class="form-label">Nombre completo *</label>
                            <input class="form-input" type="text" name="nombre" required maxlength="100"
                                   th:value="${usuario.nombre}" placeholder="Ej. Ana Fernández Rojas" style="padding-left:0.75rem;">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Teléfono</label>
                            <input class="form-input" type="tel" name="telefono" maxlength="30"
                                   th:value="${usuario.telefono}" placeholder="8888-4321" style="padding-left:0.75rem;">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Correo electrónico</label>
                            <input class="form-input" type="email" disabled th:value="${usuario.email}"
                                   style="padding-left:0.75rem; background:var(--input-bg); color:var(--text-secondary);">
                            <p style="font-size:0.75rem;color:var(--text-light);margin-top:6px;">
                                Para cambiar tu correo o cédula contactá a un administrador.
                            </p>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                    @click="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
