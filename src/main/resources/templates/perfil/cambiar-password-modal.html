<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="modal-content">
        <div class="modal-backdrop"
             @click.self="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h3 class="modal-title">Cambiar contraseña</h3>
                    <button type="button" class="close-btn"
                            @click="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">
                        &times;
                    </button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/perfil/cambiar-password}" method="post"
                          hx-post="/perfil/cambiar-password"
                          hx-target="#modal-container" hx-swap="innerHTML">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div th:if="${error}" class="form-alert-error" th:text="${error}"></div>

                        <div class="form-group">
                            <label class="form-label">Contraseña actual *</label>
                            <input class="form-input" type="password" name="passwordActual" required
                                   style="padding-left:0.75rem;">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Nueva contraseña *</label>
                            <input class="form-input" type="password" name="passwordNueva" required minlength="8"
                                   style="padding-left:0.75rem;">
                            <p style="font-size:0.75rem;color:var(--text-light);margin-top:6px;">Al menos 8 caracteres.</p>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Confirmar nueva contraseña *</label>
                            <input class="form-input" type="password" name="passwordConfirmar" required minlength="8"
                                   style="padding-left:0.75rem;">
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                    @click="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
