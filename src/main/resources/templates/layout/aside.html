<aside class="sidebar"
       th:fragment="aside"
       xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
       x-data="modoMenu()"
       th:attr="data-admin=${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')},data-system=${#authorization.expression('hasAuthority(''ROLE_SYSTEM_CONFIG'')')}"
       x-bind:class="{ 'collapsed': sidebarCollapsed, 'mobile-open': mobileMenuOpen }">

    <button class="sidebar-toggle" @click="sidebarCollapsed = !sidebarCollapsed">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
        </svg>
    </button>

    <div class="sidebar-header">
        <div class="sidebar-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>
        </div>
        <span class="sidebar-brand">Nexa</span>
    </div>

    <div id="dir-switcher-slot" th:fragment="switcher"
         th:attr="hx-swap-oob=${sincronizarSwitcher} ? 'outerHTML' : null"
         x-show="modo !== 'system'">
        <div class="dir-switcher"
             sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_DIRECTOR')"
             th:if="${menuDireccion != null and menuDireccion.visible}"
             x-data="{ open: false }"
             @click.outside="open = false"
             th:with="nombreDir=${session.SESSION_DIRECCION_NOMBRE != null and !#strings.isEmpty(session.SESSION_DIRECCION_NOMBRE) ? session.SESSION_DIRECCION_NOMBRE : 'Dirección'}">
            <button type="button" class="dir-switcher-btn" @click="open = !open"
                    :aria-expanded="open ? 'true' : 'false'" aria-haspopup="true" th:title="${nombreDir}">
                <span class="dir-switcher-mark" th:text="${#strings.substring(nombreDir, 0, 1)}">D</span>
                <span class="dir-switcher-copy">
                    <span class="dir-switcher-kicker">Dirección activa</span>
                    <span class="dir-switcher-name" th:text="${nombreDir}">Dirección</span>
                </span>
                <svg class="dir-switcher-chevron" :class="{ 'is-open': open }" xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9" />
                </svg>
            </button>
            <div class="dir-switcher-menu" x-show="open" x-cloak>
                <div class="dir-switcher-opciones">
                    <th:block th:each="op : ${menuDireccion.opciones}">
                        <div th:if="${op.actual}" class="dir-switcher-option is-active" th:title="${op.titulo}">
                            <span class="dir-switcher-mark" th:text="${#strings.substring(op.texto, 0, 1)}">D</span>
                            <span class="dir-switcher-option-name" th:text="${op.texto}">Dirección</span>
                            <span class="dir-switcher-badge">Actual</span>
                        </div>
                        <form th:unless="${op.actual}" class="dir-switcher-option-form" method="post"
                              th:action="@{/inicio/cambiar-direccion}"
                              hx-post="/inicio/cambiar-direccion"
                              hx-target=".content-area"
                              hx-swap="innerHTML"
                              hx-push-url="/inicio"
                              hx-disabled-elt="this"
                              @submit="open = false">
                            <input type="hidden" name="direccionId" th:value="${op.id}" />
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="dir-switcher-option" th:title="${op.titulo}">
                                <span class="dir-switcher-mark dir-switcher-mark-alt"
                                      th:text="${#strings.substring(op.texto, 0, 1)}">D</span>
                                <span class="dir-switcher-option-name" th:text="${op.texto}">Dirección</span>
                            </button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>
    </div>

    <div class="dir-switcher modo-switcher" sec:authorize="hasAuthority('ROLE_SYSTEM_CONFIG')"
         @click.outside="open = false">
        <button type="button" class="dir-switcher-btn" @click="open = !open" :title="nombre()">
            <span class="dir-switcher-mark" :class="{ 'dir-switcher-mark-alt': modo !== 'admin' }" x-text="inicial()">A</span>
            <span class="dir-switcher-copy">
                <span class="dir-switcher-kicker">Modo</span>
                <span class="dir-switcher-name" x-text="nombre()">Administrador</span>
            </span>
            <svg class="dir-switcher-chevron" :class="{ 'is-open': open }" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
            </svg>
        </button>
        <div class="dir-switcher-menu modo-menu" x-show="open" x-cloak x-transition.opacity.duration.150ms>
            <div class="dir-switcher-menu-label">Ver el menú como</div>
            <template x-for="item in modos" :key="item.id">
                <button type="button" class="dir-switcher-option" :class="{ 'is-active': modo === item.id }"
                        @click="elegir(item.id)">
                    <span class="dir-switcher-mark" :class="{ 'dir-switcher-mark-alt': item.id !== 'admin' }"
                          x-text="item.letra">A</span>
                    <span class="dir-switcher-option-name" x-text="item.nombre">Modo</span>
                    <span class="dir-switcher-badge" x-show="modo === item.id">Actual</span>
                </button>
            </template>
            <p class="dir-switcher-note" x-text="nota()">El menú muestra ese rol. Seguís siendo administrador.</p>
        </div>
    </div>

    <th:block th:replace="~{layout/sidebar :: sidebar}" />

    <div class="sidebar-footer">
        <div class="sidebar-user" @click="userMenuOpen = !userMenuOpen">
            <div class="sidebar-user-avatar"
                th:text="${#strings.substring(#authentication.principal.nombre, 0, 1).toUpperCase()}">U</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" th:text="${#authentication.principal.nombre}">Usuario</div>
                <div class="sidebar-user-role"
                    th:text="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')') ? 'ADMIN' : (#authorization.expression('hasAuthority(''ROLE_SYSTEM_CONFIG'')') ? 'SYSTEM_CONFIG' : #authentication.principal.authorities[0].authority.replace('ROLE_', ''))}">Admin</div>
            </div>

            <div class="user-dropdown-menu" x-show="userMenuOpen" @click.outside="userMenuOpen = false"
                style="display: none;">
                <button class="user-dropdown-item"
                        hx-get="/perfil" hx-target=".content-area" hx-swap="innerHTML" hx-push-url="true"
                        @click="userMenuOpen = false">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    Mi perfil
                </button>
                <button class="user-dropdown-item"
                        sec:authorize="hasAuthority('ROLE_SYSTEM_CONFIG')"
                        hx-get="/configuracion" hx-target=".content-area" hx-swap="innerHTML" hx-push-url="true"
                        @click="userMenuOpen = false; elegir('system', false)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                    Configuración
                </button>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="user-dropdown-item danger">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <style>
        #dir-switcher-slot:empty {
            display: none;
        }
        .dir-switcher {
            position: relative;
            padding: 12px 12px 4px;
            flex-shrink: 0;
        }
        .dir-switcher-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid var(--sidebar-border);
            border-radius: 12px;
            background: #f8fafc;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            color: var(--text-primary);
            transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
        }
        .dir-switcher-btn:hover {
            background: #fff;
            border-color: #cbd5e1;
        }
        .dir-switcher-mark {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2d5a87, #60a5fa);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .dir-switcher-mark-alt {
            background: linear-gradient(135deg, #0f766e, #2dd4bf);
        }
        .dir-switcher-copy {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .dir-switcher-kicker {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #94a3b8;
        }
        .dir-switcher-name,
        .dir-switcher-option-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dir-switcher-chevron {
            width: 16px;
            height: 16px;
            color: #94a3b8;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .dir-switcher-chevron.is-open {
            transform: rotate(180deg);
        }
        .dir-switcher-menu {
            position: absolute;
            top: calc(100% - 2px);
            left: 12px;
            right: 12px;
            background: #fff;
            border: 1px solid var(--sidebar-border);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.12);
            z-index: 120;
        }
        .dir-switcher-menu-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 6px 10px 4px;
        }
        .dir-switcher-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: none;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
        }
        .dir-switcher-option:hover {
            background: var(--sidebar-bg-hover);
        }
        .dir-switcher-option.is-active {
            background: rgba(45, 90, 135, 0.08);
            cursor: default;
        }
        .dir-switcher-option-name {
            flex: 1;
            min-width: 0;
            font-size: 0.84rem;
        }
        .dir-switcher-badge {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #2d5a87;
            background: rgba(45, 90, 135, 0.1);
            padding: 2px 6px;
            border-radius: 999px;
            flex-shrink: 0;
        }
        .dir-switcher-note {
            margin: 6px 10px 4px;
            font-size: 0.7rem;
            line-height: 1.35;
            color: #94a3b8;
        }
        .dir-switcher-opciones {
            max-height: 320px;
            overflow-y: auto;
        }
        .dir-switcher-option-form {
            margin: 0;
        }
        .sidebar.collapsed .dir-switcher-copy,
        .sidebar.collapsed .dir-switcher-chevron {
            display: none;
        }
        .sidebar.collapsed .dir-switcher-btn {
            justify-content: center;
            padding: 8px;
        }
        .sidebar.collapsed .dir-switcher-menu {
            left: calc(100% - 4px);
            right: auto;
            width: 260px;
            top: 8px;
        }
        .modo-switcher {
            padding-top: 8px;
            z-index: 30;
        }
        .modo-switcher .dir-switcher-mark {
            font-size: 0.72rem;
        }
        .modo-menu {
            max-height: 320px;
            overflow-y: auto;
        }
        .nav-section:not(:has(.nav-item:not([style*="display: none"]))) {
            display: none;
        }
    </style>
    <script>
        function modoMenu() {
            return {
                open: false,
                modo: 'admin',
                esAdmin: false,
                esSystem: false,
                modos: [
                    { id: 'admin', nombre: 'Administrador', letra: 'A' },
                    { id: 'director', nombre: 'Director', letra: 'D' },
                    { id: 'docente', nombre: 'Docente', letra: 'Do' },
                    { id: 'estudiante', nombre: 'Estudiante', letra: 'E' },
                    { id: 'padre', nombre: 'Padres de familia', letra: 'P' },
                    { id: 'auxiliar', nombre: 'Auxiliar', letra: 'Au' },
                    { id: 'guarda', nombre: 'Guarda', letra: 'G' }
                ],
                actual: function () {
                    var id = this.modo;
                    return this.modos.filter(function (item) { return item.id === id; })[0] || this.modos[0];
                },
                nombre: function () {
                    return this.actual().nombre;
                },
                inicial: function () {
                    return this.actual().letra;
                },
                init: function () {
                    this.esAdmin = this.$el.dataset.admin === 'true';
                    this.esSystem = this.$el.dataset.system === 'true';
                    if (this.esSystem) {
                        this.modos.splice(1, 0, { id: 'system', nombre: 'System Config', letra: 'S' });
                    }
                    var self = this;
                    window.addEventListener('nexa-modo', function (event) {
                        if (event.detail) {
                            self.elegir(event.detail, false);
                        }
                    });
                    document.addEventListener('direccionCambiada', function () {
                        if (self.esAdmin && self.modo === 'system') {
                            self.elegir('admin', false);
                        }
                    });
                    if (!this.esAdmin && !this.esSystem) {
                        return;
                    }
                    if (!this.esAdmin) {
                        this.modo = 'system';
                    }
                    var guardado = sessionStorage.getItem('nexa-modo-menu');
                    if (guardado && this.modos.some(function (item) { return item.id === guardado; })) {
                        this.modo = guardado;
                    }
                    this.pintarRol();
                },
                ve: function (roles) {
                    if (!this.esAdmin && !this.esSystem) {
                        return true;
                    }
                    if (this.modo === 'auxiliar' || this.modo === 'guarda') {
                        return true;
                    }
                    return (' ' + roles + ' ').indexOf(' ' + this.modo + ' ') !== -1;
                },
                rutaSystem: function () {
                    var path = window.location.pathname;
                    return path === '/configuracion' || path.indexOf('/configuracion/') === 0
                        || path === '/usuarios' || path.indexOf('/usuarios/') === 0
                        || path === '/seguridad' || path.indexOf('/seguridad/') === 0
                        || path === '/direcciones' || path.indexOf('/direcciones/') === 0;
                },
                pintarRol: function () {
                    var texto = this.modo === 'system' ? 'SYSTEM_CONFIG'
                        : this.modo === 'admin' ? 'ADMIN'
                        : this.modo === 'director' ? 'DIRECTOR'
                        : this.modo === 'docente' ? 'DOCENTE'
                        : this.modo === 'estudiante' ? 'ESTUDIANTE'
                        : this.modo === 'padre' ? 'PADRE'
                        : this.nombre().toUpperCase();
                    document.querySelectorAll('.dropdown-user-role, .sidebar-user-role').forEach(function (el) {
                        el.textContent = texto;
                    });
                },
                nota: function () {
                    if (this.modo === 'system') {
                        return 'Solo las opciones de System Config.';
                    }
                    if (this.modo === 'admin') {
                        return 'Solo las opciones de administrador.';
                    }
                    if (this.modo === 'director' || this.modo === 'docente' || this.modo === 'estudiante' || this.modo === 'padre') {
                        return 'El menú muestra ese rol. Seguís siendo administrador.';
                    }
                    return 'Este modo todavía no cambia el menú.';
                },
                elegir: function (id, navegar) {
                    if (!this.modos.some(function (item) { return item.id === id; })) {
                        return;
                    }
                    this.modo = id;
                    this.open = false;
                    if (this.esAdmin || this.esSystem) {
                        sessionStorage.setItem('nexa-modo-menu', id);
                    }
                    this.pintarRol();
                    if (navegar === false) {
                        return;
                    }
                    var self = this;
                    this.$nextTick(function () {
                        if (id === 'system' && !self.rutaSystem()) {
                            var config = document.querySelector('.sidebar-nav a[href="/configuracion"]');
                            if (config) {
                                config.click();
                            }
                        } else if (id !== 'system' && self.rutaSystem()) {
                            var inicio = document.querySelector('.sidebar-nav a[href="/inicio"]');
                            if (inicio) {
                                inicio.click();
                            }
                        }
                    });
                }
            };
        }
    </script>

</aside>
