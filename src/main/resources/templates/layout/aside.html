<aside class="sidebar"
       th:fragment="aside"
       xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
       x-data="modoMenu()"
       th:attr="data-admin=${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}"
       x-bind:class="{ 'collapsed': sidebarCollapsed, 'mobile-open': mobileMenuOpen }">

    <button class="sidebar-toggle" @click="sidebarCollapsed = !sidebarCollapsed">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
        </svg>
    </button>

    <div class="sidebar-header">
        <div class="sidebar-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>
        </div>
        <span class="sidebar-brand">Nexa</span>
    </div>

    <div class="dir-switcher"
         x-data="direccionSwitcher()"
         @click.outside="open = false"
         th:attr="data-actual=${session.SESSION_DIRECCION_NOMBRE != null ? session.SESSION_DIRECCION_NOMBRE : 'Sin dirección'}">
        <button type="button" class="dir-switcher-btn" @click="open = !open" :title="actual">
            <span class="dir-switcher-mark" x-text="inicial()">D</span>
            <span class="dir-switcher-copy">
                <span class="dir-switcher-kicker">Dirección activa</span>
                <span class="dir-switcher-name" x-text="actual">Dirección</span>
            </span>
            <svg class="dir-switcher-chevron" :class="{ 'is-open': open }" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
            </svg>
        </button>
        <div class="dir-switcher-menu" x-show="open" x-cloak x-transition.opacity.duration.150ms>
            <div class="dir-switcher-menu-label">Misma institución</div>
            <button type="button" class="dir-switcher-option" :class="{ 'is-active': actual === original }"
                    @click="elegir(original)">
                <span class="dir-switcher-mark" x-text="letra(original)">D</span>
                <span class="dir-switcher-option-name" x-text="original">Dirección actual</span>
                <span class="dir-switcher-badge" x-show="actual === original">Actual</span>
            </button>
            <button type="button" class="dir-switcher-option" :class="{ 'is-active': actual === otra() }"
                    @click="elegir(otra())">
                <span class="dir-switcher-mark dir-switcher-mark-alt" x-text="letra(otra())">S</span>
                <span class="dir-switcher-option-name" x-text="otra()">Otra dirección</span>
                <span class="dir-switcher-badge" x-show="actual === otra()">Actual</span>
            </button>
            <p class="dir-switcher-note">Vista previa. Todavía no cambia la sesión.</p>
        </div>
    </div>

    <div class="dir-switcher modo-switcher" sec:authorize="hasAuthority('ROLE_ADMIN')"
         @click.outside="open = false">
        <button type="button" class="dir-switcher-btn" @click="open = !open" :title="nombre()">
            <span class="dir-switcher-mark" :class="{ 'dir-switcher-mark-alt': modo !== 'admin' }" x-text="inicial()">A</span>
            <span class="dir-switcher-copy">
                <span class="dir-switcher-kicker">Modo</span>
                <span class="dir-switcher-name" x-text="nombre()">Administrador</span>
            </span>
            <svg class="dir-switcher-chevron" :class="{ 'is-open': open }" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
            </svg>
        </button>
        <div class="dir-switcher-menu modo-menu" x-show="open" x-cloak x-transition.opacity.duration.150ms>
            <div class="dir-switcher-menu-label">Ver el menú como</div>
            <template x-for="item in modos" :key="item.id">
                <button type="button" class="dir-switcher-option" :class="{ 'is-active': modo === item.id }"
                        @click="elegir(item.id)">
                    <span class="dir-switcher-mark" :class="{ 'dir-switcher-mark-alt': item.id !== 'admin' }"
                          x-text="item.letra">A</span>
                    <span class="dir-switcher-option-name" x-text="item.nombre">Modo</span>
                    <span class="dir-switcher-badge" x-show="modo === item.id">Actual</span>
                </button>
            </template>
            <p class="dir-switcher-note" x-text="nota()">El menú muestra ese rol. Seguís siendo administrador.</p>
        </div>
    </div>

    <th:block th:replace="~{layout/sidebar :: sidebar}" />

    <div class="sidebar-footer">
        <div class="sidebar-user" @click="userMenuOpen = !userMenuOpen">
            <div class="sidebar-user-avatar"
                th:text="${#strings.substring(#authentication.principal.nombre, 0, 1).toUpperCase()}">U</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" th:text="${#authentication.principal.nombre}">Usuario</div>
                <div class="sidebar-user-role"
                    th:text="${#authentication.principal.authorities[0].authority.replace('ROLE_', '')}">Admin</div>
            </div>

            <div class="user-dropdown-menu" x-show="userMenuOpen" @click.outside="userMenuOpen = false"
                style="display: none;">
                <button class="user-dropdown-item"
                        hx-get="/perfil" hx-target=".content-area" hx-swap="innerHTML" hx-push-url="true"
                        @click="userMenuOpen = false">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    Mi perfil
                </button>
                <button class="user-dropdown-item"
                        hx-get="/configuracion-cuenta" hx-target=".content-area" hx-swap="innerHTML" hx-push-url="true"
                        @click="userMenuOpen = false">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                    Configuración
                </button>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="user-dropdown-item danger">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>

    <style>
        .dir-switcher {
            position: relative;
            padding: 12px 12px 4px;
            flex-shrink: 0;
        }
        .dir-switcher-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid var(--sidebar-border);
            border-radius: 12px;
            background: #f8fafc;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            color: var(--text-primary);
            transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
        }
        .dir-switcher-btn:hover {
            background: #fff;
            border-color: #cbd5e1;
        }
        .dir-switcher-mark {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2d5a87, #60a5fa);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .dir-switcher-mark-alt {
            background: linear-gradient(135deg, #0f766e, #2dd4bf);
        }
        .dir-switcher-copy {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .dir-switcher-kicker {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #94a3b8;
        }
        .dir-switcher-name,
        .dir-switcher-option-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dir-switcher-chevron {
            width: 16px;
            height: 16px;
            color: #94a3b8;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .dir-switcher-chevron.is-open {
            transform: rotate(180deg);
        }
        .dir-switcher-menu {
            position: absolute;
            top: calc(100% - 2px);
            left: 12px;
            right: 12px;
            background: #fff;
            border: 1px solid var(--sidebar-border);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.12);
            z-index: 120;
        }
        .dir-switcher-menu-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 6px 10px 4px;
        }
        .dir-switcher-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            background: none;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
        }
        .dir-switcher-option:hover {
            background: var(--sidebar-bg-hover);
        }
        .dir-switcher-option.is-active {
            background: rgba(45, 90, 135, 0.08);
        }
        .dir-switcher-option-name {
            flex: 1;
            min-width: 0;
            font-size: 0.84rem;
        }
        .dir-switcher-badge {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #2d5a87;
            background: rgba(45, 90, 135, 0.1);
            padding: 2px 6px;
            border-radius: 999px;
            flex-shrink: 0;
        }
        .dir-switcher-note {
            margin: 6px 10px 4px;
            font-size: 0.7rem;
            line-height: 1.35;
            color: #94a3b8;
        }
        .sidebar.collapsed .dir-switcher-copy,
        .sidebar.collapsed .dir-switcher-chevron {
            display: none;
        }
        .sidebar.collapsed .dir-switcher-btn {
            justify-content: center;
            padding: 8px;
        }
        .sidebar.collapsed .dir-switcher-menu {
            left: calc(100% - 4px);
            right: auto;
            width: 260px;
            top: 8px;
        }
        .modo-switcher {
            padding-top: 8px;
            z-index: 30;
        }
        .modo-switcher .dir-switcher-mark {
            font-size: 0.72rem;
        }
        .modo-menu {
            max-height: 320px;
            overflow-y: auto;
        }
        .nav-section:not(:has(.nav-item:not([style*="display: none"]))) {
            display: none;
        }
    </style>
    <script>
        function direccionSwitcher() {
            return {
                open: false,
                actual: '',
                original: '',
                init: function () {
                    this.original = this.$el.dataset.actual || 'Sin dirección';
                    this.actual = this.original;
                },
                otra: function () {
                    var nombre = this.original;
                    if (nombre.indexOf('Primaria') !== -1) return nombre.replace('Primaria', 'Secundaria');
                    if (nombre.indexOf('Secundaria') !== -1) return nombre.replace('Secundaria', 'Primaria');
                    if (nombre.indexOf('Preescolar') !== -1) return nombre.replace('Preescolar', 'Primaria');
                    if (!nombre || nombre === 'Sin dirección') return 'Segunda dirección';
                    return nombre + ' · Secundaria';
                },
                letra: function (nombre) {
                    return (nombre || 'D').charAt(0).toUpperCase();
                },
                inicial: function () {
                    return this.letra(this.actual);
                },
                elegir: function (nombre) {
                    this.actual = nombre;
                    this.open = false;
                }
            };
        }

        function modoMenu() {
            return {
                open: false,
                modo: 'admin',
                esAdmin: false,
                modos: [
                    { id: 'admin', nombre: 'Administrador', letra: 'A' },
                    { id: 'director', nombre: 'Director', letra: 'D' },
                    { id: 'docente', nombre: 'Docente', letra: 'Do' },
                    { id: 'estudiante', nombre: 'Estudiante', letra: 'E' },
                    { id: 'padre', nombre: 'Padres de familia', letra: 'P' },
                    { id: 'auxiliar', nombre: 'Auxiliar', letra: 'Au' },
                    { id: 'guarda', nombre: 'Guarda', letra: 'G' }
                ],
                actual: function () {
                    var id = this.modo;
                    return this.modos.filter(function (item) { return item.id === id; })[0] || this.modos[0];
                },
                nombre: function () {
                    return this.actual().nombre;
                },
                inicial: function () {
                    return this.actual().letra;
                },
                init: function () {
                    this.esAdmin = this.$el.dataset.admin === 'true';
                    if (!this.esAdmin) {
                        return;
                    }
                    var guardado = sessionStorage.getItem('nexa-modo-menu');
                    if (guardado && this.modos.some(function (item) { return item.id === guardado; })) {
                        this.modo = guardado;
                    }
                },
                ve: function (roles) {
                    if (!this.esAdmin || this.modo === 'admin' || (this.modo !== 'director' && this.modo !== 'docente')) {
                        return true;
                    }
                    return (' ' + roles + ' ').indexOf(' ' + this.modo + ' ') !== -1;
                },
                nota: function () {
                    if (this.modo === 'director' || this.modo === 'docente') {
                        return 'El menú muestra ese rol. Seguís siendo administrador.';
                    }
                    if (this.modo === 'admin') {
                        return 'Menú completo de administrador.';
                    }
                    return 'Este modo todavía no cambia el menú.';
                },
                elegir: function (id) {
                    this.modo = id;
                    this.open = false;
                    if (this.esAdmin) {
                        sessionStorage.setItem('nexa-modo-menu', id);
                    }
                }
            };
        }
    </script>

</aside>
