<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- Indicador de la campanita. Se vuelve a pedir solo cada 20 s (mientras la pestaña esté visible) para que
         los mensajes nuevos aparezcan sin recargar; "oob" lo usa el desplegable para sincronizarlo al abrirse. -->
    <span th:fragment="punto(hayNuevas, oob)" id="notification-dot" class="notification-dot"
          th:classappend="${hayNuevas} ? '' : ' notification-dot-hidden'"
          th:attr="hx-swap-oob=${oob} ? 'true' : null"
          hx-get="/notificaciones/contador" hx-trigger="every 20s [document.visibilityState === 'visible']"
          hx-swap="outerHTML"></span>

    <div th:fragment="dropdown-content">
        <span th:replace="~{:: punto(${notificaciones != null and !notificaciones.empty}, true)}"></span>

        <div class="dropdown-header">
            <div class="dropdown-user-name">Notificaciones</div>
        </div>
        <div class="dropdown-divider"></div>

        <div th:if="${notificaciones == null or notificaciones.empty}"
             style="padding: 1.5rem 0.75rem; text-align: center; color: var(--text-secondary); font-size: 0.85rem;">
            No tenés notificaciones nuevas.
        </div>

        <div th:each="n : ${notificaciones}" class="notif-item">
            <div style="flex: 1; min-width: 0;"
                 th:attr="hx-get=${n.enlace}, hx-target=${n.enlace != null} ? '.content-area' : null,
                          hx-swap=${n.enlace != null} ? 'innerHTML' : null,
                          hx-push-url=${n.enlace != null} ? 'true' : null"
                 th:style="${n.enlace != null} ? 'flex: 1; min-width: 0; cursor: pointer;' : 'flex: 1; min-width: 0;'"
                 @click="open = false">
                <p style="font-size: 0.85rem; color: var(--text-primary); margin: 0; line-height: 1.4;" th:text="${n.mensaje}">Mensaje</p>
                <p style="font-size: 0.72rem; color: var(--text-light); margin: 4px 0 0;"
                   th:text="${#temporals.format(n.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</p>
            </div>
            <form th:action="@{'/notificaciones/' + ${n.id} + '/leer'}" method="post"
                  th:attr="hx-post=@{'/notificaciones/' + ${n.id} + '/leer'}"
                  hx-target="#notif-dropdown" hx-swap="innerHTML" style="margin: 0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-icon" title="Marcar como leída">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--text-light);">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</body>

</html>
