<div x-data="{ show: false, message: '' }"
     @notify.window="show = true; message = $event.detail; setTimeout(() => show = false, 3000)" class="toast"
     x-show="show" x-transition.duration.300ms style="display: none;"
     th:fragment="toast"
     xmlns:th="http://www.thymeleaf.org">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
    </svg>
    <span x-text="message"></span>
</div>
