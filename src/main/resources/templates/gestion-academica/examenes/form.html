<div th:fragment="form-content" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-backdrop" onclick="if(event.target===this) cerrarModalAcademico()">
        <div class="modal-dialog" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${examen.id == null ? 'Programar Examen' : 'Editar Examen'}">Examen</h3>
                <button type="button" class="close-btn" onclick="cerrarModalAcademico()">&times;</button>
            </div>
            <div class="modal-body">
                <form hx-post="/gestion-academica/examenes"
                      hx-target="#examenes-panel" hx-swap="innerHTML"
                      hx-on:htmx:after-request="if(event.detail.successful) cerrarModalAcademico()">
                    <input type="hidden" name="id" th:value="${examen.id}">
                    <input type="hidden" name="periodoId" th:value="${periodoId}">
                    <input type="hidden" name="materiaId" th:value="${materiaId}">

                    <div class="form-group">
                        <label class="form-label">Título *</label>
                        <input class="form-input" type="text" name="titulo" required maxlength="200"
                               th:value="${examen.titulo}" placeholder="Nombre del examen">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-textarea" name="descripcion" maxlength="1000"
                                  th:text="${examen.descripcion}" placeholder="Detalles adicionales..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Tipo</label>
                            <select class="form-input" name="tipo">
                                <option value="EXAMEN" th:selected="${examen.tipo == null or examen.tipo.name() == 'EXAMEN'}">Examen</option>
                                <option value="QUIZ" th:selected="${examen.tipo != null and examen.tipo.name() == 'QUIZ'}">Quiz</option>
                                <option value="PRUEBA" th:selected="${examen.tipo != null and examen.tipo.name() == 'PRUEBA'}">Prueba</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Porcentaje *</label>
                            <input class="form-input" type="number" name="porcentaje" min="0" max="100" required
                                   th:value="${examen.porcentaje}" placeholder="Ej. 20">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Fecha y Hora *</label>
                            <input class="form-input" type="datetime-local" name="fecha" required
                                   th:value="${examen.fecha}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Estado</label>
                            <select class="form-input" name="estado">
                                <option value="PROGRAMADO" th:selected="${examen.estado == null or examen.estado.name() == 'PROGRAMADO'}">Programado</option>
                                <option value="APLICADO" th:selected="${examen.estado != null and examen.estado.name() == 'APLICADO'}">Aplicado</option>
                                <option value="CALIFICADO" th:selected="${examen.estado != null and examen.estado.name() == 'CALIFICADO'}">Calificado</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="cerrarModalAcademico()">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
