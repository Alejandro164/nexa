<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Gestión Académica — Nexa</title>
</head>

<body>

    <th:block layout:fragment="page-title">Gestión Académica</th:block>
    <th:block layout:fragment="page-subtitle">Controla la asistencia, trabajo cotidiano, tareas, proyectos y exámenes
    </th:block>

    <main layout:fragment="content" th:fragment="htmx-content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }

            .config-tabs-container::-webkit-scrollbar {
                display: none;
            }

            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }

            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }

            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }

            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }

            .tab-pane {
                animation: fadeIn 0.35s ease-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .reg-tabs {
                display: flex;
                gap: 6px;
                margin-bottom: 1.25rem;
                background: #fff;
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 4px;
            }
            .reg-tab {
                flex: 1;
                text-align: center;
                padding: 8px 12px;
                font-size: 0.82rem;
                font-weight: 600;
                color: var(--text-secondary);
                border-radius: 7px;
                cursor: pointer;
                border: none;
                background: transparent;
                transition: all 0.2s;
                white-space: nowrap;
            }
            .reg-tab:hover {
                color: var(--primary);
                background: var(--input-bg);
            }
            .reg-tab.active {
                color: #fff;
                background: var(--primary);
            }
        </style>

        <div x-data="{ activeTab: 'asistencia' }">
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'asistencia' }"
                        @click="activeTab = 'asistencia'">
                        📅 Asistencia
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'cotidiano' }"
                        @click="activeTab = 'cotidiano'">
                        📝 Cotidiano
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'tareas' }"
                        @click="activeTab = 'tareas'">
                        📚 Tareas
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'proyectos' }"
                        @click="activeTab = 'proyectos'">
                        🎯 Proyectos
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'examenes' }"
                        @click="activeTab = 'examenes'">
                        📋 Exámenes
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'extraclase' }"
                        @click="activeTab = 'extraclase'">
                        🏠 Extraclase
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'promedio' }"
                        @click="activeTab = 'promedio'">
                        ✅ Promedio
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'componentes' }"
                        @click="activeTab = 'componentes'">
                        ⚖️ Distribución Porcentual
                    </button>
                </div>
            </div>

            <!-- Asistencia -->
            <div x-show="activeTab === 'asistencia'" class="tab-pane">
                <div id="asistencia-panel" hx-get="/gestion-academica/asistencia" hx-trigger="load" hx-swap="innerHTML">
                    <div class="card">
                        <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando asistencia…</div>
                    </div>
                </div>
            </div>

            <!-- Cotidiano -->
            <div x-show="activeTab === 'cotidiano'" class="tab-pane" x-cloak
                 x-data="{ subTabCotidiano: 'indicadores' }">

                <div class="reg-tabs">
                    <button class="reg-tab" :class="{ 'active': subTabCotidiano === 'indicadores' }"
                            @click="subTabCotidiano = 'indicadores'">
                        📌 Indicadores de Trabajo Cotidiano
                    </button>
                    <button class="reg-tab" :class="{ 'active': subTabCotidiano === 'evaluacion' }"
                            @click="subTabCotidiano = 'evaluacion'">
                        ✍️ Evaluación de Trabajo Cotidiano
                    </button>
                </div>

                <!-- Sub-tab: Indicadores -->
                <div x-show="subTabCotidiano === 'indicadores'">
                    <div id="indicadores-panel" hx-get="/gestion-academica/cotidiano/indicadores" hx-trigger="load" hx-swap="innerHTML">
                        <div class="card">
                            <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando indicadores…</div>
                        </div>
                    </div>
                </div>

                <!-- Sub-tab: Evaluación -->
                <div x-show="subTabCotidiano === 'evaluacion'">
                    <div id="evaluacion-panel" hx-get="/gestion-academica/cotidiano/evaluacion" hx-trigger="load" hx-swap="innerHTML">
                        <div class="card">
                            <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando evaluaciones…</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Tareas -->
            <div x-show="activeTab === 'tareas'" class="tab-pane" x-cloak>
                <div id="tareas-est-panel" hx-get="/gestion-academica/tareas" hx-trigger="load" hx-swap="innerHTML">
                    <div class="card">
                        <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando tareas…</div>
                    </div>
                </div>
            </div>

            <!-- Proyectos -->
            <div x-show="activeTab === 'proyectos'" class="tab-pane" x-cloak>
                <div id="proyectos-panel" hx-get="/gestion-academica/proyectos" hx-trigger="load" hx-swap="innerHTML">
                    <div class="card">
                        <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando proyectos…</div>
                    </div>
                </div>
            </div>

            <!-- Exámenes -->
            <div x-show="activeTab === 'examenes'" class="tab-pane" x-cloak>
                <div id="examenes-panel" hx-get="/gestion-academica/examenes" hx-trigger="load" hx-swap="innerHTML">
                    <div class="card">
                        <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando exámenes…</div>
                    </div>
                </div>
            </div>

            <!-- Extraclase -->
            <div x-show="activeTab === 'extraclase'" class="tab-pane" x-cloak>
                <div id="extraclase-panel" hx-get="/gestion-academica/extraclase" hx-trigger="load" hx-swap="innerHTML">
                    <div class="card">
                        <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando trabajos extraclase…</div>
                    </div>
                </div>
            </div>

            <!-- Promedio -->
            <div x-show="activeTab === 'promedio'" class="tab-pane" x-cloak>
                <div id="promedio-panel" hx-get="/gestion-academica/promedio" hx-trigger="load" hx-swap="innerHTML">
                    <div class="card">
                        <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando promedios…</div>
                    </div>
                </div>
            </div>

            <!-- Componentes de Calificación / Distribución Porcentual -->
            <div x-show="activeTab === 'componentes'" class="tab-pane" x-cloak>
                <div id="distribucion-panel" hx-get="/gestion-academica/distribucion" hx-trigger="load" hx-swap="innerHTML">
                    <div class="card">
                        <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando distribución…</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>

</html>
