<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Proyectos Estudiantiles</h3>
            <div style="display: flex; gap: 0.75rem; align-items: center;">
                <div class="periodo-select-wide">
                    <select class="form-input" name="periodoId"
                            hx-get="/gestion-academica/proyectos"
                            hx-target="#proyectos-panel" hx-swap="innerHTML"
                            hx-include="[name='materiaId']">
                        <option value="" th:if="${periodos == null or periodos.empty}" disabled selected>Sin períodos</option>
                        <option th:each="p : ${periodos}" th:value="${p.id}" th:text="${p.codigo}"
                                th:selected="${periodoId != null and periodoId == p.id}"></option>
                    </select>
                </div>
                <select class="form-input" style="max-width: 220px;" name="materiaId"
                        hx-get="/gestion-academica/proyectos"
                        hx-target="#proyectos-panel" hx-swap="innerHTML"
                        hx-include="[name='periodoId']">
                    <option value="" th:if="${materias == null or materias.empty}" disabled selected>Sin materias</option>
                    <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"
                            th:selected="${materiaId != null and materiaId == m.id}"></option>
                </select>
                <button class="btn btn-primary" style="width: 220px; white-space: nowrap;"
                        th:if="${periodoId != null and materiaId != null}"
                        th:attr="hx-get='/gestion-academica/proyectos/form?periodoId=' + ${periodoId} + '&materiaId=' + ${materiaId}"
                        hx-target="#modal-container" hx-swap="innerHTML"
                        onclick="abrirModalAcademico()">Nuevo Proyecto</button>
            </div>
        </div>

        <div th:if="${periodoId == null or materiaId == null}"
             style="padding: 2rem; text-align:center; color: var(--text-secondary);">
            Debes crear al menos un período académico y una materia para registrar proyectos.
        </div>

        <div th:if="${periodoId != null and materiaId != null}" class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Estudiante</th>
                        <th>Fechas</th>
                        <th>%</th>
                        <th>Estado</th>
                        <th>Calif.</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${proyectos == null or proyectos.empty}">
                        <td colspan="7" class="table-empty">No hay proyectos registrados.</td>
                    </tr>
                    <tr th:each="p : ${proyectos}">
                        <td>
                            <strong th:text="${p.titulo}">Título</strong>
                            <div class="text-muted text-sm" th:if="${p.descripcion != null and !p.descripcion.isBlank()}" th:text="${p.descripcion}"></div>
                        </td>
                        <td th:text="${p.estudiante.nombre}">Estudiante</td>
                        <td th:text="${#temporals.format(p.fechaInicio, 'dd/MM')} + ' – ' + ${#temporals.format(p.fechaFin, 'dd/MM')}">Fechas</td>
                        <td th:text="${p.porcentaje} + '%'">25%</td>
                        <td>
                            <span th:if="${p.estado.name() == 'ABIERTO'}" class="badge badge-primary">ABIERTO</span>
                            <span th:if="${p.estado.name() == 'EN_PROGRESO'}" class="badge badge-warning">EN_PROGRESO</span>
                            <span th:if="${p.estado.name() == 'CERRADO'}" class="badge badge-secondary">CERRADO</span>
                            <span th:if="${p.estado.name() == 'CALIFICADO'}" class="badge badge-success">CALIFICADO</span>
                        </td>
                        <td th:text="${p.calificacion != null ? p.calificacion : '—'}">—</td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-xs btn-ghost"
                                        th:attr="hx-get='/gestion-academica/proyectos/form/' + ${p.id} + '?periodoId=' + ${periodoId} + '&materiaId=' + ${materiaId}"
                                        hx-target="#modal-container" hx-swap="innerHTML"
                                        onclick="abrirModalAcademico()"
                                        title="Editar">✏️</button>
                                <button class="btn-xs btn-danger-ghost"
                                        onclick="abrirConfirmacionAcademica(this)"
                                        th:attr="data-delete-url='/gestion-academica/proyectos/' + ${p.id} + '?periodoId=' + ${periodoId} + '&materiaId=' + ${materiaId},
                                                 data-delete-target='#proyectos-panel',
                                                 data-delete-title='Eliminar proyecto',
                                                 data-delete-message='¿Deseas eliminar ' + ${p.titulo} + '? Esta acción no se puede deshacer.'"
                                        title="Eliminar">🗑️</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
