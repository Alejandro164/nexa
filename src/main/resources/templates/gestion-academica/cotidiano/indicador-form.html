<div th:fragment="form-content" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-backdrop" onclick="if(event.target===this) cerrarModalAcademico()">
        <div class="modal-dialog" style="max-width: 520px;">
            <div class="modal-loading-overlay htmx-indicator" id="modal-loading-overlay">
                <div class="spinner"></div>
                <span>Cargando...</span>
            </div>
            <div class="modal-header">
                <h3 class="modal-title" th:text="${indicador.id == null ? 'Nuevo Indicador' : 'Editar Indicador'}">Indicador</h3>
                <button type="button" class="close-btn" onclick="cerrarModalAcademico()">&times;</button>
            </div>
            <div class="modal-body">
                <form hx-post="/gestion-academica/cotidiano/indicadores"
                      hx-target="#indicadores-panel" hx-swap="innerHTML"
                      hx-indicator="#modal-loading-overlay"
                      hx-on:htmx:after-request="if(event.detail.successful) cerrarModalAcademico()">
                    <input type="hidden" name="id" th:value="${indicador.id}">
                    <input type="hidden" name="nivelId" th:value="${nivelId}">
                    <input type="hidden" name="materiaId" th:value="${materiaId}">

                    <div class="form-group">
                        <label class="form-label">Indicador *</label>
                        <input class="form-input" type="text" name="titulo" required maxlength="200"
                               th:value="${indicador.titulo}" placeholder="Ej. Resuelve ecuaciones lineales de primer grado">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-textarea" name="descripcion" maxlength="500"
                                  th:text="${indicador.descripcion}" placeholder="¿Qué mide este indicador?"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Porcentaje *</label>
                        <input class="form-input" type="number" name="porcentaje" min="0" max="100" required
                               th:value="${indicador.porcentaje}" placeholder="Ej. 15">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Puntos totales (opcional)</label>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div class="input-suffix-wrap" style="flex: 1;">
                                <input class="form-input" type="number" name="puntosTotales" min="0"
                                       style="padding-left: 10px;" th:value="${indicador.puntosTotales}">
                                <span class="input-suffix">pts</span>
                            </div>
                            <span class="info-tooltip">
                                <button type="button" class="info-tooltip-btn" aria-label="Información sobre puntos totales">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10" />
                                        <line x1="12" y1="16" x2="12" y2="12" />
                                        <line x1="12" y1="8" x2="12.01" y2="8" />
                                    </svg>
                                </button>
                                <span class="info-tooltip-text">
                                    Si se define, al evaluar se ingresan puntos obtenidos y la calificación se calcula
                                    automáticamente. Si se deja vacío, la calificación se ingresa directamente (0-100).
                                </span>
                            </span>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="cerrarModalAcademico()">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
