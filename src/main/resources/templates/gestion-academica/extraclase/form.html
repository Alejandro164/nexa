<div th:fragment="form-content" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-backdrop" onclick="if(event.target===this) cerrarModalAcademico()">
        <div class="modal-dialog" style="max-width: 560px;">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${trabajo.id == null ? 'Nuevo Trabajo Extraclase' : 'Editar Trabajo Extraclase'}">Trabajo Extraclase</h3>
                <button type="button" class="close-btn" onclick="cerrarModalAcademico()">&times;</button>
            </div>
            <div class="modal-body">
                <form hx-post="/gestion-academica/extraclase"
                      hx-target="#extraclase-panel" hx-swap="innerHTML"
                      hx-on:htmx:after-request="if(event.detail.successful) cerrarModalAcademico()">
                    <input type="hidden" name="id" th:value="${trabajo.id}">
                    <input type="hidden" name="periodoId" th:value="${periodoId}">
                    <input type="hidden" name="materiaId" th:value="${materiaId}">

                    <div class="form-group">
                        <label class="form-label">Título *</label>
                        <input class="form-input" type="text" name="titulo" required maxlength="200"
                               th:value="${trabajo.titulo}" placeholder="Nombre del trabajo">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-textarea" name="descripcion" maxlength="1000"
                                  th:text="${trabajo.descripcion}" placeholder="Detalles adicionales..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Estudiante *</label>
                        <select class="form-input" name="estudianteId" required>
                            <option value="" disabled th:selected="${trabajo.estudiante == null}">Seleccionar estudiante</option>
                            <option th:each="e : ${estudiantes}" th:value="${e.id}" th:text="${e.nombre}"
                                    th:selected="${trabajo.estudiante != null and trabajo.estudiante.id == e.id}"></option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Fecha de Entrega *</label>
                            <input class="form-input" type="date" name="fechaEntrega" required
                                   th:value="${trabajo.fechaEntrega}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Porcentaje *</label>
                            <input class="form-input" type="number" name="porcentaje" min="0" max="100" required
                                   th:value="${trabajo.porcentaje}" placeholder="Ej. 10">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Estado</label>
                            <select class="form-input" name="estado">
                                <option value="PENDIENTE" th:selected="${trabajo.estado == null or trabajo.estado.name() == 'PENDIENTE'}">Pendiente</option>
                                <option value="ENTREGADA" th:selected="${trabajo.estado != null and trabajo.estado.name() == 'ENTREGADA'}">Entregada</option>
                                <option value="CALIFICADA" th:selected="${trabajo.estado != null and trabajo.estado.name() == 'CALIFICADA'}">Calificada</option>
                                <option value="ATRASADA" th:selected="${trabajo.estado != null and trabajo.estado.name() == 'ATRASADA'}">Atrasada</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Calificación</label>
                            <input class="form-input" type="number" name="calificacion" min="0" max="100"
                                   th:value="${trabajo.calificacion}" placeholder="Opcional, 0-100">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="cerrarModalAcademico()">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
