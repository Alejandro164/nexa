<div th:fragment="form-content" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-backdrop" onclick="if(event.target===this) cerrarModalAcademico()">
        <div class="modal-dialog" style="max-width: 480px;">
            <div class="modal-loading-overlay htmx-indicator" id="modal-loading-overlay">
                <div class="spinner"></div>
                <span>Cargando...</span>
            </div>
            <div class="modal-header">
                <h3 class="modal-title" th:text="${trabajo.id == null ? 'Nuevo Trabajo' : 'Editar Trabajo'}">Trabajo</h3>
                <button type="button" class="close-btn" onclick="cerrarModalAcademico()">&times;</button>
            </div>
            <div class="modal-body">
                <form hx-post="/gestion-academica/extraclase"
                      hx-target="#extraclase-panel" hx-swap="innerHTML"
                      hx-indicator="#modal-loading-overlay"
                      hx-on:htmx:after-request="if(event.detail.successful) cerrarModalAcademico()">
                    <input type="hidden" name="id" th:value="${trabajo.id}">
                    <input type="hidden" name="nivelId" th:value="${nivelId}">
                    <input type="hidden" name="materiaId" th:value="${materiaId}">

                    <div class="form-group">
                        <label class="form-label">Nombre *</label>
                        <input class="form-input" type="text" name="titulo" required maxlength="200"
                               th:value="${trabajo.titulo}" placeholder="Ej. Guía de ejercicios">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-textarea" name="descripcion" maxlength="1000"
                                  th:text="${trabajo.descripcion}" placeholder="¿En qué consiste este trabajo?"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Porcentaje *</label>
                        <input class="form-input" type="number" name="porcentaje" min="0" max="100" required
                               th:value="${trabajo.porcentaje}" placeholder="Ej. 10">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Puntos totales *</label>
                        <div class="input-suffix-wrap">
                            <input class="form-input" type="number" name="puntosTotales" min="1" required
                                   style="padding-left: 10px;" th:value="${trabajo.puntosTotales}" placeholder="Ej. 20">
                            <span class="input-suffix">pts</span>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="cerrarModalAcademico()">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
