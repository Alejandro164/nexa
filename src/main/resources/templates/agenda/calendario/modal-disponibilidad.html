<div th:fragment="modal">
    <div class="disp-overlay" x-show="showDisponibilidad" x-cloak style="display: none;"
         @keydown.escape.window="showDisponibilidad = false">
        <div class="disp-modal" @click.outside="showDisponibilidad = false">
            <div class="disp-modal-header">
                <div class="disp-modal-header-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                    </svg>
                </div>
                <div>
                    <h3 style="margin: 0; font-size: 1.05rem; font-weight: 700; color: #0f172a;">Marcar No Disponible</h3>
                    <p style="margin: 2px 0 0; font-size: 0.82rem; color: #94a3b8;">Bloquea un horario en tu calendario</p>
                </div>
                <button @click="showDisponibilidad = false" style="margin-left: auto; background: none; border: none; cursor: pointer; color: #94a3b8; padding: 4px; border-radius: 8px; transition: all 0.2s;" onmouseover="this.style.background='#fee2e2'; this.style.color='#ef4444'" onmouseout="this.style.background='none'; this.style.color='#94a3b8'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="disp-modal-body">
                <div class="disp-field">
                    <label class="disp-label">Fecha</label>
                    <input type="date" class="disp-input" x-model="dispFecha">
                </div>
                <div class="disp-toggle-row">
                    <div>
                        <div class="disp-toggle-label">Día completo</div>
                        <div class="disp-toggle-sublabel">Bloquear todo el día</div>
                    </div>
                    <button type="button" class="disp-toggle" :class="{ 'on': dispDiaCompleto }" @click="dispDiaCompleto = !dispDiaCompleto"></button>
                </div>
                <div x-show="!dispDiaCompleto" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform -translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0">
                    <div class="disp-time-row">
                        <div class="disp-field">
                            <label class="disp-label">Desde</label>
                            <input type="time" class="disp-input" x-model="dispHoraInicio">
                        </div>
                        <div class="disp-time-sep">→</div>
                        <div class="disp-field">
                            <label class="disp-label">Hasta</label>
                            <input type="time" class="disp-input" x-model="dispHoraFin">
                        </div>
                    </div>
                    <div style="margin-top: 10px;">
                        <span style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; margin-bottom: 6px; display: block;">Bloques rápidos</span>
                        <div class="disp-quick-times">
                            <button type="button" class="disp-pill"
                                    :class="{ 'active-pill': dispHoraInicio === '07:00' && dispHoraFin === '12:00' }"
                                    @click="dispHoraInicio = '07:00'; dispHoraFin = '12:00'">Mañana</button>
                            <button type="button" class="disp-pill"
                                    :class="{ 'active-pill': dispHoraInicio === '12:00' && dispHoraFin === '17:00' }"
                                    @click="dispHoraInicio = '12:00'; dispHoraFin = '17:00'">Tarde</button>
                            <button type="button" class="disp-pill"
                                    :class="{ 'active-pill': dispHoraInicio === '08:00' && dispHoraFin === '10:00' }"
                                    @click="dispHoraInicio = '08:00'; dispHoraFin = '10:00'">8-10 AM</button>
                            <button type="button" class="disp-pill"
                                    :class="{ 'active-pill': dispHoraInicio === '10:00' && dispHoraFin === '12:00' }"
                                    @click="dispHoraInicio = '10:00'; dispHoraFin = '12:00'">10-12 PM</button>
                            <button type="button" class="disp-pill"
                                    :class="{ 'active-pill': dispHoraInicio === '13:00' && dispHoraFin === '15:00' }"
                                    @click="dispHoraInicio = '13:00'; dispHoraFin = '15:00'">1-3 PM</button>
                            <button type="button" class="disp-pill"
                                    :class="{ 'active-pill': dispHoraInicio === '15:00' && dispHoraFin === '17:00' }"
                                    @click="dispHoraInicio = '15:00'; dispHoraFin = '17:00'">3-5 PM</button>
                        </div>
                    </div>
                </div>
                <div class="disp-field">
                    <label class="disp-label">Motivo <span style="font-weight: 400; text-transform: none; letter-spacing: 0;">(opcional)</span></label>
                    <input type="text" class="disp-input" x-model="dispMotivo" placeholder="Ej: Cita médica, trámites personales...">
                </div>
                <div class="disp-field">
                    <label class="disp-label">Repetir</label>
                    <select class="disp-input" x-model="dispRepetir" style="appearance: auto; cursor: pointer;">
                        <option value="no">No se repite</option>
                        <option value="semanal">Cada semana</option>
                        <option value="quincenal">Cada dos semanas</option>
                        <option value="mensual">Cada mes</option>
                    </select>
                </div>
            </div>
            <div class="disp-modal-footer">
                <button type="button" class="disp-btn-cancel" @click="showDisponibilidad = false">Cancelar</button>
                <button type="button" class="disp-btn-save" @click="guardarDisponibilidad()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                    </svg>
                    Bloquear Horario
                </button>
            </div>
        </div>
    </div>
</div>
