<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Agenda — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Agenda y Actividades</h2>
    <p layout:fragment="page-subtitle">Organiza tu calendario de clases, programa citas de atención a padres y
        gestiona aulas virtuales</p>

    <th:block th:fragment="htmx-content">
    <!-- OOB: al navegar por htmx solo se reemplaza .content-area, así que el título del topbar
         (fuera de ese contenedor) se sincroniza aparte para que no se quede con el de la página anterior. -->
    <h2 id="topbar-page-title" hx-swap-oob="true">Agenda y Actividades</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Organiza tu calendario de clases, programa citas de atención a padres y
        gestiona aulas virtuales</p>
    <main layout:fragment="content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }

            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }

            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }

            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }

            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }

            .tab-pane {
                animation: fadeIn 0.35s ease-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .agenda-content-wrapper {
                position: relative;
            }

            .agenda-loading-overlay {
                position: absolute;
                inset: 0;
                z-index: 50;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(2px);
                -webkit-backdrop-filter: blur(2px);
                border-radius: 16px;
                font-weight: 600;
                color: var(--text-secondary);
                font-size: 0.9rem;
                pointer-events: none;
                min-height: 300px;
            }

            .htmx-request.agenda-loading-overlay,
            .htmx-request .agenda-loading-overlay {
                pointer-events: auto;
            }

            .agenda-loading-overlay .spinner {
                width: 32px;
                height: 32px;
                border-width: 3px;
            }
        </style>

        <div x-data="{ activeTab: 'calendario' }">
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'calendario' }"
                        @click="activeTab = 'calendario'" hx-get="/agenda/calendario" hx-target="#agenda-content"
                        hx-indicator="#agenda-loading" hx-swap="innerHTML">
                        📅 Calendario
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'tareas' }"
                        @click="activeTab = 'tareas'" hx-get="/agenda/tareas" hx-target="#agenda-content"
                        hx-swap="innerHTML">
                        ✅ Tareas
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'recordatorios' }"
                        @click="activeTab = 'recordatorios'" hx-get="/agenda/recordatorios" hx-target="#agenda-content"
                        hx-swap="innerHTML">
                        ⏰ Recordatorios
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'actividad' }"
                        @click="activeTab = 'actividad'" hx-get="/agenda/actividad" hx-target="#agenda-content"
                        hx-indicator="#agenda-loading" hx-swap="innerHTML">
                        📋 Actividad Institucional
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'proyectos' }"
                        @click="activeTab = 'proyectos'" hx-get="/agenda/proyectos" hx-target="#agenda-content"
                        hx-swap="innerHTML">
                        📁 Proyectos
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'participacion' }"
                        @click="activeTab = 'participacion'" hx-get="/agenda/participacion" hx-target="#agenda-content"
                        hx-swap="innerHTML">
                        👥 Participación
                    </button>
                </div>
            </div>

            <!-- Contenedor HTMX para el contenido de las pestañas -->
            <div class="agenda-content-wrapper">
                <div id="agenda-loading" class="htmx-indicator agenda-loading-overlay">
                    <div class="spinner"></div>
                    <span>Cargando...</span>
                </div>
                <div id="agenda-content" class="tab-pane" hx-get="/agenda/calendario" hx-trigger="load"
                    hx-indicator="#agenda-loading" hx-swap="innerHTML">
                    <!-- El contenido se cargará dinámicamente aquí -->
                </div>
            </div>
        </div>
    </main>
    </th:block>

</body>

</html>
