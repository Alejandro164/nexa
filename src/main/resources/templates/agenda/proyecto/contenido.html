<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" x-data="proyectoComponente()"
     @ver-miembros.window="verMiembros($event.detail.id)">
    <style>
        .proyecto-tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 5px; }
        .proyecto-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border-radius: 8px; cursor: pointer; border: none; background: transparent; transition: all 0.2s; white-space: nowrap; }
        .proyecto-tab:hover { color: var(--primary); background: var(--input-bg); }
        .proyecto-tab.active { color: #fff; background: var(--primary); box-shadow: 0 4px 12px rgba(45, 90, 135, 0.25); }
        .proyecto-panel { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .proyecto-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .proyecto-card-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
        .proyecto-card-title { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin: 0; }
        .proyecto-table { width: 100%; border-collapse: collapse; }
        .proyecto-table th { text-align: left; padding: 0.75rem 1.5rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; background: #f8fafc; border-bottom: 1px solid var(--border); }
        .proyecto-table td { padding: 0.9rem 1.5rem; font-size: 0.9rem; color: #334155; border-bottom: 1px solid #f1f5f9; }
        .proyecto-table tr:hover td { background: #f8fafc; }
        .proyecto-empty { text-align: center; padding: 3rem !important; color: #94a3b8; font-style: italic; }
        .badge-estado { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-abierto     { background: #f1f5f9; color: #475569; }
        .badge-en-progreso { background: #dbeafe; color: #1e40af; }
        .badge-pendiente   { background: #fef3c7; color: #92400e; }
        .badge-en-revision { background: #f3e8ff; color: #6b21a8; }
        .badge-completado  { background: #ccfbf1; color: #0f766e; }
        .badge-cerrado     { background: #dcfce7; color: #166534; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
        .btn-ghost { background: transparent; color: var(--primary); }
        .btn-ghost:hover { background: var(--input-bg); }
        .btn-danger-ghost { background: transparent; color: #ef4444; }
        .btn-danger-ghost:hover { background: #fef2f2; }
        .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
        .search-box { display: flex; gap: 8px; margin-bottom: 1rem; }
        .search-input { flex: 1; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1); }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .modal-dialog { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid #e2e8f0; }
        .modal-title { margin: 0; font-size: 1.15rem; font-weight: 700; color: #0f172a; }
        .modal-body { padding: 1.5rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; background: #f8fafc; }
        .close-btn { background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 1.4rem; line-height: 1; padding: 4px 8px; border-radius: 6px; }
        .close-btn:hover { color: #0f172a; background: #f1f5f9; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 5px; }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; font-family: inherit; }
        .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1); }
        .form-textarea { resize: vertical; min-height: 70px; }
        .btn-primary { padding: 9px 18px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-primary:hover { background: #1e3a5f; }
        .btn-secondary { padding: 9px 18px; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-secondary:hover { background: #e2e8f0; }
        .miembro-row { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 6px; background: #fff; }
        .miembro-info { display: flex; flex-direction: column; gap: 2px; }
        .miembro-nombre { font-weight: 600; font-size: 0.9rem; color: #0f172a; }
        .miembro-email { font-size: 0.8rem; color: #94a3b8; }
        .rol-badge { padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; }
        .rol-lider { background: #fef3c7; color: #92400e; }
        .rol-miembro { background: #e0e7ff; color: #3730a3; }
        .tareas-container { margin-top: 10px; padding: 0.75rem; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
        .tarea-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 0.85rem; background: #fff; border: 1px solid #f1f5f9; }
        .tarea-row:hover { border-color: #e2e8f0; }
        .estado-badge { padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .estado-pendiente { background: #fef3c7; color: #92400e; }
        .estado-en-progreso { background: #dbeafe; color: #1e40af; }
        .estado-completada { background: #dcfce7; color: #166534; }
        .estado-vencida { background: #fee2e2; color: #991b1b; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 1.5rem; }
        .stat-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: #64748b; margin-top: 4px; font-weight: 500; }
        .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .select-group { margin-bottom: 1.5rem; max-width: 380px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .personal-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; background: #f1f5f9; color: #475569; }
    </style>

    <div>
        <div class="proyecto-tabs">
            <button class="proyecto-tab" :class="{ 'active': activeTab === 'proyectos' }" @click="activeTab = 'proyectos'">📁 Proyectos</button>
            <button class="proyecto-tab" id="btn-tab-eficiencia" :class="{ 'active': activeTab === 'dashboard' }" @click="activeTab = 'dashboard'">📊 Eficiencia</button>
        </div>

        <div class="proyecto-panel" x-show="activeTab === 'proyectos'" x-cloak>
            <div class="search-box">
                <input class="search-input" type="text" placeholder="Buscar proyectos..." x-model="filtro" @input.debounce.300ms="buscarProyectos()">
                <button class="btn-primary"
                        hx-get="/agenda/proyectos/form"
                        hx-target="#modal-container" hx-swap="innerHTML"
                        onclick="abrirModalAcademico()"
                        style="white-space: nowrap;">+ Nuevo Proyecto</button>
            </div>
            <div id="tabla-proyectos-container" class="proyecto-card" th:insert="~{agenda/proyecto/contenido :: tabla-proyectos}"></div>
        </div>

        <div class="proyecto-panel" x-show="activeTab === 'dashboard'" x-cloak>
            <div id="proyectos-select-group" class="select-group">
                <select x-model="dashboardProyectoId" class="form-input"
                        onchange="if(this.value){htmx.ajax('GET','/agenda/proyectos/'+this.value+'/dashboard',{target:'#dashboard-container',swap:'innerHTML'});htmx.ajax('GET','/agenda/proyectos/'+this.value+'/miembros',{target:'#miembros-container',swap:'innerHTML'});}">
                    <option value="">-- Selecciona un proyecto --</option>
                    <option th:each="p : ${proyectos}" th:value="${p.id}" th:text="${p.nombre}">Proyecto</option>
                </select>
            </div>
            <div id="dashboard-container"></div>
            <div id="miembros-container" style="margin-top: 1.5rem;"></div>
        </div>
    </div>

</div>

<th:block th:fragment="tabla-proyectos">
    <div class="proyecto-card-header">
        <h3 class="proyecto-card-title">Proyectos
            <span style="font-weight:400;color:#94a3b8;font-size:0.85rem;"
                  th:text="'(' + ${proyectos != null ? #lists.size(proyectos) : 0} + ')'">
                (0)
            </span>
        </h3>
    </div>
    <table class="proyecto-table">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Objetivo</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Personal Asignado</th>
                <th>Estado</th>
                <th style="text-align:right;">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${proyectos == null or proyectos.empty}">
                <td colspan="7" class="proyecto-empty">No hay proyectos. Crea el primero.</td>
            </tr>
            <tr th:each="p : ${proyectos}">
                <td><strong th:text="${p.nombre}" style="color:#0f172a;">Nombre</strong></td>
                <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                    <span th:text="${p.objetivo}" style="color:#64748b;">Objetivo</span>
                </td>
                <td th:text="${#temporals.format(p.fechaInicio, 'dd/MM/yyyy')}" style="font-size:0.85rem; color:#64748b; white-space:nowrap;">01/01/2026</td>
                <td th:text="${#temporals.format(p.fechaFin, 'dd/MM/yyyy')}" style="font-size:0.85rem; color:#64748b; white-space:nowrap;">31/12/2026</td>
                <td>
                    <span class="personal-badge">
                        👤 <span th:text="${p.miembros.size()}">0</span>
                    </span>
                </td>
                <td>
                    <span class="badge-estado"
                          th:classappend="${'badge-' + p.estado.name().toLowerCase().replace('_','-')}"
                          th:text="${p.estado.name() == 'ABIERTO' ? 'Abierto' :
                                    (p.estado.name() == 'EN_PROGRESO' ? 'En Progreso' :
                                    (p.estado.name() == 'PENDIENTE' ? 'Pendiente' :
                                    (p.estado.name() == 'EN_REVISION' ? 'En Revisión' :
                                    (p.estado.name() == 'COMPLETADO' ? 'Completado' : 'Cerrado'))))}">
                        Abierto
                    </span>
                </td>
                <td>
                    <div class="actions-cell">
                        <button class="btn-sm btn-ghost"
                                th:attr="data-id=${p.id}"
                                onclick="window.dispatchEvent(new CustomEvent('ver-miembros',{detail:{id:+this.dataset.id}}))">👤</button>
                        <button class="btn-sm btn-ghost"
                                th:attr="hx-get='/agenda/proyectos/form/' + ${p.id}"
                                hx-target="#modal-container" hx-swap="innerHTML"
                                onclick="abrirModalAcademico()">✏️</button>
                        <button class="btn-sm btn-danger-ghost"
                                onclick="abrirConfirmacionAcademica(this)"
                                th:attr="data-delete-url='/agenda/proyectos/' + ${p.id},
                                         data-delete-target='#tabla-proyectos-container',
                                         data-delete-title='Eliminar proyecto',
                                         data-delete-message='¿Deseas eliminar el proyecto ' + ${p.nombre} + '? Se perderán todos sus miembros y tareas.'">🗑️</button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- OOB: sincroniza el select de Eficiencia cuando cambia la lista de proyectos -->
    <div id="proyectos-select-group" hx-swap-oob="true" class="select-group">
        <select x-model="dashboardProyectoId" class="form-input"
                onchange="if(this.value){htmx.ajax('GET','/agenda/proyectos/'+this.value+'/dashboard',{target:'#dashboard-container',swap:'innerHTML'});htmx.ajax('GET','/agenda/proyectos/'+this.value+'/miembros',{target:'#miembros-container',swap:'innerHTML'});}">
            <option value="">-- Selecciona un proyecto --</option>
            <option th:each="p : ${proyectos}" th:value="${p.id}" th:text="${p.nombre}">Proyecto</option>
        </select>
    </div>
</th:block>

</body>
</html>
