<div th:fragment="tabla-tareas">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 0.75rem;">
        <span style="font-weight:600;font-size:0.85rem;color:#475569;">Tareas Asignadas</span>
        <button class="btn-sm btn-primary"
                th:attr="hx-get='/agenda/tareas/form?miembroId=' + ${miembroId},data-mid=${miembroId},data-pid=${proyectoId}"
                hx-target="#modal-container" hx-swap="innerHTML"
                onclick="abrirModalTareaMiembro(this)">+ Nueva</button>
    </div>
    <table class="proyecto-table">
        <tbody>
            <tr th:if="${tareas == null or tareas.empty}">
                <td colspan="2" class="proyecto-empty">Sin tareas.</td>
            </tr>
            <tr th:each="t : ${tareas}">
                <td>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="estado-badge"
                              th:classappend="${t.estado.name() == 'PENDIENTE' ? 'estado-pendiente' : (t.estado.name() == 'EN_PROGRESO' ? 'estado-en-progreso' : (t.estado.name() == 'COMPLETADA' ? 'estado-completada' : 'estado-vencida'))}"
                              th:text="${t.estado.name()}">PENDIENTE</span>
                        <strong style="font-size:0.85rem;" th:text="${t.titulo}">Título</strong>
                        <span th:if="${t.calificacion != null}" style="font-size:0.8rem;color:#64748b;" th:text="'Nota: '+${t.calificacion}+'/100'">Nota</span>
                    </div>
                    <div style="font-size:0.78rem;color:#94a3b8;margin-top:3px;" th:text="'Límite: '+${#temporals.format(t.fechaLimite, 'dd/MM/yyyy')}">Límite</div>
                </td>
                <td style="width:1%;white-space:nowrap;text-align:right;">
                    <button class="btn-xs btn-ghost" style="font-size:0.75rem;"
                            th:attr="hx-get='/agenda/tareas/form/' + ${t.id} + '?miembroId=' + ${t.miembro.id},data-mid=${t.miembro.id},data-pid=${t.proyecto.id}"
                            hx-target="#modal-container" hx-swap="innerHTML"
                            onclick="abrirModalTareaMiembro(this)"
                            title="Editar">✏️</button>
                    <button class="btn-xs btn-danger-ghost" style="font-size:0.75rem;"
                            onclick="abrirConfirmacionAcademica(this)"
                            th:attr="data-delete-url=|/agenda/proyectos/tareas/${t.id}?proyectoId=${t.proyecto.id}&amp;miembroId=${t.miembro.id}|,
                                     data-delete-target='#tareas-' + ${t.miembro.id},
                                     data-delete-title='Eliminar tarea',
                                     data-delete-message='¿Deseas eliminar la tarea ' + ${t.titulo} + '? Esta acción no se puede deshacer.'"
                            title="Eliminar">🗑️</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
