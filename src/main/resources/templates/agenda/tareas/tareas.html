<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="tab-pane">
    <style>
        .tarea-card { background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden; }
        .tarea-card-header { display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;border-bottom:1px solid var(--border); }
        .tarea-card-title { font-size:1.1rem;font-weight:700;color:#0f172a;margin:0; }
        .tarea-table { width:100%;border-collapse:collapse; }
        .tarea-table th { text-align:left;padding:0.75rem 1.5rem;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#64748b;background:#f8fafc;border-bottom:1px solid var(--border); }
        .tarea-table td { padding:0.85rem 1.5rem;font-size:0.88rem;color:#334155;border-bottom:1px solid #f1f5f9;vertical-align:middle; }
        .tarea-table tr:hover td { background:#f8fafc; }
        .tarea-empty { text-align:center;padding:3rem!important;color:#94a3b8;font-style:italic; }
        .tarea-chip { display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:600; }
        .tarea-badge-alta     { background:#fee2e2;color:#991b1b; }
        .tarea-badge-media    { background:#fef3c7;color:#92400e; }
        .tarea-badge-baja     { background:#f1f5f9;color:#475569; }
        .tarea-badge-pendiente   { background:#fef3c7;color:#92400e; }
        .tarea-badge-en-progreso { background:#dbeafe;color:#1e40af; }
        .tarea-badge-completada  { background:#dcfce7;color:#166534; }
        .tarea-badge-vencida     { background:#fee2e2;color:#991b1b; }
        .tarea-actions { display:flex;gap:4px;justify-content:flex-end; }
        .btn-xs { padding:4px 10px;font-size:0.75rem;border-radius:6px;font-weight:500;cursor:pointer;border:none; }
        .btn-ghost { background:transparent;color:var(--primary); }
        .btn-ghost:hover { background:var(--input-bg); }
        .btn-danger-ghost { background:transparent;color:#ef4444; }
        .btn-danger-ghost:hover { background:#fef2f2; }
        .form-group { margin-bottom:1rem; }
        .form-label { display:block;font-size:0.85rem;font-weight:600;color:#334155;margin-bottom:5px; }
        .form-input,.form-select-t { width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;outline:none;font-family:inherit;box-sizing:border-box; }
        .form-input:focus,.form-select-t:focus { border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,90,135,0.1); }
        .form-textarea { width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;outline:none;font-family:inherit;resize:vertical;min-height:70px;box-sizing:border-box; }
        .form-textarea:focus { border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,90,135,0.1); }
        .form-row { display:flex;gap:12px; }
        .form-row .form-group { flex:1; }
        .btn-primary-t { padding:9px 18px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:0.85rem;cursor:pointer; }
        .btn-primary-t:hover { background:#1e3a5f; }
        .btn-secondary-t { padding:9px 18px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:8px;font-weight:600;font-size:0.85rem;cursor:pointer; }
        .btn-secondary-t:hover { background:#e2e8f0; }
        .tarea-modal-footer { display:flex;justify-content:flex-end;gap:10px;padding:1rem 1.5rem;border-top:1px solid #e2e8f0;background:#f8fafc;margin:0 -1.5rem -1.5rem;border-radius:0 0 14px 14px; }
        #tareas-modal-container.dir-modal-visible .modal-backdrop { animation:academicModalBackdropIn 180ms ease-out both; }
        #tareas-modal-container.dir-modal-visible .modal-dialog { animation:academicModalDialogIn 240ms cubic-bezier(.22,1,.36,1) both; }
        #tareas-modal-container.dir-modal-closing .modal-backdrop { animation:academicModalBackdropOut 180ms ease-in both; }
        #tareas-modal-container.dir-modal-closing .modal-dialog { animation:academicModalDialogOut 180ms ease-in both; }
    </style>

    <div class="tarea-card">
        <div class="tarea-card-header">
            <h3 class="tarea-card-title">Gestión de Tareas
                <span style="font-weight:400;color:#94a3b8;font-size:0.85rem;"
                      th:text="'(' + ${tareas != null ? #lists.size(tareas) : 0} + ')'"></span>
            </h3>
            <button class="btn-primary-t"
                    hx-get="/agenda/tareas/form"
                    hx-target="#tareas-modal-container" hx-swap="innerHTML"
                    onclick="abrirTareasModal()">+ Nueva Tarea</button>
        </div>
        <div id="tareas-tabla-container" th:insert="~{agenda/tareas/tareas :: tabla-tareas}"></div>
    </div>

    <div id="tareas-modal-container" style="display:none;"></div>
</div>

<th:block th:fragment="tabla-tareas">
    <table class="tarea-table">
        <thead>
            <tr>
                <th>Título</th>
                <th>Asignado a</th>
                <th>Fecha Límite</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th style="text-align:right;">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${tareas == null or tareas.empty}">
                <td colspan="6" class="tarea-empty">No hay tareas registradas.</td>
            </tr>
            <tr th:each="t : ${tareas}">
                <td><strong th:text="${t.titulo}" style="color:#0f172a;">Título</strong></td>
                <td th:text="${t.miembro != null ? t.miembro.usuario.nombre : t.proyecto.nombre}" style="color:#64748b;">Asignado</td>
                <td style="white-space:nowrap;"
                    th:text="${#temporals.format(t.fechaLimite,'dd/MM/yyyy')}"
                    th:style="${t.fechaLimite.isBefore(#temporals.createNow().toLocalDate()) and t.estado.name() != 'COMPLETADA'} ? 'color:#ef4444;font-size:0.85rem;white-space:nowrap;font-weight:600;' : 'color:#64748b;font-size:0.85rem;white-space:nowrap;'">
                </td>
                <td>
                    <span class="tarea-chip"
                          th:classappend="${'tarea-badge-' + t.prioridad.name().toLowerCase()}"
                          th:text="${t.prioridad.name() == 'ALTA' ? 'Alta' : (t.prioridad.name() == 'MEDIA' ? 'Media' : 'Baja')}">
                    </span>
                </td>
                <td>
                    <span class="tarea-chip"
                          th:classappend="${'tarea-badge-' + t.estado.name().toLowerCase().replace('_','-')}"
                          th:text="${t.estado.name() == 'PENDIENTE' ? 'Pendiente' :
                                    (t.estado.name() == 'EN_PROGRESO' ? 'En Progreso' :
                                    (t.estado.name() == 'COMPLETADA' ? 'Completada' : 'Vencida'))}">
                    </span>
                </td>
                <td>
                    <div class="tarea-actions">
                        <button class="btn-xs btn-ghost"
                                th:attr="hx-get='/agenda/tareas/form/' + ${t.id}"
                                hx-target="#tareas-modal-container" hx-swap="innerHTML"
                                onclick="abrirTareasModal()" title="Editar">✏️</button>
                        <button class="btn-xs btn-danger-ghost"
                                onclick="abrirConfirmacionAcademica(this)"
                                th:attr="data-delete-url='/agenda/tareas/' + ${t.id},
                                         data-delete-target='#tareas-tabla-container',
                                         data-delete-title='Eliminar tarea',
                                         data-delete-message='¿Deseas eliminar la tarea ' + ${t.titulo} + '? Esta acción no se puede deshacer.'"
                                title="Eliminar">🗑️</button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</th:block>

</body>
</html>
