<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form-content">
    <div class="modal-backdrop" onclick="if(event.target===this) cerrarTareasModal()">
        <div class="modal-dialog" style="max-width:520px;">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${tarea.id == null ? 'Nueva Tarea' : 'Editar Tarea'}">Tarea</h3>
                <button type="button" class="close-btn" onclick="cerrarTareasModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form th:action="@{/agenda/tareas}" method="post"
                      hx-post="/agenda/tareas"
                      hx-target="#tareas-tabla-container" hx-swap="innerHTML"
                      hx-on:htmx:after-request="if(event.detail.successful) cerrarTareasModal()">
                    <input type="hidden" name="id" th:value="${tarea.id}">

                    <div th:if="${error}" class="form-alert-error" th:text="${error}"></div>

                    <div class="form-group">
                        <label class="form-label">Título *</label>
                        <input class="form-input" type="text" name="titulo" required maxlength="200"
                               th:value="${tarea.titulo}" placeholder="Descripción de la tarea">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-textarea" name="descripcion" maxlength="1000"
                                  th:text="${tarea.descripcion}"
                                  placeholder="Detalles adicionales..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Asignar a *</label>
                        <div style="display:flex;gap:1.5rem;margin-bottom:10px;">
                            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.88rem;font-weight:500;color:#334155;">
                                <input type="radio" name="_tipoAsig" value="p"
                                       th:checked="${tarea.miembro == null}"
                                       onchange="toggleTipoAsignacion('p')"
                                       style="accent-color:var(--primary);width:15px;height:15px;">
                                Proyecto
                            </label>
                            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.88rem;font-weight:500;color:#334155;">
                                <input type="radio" name="_tipoAsig" value="u"
                                       th:checked="${tarea.miembro != null}"
                                       onchange="toggleTipoAsignacion('u')"
                                       style="accent-color:var(--primary);width:15px;height:15px;">
                                Personal
                            </label>
                        </div>

                        <div id="wrap-asig-proyecto" th:style="${tarea.miembro != null} ? 'display:none' : ''">
                            <select id="asig-proyecto" name="asignarA" class="form-input"
                                    th:disabled="${tarea.miembro != null}">
                                <option value="" disabled hidden th:selected="${tarea.proyecto == null}">Seleccionar Proyecto</option>
                                <option th:each="p : ${proyectos}"
                                        th:value="'p_' + ${p.id}"
                                        th:text="${p.nombre}"
                                        th:selected="${tarea.miembro == null and tarea.proyecto != null and tarea.proyecto.id == p.id}">Proyecto</option>
                            </select>
                        </div>

                        <div id="wrap-asig-personal" th:style="${tarea.miembro == null} ? 'display:none' : ''">
                            <select id="asig-personal" name="asignarA" class="form-input"
                                    th:disabled="${tarea.miembro == null}">
                                <option value="" disabled hidden th:selected="${tarea.miembro == null}">Seleccionar Personal</option>
                                <option th:each="u : ${personal}"
                                        th:value="'u_' + ${u.id}"
                                        th:text="${u.nombre}"
                                        th:attr="data-role=${u.roles.empty ? 'Sin rol' : #strings.replace(u.roles.![nombre].get(0), 'ROLE_', '')}"
                                        th:selected="${tarea.miembro != null and tarea.miembro.usuario.id == u.id}">Personal</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Fecha Límite *</label>
                            <input class="form-input" type="date" name="fechaLimite" required
                                   th:value="${tarea.fechaLimite}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Prioridad</label>
                            <select class="form-input" name="prioridad">
                                <option value="ALTA"  th:selected="${tarea.prioridad != null and tarea.prioridad.name() == 'ALTA'}">Alta</option>
                                <option value="MEDIA" th:selected="${tarea.prioridad == null or tarea.prioridad.name() == 'MEDIA'}">Media</option>
                                <option value="BAJA"  th:selected="${tarea.prioridad != null and tarea.prioridad.name() == 'BAJA'}">Baja</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Estado</label>
                        <select class="form-input" name="estado">
                            <option value="PENDIENTE"   th:selected="${tarea.estado == null or tarea.estado.name() == 'PENDIENTE'}">Pendiente</option>
                            <option value="EN_PROGRESO" th:selected="${tarea.estado != null and tarea.estado.name() == 'EN_PROGRESO'}">En Progreso</option>
                            <option value="COMPLETADA"  th:selected="${tarea.estado != null and tarea.estado.name() == 'COMPLETADA'}">Completada</option>
                            <option value="VENCIDA"     th:selected="${tarea.estado != null and tarea.estado.name() == 'VENCIDA'}">Vencida</option>
                        </select>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="cerrarTareasModal()">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
