<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" x-data="planTrabajoComponente()"
     @ver-miembros.window="verMiembros($event.detail.id)">

    <div>
        <div class="module-tabs">
            <button class="module-tab" :class="{ 'active': activeTab === 'planesTrabajo' }" @click="activeTab = 'planesTrabajo'">📁 Plan de trabajo</button>
            <button class="module-tab" id="btn-tab-eficiencia" :class="{ 'active': activeTab === 'dashboard' }" @click="activeTab = 'dashboard'">📊 Eficiencia</button>
        </div>

        <div class="module-panel" x-show="activeTab === 'planesTrabajo'" x-cloak>
            <div class="module-search">
                <input class="module-search-input" type="text" placeholder="Buscar planes de trabajo..." x-model="filtro" @input.debounce.300ms="buscarPlanesTrabajo()">
                <button class="btn-primary"
                        hx-get="/agenda/plan-trabajo/form"
                        hx-target="#modal-container" hx-swap="innerHTML"
                        onclick="abrirModalAcademico()"
                        style="white-space: nowrap;">+ Nuevo plan de trabajo</button>
            </div>
            <div id="tabla-planes-trabajo-container" class="module-card" th:insert="~{agenda/plan-trabajo/contenido :: tabla-planes-trabajo}"></div>
        </div>

        <div class="module-panel" x-show="activeTab === 'dashboard'" x-cloak>
            <div id="planes-trabajo-select-group" class="select-group">
                <select x-model="dashboardPlanTrabajoId" class="form-input"
                        onchange="if(this.value){htmx.ajax('GET','/agenda/plan-trabajo/'+this.value+'/dashboard',{target:'#dashboard-container',swap:'innerHTML'});htmx.ajax('GET','/agenda/plan-trabajo/'+this.value+'/miembros',{target:'#miembros-container',swap:'innerHTML'});}">
                    <option value="" disabled hidden>Selecciona un plan de trabajo</option>
                    <option th:each="p : ${planesTrabajo}" th:value="${p.id}" th:text="${p.nombre}">Plan de trabajo</option>
                </select>
            </div>
            <div id="dashboard-container"></div>
            <div id="miembros-container" style="margin-top: 1.5rem;"></div>
        </div>
    </div>

</div>

<th:block th:fragment="tabla-planes-trabajo">
    <div class="module-card-header">
        <h3 class="module-card-title">Planes de trabajo
            <span style="font-weight:400;color:#94a3b8;font-size:0.85rem;"
                  th:text="'(' + ${planesTrabajo != null ? #lists.size(planesTrabajo) : 0} + ')'">
                (0)
            </span>
        </h3>
    </div>
    <table class="table">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Objetivo</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Personal Asignado</th>
                <th>Estado</th>
                <th style="text-align:right;">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${planesTrabajo == null or planesTrabajo.empty}">
                <td colspan="7" class="table-empty">No hay planes de trabajo. Crea el primero.</td>
            </tr>
            <tr th:each="p : ${planesTrabajo}">
                <td><strong th:text="${p.nombre}" style="color:#0f172a;">Nombre</strong></td>
                <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                    <span th:text="${p.objetivo}" style="color:#64748b;">Objetivo</span>
                </td>
                <td th:text="${#temporals.format(p.fechaInicio, 'dd/MM/yyyy')}" style="font-size:0.85rem; color:#64748b; white-space:nowrap;">01/01/2026</td>
                <td th:text="${#temporals.format(p.fechaFin, 'dd/MM/yyyy')}" style="font-size:0.85rem; color:#64748b; white-space:nowrap;">31/12/2026</td>
                <td>
                    <span class="personal-badge">
                        👤 <span th:text="${p.miembros.size()}">0</span>
                    </span>
                </td>
                <td>
                    <span class="badge-estado"
                          th:classappend="${'badge-' + p.estado.name().toLowerCase().replace('_','-')}"
                          th:text="${p.estado.name() == 'ABIERTO' ? 'Abierto' :
                                    (p.estado.name() == 'EN_PROGRESO' ? 'En Progreso' :
                                    (p.estado.name() == 'PENDIENTE' ? 'Pendiente' :
                                    (p.estado.name() == 'EN_REVISION' ? 'En Revisión' :
                                    (p.estado.name() == 'COMPLETADO' ? 'Completado' : 'Cerrado'))))}">
                        Abierto
                    </span>
                </td>
                <td>
                    <div class="table-actions">
                        <button class="btn-xs btn-ghost"
                                th:attr="data-id=${p.id}"
                                onclick="window.dispatchEvent(new CustomEvent('ver-miembros',{detail:{id:+this.dataset.id}}))">👤</button>
                        <button class="btn-xs btn-ghost"
                                th:attr="hx-get='/agenda/plan-trabajo/form/' + ${p.id}"
                                hx-target="#modal-container" hx-swap="innerHTML"
                                onclick="abrirModalAcademico()">✏️</button>
                        <button class="btn-xs btn-danger-ghost"
                                onclick="abrirConfirmacionAcademica(this)"
                                th:attr="data-delete-url='/agenda/plan-trabajo/' + ${p.id},
                                         data-delete-target='#tabla-planes-trabajo-container',
                                         data-delete-title='Eliminar plan de trabajo',
                                         data-delete-message='¿Deseas eliminar el plan de trabajo ' + ${p.nombre} + '? Se perderán todos sus miembros y tareas.'">🗑️</button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- OOB: sincroniza el select de Eficiencia cuando cambia la lista de planes de trabajo -->
    <div id="planes-trabajo-select-group" hx-swap-oob="true" class="select-group">
        <select x-model="dashboardPlanTrabajoId" class="form-input"
                onchange="if(this.value){htmx.ajax('GET','/agenda/plan-trabajo/'+this.value+'/dashboard',{target:'#dashboard-container',swap:'innerHTML'});htmx.ajax('GET','/agenda/plan-trabajo/'+this.value+'/miembros',{target:'#miembros-container',swap:'innerHTML'});}">
            <option value="" disabled hidden>Selecciona un plan de trabajo</option>
            <option th:each="p : ${planesTrabajo}" th:value="${p.id}" th:text="${p.nombre}">Plan de trabajo</option>
        </select>
    </div>
</th:block>

</body>
</html>
