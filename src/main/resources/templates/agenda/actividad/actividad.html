<div th:fragment="content" id="actividad-content" class="tab-pane">
    <form class="filters-bar"
          hx-get="/agenda/actividad"
          hx-target="#actividad-content" hx-swap="outerHTML"
          hx-trigger="submit, change from:.filter-select delay:200ms, input from:.filter-input delay:400ms">
        <input class="filter-input" type="text" name="filtro" th:value="${filtro}"
               placeholder="🔍 Buscar por título o descripción..." style="flex:1; min-width:220px;">
        <select class="form-input filter-select" name="mes">
            <option value="" th:selected="${mesSel == null}">Todos los meses</option>
            <option th:each="m : ${meses}" th:value="${m.key}" th:text="${m.value}"
                    th:selected="${mesSel != null and mesSel == m.key}"></option>
        </select>
        <select class="form-input filter-select" name="categoria">
            <option value="" th:selected="${categoriaSel == null or categoriaSel.isBlank()}">Todas las categorías</option>
            <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"
                    th:selected="${categoriaSel != null and categoriaSel == c}"></option>
        </select>
    </form>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Actividades Institucionales
                <span style="font-weight:400; color:#94a3b8; font-size:0.85rem;"
                      th:text="'(' + ${eventos != null ? #lists.size(eventos) : 0} + ')'"></span>
            </h3>
        </div>
        <div th:insert="~{agenda/actividad/actividad :: eventos-tabla}"></div>
    </div>

    <div id="actividad-modal-container" style="display:none;"></div>
</div>

<th:block th:fragment="eventos-tabla">
    <div class="table-container">
        <table class="table">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Categoría</th>
                    <th>Fecha</th>
                    <th style="text-align:right;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${eventos == null or eventos.empty}">
                    <td colspan="4" class="table-empty">No se encontraron actividades institucionales con esos filtros.</td>
                </tr>
                <tr th:each="ev : ${eventos}">
                    <td>
                        <strong th:text="${ev.titulo}" style="color:#0f172a;">Título</strong>
                        <span th:if="${ev.destacadoFlag}" class="badge badge-info" style="margin-left:6px;">Destacado</span>
                    </td>
                    <td><span class="badge badge-primary" th:text="${ev.nombreCategoria}">Categoría</span></td>
                    <td style="white-space:nowrap;"
                        th:text="${ev.rangoUnico}
                            ? ${#temporals.format(ev.fechaInicio, 'dd/MM/yyyy')}
                            : ${#temporals.format(ev.fechaInicio, 'dd/MM/yyyy')} + ' – ' + ${#temporals.format(ev.fechaFin, 'dd/MM/yyyy')}">
                        Fecha
                    </td>
                    <td>
                        <div class="table-actions">
                            <button class="btn-xs btn-ghost"
                                    th:attr="hx-get='/agenda/actividad/detalle/' + ${ev.id}"
                                    hx-target="#actividad-modal-container" hx-swap="innerHTML"
                                    onclick="abrirActividadModal()">Ver detalles</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</th:block>

<th:block th:fragment="detalle-modal">
    <div class="modal-backdrop" onclick="if(event.target===this) cerrarActividadModal()">
        <div class="modal-dialog" style="max-width:560px;">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${evento != null ? evento.titulo : 'Actividad no encontrada'}">Actividad</h3>
                <button type="button" class="close-btn" onclick="cerrarActividadModal()">&times;</button>
            </div>
            <div class="modal-body" th:if="${evento != null}">
                <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1rem;">
                    <span class="badge badge-primary" th:text="${evento.nombreCategoria}">Categoría</span>
                    <span class="badge badge-info" th:if="${evento.destacadoFlag}">Destacado</span>
                    <span class="badge badge-secondary" th:each="sub : ${evento.subcategorias}"
                          th:if="${sub != null and !sub.isBlank()}" th:text="${sub}">Subcategoría</span>
                </div>
                <p style="font-weight:600; color:var(--text-secondary); margin-bottom:0.75rem;"
                   th:text="${evento.rangoUnico}
                        ? ${#temporals.format(evento.fechaInicio, 'dd/MM/yyyy')}
                        : ${#temporals.format(evento.fechaInicio, 'dd/MM/yyyy')} + ' – ' + ${#temporals.format(evento.fechaFin, 'dd/MM/yyyy')}">
                    Fecha
                </p>
                <p th:if="${evento.descripcion != null and !evento.descripcion.isBlank()}"
                   style="white-space:pre-line; color:var(--text-secondary); font-size:0.9rem;"
                   th:text="${evento.descripcion}">Descripción</p>
            </div>
            <div class="modal-body" th:if="${evento == null}">
                <p class="table-empty">No se encontró información para esta actividad.</p>
            </div>
            <div class="modal-footer">
                <a th:if="${evento != null and evento.tieneLink}" th:href="${evento.link}" target="_blank" rel="noopener"
                   class="btn-secondary">Ver más</a>
                <button type="button" class="btn-primary" onclick="cerrarActividadModal()">Cerrar</button>
            </div>
        </div>
    </div>
</th:block>
