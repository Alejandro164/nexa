<div th:fragment="content" id="actividad-content" class="tab-pane" hx-indicator="#agenda-loading"
     x-data="{ subTab: 'institucion' }">
    <div class="config-tabs-container">
        <div class="config-tabs">
            <button type="button" class="config-tab-btn" :class="{ 'active': subTab === 'institucion' }"
                    @click="subTab = 'institucion'"
                    hx-get="/agenda/actividad/institucion" hx-target="#actividad-subcontent" hx-swap="innerHTML">
                🏫 Actividades Institución
            </button>
            <button type="button" class="config-tab-btn" :class="{ 'active': subTab === 'mep' }"
                    @click="subTab = 'mep'"
                    hx-get="/agenda/actividad/mep" hx-target="#actividad-subcontent" hx-swap="innerHTML">
                📅 Actividades MEP
            </button>
        </div>
    </div>

    <div id="actividad-subcontent" th:insert="~{agenda/actividad/institucion/institucion :: content}"></div>

    <div id="actividad-modal-container" style="display:none;"></div>
</div>

<th:block th:fragment="detalle-modal">
    <div class="modal-backdrop" onclick="if(event.target===this) cerrarActividadModal()">
        <div class="modal-dialog" style="max-width:560px;">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${evento != null ? evento.tituloVisible : 'Actividad no encontrada'}">Actividad</h3>
                <button type="button" class="close-btn" onclick="cerrarActividadModal()">&times;</button>
            </div>
            <div class="modal-body">
                <th:block th:if="${evento != null}">
                    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1rem;">
                        <span class="badge badge-primary" th:text="${evento.nombreCategoria}">Categoría</span>
                        <span class="badge badge-info" th:if="${evento.destacadoFlag}">Destacado</span>
                        <span class="badge badge-secondary" th:if="${evento.propia}">Dirección</span>
                        <span class="badge badge-secondary" th:each="sub : ${evento.subcategorias}"
                              th:if="${sub != null and !sub.isBlank()}" th:text="${sub}">Subcategoría</span>
                    </div>
                    <p style="font-weight:600; color:var(--text-secondary); margin-bottom:0.75rem;"
                       th:text="${evento.rangoUnico}
                            ? ${#temporals.format(evento.fechaInicio, 'dd/MM/yyyy')}
                            : ${#temporals.format(evento.fechaInicio, 'dd/MM/yyyy')} + ' – ' + ${#temporals.format(evento.fechaFin, 'dd/MM/yyyy')}">
                        Fecha
                    </p>
                    <p th:if="${evento.descripcion != null and !evento.descripcion.isBlank()}"
                       style="white-space:pre-line; color:var(--text-secondary); font-size:0.9rem;"
                       th:text="${evento.descripcion}">Descripción</p>
                </th:block>
                <p th:if="${evento == null}" class="table-empty">No se encontró información para esta actividad.</p>

                <div class="modal-footer">
                    <th:block th:if="${evento != null and evento.propia and puedeCrearActividad}">
                        <button type="button" class="btn btn-destructive"
                                th:attr="data-delete-url='/agenda/actividad/' + ${#strings.substringAfter(evento.id, 'local-')},
                                         data-delete-target='#actividad-content',
                                         data-delete-swap='outerHTML',
                                         data-delete-title='Eliminar actividad',
                                         data-delete-message='¿Deseas eliminar la actividad ' + ${evento.titulo} + '? Esta acción no se puede deshacer.'"
                                onclick="cerrarActividadModal(); abrirConfirmacionAcademica(this)">Eliminar</button>
                        <button class="btn-secondary"
                                th:attr="hx-get='/agenda/actividad/form/' + ${#strings.substringAfter(evento.id, 'local-')}"
                                hx-target="#actividad-modal-container" hx-swap="innerHTML" hx-indicator="this"
                                onclick="abrirActividadModal()">Editar</button>
                    </th:block>
                    <a th:if="${evento != null and evento.tieneLink}" th:href="${evento.link}" target="_blank" rel="noopener"
                       class="btn-secondary">Ver más</a>
                    <button type="button" class="btn-primary" onclick="cerrarActividadModal()">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</th:block>
