<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
<style>
    [x-cloak] { display: none !important; }

    .notas-split {
        display: grid;
        grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
        gap: 1rem;
        align-items: stretch;
        min-height: min(720px, calc(100vh - 210px));
    }
    .notas-pane {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
    }
    .notas-pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 1rem 1.15rem 0.85rem;
        border-bottom: 1px solid var(--border);
        background: #f8fafc;
    }
    .notas-pane-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.01em;
    }
    .notas-count {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--primary);
        background: rgba(45, 90, 135, 0.08);
        padding: 3px 10px;
        border-radius: 999px;
        white-space: nowrap;
    }
    .notas-pane-tools {
        padding: 0.85rem 1.15rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        background: #fff;
    }
    .notas-search {
        position: relative;
        display: flex;
        align-items: center;
    }
    .notas-search svg {
        position: absolute;
        left: 11px;
        color: #94a3b8;
        pointer-events: none;
    }
    .notas-search input {
        width: 100%;
        min-height: 38px;
        padding: 0.5rem 0.85rem 0.5rem 2.3rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f8fafc;
        font-size: 0.85rem;
        font-family: inherit;
        color: #0f172a;
        outline: none;
        box-sizing: border-box;
    }
    .notas-search input:focus {
        background: #fff;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.12);
    }
    .notas-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
    }
    .notas-chip {
        border: 1px solid var(--border);
        background: #fff;
        color: #64748b;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        padding: 5px 10px;
        border-radius: 999px;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .notas-chip:hover { border-color: #cbd5e1; color: #334155; }
    .notas-chip.is-on {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
    }
    .notas-list {
        overflow-y: auto;
        flex: 1;
        padding: 0.4rem;
    }
    .notas-list:focus { outline: none; }
    .notas-student {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0.7rem 0.75rem;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        transition: background 0.15s, border-color 0.15s;
    }
    .notas-student:hover { background: #f8fafc; }
    .notas-student.is-on {
        background: rgba(45, 90, 135, 0.07);
        border-color: rgba(45, 90, 135, 0.18);
        box-shadow: inset 3px 0 0 var(--primary);
    }
    .notas-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 0.72rem;
        font-weight: 700;
        flex-shrink: 0;
    }
    .notas-student-meta { min-width: 0; flex: 1; }
    .notas-student-name {
        font-size: 0.84rem;
        font-weight: 650;
        color: #0f172a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .notas-student-sub {
        font-size: 0.72rem;
        color: #64748b;
        margin-top: 1px;
    }
    .notas-pill {
        font-size: 0.78rem;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 8px;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
    }
    .notas-pill.excelente { background: #dcfce7; color: #166534; }
    .notas-pill.bueno { background: #dbeafe; color: #1e40af; }
    .notas-pill.regular { background: #fef3c7; color: #92400e; }
    .notas-pill.deficiente { background: #fee2e2; color: #991b1b; }

    .notas-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 3rem 2rem;
        color: #94a3b8;
    }
    .notas-empty-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #f1f5f9;
        display: grid;
        place-items: center;
        margin-bottom: 1rem;
        color: #94a3b8;
    }
    .notas-empty strong {
        display: block;
        color: #64748b;
        font-size: 0.95rem;
        margin-bottom: 0.3rem;
    }
    .notas-empty span { font-size: 0.82rem; max-width: 28rem; line-height: 1.5; }

    .notas-detail-head {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, #f8fafc 0%, #fff 100%);
    }
    .notas-ring {
        --pct: 0;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: conic-gradient(#2d5a87 calc(var(--pct) * 1%), #e8eef4 0);
        display: grid;
        place-items: center;
        flex-shrink: 0;
    }
    .notas-ring-inner {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.05rem;
        color: #0f172a;
        font-variant-numeric: tabular-nums;
    }
    .notas-detail-id { min-width: 0; flex: 1; }
    .notas-detail-name {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 750;
        color: #0f172a;
        letter-spacing: -0.02em;
    }
    .notas-detail-sub {
        margin-top: 0.2rem;
        font-size: 0.8rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem 0.85rem;
    }
    .notas-period {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--primary);
        background: rgba(45, 90, 135, 0.08);
        padding: 6px 10px;
        border-radius: 8px;
        white-space: nowrap;
    }
    .notas-kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
        border-bottom: 1px solid var(--border);
    }
    .notas-kpi {
        padding: 0.85rem 1.1rem;
        border-right: 1px solid var(--border);
    }
    .notas-kpi:last-child { border-right: none; }
    .notas-kpi-label {
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #64748b;
    }
    .notas-kpi-value {
        margin-top: 0.2rem;
        font-size: 1.2rem;
        font-weight: 750;
        color: #0f172a;
        font-variant-numeric: tabular-nums;
    }
    .notas-kpi-value.is-risk { color: #dc2626; }
    .notas-kpi-value.is-ok { color: #15803d; }

    .notas-table-wrap {
        overflow: auto;
        flex: 1;
    }
    .notas-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
    }
    .notas-table th {
        text-align: left;
        padding: 0.6rem 0.85rem;
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #64748b;
        background: #f8fafc;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 1;
    }
    .notas-table th.num, .notas-table td.num { text-align: right; }
    .notas-table td {
        padding: 0.8rem 0.85rem;
        font-size: 0.84rem;
        color: #334155;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: middle;
    }
    .notas-table tr:hover td { background: #f8fafc; }
    .notas-materia {
        font-weight: 650;
        color: #0f172a;
    }
    .notas-docente {
        display: block;
        font-size: 0.72rem;
        font-weight: 500;
        color: #94a3b8;
        margin-top: 2px;
    }
    .notas-final {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
    }
    .notas-final.excelente { color: #166534; }
    .notas-final.bueno { color: #1e40af; }
    .notas-final.regular { color: #92400e; }
    .notas-final.deficiente { color: #991b1b; }
    .notas-bar {
        height: 4px;
        border-radius: 99px;
        background: #e8eef4;
        margin-top: 6px;
        overflow: hidden;
        width: 72px;
        margin-left: auto;
    }
    .notas-bar-fill {
        height: 100%;
        border-radius: inherit;
    }
    .notas-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        padding: 0.75rem 1.25rem;
        border-top: 1px solid var(--border);
        background: #f8fafc;
        font-size: 0.72rem;
        color: #64748b;
    }
    .notas-legend b { color: #334155; font-weight: 700; }

    @media (max-width: 1100px) {
        .notas-kpis { grid-template-columns: repeat(2, 1fr); }
        .notas-kpi:nth-child(2) { border-right: none; }
        .notas-kpi:nth-child(1),
        .notas-kpi:nth-child(2) { border-bottom: 1px solid var(--border); }
    }
    @media (max-width: 960px) {
        .notas-split {
            grid-template-columns: 1fr;
            min-height: 0;
        }
        .notas-pane--list { max-height: 42vh; }
        .notas-pane--detail { min-height: 520px; }
    }
</style>

<div id="notas-root" x-data="notasModulo()" x-cloak>
    <div class="notas-split">
        <section class="notas-pane notas-pane--list" aria-label="Estudiantes">
            <div class="notas-pane-head">
                <h3 class="notas-pane-title">Estudiantes</h3>
                <span class="notas-count" x-text="filtrados.length + ' de ' + estudiantes.length"></span>
            </div>
            <div class="notas-pane-tools">
                <div class="notas-search">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" placeholder="Nombre, cédula o sección..."
                           aria-label="Buscar estudiante" x-model="q">
                </div>
                <div class="notas-chips" role="tablist" aria-label="Filtrar por sección">
                    <button type="button" class="notas-chip" :class="{ 'is-on': seccion === '' }"
                            @click="seccion = ''">Todas</button>
                    <template x-for="s in secciones" :key="s">
                        <button type="button" class="notas-chip" :class="{ 'is-on': seccion === s }"
                                @click="seccion = s" x-text="s"></button>
                    </template>
                </div>
            </div>
            <div class="notas-list" role="listbox" aria-label="Lista de estudiantes" tabindex="0"
                 @keydown.arrow-down.prevent="mover(1)"
                 @keydown.arrow-up.prevent="mover(-1)">
                <template x-for="e in filtrados" :key="e.id">
                    <button type="button" class="notas-student"
                            role="option"
                            :class="{ 'is-on': selectedId === e.id }"
                            :aria-selected="selectedId === e.id"
                            @click="selectedId = e.id">
                        <span class="notas-avatar" :style="'background:' + e.color" x-text="e.iniciales"></span>
                        <span class="notas-student-meta">
                            <span class="notas-student-name" x-text="e.nombre"></span>
                            <span class="notas-student-sub" x-text="e.cedula + ' · ' + e.seccion"></span>
                        </span>
                        <span class="notas-pill" :class="nivel(promedioDe(e))"
                              x-text="promedioDe(e)"></span>
                    </button>
                </template>
                <div class="notas-empty" x-show="filtrados.length === 0">
                    <strong>Sin coincidencias</strong>
                    <span>Ajuste la búsqueda o el filtro de sección.</span>
                </div>
            </div>
        </section>

        <section class="notas-pane notas-pane--detail" aria-label="Notas del estudiante">
            <template x-if="!seleccionado">
                <div class="notas-empty">
                    <div class="notas-empty-icon">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                            <line x1="8" y1="16" x2="16" y2="16"></line>
                        </svg>
                    </div>
                    <strong>Seleccione un estudiante</strong>
                    <span>Las calificaciones por materia y componente se muestran aquí al elegir un registro de la lista.</span>
                </div>
            </template>

            <template x-if="seleccionado">
                <div style="display:flex;flex-direction:column;min-height:0;flex:1;">
                    <div class="notas-detail-head">
                        <div class="notas-ring" :style="'--pct:' + promedioDe(seleccionado)">
                            <div class="notas-ring-inner" x-text="promedioDe(seleccionado)"></div>
                        </div>
                        <div class="notas-detail-id">
                            <h3 class="notas-detail-name" x-text="seleccionado.nombre"></h3>
                            <div class="notas-detail-sub">
                                <span x-text="seleccionado.cedula"></span>
                                <span x-text="'Sección ' + seleccionado.seccion"></span>
                                <span class="notas-pill" :class="nivel(promedioDe(seleccionado))"
                                      x-text="etiqueta(promedioDe(seleccionado))"></span>
                            </div>
                        </div>
                        <span class="notas-period">II período 2026</span>
                    </div>
                    <div class="notas-kpis">
                        <div class="notas-kpi">
                            <div class="notas-kpi-label">Promedio</div>
                            <div class="notas-kpi-value" x-text="promedioDe(seleccionado)"></div>
                        </div>
                        <div class="notas-kpi">
                            <div class="notas-kpi-label">Materias</div>
                            <div class="notas-kpi-value" x-text="seleccionado.materias.length"></div>
                        </div>
                        <div class="notas-kpi">
                            <div class="notas-kpi-label">Aprobadas</div>
                            <div class="notas-kpi-value is-ok" x-text="conteo(seleccionado, 70, true)"></div>
                        </div>
                        <div class="notas-kpi">
                            <div class="notas-kpi-label">En riesgo</div>
                            <div class="notas-kpi-value" :class="{ 'is-risk': conteo(seleccionado, 70, false) > 0 }"
                                 x-text="conteo(seleccionado, 70, false)"></div>
                        </div>
                    </div>
                    <div class="notas-table-wrap">
                        <table class="notas-table">
                            <thead>
                                <tr>
                                    <th>Materia</th>
                                    <th class="num">Cotidiano<br>35%</th>
                                    <th class="num">Tareas<br>15%</th>
                                    <th class="num">Proyectos<br>25%</th>
                                    <th class="num">Exámenes<br>20%</th>
                                    <th class="num">Asist.<br>5%</th>
                                    <th class="num">Final</th>
                                    <th>Nivel</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="m in seleccionado.materias" :key="m.nombre">
                                    <tr>
                                        <td>
                                            <span class="notas-materia" x-text="m.nombre"></span>
                                            <span class="notas-docente" x-text="m.docente"></span>
                                        </td>
                                        <td class="num" x-text="m.cotidiano"></td>
                                        <td class="num" x-text="m.tareas"></td>
                                        <td class="num" x-text="m.proyectos"></td>
                                        <td class="num" x-text="m.examenes"></td>
                                        <td class="num" x-text="m.asistencia"></td>
                                        <td class="num">
                                            <div class="notas-final" :class="nivel(finalDe(m))"
                                                 x-text="finalDe(m)"></div>
                                            <div class="notas-bar">
                                                <div class="notas-bar-fill"
                                                     :style="'width:' + finalDe(m) + '%;background:' + colorDe(finalDe(m))"></div>
                                            </div>
                                        </td>
                                        <td>
                                            <span class="notas-pill" :class="nivel(finalDe(m))"
                                                  x-text="etiqueta(finalDe(m))"></span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div class="notas-legend">
                        <span><b>Cotidiano</b> 35%</span>
                        <span><b>Tareas</b> 15%</span>
                        <span><b>Proyectos</b> 25%</span>
                        <span><b>Exámenes</b> 20%</span>
                        <span><b>Asistencia</b> 5%</span>
                        <span>Promedio = media aritmética de las notas finales de cada materia.</span>
                    </div>
                </div>
            </template>
        </section>
    </div>
</div>

<script>
    function notasModulo() {
        const catalogo = [
            { nombre: 'Español', docente: 'Prof. Ana Vargas' },
            { nombre: 'Matemáticas', docente: 'Prof. Pedro Miranda' },
            { nombre: 'Ciencias', docente: 'Prof. Laura Méndez' },
            { nombre: 'Estudios Sociales', docente: 'Prof. Carlos Rojas' },
            { nombre: 'Inglés', docente: 'Prof. Helen Castro' },
            { nombre: 'Educación Cívica', docente: 'Prof. Ana Vargas' },
            { nombre: 'Educación Física', docente: 'Prof. Diego Solís' }
        ];
        const base = [
            { id: 1, nombre: 'Valeria Solano Mora', cedula: '9-2345-6789', seccion: '1-A', color: '#2d5a87', perfil: 93 },
            { id: 2, nombre: 'Gabriela Brenes Gómez', cedula: '9-0028-9971', seccion: '1-A', color: '#059669', perfil: 97 },
            { id: 3, nombre: 'Melissa Sánchez Gutiérrez', cedula: '9-0034-9965', seccion: '1-A', color: '#0284c7', perfil: 82 },
            { id: 4, nombre: 'Carlos Díaz Castro', cedula: '9-0040-9959', seccion: '1-A', color: '#7c3aed', perfil: 68 },
            { id: 5, nombre: 'Fernando Chavarría Quesada', cedula: '9-0046-9953', seccion: '1-A', color: '#e11d48', perfil: 55 },
            { id: 6, nombre: 'Francisco Jiménez Pérez', cedula: '9-0052-9947', seccion: '7-A', color: '#ca8a04', perfil: 92 },
            { id: 7, nombre: 'Lucía Fernández Rojas', cedula: '3-6001-0101', seccion: '7-A', color: '#db2777', perfil: 97 },
            { id: 8, nombre: 'Mateo Vargas Solís', cedula: '3-6002-0202', seccion: '7-A', color: '#0891b2', perfil: 80 }
        ];

        function clamp(n) { return Math.min(100, Math.max(40, Math.round(n))); }
        function around(perfil, offset) { return clamp(perfil + offset); }
        function materiasDe(est) {
            const p = est.perfil;
            return catalogo.map(function (m, i) {
                const sway = ((est.id * 3 + i * 5) % 9) - 4;
                return {
                    nombre: m.nombre,
                    docente: m.docente,
                    cotidiano: around(p, sway),
                    tareas: around(p, sway - 2),
                    proyectos: around(p, sway + 1),
                    examenes: around(p, sway - 3),
                    asistencia: clamp(p >= 80 ? 96 + (i % 5) : 78 + (i % 12))
                };
            });
        }

        const estudiantes = base.map(function (e) {
            const parts = e.nombre.split(' ');
            return Object.assign({}, e, {
                iniciales: parts[0].charAt(0) + parts[1].charAt(0),
                materias: materiasDe(e)
            });
        });

        return {
            q: '',
            seccion: '',
            selectedId: estudiantes[0].id,
            estudiantes: estudiantes,
            get secciones() {
                return [...new Set(this.estudiantes.map(function (e) { return e.seccion; }))];
            },
            get filtrados() {
                const q = this.q.trim().toLowerCase();
                return this.estudiantes.filter((e) => {
                    if (this.seccion && e.seccion !== this.seccion) return false;
                    if (!q) return true;
                    return (e.nombre + ' ' + e.cedula + ' ' + e.seccion).toLowerCase().includes(q);
                });
            },
            get seleccionado() {
                const id = this.selectedId;
                return this.filtrados.find(function (e) { return e.id === id; })
                    || this.estudiantes.find(function (e) { return e.id === id; })
                    || null;
            },
            finalDe(m) {
                return +(m.cotidiano * 0.35 + m.tareas * 0.15 + m.proyectos * 0.25
                    + m.examenes * 0.20 + m.asistencia * 0.05).toFixed(1);
            },
            promedioDe(est) {
                if (!est || !est.materias.length) return 0;
                const sum = est.materias.reduce((acc, m) => acc + this.finalDe(m), 0);
                return +(sum / est.materias.length).toFixed(1);
            },
            conteo(est, umbral, aprobadas) {
                if (!est) return 0;
                return est.materias.filter((m) => {
                    const n = this.finalDe(m);
                    return aprobadas ? n >= umbral : n < umbral;
                }).length;
            },
            nivel(n) {
                if (n >= 90) return 'excelente';
                if (n >= 80) return 'bueno';
                if (n >= 70) return 'regular';
                return 'deficiente';
            },
            etiqueta(n) {
                const map = { excelente: 'Excelente', bueno: 'Bueno', regular: 'Regular', deficiente: 'Aplazado' };
                return map[this.nivel(n)];
            },
            colorDe(n) {
                const map = { excelente: '#16a34a', bueno: '#2563eb', regular: '#d97706', deficiente: '#dc2626' };
                return map[this.nivel(n)];
            },
            mover(dir) {
                const list = this.filtrados;
                if (!list.length) return;
                let i = list.findIndex((e) => e.id === this.selectedId);
                if (i < 0) i = 0;
                i = Math.max(0, Math.min(list.length - 1, i + dir));
                this.selectedId = list[i].id;
            }
        };
    }

    (function () {
        var el = document.getElementById('notas-root');
        if (el && window.Alpine && !el._x_dataStack) {
            Alpine.initTree(el);
        }
    })();
</script>
    
</div>
