<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Gestión de Oficios</title>
</head>

<body>

    <h2 layout:fragment="page-title">📋 Gestión de Oficios</h2>
    <p layout:fragment="page-subtitle">Registro y control de oficios emitidos por la institución</p>

    <th:block th:fragment="htmx-content">
    <!-- OOB: al navegar por htmx solo se reemplaza .content-area, así que el título del topbar
         (fuera de ese contenedor) se sincroniza aparte para que no se quede con el de la página anterior. -->
    <h2 id="topbar-page-title" hx-swap-oob="true">📋 Gestión de Oficios</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Registro y control de oficios emitidos por la institución</p>
    <main layout:fragment="content"
          x-data="{
              openModal(id) {
                  const el = document.getElementById(id);
                  el.style.display = 'block';
                  setTimeout(() => {
                      void el.offsetWidth;
                      el.classList.remove('dir-modal-closing');
                      el.classList.add('dir-modal-visible');
                  }, 0);
              },
              closeModal(id) {
                  const el = document.getElementById(id);
                  el.classList.remove('dir-modal-visible');
                  el.classList.add('dir-modal-closing');
                  setTimeout(() => {
                      el.style.display = 'none';
                      el.classList.remove('dir-modal-closing');
                  }, 180);
              }
          }"
          @open-modal.window="openModal('oficios-modal-container')"
          @close-modal.window="closeModal('oficios-modal-container')"
          @keydown.escape.window="closeModal('oficios-modal-container')">

        <style>
            .oficios-container {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 70vh;
            }

            .oficios-toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #ffffff;
                padding: 1.5rem;
                border-radius: 12px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow-sm);
                gap: 1rem;
                flex-wrap: wrap;
            }

            .search-bar {
                flex: 1;
                min-width: 300px;
                position: relative;
            }

            .search-bar input {
                width: 100%;
                padding: 10px 16px 10px 42px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: var(--input-bg);
                font-size: 0.95rem;
                transition: all 0.2s;
            }

            .search-bar input:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1);
            }

            .search-bar svg {
                position: absolute;
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-light);
            }

            /* ── Table ── */
            .oficios-table-container {
                background: #ffffff;
                border-radius: 12px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }

            .oficios-table {
                width: 100%;
                table-layout: fixed;
                border-collapse: collapse;
                text-align: left;
                min-width: 900px;
            }

            .oficios-table th,
            .oficios-table td {
                padding: 0.85rem 1rem;
                font-size: 0.88rem;
                border-bottom: 1px solid var(--border);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .oficios-table th {
                background: var(--input-bg);
                font-size: 0.8rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                border-bottom: 2px solid var(--border);
            }

            .oficios-table td {
                color: var(--text-primary);
            }

            .oficios-table tr:last-child td {
                border-bottom: none;
            }

            .oficios-table tr:hover td {
                background: rgba(45, 90, 135, 0.02);
            }

            .oficios-table .col-oficio { width: 11%; }
            .oficios-table .col-redactor { width: 16%; }
            .oficios-table .col-asunto { width: 26%; }
            .oficios-table .col-destinatario { width: 22%; }
            .oficios-table .col-circular { width: 10%; }
            .oficios-table .col-estado { width: 8%; }
            .oficios-table .col-doc { width: 14%; }

            .oficio-number {
                font-weight: 700;
                color: #0f172a;
                font-family: 'SF Mono', 'Fira Code', monospace;
            }

            .badge-circular {
                background: var(--input-bg);
                color: #475569;
                padding: 4px 10px;
                border-radius: 4px;
                font-size: 0.8rem;
                font-weight: 600;
                font-family: monospace;
            }

            .badge-estado {
                background: rgba(34, 197, 94, 0.1);
                color: #15803d;
                padding: 4px 10px;
                border-radius: 4px;
                font-size: 0.8rem;
                font-weight: 600;
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }

            .badge-estado.pendiente {
                background: rgba(234, 179, 8, 0.1);
                color: #a16207;
            }

            .btn-view {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 6px 12px;
                border-radius: 6px;
                background: rgba(45, 90, 135, 0.1);
                color: var(--primary);
                font-weight: 600;
                font-size: 0.8rem;
                text-decoration: none;
                transition: all 0.2s;
                border: none;
                cursor: pointer;
            }

            .btn-view:hover {
                background: var(--primary);
                color: #ffffff;
            }
        </style>

        <div class="oficios-container">

            <!-- Toolbar & Search -->
            <div class="oficios-toolbar">
                <div class="search-bar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" name="q" placeholder="Buscar por N° de oficio, asunto o destinatario..."
                           th:value="${q}"
                           hx-get="/oficios/lista"
                           hx-trigger="keyup changed delay:400ms, search"
                           hx-target="#oficios-lista-content" hx-swap="outerHTML">
                </div>

                <button class="btn btn-primary" style="display: flex; align-items: center; gap: 8px; border-radius: 8px;"
                        hx-get="/oficios/form"
                        hx-target="#oficios-modal-container" hx-swap="innerHTML"
                        hx-on:htmx:after-request="window.dispatchEvent(new CustomEvent('open-modal'))">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Nuevo Oficio
                </button>
            </div>

            <div th:replace="~{oficios/lista :: content}"></div>

        </div>

        <div id="oficios-modal-container" style="display:none;"></div>

    </main>
    </th:block>

</body>

</html>
