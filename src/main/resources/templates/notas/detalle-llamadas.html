<div th:fragment="detalle" id="notas-llamadas-modal" xmlns:th="http://www.thymeleaf.org">
    <style>
        #notas-llamadas-modal .modal-dialog {
            max-width: 820px;
            display: flex;
            flex-direction: column;
            max-height: min(860px, calc(100vh - 2rem));
        }
        #notas-llamadas-modal .modal-header { align-items: flex-start; gap: 1rem; }
        #notas-llamadas-modal .notas-lla-heading { min-width: 0; }
        #notas-llamadas-modal .modal-title { margin: 0; color: #0f172a; letter-spacing: -0.02em; }
        #notas-llamadas-modal .notas-lla-sub { margin: 0.2rem 0 0; font-size: 0.8rem; color: #64748b; }
        #notas-llamadas-modal .notas-lla-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 0.85rem 1.5rem;
            border-bottom: 1px solid var(--border, #e2e8f0);
            background: #f8fafc;
        }
        #notas-llamadas-modal .notas-lla-student { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
        #notas-llamadas-modal .notas-lla-avatar {
            width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
            color: #fff; font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
        }
        #notas-llamadas-modal .notas-lla-name { font-size: 0.9rem; font-weight: 700; color: #0f172a; }
        #notas-llamadas-modal .notas-lla-meta { font-size: 0.75rem; color: #64748b; margin-top: 1px; }
        #notas-llamadas-modal .notas-lla-filtro { display: flex; flex-direction: row; align-items: flex-end; gap: 0.5rem; }
        #notas-llamadas-modal .notas-lla-filtro-label {
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #64748b;
            white-space: nowrap; padding-bottom: 0.4rem;
        }
        #notas-llamadas-modal .notas-lla-periodos-col {
            display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem;
        }
        #notas-llamadas-modal .notas-lla-filtro .btn-primary.btn-sm {
            padding: 6px 12px; font-size: 0.8rem; border-radius: 6px;
        }
        #notas-llamadas-modal .notas-lla-periodos {
            display: inline-flex; padding: 3px; border: 1px solid var(--border, #e2e8f0);
            border-radius: 10px; background: #fff; gap: 2px;
        }
        #notas-llamadas-modal .notas-lla-periodo {
            min-height: 28px; padding: 0 0.7rem; border: none; border-radius: 7px; background: transparent;
            color: #64748b; font-size: 0.75rem; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap;
        }
        #notas-llamadas-modal .notas-lla-periodo.is-on { background: var(--primary, #2d5a87); color: #fff; }
        #notas-llamadas-modal .modal-body {
            overflow: hidden; padding: 1rem 1.5rem 1.25rem; background: #f8fafc;
            display: flex; flex-direction: column; min-height: 0;
        }
        #notas-llamadas-modal .modal-dialog > .modal-footer {
            margin: 0; padding: 0.85rem 1.5rem; border-top: 1px solid var(--border, #e2e8f0); background: #fff;
        }
        #notas-llamadas-modal .notas-lla-kpis {
            display: grid; grid-template-columns: repeat(4, 1fr); background: #fff;
            border: 1px solid var(--border, #e2e8f0); border-radius: 12px; overflow: hidden; margin-bottom: 0.85rem;
        }
        #notas-llamadas-modal .notas-lla-kpi { padding: 0.7rem 0.85rem; border-right: 1px solid var(--border, #e2e8f0); }
        #notas-llamadas-modal .notas-lla-kpi:last-child { border-right: none; }
        #notas-llamadas-modal .notas-lla-kpi span {
            display: block; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.03em;
            text-transform: uppercase; color: #64748b;
        }
        #notas-llamadas-modal .notas-lla-kpi strong {
            display: block; margin-top: 0.15rem; font-size: 1.15rem; font-weight: 750;
            color: #0f172a; font-variant-numeric: tabular-nums;
        }
        #notas-llamadas-modal .notas-lla-tabla-wrap {
            background: #fff; border: 1px solid var(--border, #e2e8f0); border-radius: 12px;
            max-height: min(360px, 46vh); overflow: auto;
        }
        #notas-llamadas-modal .notas-lla-tabla { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 720px; }
        #notas-llamadas-modal .notas-lla-tabla th {
            position: sticky; top: 0; z-index: 1;
            padding: 0.75rem 0.85rem; background: #f8fafc;
            box-shadow: inset 0 -1px 0 var(--border, #e2e8f0);
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
            color: #64748b; text-align: left; white-space: nowrap;
        }
        #notas-llamadas-modal .notas-lla-tabla td {
            padding: 0.7rem 0.85rem; font-size: 0.84rem; color: #334155;
            border-bottom: 1px solid #f1f5f9; vertical-align: top;
        }
        #notas-llamadas-modal .notas-lla-tabla tr:last-child td { border-bottom: none; }
        #notas-llamadas-modal .notas-lla-tabla tr:hover td { background: #f8fafc; }
        #notas-llamadas-modal .notas-lla-fecha { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 650; color: #0f172a; }
        #notas-llamadas-modal .notas-lla-motivo { font-weight: 650; color: #0f172a; }
        #notas-llamadas-modal .notas-lla-docente { font-weight: 600; color: #334155; white-space: nowrap; }
        #notas-llamadas-modal .notas-lla-desc { color: #64748b; font-size: 0.8rem; line-height: 1.45; }
        #notas-llamadas-modal .notas-lla-pill {
            display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 700;
            padding: 3px 8px; border-radius: 8px; white-space: nowrap;
        }
        #notas-llamadas-modal .notas-lla-pill.pendiente { background: #fef3c7; color: #92400e; }
        #notas-llamadas-modal .notas-lla-pill.enproceso { background: #dbeafe; color: #1e40af; }
        #notas-llamadas-modal .notas-lla-pill.resuelto { background: #dcfce7; color: #166534; }
        #notas-llamadas-modal .notas-lla-pill.apelado { background: #f3e8ff; color: #6b21a8; }
        #notas-llamadas-modal .notas-lla-estado { color: #64748b; font-size: 0.84rem; }
        @media (max-width: 720px) {
            #notas-llamadas-modal .notas-lla-kpis { grid-template-columns: repeat(2, 1fr); }
            #notas-llamadas-modal .notas-lla-kpi:nth-child(2) { border-right: none; }
            #notas-llamadas-modal .notas-lla-kpi:nth-child(1),
            #notas-llamadas-modal .notas-lla-kpi:nth-child(2) { border-bottom: 1px solid var(--border, #e2e8f0); }
            #notas-llamadas-modal .notas-lla-filtro { align-items: flex-end; }
        }
    </style>

    <template x-if="llamadaPeriodo && seleccionado">
        <div class="modal-backdrop" role="presentation" @click.self="cerrarLlamadas()"
             @keydown.escape.window="cerrarLlamadas()">
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="notas-llamadas-titulo">
                <div class="modal-header">
                    <div class="notas-lla-heading">
                        <h3 class="modal-title" id="notas-llamadas-titulo">Llamadas de atención</h3>
                        <p class="notas-lla-sub"
                           x-text="'Detalle de ' + llamadaPeriodo.etiqueta + '.'"></p>
                    </div>
                    <button type="button" class="close-btn" aria-label="Cerrar" @click="cerrarLlamadas()">&times;</button>
                </div>
                <div class="notas-lla-toolbar">
                    <div class="notas-lla-student">
                        <span class="notas-lla-avatar" :style="'background:' + seleccionado.color"
                              x-text="seleccionado.iniciales"></span>
                        <div>
                            <div class="notas-lla-name" x-text="seleccionado.nombre"></div>
                            <div class="notas-lla-meta"
                                 x-text="seleccionado.cedula + ' · Sección ' + grupoDe(seleccionado)"></div>
                        </div>
                    </div>
                    <div class="notas-lla-filtro">
                        <span class="notas-lla-filtro-label">Período</span>
                        <div class="notas-lla-periodos-col">
                            <button type="button" class="btn-primary btn-sm">Enviar</button>
                            <div class="notas-lla-periodos" role="group" aria-label="Filtrar llamadas por período">
                                <template x-for="p in periodosDelAnio" :key="'lla-p-' + p.id">
                                    <button type="button" class="notas-lla-periodo"
                                            :class="{ 'is-on': esLlamadaAbierta(p) }"
                                            :aria-pressed="esLlamadaAbierta(p)"
                                            @click="abrirLlamadas(p)"
                                            x-text="p.etiqueta"></button>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-body">
                    <div id="notas-llamadas-cuerpo">
                        <p class="notas-lla-estado">Cargando…</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" @click="cerrarLlamadas()">Cerrar</button>
                </div>
            </div>
        </div>
    </template>
</div>

<div th:fragment="registros">
    <div class="notas-lla-kpis" th:if="${error == null and llamadas != null}">
        <div class="notas-lla-kpi">
            <span>Pendientes</span>
            <strong th:text="${llamadas.pendientes}">0</strong>
        </div>
        <div class="notas-lla-kpi">
            <span>En proceso</span>
            <strong th:text="${llamadas.enProceso}">0</strong>
        </div>
        <div class="notas-lla-kpi">
            <span>Resueltas</span>
            <strong th:text="${llamadas.resueltas}">0</strong>
        </div>
        <div class="notas-lla-kpi">
            <span>Apeladas</span>
            <strong th:text="${llamadas.apeladas}">0</strong>
        </div>
    </div>
    <div class="notas-lla-tabla-wrap">
        <table class="notas-lla-tabla">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Motivo</th>
                    <th>Descripción</th>
                    <th>Docente</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${error != null}">
                    <td class="notas-lla-estado" colspan="5" th:text="${error}">No se pudo cargar.</td>
                </tr>
                <tr th:if="${error == null and (llamadas == null or llamadas.registros.isEmpty)}">
                    <td class="notas-lla-estado" colspan="5">Sin llamadas de atención en este período.</td>
                </tr>
                <th:block th:if="${llamadas != null}">
                    <tr th:each="r : ${llamadas.registros}">
                        <td class="notas-lla-fecha" th:text="${r.fecha}">01/01/2026</td>
                        <td class="notas-lla-motivo" th:text="${r.motivo}">Motivo</td>
                        <td class="notas-lla-desc" th:text="${#strings.isEmpty(r.descripcion) ? '—' : r.descripcion}">—</td>
                        <td class="notas-lla-docente" th:text="${#strings.isEmpty(r.docente) ? '—' : r.docente}">Docente</td>
                        <td><span class="notas-lla-pill" th:classappend="${r.estadoClase}" th:text="${r.estado}">Pendiente</span></td>
                    </tr>
                </th:block>
            </tbody>
        </table>
    </div>
</div>
