<div th:fragment="desglose" id="notas-desglose" xmlns:th="http://www.thymeleaf.org">
    <style>
        #notas-desglose .modal-dialog {
            max-width: 980px;
            display: flex;
            flex-direction: column;
            max-height: min(860px, calc(100vh - 2rem));
        }
        #notas-desglose .modal-header {
            align-items: flex-start;
            gap: 1rem;
        }
        #notas-desglose .notas-desglose-heading { min-width: 0; }
        #notas-desglose .modal-title {
            margin: 0;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
        #notas-desglose .notas-desglose-sub {
            margin: 0.2rem 0 0;
            font-size: 0.8rem;
            color: #64748b;
        }
        #notas-desglose .notas-desglose-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 0.85rem 1.5rem;
            border-bottom: 1px solid var(--border, #e2e8f0);
            background: #f8fafc;
        }
        #notas-desglose .notas-desglose-student {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }
        #notas-desglose .notas-desglose-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        #notas-desglose .notas-desglose-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #0f172a;
        }
        #notas-desglose .notas-desglose-meta {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 1px;
        }
        #notas-desglose .notas-desglose-filtro {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 0.5rem;
        }
        #notas-desglose .notas-desglose-filtro-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #64748b;
            white-space: nowrap;
            padding-bottom: 0.4rem;
        }
        #notas-desglose .notas-desglose-periodos-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.35rem;
        }
        #notas-desglose .notas-desglose-filtro .btn-primary.btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }
        #notas-desglose .notas-desglose-periodos {
            display: inline-flex;
            padding: 3px;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 10px;
            background: #fff;
            gap: 2px;
        }
        #notas-desglose .notas-desglose-periodo {
            min-height: 28px;
            padding: 0 0.7rem;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
        }
        #notas-desglose .notas-desglose-periodo.is-on {
            background: var(--primary, #2d5a87);
            color: #fff;
        }
        #notas-desglose .modal-body {
            overflow: auto;
            padding: 1rem 1.5rem 1.25rem;
            background: #f8fafc;
        }
        #notas-desglose .notas-desglose-kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #fff;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 0.85rem;
        }
        #notas-desglose .notas-desglose-kpi {
            padding: 0.75rem 1rem;
            border-right: 1px solid var(--border, #e2e8f0);
        }
        #notas-desglose .notas-desglose-kpi:last-child { border-right: none; }
        #notas-desglose .notas-desglose-kpi span {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #64748b;
        }
        #notas-desglose .notas-desglose-kpi strong {
            display: block;
            margin-top: 0.15rem;
            font-size: 1.15rem;
            font-weight: 750;
            color: #0f172a;
            font-variant-numeric: tabular-nums;
        }
        #notas-desglose .notas-desglose-kpi strong.is-ok { color: #15803d; }
        #notas-desglose .notas-desglose-kpi strong.is-risk { color: #dc2626; }
        #notas-desglose .notas-desglose-materia-nombre {
            font-size: 0.92rem;
            font-weight: 700;
            color: #0f172a;
        }
        #notas-desglose .notas-desglose-docente {
            display: block;
            margin-top: 1px;
            font-size: 0.72rem;
            font-weight: 500;
            color: #94a3b8;
        }
        #notas-desglose .notas-desglose-final {
            font-size: 1.05rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #0f172a;
        }
        #notas-desglose .excelente { color: #166534; }
        #notas-desglose .bueno { color: #1e40af; }
        #notas-desglose .regular { color: #92400e; }
        #notas-desglose .deficiente { color: #991b1b; }
        #notas-desglose .notas-desglose-tabla-wrap {
            background: #fff;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 12px;
            overflow: auto;
        }
        #notas-desglose .notas-desglose-tabla {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
        }
        #notas-desglose .notas-desglose-tabla th {
            padding: 0.85rem 0.75rem;
            background: #f8fafc;
            border-bottom: 1px solid var(--border, #e2e8f0);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #64748b;
            text-align: center;
            white-space: nowrap;
        }
        #notas-desglose .notas-desglose-tabla th:first-child,
        #notas-desglose .notas-desglose-tabla td:first-child {
            text-align: left;
            padding-left: 1rem;
        }
        #notas-desglose .notas-desglose-tabla th.final {
            background: #f1f5f9;
        }
        #notas-desglose .notas-desglose-tabla td {
            padding: 0.8rem 0.75rem;
            font-size: 0.84rem;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
            text-align: center;
            vertical-align: middle;
        }
        #notas-desglose .notas-desglose-tabla td.final {
            background: rgba(45, 90, 135, 0.05);
            font-variant-numeric: tabular-nums;
        }
        #notas-desglose .notas-desglose-tabla tr:last-child td { border-bottom: none; }
        #notas-desglose .notas-desglose-tabla tr:hover td { background: #f8fafc; }
        #notas-desglose .notas-desglose-tabla tr:hover td.final { background: rgba(45, 90, 135, 0.08); }
        #notas-desglose .notas-desglose-vacio { color: #94a3b8; font-weight: 600; }
        #notas-desglose .notas-desglose-estado {
            text-align: left;
            color: #64748b;
            font-size: 0.82rem;
        }
        #notas-desglose .notas-desglose-leyenda {
            margin: 0.15rem 0 0;
            font-size: 0.75rem;
            line-height: 1.45;
            color: #64748b;
        }
        #notas-desglose .modal-dialog > .modal-footer {
            margin: 0;
            padding: 0.85rem 1.5rem;
            border-top: 1px solid var(--border, #e2e8f0);
            background: #fff;
        }
        @media (max-width: 720px) {
            #notas-desglose .notas-desglose-kpis { grid-template-columns: repeat(2, 1fr); }
            #notas-desglose .notas-desglose-kpi:nth-child(2) { border-right: none; }
            #notas-desglose .notas-desglose-kpi:nth-child(1),
            #notas-desglose .notas-desglose-kpi:nth-child(2) { border-bottom: 1px solid var(--border, #e2e8f0); }
            #notas-desglose .notas-desglose-filtro { align-items: flex-end; }
        }
    </style>

    <template x-if="desglosePeriodo && seleccionado">
        <div class="modal-backdrop" role="presentation" @click.self="cerrarDesglose()"
             @keydown.escape.window="cerrarDesglose()">
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="notas-desglose-titulo">
                <div class="modal-header">
                    <div class="notas-desglose-heading">
                        <h3 class="modal-title" id="notas-desglose-titulo">Desglose de notas</h3>
                        <p class="notas-desglose-sub"
                           x-text="'Todas las materias de ' + desglosePeriodo.etiqueta + ', con cada componente.'"></p>
                    </div>
                    <button type="button" class="close-btn" aria-label="Cerrar" @click="cerrarDesglose()">&times;</button>
                </div>

                <div class="notas-desglose-toolbar">
                    <div class="notas-desglose-student">
                        <span class="notas-desglose-avatar" :style="'background:' + seleccionado.color"
                              x-text="seleccionado.iniciales"></span>
                        <div>
                            <div class="notas-desglose-name" x-text="seleccionado.nombre"></div>
                            <div class="notas-desglose-meta"
                                 x-text="seleccionado.cedula + ' · Sección ' + grupoDe(seleccionado)"></div>
                        </div>
                    </div>
                    <div class="notas-desglose-filtro">
                        <span class="notas-desglose-filtro-label">Período</span>
                        <div class="notas-desglose-periodos-col">
                            <button type="button" class="btn-primary btn-sm">Enviar</button>
                            <div class="notas-desglose-periodos" role="group" aria-label="Filtrar por período">
                                <template x-for="p in periodosDelAnio" :key="'dg-p-' + p.id">
                                    <button type="button" class="notas-desglose-periodo"
                                            :class="{ 'is-on': esPeriodoAbierto(p) }"
                                            :aria-pressed="esPeriodoAbierto(p)"
                                            @click="abrirDesglose(p)"
                                            x-text="p.etiqueta"></button>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-body">
                    <div class="notas-desglose-kpis">
                        <div class="notas-desglose-kpi">
                            <span>Promedio</span>
                            <strong x-text="fmtPeriodo(promedioPeriodo(seleccionado, desglosePeriodo))"></strong>
                        </div>
                        <div class="notas-desglose-kpi">
                            <span>Materias</span>
                            <strong x-text="materiasDe(seleccionado).length"></strong>
                        </div>
                        <div class="notas-desglose-kpi">
                            <span>Aprobadas</span>
                            <strong class="is-ok" x-text="conteoPeriodo(seleccionado, desglosePeriodo, 70, true)"></strong>
                        </div>
                        <div class="notas-desglose-kpi">
                            <span>En riesgo</span>
                            <strong :class="{ 'is-risk': conteoPeriodo(seleccionado, desglosePeriodo, 70, false) > 0 }"
                                    x-text="conteoPeriodo(seleccionado, desglosePeriodo, 70, false)"></strong>
                        </div>
                    </div>

                    <div class="notas-desglose-tabla-wrap">
                        <table class="notas-desglose-tabla">
                            <thead>
                                <tr>
                                    <th>Materias</th>
                                    <th>Cotidiano</th>
                                    <th>Tareas</th>
                                    <th>Proyecto</th>
                                    <th>Pruebas</th>
                                    <th>Asistencia</th>
                                    <th class="final">Promedio final</th>
                                </tr>
                            </thead>
                            <tbody id="notas-desglose-cuerpo">
                                <tr class="notas-desglose-fila">
                                    <td class="notas-desglose-estado" colspan="7">Cargando…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <p class="notas-desglose-leyenda">
                        El período elegido filtra el desglose. La nota de la materia es el promedio ponderado de cotidiano, tareas, proyecto, pruebas y asistencia.
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" @click="cerrarDesglose()">Cerrar</button>
                </div>
            </div>
        </div>
    </template>
</div>

<th:block th:fragment="filas">
    <tr th:if="${error != null}" class="notas-desglose-fila">
        <td class="notas-desglose-estado" colspan="7" th:text="${error}">No se pudo cargar el desglose.</td>
    </tr>
    <tr th:if="${error == null and (filas == null or filas.isEmpty)}" class="notas-desglose-fila">
        <td class="notas-desglose-estado" colspan="7">No hay materias en este período.</td>
    </tr>
    <th:block th:if="${error == null}">
        <tr th:each="f : ${filas}" class="notas-desglose-fila">
            <td>
                <span class="notas-desglose-materia-nombre" th:text="${f.nombre}">Materia</span>
                <span class="notas-desglose-docente" th:if="${!#strings.isEmpty(f.docente)}" th:text="${f.docente}">Docente</span>
            </td>
            <td>
                <span th:if="${f.cotidiano == null}" class="notas-desglose-vacio">—</span>
                <span th:if="${f.cotidiano != null}" th:text="${f.cotidiano}">0</span>
            </td>
            <td>
                <span th:if="${f.tareas == null}" class="notas-desglose-vacio">—</span>
                <span th:if="${f.tareas != null}" th:text="${f.tareas}">0</span>
            </td>
            <td>
                <span th:if="${f.proyecto == null}" class="notas-desglose-vacio">—</span>
                <span th:if="${f.proyecto != null}" th:text="${f.proyecto}">0</span>
            </td>
            <td>
                <span th:if="${f.pruebas == null}" class="notas-desglose-vacio">—</span>
                <span th:if="${f.pruebas != null}" th:text="${f.pruebas}">0</span>
            </td>
            <td>
                <span th:if="${f.asistencia == null}" class="notas-desglose-vacio">—</span>
                <span th:if="${f.asistencia != null}" th:text="${f.asistencia}">0</span>
            </td>
            <td class="final">
                <span th:if="${f.promedio == null}" class="notas-desglose-vacio">—</span>
                <span th:if="${f.promedio != null}" class="notas-desglose-final" th:classappend="${f.nivel}"
                      th:text="${f.promedioTexto}">0.0</span>
            </td>
        </tr>
    </th:block>
</th:block>
