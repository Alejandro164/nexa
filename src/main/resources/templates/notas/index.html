<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Notas</title>
</head>

<body>

    <h2 layout:fragment="page-title">Notas</h2>
    <p layout:fragment="page-subtitle">Calificaciones por estudiante, materia y año lectivo</p>

    <th:block th:fragment="htmx-content">
    <h2 id="topbar-page-title" hx-swap-oob="true">Notas</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Calificaciones por estudiante, materia y año lectivo</p>
    <main layout:fragment="content">
        <style>
            [x-cloak] { display: none !important; }

            .notas-filtros {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-end;
                gap: 0.75rem 1rem;
                background: #fff;
                border: 1px solid var(--border);
                border-radius: 12px;
                box-shadow: var(--shadow-sm);
                padding: 0.85rem 1.15rem;
                margin-bottom: 1rem;
            }
            .notas-field {
                display: flex;
                flex-direction: column;
                gap: 0.3rem;
                min-width: 10.5rem;
                flex: 1 1 10.5rem;
                max-width: 16rem;
            }
            .notas-field span {
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: #64748b;
            }
            .notas-field select {
                width: 100%;
                min-height: 38px;
                padding: 0.45rem 0.7rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #f8fafc;
                font-size: 0.85rem;
                font-family: inherit;
                color: #0f172a;
                outline: none;
                box-sizing: border-box;
            }
            .notas-field select:focus {
                background: #fff;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.12);
            }
            .notas-period-fijo {
                min-height: 38px;
                display: flex;
                align-items: center;
                padding: 0.45rem 0.7rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #f8fafc;
                font-size: 0.85rem;
                font-weight: 650;
                color: #0f172a;
                white-space: nowrap;
            }
            .notas-clear {
                min-height: 38px;
                padding: 0 0.9rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #fff;
                color: #64748b;
                font-size: 0.78rem;
                font-weight: 700;
                font-family: inherit;
                cursor: pointer;
            }
            .notas-clear:hover { border-color: #cbd5e1; color: #334155; }
            .notas-filtros .notas-count { margin-left: auto; align-self: center; }
            .notas-split {
                display: grid;
                grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
                gap: 1rem;
                align-items: stretch;
                min-height: min(680px, calc(100vh - 290px));
            }
            .notas-pane {
                background: #fff;
                border: 1px solid var(--border);
                border-radius: 12px;
                box-shadow: var(--shadow-sm);
                display: flex;
                flex-direction: column;
                min-height: 0;
                overflow: hidden;
            }
            .notas-pane-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.75rem;
                padding: 1rem 1.15rem 0.85rem;
                border-bottom: 1px solid var(--border);
                background: #f8fafc;
            }
            .notas-pane-title {
                margin: 0;
                font-size: 0.95rem;
                font-weight: 700;
                color: #0f172a;
                letter-spacing: -0.01em;
            }
            .notas-count {
                font-size: 0.72rem;
                font-weight: 700;
                color: var(--primary);
                background: rgba(45, 90, 135, 0.08);
                padding: 3px 10px;
                border-radius: 999px;
                white-space: nowrap;
            }
            .notas-pane-tools {
                padding: 0.85rem 1.15rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                gap: 0.7rem;
                background: #fff;
            }
            .notas-search {
                position: relative;
                display: flex;
                align-items: center;
            }
            .notas-search svg {
                position: absolute;
                left: 11px;
                color: #94a3b8;
                pointer-events: none;
            }
            .notas-search input {
                width: 100%;
                min-height: 38px;
                padding: 0.5rem 0.85rem 0.5rem 2.3rem;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #f8fafc;
                font-size: 0.85rem;
                font-family: inherit;
                color: #0f172a;
                outline: none;
                box-sizing: border-box;
            }
            .notas-search input:focus {
                background: #fff;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.12);
            }
            .notas-list {
                overflow-y: auto;
                flex: 1;
                padding: 0.4rem;
            }
            .notas-list:focus { outline: none; }
            .notas-student {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0.7rem 0.75rem;
                border: 1px solid transparent;
                border-radius: 10px;
                background: transparent;
                cursor: pointer;
                text-align: left;
                font-family: inherit;
                transition: background 0.15s, border-color 0.15s;
            }
            .notas-student:hover { background: #f8fafc; }
            .notas-student.is-on {
                background: rgba(45, 90, 135, 0.07);
                border-color: rgba(45, 90, 135, 0.18);
                box-shadow: inset 3px 0 0 var(--primary);
            }
            .notas-avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                display: grid;
                place-items: center;
                color: #fff;
                font-size: 0.72rem;
                font-weight: 700;
                flex-shrink: 0;
            }
            .notas-student-meta { min-width: 0; flex: 1; }
            .notas-student-name {
                font-size: 0.84rem;
                font-weight: 650;
                color: #0f172a;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .notas-student-sub {
                font-size: 0.72rem;
                color: #64748b;
                margin-top: 1px;
            }
            .notas-pill {
                font-size: 0.78rem;
                font-weight: 800;
                padding: 3px 8px;
                border-radius: 8px;
                flex-shrink: 0;
                font-variant-numeric: tabular-nums;
            }
            .notas-pill.excelente { background: #dcfce7; color: #166534; }
            .notas-pill.bueno { background: #dbeafe; color: #1e40af; }
            .notas-pill.regular { background: #fef3c7; color: #92400e; }
            .notas-pill.deficiente { background: #fee2e2; color: #991b1b; }

            .notas-empty {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 3rem 2rem;
                color: #94a3b8;
            }
            .notas-empty-icon {
                width: 56px;
                height: 56px;
                border-radius: 16px;
                background: #f1f5f9;
                display: grid;
                place-items: center;
                margin-bottom: 1rem;
                color: #94a3b8;
            }
            .notas-empty strong {
                display: block;
                color: #64748b;
                font-size: 0.95rem;
                margin-bottom: 0.3rem;
            }
            .notas-empty span { font-size: 0.82rem; max-width: 28rem; line-height: 1.5; }

            .notas-detail-head {
                display: flex;
                align-items: center;
                gap: 1rem;
                padding: 1.1rem 1.25rem;
                border-bottom: 1px solid var(--border);
                background: linear-gradient(180deg, #f8fafc 0%, #fff 100%);
            }
            .notas-ring {
                --pct: 0;
                width: 72px;
                height: 72px;
                border-radius: 50%;
                background: conic-gradient(#2d5a87 calc(var(--pct) * 1%), #e8eef4 0);
                display: grid;
                place-items: center;
                flex-shrink: 0;
            }
            .notas-ring-inner {
                width: 54px;
                height: 54px;
                border-radius: 50%;
                background: #fff;
                display: grid;
                place-items: center;
                font-weight: 800;
                font-size: 1.05rem;
                color: #0f172a;
                font-variant-numeric: tabular-nums;
            }
            .notas-detail-id { min-width: 0; flex: 1; }
            .notas-detail-name {
                margin: 0;
                font-size: 1.15rem;
                font-weight: 750;
                color: #0f172a;
                letter-spacing: -0.02em;
            }
            .notas-detail-sub {
                margin-top: 0.2rem;
                font-size: 0.8rem;
                color: #64748b;
                display: flex;
                flex-wrap: wrap;
                gap: 0.45rem 0.85rem;
            }
            .notas-period {
                font-size: 0.72rem;
                font-weight: 700;
                color: var(--primary);
                background: rgba(45, 90, 135, 0.08);
                padding: 6px 10px;
                border-radius: 8px;
                white-space: nowrap;
            }
            .notas-detail-actions {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 0.45rem;
                margin-left: auto;
                align-self: flex-start;
            }
            .notas-enviar {
                min-height: 34px;
                padding: 0 0.95rem;
                border: none;
                border-radius: 8px;
                background: var(--primary);
                color: #fff;
                font-size: 0.78rem;
                font-weight: 700;
                font-family: inherit;
                cursor: pointer;
            }
            .notas-kpis {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 0;
                border-bottom: 1px solid var(--border);
            }
            .notas-kpi {
                padding: 0.85rem 1.1rem;
                border-right: 1px solid var(--border);
            }
            .notas-kpi:last-child { border-right: none; }
            .notas-kpi-label {
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: #64748b;
            }
            .notas-kpi-value {
                margin-top: 0.2rem;
                font-size: 1.2rem;
                font-weight: 750;
                color: #0f172a;
                font-variant-numeric: tabular-nums;
            }
            .notas-kpi-value.is-risk { color: #dc2626; }
            .notas-kpi-value.is-ok { color: #15803d; }

            .notas-table-wrap {
                overflow: auto;
                flex: 1;
            }
            .notas-table {
                width: 100%;
                border-collapse: collapse;
                min-width: 720px;
            }
            .notas-table th {
                text-align: left;
                padding: 0.6rem 0.85rem;
                font-size: 0.68rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: #64748b;
                background: #f8fafc;
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                z-index: 1;
            }
            .notas-table th.num, .notas-table td.num { text-align: right; white-space: nowrap; }
            .notas-table th.num { min-width: 5.75rem; }
            .notas-th-periodo { vertical-align: middle; }
            .notas-periodo-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 26px;
                padding: 0.18rem 0.55rem;
                border: 1px solid #cbd5e1;
                border-radius: 7px;
                background: #fff;
                color: var(--primary);
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.03em;
                text-transform: uppercase;
                font-family: inherit;
                line-height: 1.2;
                cursor: pointer;
                white-space: nowrap;
                box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
                transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
            }
            .notas-periodo-btn:hover {
                background: rgba(45, 90, 135, 0.08);
                border-color: var(--primary);
            }
            .notas-periodo-btn:focus-visible {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.18);
            }
            .notas-periodo-btn:active {
                background: rgba(45, 90, 135, 0.14);
            }
            .notas-periodo-btn.is-on {
                background: var(--primary);
                border-color: var(--primary);
                color: #fff;
            }
            .notas-celda {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 2px;
            }
            .notas-col-anio { background: rgba(45, 90, 135, 0.05); }
            .notas-table tr:hover td.notas-col-anio { background: rgba(45, 90, 135, 0.08); }
            .notas-table td {
                padding: 0.8rem 0.85rem;
                font-size: 0.84rem;
                color: #334155;
                border-bottom: 1px solid #f1f5f9;
                vertical-align: middle;
            }
            .notas-table tr:hover td { background: #f8fafc; }
            .notas-conducta td { border-top: 1px solid var(--border); background: #f8fafc; }
            .notas-table tr.notas-conducta:hover td { background: #f1f5f9; }
            .notas-materia {
                font-weight: 650;
                color: #0f172a;
            }
            .notas-docente {
                display: block;
                font-size: 0.72rem;
                font-weight: 500;
                color: #94a3b8;
                margin-top: 2px;
            }
            .notas-final {
                font-weight: 800;
                font-variant-numeric: tabular-nums;
            }
            .notas-final.excelente { color: #166534; }
            .notas-final.bueno { color: #1e40af; }
            .notas-final.regular { color: #92400e; }
            .notas-final.deficiente { color: #991b1b; }
            .notas-bar {
                height: 4px;
                border-radius: 99px;
                background: #e8eef4;
                margin-top: 6px;
                overflow: hidden;
                width: 72px;
                margin-left: auto;
            }
            .notas-bar-fill {
                height: 100%;
                border-radius: inherit;
            }
            .notas-ausencias {
                flex-shrink: 0;
                border-top: 1px solid var(--border);
                padding: 1rem 1.15rem 1.15rem;
                background: #fff;
            }
            .notas-ausencias-table {
                width: 100%;
                border-collapse: collapse;
                border: 1px solid var(--border);
            }
            .notas-ausencias-table th,
            .notas-ausencias-table td {
                border: 1px solid #e2e8f0;
                padding: 0.55rem 0.85rem;
                font-size: 0.82rem;
                color: #334155;
            }
            .notas-ausencias-table th {
                background: #f8fafc;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.03em;
                text-transform: uppercase;
                color: #64748b;
                text-align: center;
            }
            .notas-ausencias-table th:first-child,
            .notas-ausencias-table td:first-child {
                text-align: left;
                text-transform: none;
                letter-spacing: 0;
                font-size: 0.84rem;
                font-weight: 650;
                color: #0f172a;
                width: 42%;
            }
            .notas-ausencias-table td.num {
                text-align: center;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                color: #0f172a;
            }
            .notas-observaciones { padding-top: 0; }
            .notas-observaciones-table thead th:first-child {
                text-align: center;
                text-transform: none;
                letter-spacing: 0;
                font-size: 0.92rem;
                font-weight: 700;
                color: #0f172a;
                width: auto;
            }
            .notas-observaciones-table td:first-child {
                width: 8.5rem;
                white-space: nowrap;
                vertical-align: top;
            }
            .notas-obs-texto {
                font-weight: 500;
                line-height: 1.5;
                text-align: left;
                color: #334155;
            }
            .notas-obs-editor {
                display: flex;
                flex-direction: column;
                gap: 0.45rem;
            }
            .notas-obs-input {
                width: 100%;
                min-height: 4.6rem;
                resize: vertical;
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 0.55rem 0.7rem;
                font: inherit;
                font-size: 0.84rem;
                font-weight: 500;
                line-height: 1.5;
                color: #334155;
                background: #fff;
                box-sizing: border-box;
            }
            .notas-obs-input:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.12);
            }
            .notas-obs-bar {
                display: flex;
                justify-content: flex-end;
            }
            .notas-obs-save {
                min-height: 32px;
                padding: 0 0.85rem;
                border: none;
                border-radius: 8px;
                background: var(--primary);
                color: #fff;
                font-size: 0.75rem;
                font-weight: 700;
                font-family: inherit;
                cursor: pointer;
            }
            .notas-obs-save:disabled {
                opacity: 0.6;
                cursor: default;
            }
            .notas-legend {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem 1.25rem;
                padding: 0.75rem 1.25rem;
                border-top: 1px solid var(--border);
                background: #f8fafc;
                font-size: 0.72rem;
                color: #64748b;
            }
            .notas-legend b { color: #334155; font-weight: 700; }

            @media (max-width: 1100px) {
                .notas-kpis { grid-template-columns: repeat(2, 1fr); }
                .notas-kpi:nth-child(2) { border-right: none; }
                .notas-kpi:nth-child(1),
                .notas-kpi:nth-child(2) { border-bottom: 1px solid var(--border); }
            }
            @media (max-width: 960px) {
                .notas-split {
                    grid-template-columns: 1fr;
                    min-height: 0;
                }
                .notas-pane--list { max-height: 42vh; }
                .notas-pane--detail { min-height: 520px; }
                .notas-field { max-width: none; }
                .notas-filtros .notas-count { margin-left: 0; }
            }
        </style>

        <div id="notas-root" x-cloak>
            <div class="notas-filtros" role="search" aria-label="Filtrar por año, grado y sección">
                <label class="notas-field" th:if="${notasCatalogo.elegirAnio}">
                    <span>Año</span>
                    <select aria-label="Año" x-model="anio" @change="cerrarDetalle()"
                            x-init="$nextTick(() => { $el.value = anio })">
                        <template x-for="a in anios" :key="a.anio">
                            <option :value="String(a.anio)" x-text="a.etiqueta"></option>
                        </template>
                    </select>
                </label>
                <div class="notas-field" th:unless="${notasCatalogo.elegirAnio}">
                    <span>Año</span>
                    <div class="notas-period-fijo" th:text="${notasCatalogo.anioEtiqueta}">Año lectivo</div>
                </div>
                <label class="notas-field">
                    <span>Grado</span>
                    <select aria-label="Grado" x-model="grado" @change="alCambiarGrado()">
                        <option value="">Todos los grados</option>
                        <template x-for="g in grados" :key="g">
                            <option :value="g" x-text="'Grado ' + g"></option>
                        </template>
                    </select>
                </label>
                <label class="notas-field">
                    <span>Sección</span>
                    <select aria-label="Sección" x-model="seccion" @change="asegurarSeleccion()">
                        <option value="">Todas las secciones</option>
                        <template x-for="s in seccionesDisponibles" :key="s.id">
                            <option :value="s.id" x-text="s.etiqueta"></option>
                        </template>
                    </select>
                </label>
                <button type="button" class="notas-clear" x-show="grado || seccion" x-cloak
                        @click="limpiarFiltros()">Limpiar</button>
                <span class="notas-count" x-text="cohorte.length + (cohorte.length === 1 ? ' estudiante' : ' estudiantes')"></span>
            </div>
            <div class="notas-split">
                <section class="notas-pane notas-pane--list" aria-label="Estudiantes">
                    <div class="notas-pane-head">
                        <h3 class="notas-pane-title">Estudiantes</h3>
                        <span class="notas-count" x-text="filtrados.length + ' de ' + cohorte.length"></span>
                    </div>
                    <div class="notas-pane-tools">
                        <div class="notas-search">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="search" placeholder="Nombre o cédula..."
                                   aria-label="Buscar estudiante" x-model="q">
                        </div>
                    </div>
                    <div class="notas-list" role="listbox" aria-label="Lista de estudiantes" tabindex="0"
                         @keydown.arrow-down.prevent="mover(1)"
                         @keydown.arrow-up.prevent="mover(-1)">
                        <template x-for="e in filtrados" :key="e.id">
                            <button type="button" class="notas-student"
                                    role="option"
                                    :class="{ 'is-on': selectedId === e.id }"
                                    :aria-selected="selectedId === e.id"
                                    @click="elegirEstudiante(e)">
                                <span class="notas-avatar" :style="'background:' + e.color" x-text="e.iniciales"></span>
                                <span class="notas-student-meta">
                                    <span class="notas-student-name" x-text="e.nombre"></span>
                                    <span class="notas-student-sub" x-text="e.cedula + ' · ' + grupoDe(e)"></span>
                                </span>
                                <span class="notas-pill" x-show="promedioDe(e) != null"
                                      :class="nivel(promedioDe(e))" x-text="promedioDe(e)"></span>
                            </button>
                        </template>
                        <div class="notas-empty" x-show="filtrados.length === 0">
                            <strong x-text="tituloVacio()"></strong>
                            <span x-text="mensajeVacio()"></span>
                        </div>
                    </div>
                </section>

                <section class="notas-pane notas-pane--detail" aria-label="Notas del estudiante">
                    <template x-if="!seleccionado">
                        <div class="notas-empty">
                            <div class="notas-empty-icon">
                                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                                    <rect x="8" y="2" width="8" height="4" rx="1"></rect>
                                    <line x1="8" y1="12" x2="16" y2="12"></line>
                                    <line x1="8" y1="16" x2="16" y2="16"></line>
                                </svg>
                            </div>
                            <strong>Seleccione un estudiante</strong>
                            <span>Las calificaciones de cada materia, por período del año, se muestran aquí al elegir un estudiante.</span>
                        </div>
                    </template>

                    <template x-if="seleccionado">
                        <div style="display:flex;flex-direction:column;min-height:0;flex:1;">
                            <div class="notas-detail-head">
                                <div class="notas-ring" :style="'--pct:' + (promedioDe(seleccionado) == null ? 0 : promedioDe(seleccionado))">
                                    <div class="notas-ring-inner"
                                         x-text="promedioDe(seleccionado) == null ? '—' : promedioDe(seleccionado)"></div>
                                </div>
                                <div class="notas-detail-id">
                                    <h3 class="notas-detail-name" x-text="seleccionado.nombre"></h3>
                                    <div class="notas-detail-sub">
                                        <span x-text="seleccionado.cedula"></span>
                                        <span x-text="'Sección ' + grupoDe(seleccionado)"></span>
                                        <span class="notas-pill" x-show="promedioDe(seleccionado) != null"
                                              :class="nivel(promedioDe(seleccionado))"
                                              x-text="etiqueta(promedioDe(seleccionado))"></span>
                                    </div>
                                </div>
                                <div class="notas-detail-actions">
                                    <button type="button" class="notas-enviar" @click="simularEnvio()">Enviar</button>
                                    <span class="notas-period" x-text="etiquetaAnio()"></span>
                                </div>
                            </div>
                            <div class="notas-empty" x-show="!tieneMaterias(seleccionado)" style="min-height: 220px;">
                                <strong>Sin materias</strong>
                                <span>No hay materias asignadas a la sección de este estudiante en el año seleccionado.</span>
                            </div>
                            <div class="notas-kpis" x-show="tieneMaterias(seleccionado)">
                                <div class="notas-kpi">
                                    <div class="notas-kpi-label">Promedio</div>
                                    <div class="notas-kpi-value" x-text="promedioDe(seleccionado) == null ? '—' : promedioDe(seleccionado)"></div>
                                </div>
                                <div class="notas-kpi">
                                    <div class="notas-kpi-label">Materias</div>
                                    <div class="notas-kpi-value" x-text="materiasDe(seleccionado).length"></div>
                                </div>
                                <div class="notas-kpi">
                                    <div class="notas-kpi-label">Aprobadas</div>
                                    <div class="notas-kpi-value is-ok" x-text="conteo(seleccionado, 70, true)"></div>
                                </div>
                                <div class="notas-kpi">
                                    <div class="notas-kpi-label">En riesgo</div>
                                    <div class="notas-kpi-value" :class="{ 'is-risk': conteo(seleccionado, 70, false) > 0 }"
                                         x-text="conteo(seleccionado, 70, false)"></div>
                                </div>
                            </div>
                            <div class="notas-table-wrap" x-show="tieneMaterias(seleccionado)">
                                <table class="notas-table">
                                    <thead>
                                        <tr>
                                            <th>Materia</th>
                                            <template x-for="p in periodosDelAnio" :key="p.id">
                                                <th class="num notas-th-periodo">
                                                    <button type="button" class="notas-periodo-btn"
                                                            :class="{ 'is-on': esPeriodoAbierto(p) }"
                                                            :title="p.titulo"
                                                            :aria-pressed="esPeriodoAbierto(p)"
                                                            aria-haspopup="dialog"
                                                            @click="abrirDesglose(p)"
                                                            x-text="p.etiqueta"></button>
                                                </th>
                                            </template>
                                            <th class="num notas-col-anio">Año</th>
                                            <th>Nivel</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="m in materiasDe(seleccionado)" :key="m.id">
                                            <tr :class="{ 'notas-conducta': esConducta(m) }">
                                                <td>
                                                    <span class="notas-materia" x-text="m.nombre"></span>
                                                    <span class="notas-docente" x-text="m.docente"></span>
                                                </td>
                                                <template x-for="p in periodosDelAnio" :key="m.id + '-' + p.id">
                                                    <td class="num">
                                                        <div class="notas-final" :class="nivel(pctDe(notaDe(m, p.id)))"
                                                             x-text="fmtNota(notaDe(m, p.id))"></div>
                                                    </td>
                                                </template>
                                                <td class="num notas-col-anio">
                                                    <div class="notas-celda">
                                                        <div class="notas-final" :class="nivel(pctDe(resumenDe(m)))"
                                                             x-text="fmtNota(resumenDe(m))"></div>
                                                        <div class="notas-bar" x-show="pctDe(resumenDe(m)) != null">
                                                            <div class="notas-bar-fill" :style="barraDe(resumenDe(m))"></div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td>
                                                    <span class="notas-pill" x-show="pctDe(resumenDe(m)) != null"
                                                          :class="nivel(pctDe(resumenDe(m)))"
                                                          x-text="etiqueta(pctDe(resumenDe(m)))"></span>
                                                    <span x-show="pctDe(resumenDe(m)) == null">—</span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <div class="notas-legend" x-show="tieneMaterias(seleccionado)">
                                <span>La nota es el promedio ponderado del período, según la distribución de la materia y la asistencia.</span>
                                <span><b>Conducta</b> inicia en 100. Solo las boletas del período descuentan puntos.</span>
                                <span><b>Año</b> es el promedio de los períodos que tienen nota.</span>
                            </div>
                            <div class="notas-ausencias">
                                <table class="notas-ausencias-table">
                                    <thead>
                                        <tr>
                                            <th>Ausencias</th>
                                            <template x-for="p in periodosDelAnio" :key="'aus-' + p.id">
                                                <th class="num">
                                                    <button type="button" class="notas-periodo-btn"
                                                            :class="{ 'is-on': esAusenciaAbierta(p) }"
                                                            :title="p.titulo"
                                                            :aria-pressed="esAusenciaAbierta(p)"
                                                            aria-haspopup="dialog"
                                                            @click="abrirAusencias(p)"
                                                            x-text="p.etiqueta"></button>
                                                </th>
                                            </template>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="fila in filasAusencia" :key="fila.nombre">
                                            <tr>
                                                <td x-text="fila.nombre"></td>
                                                <template x-for="p in periodosDelAnio" :key="fila.nombre + '-' + p.id">
                                                    <td class="num" x-text="valorAusencia(fila, p)"></td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <div class="notas-ausencias notas-observaciones">
                                <table class="notas-ausencias-table notas-observaciones-table">
                                    <thead>
                                        <tr>
                                            <th colspan="2">Observaciones del docente guía</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="p in periodosDelAnio" :key="'obs-' + seleccionado.id + '-' + p.id">
                                            <tr>
                                                <td x-text="p.etiqueta"></td>
                                                <td>
                                                    <div class="notas-obs-editor">
                                                        <textarea class="notas-obs-input" rows="3" maxlength="1500"
                                                                  placeholder="Sin observación registrada para este período."
                                                                  :aria-label="'Observación de ' + p.etiqueta"
                                                                  x-init="$el.value = textoObservacion(p)"
                                                                  @input="fijarObservacion(p, $event.target.value)"></textarea>
                                                        <div class="notas-obs-bar">
                                                            <button type="button" class="notas-obs-save"
                                                                    @click="guardarObservacion(p)"
                                                                    :disabled="guardandoObs === p.id"
                                                                    x-text="guardandoObs === p.id ? 'Guardando…' : 'Guardar'"></button>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>
                </section>
            </div>
            <div th:replace="~{notas/detalle-por-componente :: desglose}"></div>
            <div th:replace="~{notas/detalle-ausencias :: detalle}"></div>
        </div>

        <script th:inline="javascript">
            var NOTAS_CATALOGO = /*[[${notasCatalogo}]]*/ {};

            function notasModulo() {
                const catalogo = NOTAS_CATALOGO || {};
                const niveles = catalogo.niveles || [];
                const estudiantes = catalogo.estudiantes || [];
                const gradosUnicos = [...new Set(niveles.map(function (n) { return n.grado; }))]
                    .sort(function (a, b) { return Number(a) - Number(b); });
                const gradoInicial = gradosUnicos.length === 1 ? String(gradosUnicos[0]) : '';
                const seccionInicial = niveles.length === 1 ? String(niveles[0].id) : '';

                function mismaCohorte(e, grado, seccion) {
                    if (grado && String(e.grado) !== String(grado)) return false;
                    if (seccion && String(e.nivelId) !== String(seccion)) return false;
                    return true;
                }
                const iniciales = estudiantes.filter(function (e) {
                    return mismaCohorte(e, gradoInicial, seccionInicial);
                });

                return {
                    q: '',
                    elegirAnio: !!catalogo.elegirAnio,
                    anio: catalogo.anio == null ? '' : String(catalogo.anio),
                    anioEtiqueta: catalogo.anioEtiqueta || 'Sin períodos',
                    aviso: catalogo.aviso || '',
                    grado: gradoInicial,
                    seccion: seccionInicial,
                    selectedId: iniciales[0] ? iniciales[0].id : null,
                    guardandoObs: null,
                    desglosePeriodo: null,
                    desgloseCtrl: null,
                    ausenciaPeriodo: null,
                    ausenciaCtrl: null,
                    anios: catalogo.anios || [],
                    periodos: catalogo.periodos || [],
                    filasAusencia: [
                        { nombre: 'Ausencias justificadas', clave: 'justificadas' },
                        { nombre: 'Ausencias injustificadas', clave: 'injustificadas' },
                        { nombre: 'Tardías justificadas', clave: 'tardiasJustificadas' },
                        { nombre: 'Tardías injustificadas', clave: 'tardiasInjustificadas' }
                    ],
                    niveles: niveles,
                    estudiantes: estudiantes,
                    get periodosDelAnio() {
                        const anio = String(this.anio);
                        return this.periodos.filter(function (p) { return String(p.anio) === anio; });
                    },
                    get grados() {
                        return [...new Set(this.niveles.map(function (n) { return n.grado; }))]
                            .sort(function (a, b) { return Number(a) - Number(b); });
                    },
                    get seccionesDisponibles() {
                        const grado = this.grado;
                        return this.niveles.filter(function (n) {
                            return !grado || String(n.grado) === String(grado);
                        });
                    },
                    get cohorte() {
                        const grado = this.grado;
                        const seccion = this.seccion;
                        return this.estudiantes.filter(function (e) {
                            return mismaCohorte(e, grado, seccion);
                        });
                    },
                    get filtrados() {
                        const q = this.q.trim().toLowerCase();
                        return this.cohorte.filter(function (e) {
                            if (!q) return true;
                            return (e.nombre + ' ' + e.cedula + ' ' + e.grado + '-' + e.seccion).toLowerCase().includes(q);
                        });
                    },
                    get seleccionado() {
                        const id = this.selectedId;
                        return this.filtrados.find(function (e) { return e.id === id; })
                            || this.cohorte.find(function (e) { return e.id === id; })
                            || null;
                    },
                    grupoDe(e) {
                        return e.grado + '-' + e.seccion;
                    },
                    alCambiarGrado() {
                        const ids = this.seccionesDisponibles.map(function (n) { return String(n.id); });
                        if (this.seccion && ids.indexOf(String(this.seccion)) < 0) {
                            this.seccion = '';
                        }
                        this.asegurarSeleccion();
                    },
                    idsDelAnio() {
                        return this.periodosDelAnio.map(function (p) { return String(p.id); });
                    },
                    materiasDe(est) {
                        if (!est || !est.materias) return [];
                        const ids = this.idsDelAnio();
                        return est.materias.filter(function (m) {
                            return (m.periodoIds || []).some(function (id) { return ids.indexOf(String(id)) >= 0; });
                        });
                    },
                    tieneMaterias(est) {
                        return this.materiasDe(est).length > 0;
                    },
                    esConducta(m) {
                        return !!(m && m.id < 0);
                    },
                    elegirEstudiante(e) {
                        if (this.selectedId !== e.id) this.cerrarDetalle();
                        this.selectedId = e.id;
                    },
                    abrirDesglose(periodo) {
                        if (!this.seleccionado || !periodo) return;
                        this.cerrarAusencias();
                        const estudianteId = this.seleccionado.id;
                        const periodoId = periodo.id;
                        this.desglosePeriodo = periodo;
                        if (this.desgloseCtrl) this.desgloseCtrl.abort();
                        const ctrl = new AbortController();
                        this.desgloseCtrl = ctrl;
                        const pintar = (html) => {
                            if (this.desgloseCtrl !== ctrl) return;
                            if (!this.seleccionado || this.seleccionado.id !== estudianteId || !this.esPeriodoAbierto(periodo)) return;
                            const cuerpo = document.getElementById('notas-desglose-cuerpo');
                            if (cuerpo) cuerpo.innerHTML = html;
                        };
                        const cargando = '<tr class="notas-desglose-fila"><td class="notas-desglose-estado" colspan="7">Cargando…</td></tr>';
                        this.$nextTick(() => {
                            pintar(cargando);
                            fetch('/notas/desglose?estudianteId=' + estudianteId + '&periodoId=' + periodoId, { signal: ctrl.signal })
                                .then((res) => {
                                    if (res.redirected || !res.ok) throw new Error('respuesta');
                                    return res.text();
                                })
                                .then((html) => pintar(html))
                                .catch((e) => {
                                    if (e && e.name === 'AbortError') return;
                                    pintar('<tr class="notas-desglose-fila"><td class="notas-desglose-estado" colspan="7">No se pudo cargar el desglose.</td></tr>');
                                });
                        });
                    },
                    cerrarDesglose() {
                        if (this.desgloseCtrl) this.desgloseCtrl.abort();
                        this.desgloseCtrl = null;
                        this.desglosePeriodo = null;
                    },
                    abrirAusencias(periodo) {
                        if (!this.seleccionado || !periodo) return;
                        this.cerrarDesglose();
                        const estudianteId = this.seleccionado.id;
                        const periodoId = periodo.id;
                        this.ausenciaPeriodo = periodo;
                        if (this.ausenciaCtrl) this.ausenciaCtrl.abort();
                        const ctrl = new AbortController();
                        this.ausenciaCtrl = ctrl;
                        const pintar = (html) => {
                            if (this.ausenciaCtrl !== ctrl) return;
                            if (!this.seleccionado || this.seleccionado.id !== estudianteId || !this.esAusenciaAbierta(periodo)) return;
                            const cuerpo = document.getElementById('notas-ausencias-cuerpo');
                            if (cuerpo) cuerpo.innerHTML = html;
                        };
                        const cargando = '<p class="notas-aus-estado">Cargando…</p>';
                        this.$nextTick(() => {
                            pintar(cargando);
                            fetch('/notas/ausencias?estudianteId=' + estudianteId + '&periodoId=' + periodoId, { signal: ctrl.signal })
                                .then((res) => {
                                    if (res.redirected || !res.ok) throw new Error('respuesta');
                                    return res.text();
                                })
                                .then((html) => pintar(html))
                                .catch((e) => {
                                    if (e && e.name === 'AbortError') return;
                                    pintar('<p class="notas-aus-estado">No se pudieron cargar las ausencias.</p>');
                                });
                        });
                    },
                    cerrarAusencias() {
                        if (this.ausenciaCtrl) this.ausenciaCtrl.abort();
                        this.ausenciaCtrl = null;
                        this.ausenciaPeriodo = null;
                    },
                    cerrarDetalle() {
                        this.cerrarDesglose();
                        this.cerrarAusencias();
                    },
                    esAusenciaAbierta(periodo) {
                        return !!(this.ausenciaPeriodo && periodo
                            && String(this.ausenciaPeriodo.id) === String(periodo.id));
                    },
                    esPeriodoAbierto(periodo) {
                        return !!(this.desglosePeriodo && periodo
                            && String(this.desglosePeriodo.id) === String(periodo.id));
                    },
                    promedioPeriodo(est, periodo) {
                        if (!est || !periodo) return null;
                        const notas = this.materiasDe(est)
                            .map((m) => this.pctDe(this.notaDe(m, periodo.id)))
                            .filter((n) => n != null);
                        if (!notas.length) return null;
                        return +(notas.reduce((acc, n) => acc + n, 0) / notas.length).toFixed(1);
                    },
                    conteoPeriodo(est, periodo, umbral, aprobadas) {
                        if (!est || !periodo) return 0;
                        return this.materiasDe(est).filter((m) => {
                            const n = this.pctDe(this.notaDe(m, periodo.id));
                            if (n == null) return false;
                            return aprobadas ? n >= umbral : n < umbral;
                        }).length;
                    },
                    fmtPeriodo(n) {
                        return n == null ? '—' : Number(n).toFixed(1);
                    },
                    etiquetaAnio() {
                        const n = this.periodosDelAnio.length;
                        const base = this.anio || this.anioEtiqueta;
                        if (!n) return String(base);
                        return base + ' · ' + n + (n === 1 ? ' período' : ' períodos');
                    },
                    notaDe(m, periodoId) {
                        if (!m || !m.notas) return null;
                        const id = String(periodoId);
                        return m.notas.find(function (n) { return String(n.periodoId) === id; }) || null;
                    },
                    resumenDe(m) {
                        const ids = this.idsDelAnio();
                        const notas = (m && m.notas ? m.notas : []).filter(function (n) {
                            return ids.indexOf(String(n.periodoId)) >= 0;
                        });
                        const conPct = notas.filter(function (n) { return n.porcentaje != null; });
                        if (!conPct.length) return null;
                        const pct = +(conPct.reduce(function (acc, n) { return acc + Number(n.porcentaje); }, 0) / conPct.length).toFixed(1);
                        return { porcentaje: pct };
                    },
                    pctDe(n) {
                        return n && n.porcentaje != null ? Number(n.porcentaje) : null;
                    },
                    fmtNota(n) {
                        const pct = this.pctDe(n);
                        return pct == null ? '—' : pct.toFixed(1);
                    },
                    valorAusencia(fila, periodo) {
                        const lista = this.seleccionado && this.seleccionado.ausencias;
                        if (!lista || !periodo || !fila) return 0;
                        const item = lista.find(function (a) {
                            return String(a.periodoId) === String(periodo.id);
                        });
                        const valor = item ? item[fila.clave] : 0;
                        return valor == null ? 0 : valor;
                    },
                    textoObservacion(periodo) {
                        const lista = this.seleccionado && this.seleccionado.observaciones;
                        if (!lista || !periodo) return '';
                        const item = lista.find(function (o) {
                            return String(o.periodoId) === String(periodo.id);
                        });
                        return item && item.texto ? item.texto : '';
                    },
                    fijarObservacion(periodo, texto) {
                        if (!this.seleccionado || !periodo) return;
                        if (!this.seleccionado.observaciones) this.seleccionado.observaciones = [];
                        let item = this.seleccionado.observaciones.find(function (o) {
                            return String(o.periodoId) === String(periodo.id);
                        });
                        if (!item) {
                            item = { periodoId: periodo.id, texto: '' };
                            this.seleccionado.observaciones.push(item);
                        }
                        item.texto = texto;
                    },
                    async guardarObservacion(periodo) {
                        if (!this.seleccionado || !periodo || this.guardandoObs != null) return;
                        this.guardandoObs = periodo.id;
                        const params = new URLSearchParams();
                        params.set('estudianteId', this.seleccionado.id);
                        params.set('periodoId', periodo.id);
                        params.set('texto', this.textoObservacion(periodo));
                        const token = document.querySelector('meta[name="_csrf"]');
                        const header = document.querySelector('meta[name="_csrf_header"]');
                        const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                        if (token && header) headers[header.getAttribute('content')] = token.getAttribute('content');
                        try {
                            const res = await fetch('/notas/observacion', { method: 'POST', headers: headers, body: params });
                            const html = await res.text();
                            const nodo = new DOMParser().parseFromString(html, 'text/html').querySelector('#obs-resultado');
                            const ok = nodo && nodo.getAttribute('data-ok') === 'true';
                            const mensaje = nodo ? nodo.textContent.trim() : 'No se pudo guardar la observación.';
                            if (!ok && nodo == null) {
                                this.avisar(mensaje || 'No se pudo guardar la observación.', 'error');
                                return;
                            }
                            if (ok && !this.textoObservacion(periodo)) {
                                this.seleccionado.observaciones = (this.seleccionado.observaciones || []).filter(function (o) {
                                    return String(o.periodoId) !== String(periodo.id);
                                });
                            }
                            this.avisar(mensaje, ok ? 'success' : 'error');
                        } catch (e) {
                            this.avisar('No se pudo guardar la observación.', 'error');
                        } finally {
                            this.guardandoObs = null;
                        }
                    },
                    simularEnvio() {
                        const nombre = this.seleccionado ? this.seleccionado.nombre : 'el estudiante';
                        this.avisar('Enviados a los padres de ' + nombre + '.', 'success');
                    },
                    avisar(message, type) {
                        window.dispatchEvent(new CustomEvent('notify', { detail: { message: message, type: type } }));
                    },
                    barraDe(n) {
                        const pct = this.pctDe(n);
                        if (pct == null) return '';
                        const ancho = Math.max(0, Math.min(100, pct));
                        return 'width:' + ancho + '%;background:' + this.colorDe(pct);
                    },
                    tituloVacio() {
                        if (this.aviso && !this.q.trim()) return 'Sin secciones';
                        return 'Sin coincidencias';
                    },
                    mensajeVacio() {
                        if (this.aviso && !this.q.trim()) return this.aviso;
                        if (!this.estudiantes.length) return 'No hay estudiantes activos en las secciones disponibles.';
                        return 'Ajuste la búsqueda o los filtros de grado y sección.';
                    },
                    asegurarSeleccion() {
                        const sigue = this.cohorte.some((e) => e.id === this.selectedId);
                        if (!sigue) {
                            this.cerrarDetalle();
                            this.selectedId = this.cohorte[0] ? this.cohorte[0].id : null;
                        }
                    },
                    limpiarFiltros() {
                        this.grado = '';
                        this.seccion = '';
                        this.asegurarSeleccion();
                    },
                    promedioDe(est) {
                        const materias = this.materiasDe(est);
                        const notas = materias
                            .map((m) => this.pctDe(this.resumenDe(m)))
                            .filter((n) => n != null);
                        if (!notas.length) return null;
                        return +(notas.reduce((acc, n) => acc + n, 0) / notas.length).toFixed(1);
                    },
                    conteo(est, umbral, aprobadas) {
                        return this.materiasDe(est).filter((m) => {
                            const n = this.pctDe(this.resumenDe(m));
                            if (n == null) return false;
                            return aprobadas ? n >= umbral : n < umbral;
                        }).length;
                    },
                    nivel(n) {
                        if (n == null) return '';
                        if (n >= 90) return 'excelente';
                        if (n >= 80) return 'bueno';
                        if (n >= 70) return 'regular';
                        return 'deficiente';
                    },
                    etiqueta(n) {
                        const map = { excelente: 'Excelente', bueno: 'Bueno', regular: 'Regular', deficiente: 'Aplazado' };
                        return map[this.nivel(n)];
                    },
                    colorDe(n) {
                        const map = { excelente: '#16a34a', bueno: '#2563eb', regular: '#d97706', deficiente: '#dc2626' };
                        return map[this.nivel(n)];
                    },
                    mover(dir) {
                        const list = this.filtrados;
                        if (!list.length) return;
                        let i = list.findIndex((e) => e.id === this.selectedId);
                        if (i < 0) i = 0;
                        i = Math.max(0, Math.min(list.length - 1, i + dir));
                        this.elegirEstudiante(list[i]);
                    }
                };
            }

            function montarNotas() {
                var el = document.getElementById('notas-root');
                if (!el || !window.Alpine) return;
                var data = el._x_dataStack && el._x_dataStack[0];
                if (data && typeof data.promedioDe === 'function' && el._x_dataStack.length === 1) return;
                if (el._x_dataStack) {
                    Alpine.destroyTree(el);
                    delete el._x_dataStack;
                }
                Alpine.mutateDom(function () {
                    el.setAttribute('x-data', 'notasModulo()');
                });
                Alpine.initTree(el);
            }

            (function () {
                var el = document.getElementById('notas-root');
                if (!el) return;
                if (!window.Alpine) {
                    el.setAttribute('x-data', 'notasModulo()');
                    return;
                }
                montarNotas();
            })();
        </script>
    </main>
    </th:block>
