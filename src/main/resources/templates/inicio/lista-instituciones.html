<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Institución — Nexa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/componentes.css}">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-general, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .instituciones-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 40px;
            border: 1px solid #e2e8f0;
            animation: slideUp 0.4s cubic-bezier(.22, 1, .36, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .inst-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .inst-header h2 {
            color: #1e293b;
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .inst-header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .inst-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .inst-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            transition: all 0.25s ease;
        }

        .inst-item:hover {
            border-color: #60a5fa;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.15);
            transform: translateY(-2px);
        }

        .inst-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .inst-icon {
            width: 44px;
            height: 44px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inst-name {
            font-weight: 600;
            color: #334155;
            font-size: 1rem;
        }

        .alert-error {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-bottom: 24px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #60a5fa;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.3);
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
        }

        .logo-text span {
            color: #60a5fa;
        }
    </style>
</head>

<body>
    <div class="instituciones-card">
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                    <path d="M6 12v5c3 3 9 3 12 0v-5" />
                </svg>
            </div>
            <div class="logo-text">Nexa<span>Chaves</span></div>
        </div>

        <div class="inst-header">
            <h2>Seleccionar Institución</h2>
            <p>Elige la institución a la que deseas ingresar</p>
        </div>

        <div th:if="${errorNoInstituciones != null}" class="alert-error" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span th:text="${errorNoInstituciones}">No tienes instituciones</span>
        </div>

        <div class="inst-list">
            <div th:each="inst : ${instituciones}" class="inst-item">
                <div class="inst-info">
                    <div class="inst-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" 
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </div>
                    <span class="inst-name" th:text="${inst.nombre}">Nombre</span>
                </div>
                <form th:action="@{/inicio/cambiar-institucion}" method="post" style="margin:0;">
                    <input type="hidden" name="institucionId" th:value="${inst.id}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-primary btn-demo-sm">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
