<div th:fragment="form-content" xmlns:th="http://www.thymeleaf.org">
    <div class="modal-backdrop" @click.self="$dispatch('close-modal')">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${contacto.id == null ? 'Agregar Contacto' : 'Editar Contacto'}">Contacto</h3>
                <button type="button" class="close-btn" @click="$dispatch('close-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form th:action="@{/contacto/instituciones}" method="post"
                      hx-post="/contacto/instituciones"
                      hx-target="#contacto-instituciones-content" hx-swap="innerHTML"
                      hx-on:htmx:after-request="if(event.detail.successful) this.dispatchEvent(new CustomEvent('close-modal',{bubbles:true}))">
                    <input type="hidden" name="id" th:value="${contacto.id}">

                    <div th:if="${error}" class="form-alert-error" th:text="${error}"></div>

                    <div class="form-row">
                        <div class="form-group" style="flex:2;">
                            <label class="form-label">Nombre *</label>
                            <input class="form-input" type="text" name="nombre" required maxlength="150"
                                   th:value="${contacto.nombre}" placeholder="Ej. Hospital Nacional de Niños">
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label class="form-label">Tipo *</label>
                            <select class="form-input" name="tipo" required>
                                <option value="" disabled th:selected="${contacto.tipo == null}">Seleccione...</option>
                                <option value="EDUCATIVA" th:selected="${contacto.tipo == 'EDUCATIVA'}">🏫 Educativa</option>
                                <option value="SALUD" th:selected="${contacto.tipo == 'SALUD'}">🏥 Salud</option>
                                <option value="EMERGENCIA" th:selected="${contacto.tipo == 'EMERGENCIA'}">🚒 Emergencia</option>
                                <option value="GUBERNAMENTAL" th:selected="${contacto.tipo == 'GUBERNAMENTAL'}">🏛️ Gubernamental</option>
                                <option value="OTRO" th:selected="${contacto.tipo == 'OTRO'}">📋 Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Dirección</label>
                        <input class="form-input" type="text" name="direccion" maxlength="200"
                               th:value="${contacto.direccion}" placeholder="Ej. Paseo Colón, San José">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Teléfono</label>
                            <input class="form-input" type="text" name="telefono" maxlength="30"
                                   th:value="${contacto.telefono}" placeholder="2222-3000">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Correo electrónico</label>
                            <input class="form-input" type="email" name="email" maxlength="150"
                                   th:value="${contacto.email}" placeholder="contacto@ejemplo.cr">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Sitio web</label>
                        <input class="form-input" type="text" name="sitioWeb" maxlength="150"
                               th:value="${contacto.sitioWeb}" placeholder="www.ejemplo.cr">
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" class="custom-checkbox" name="activo" value="true"
                                   th:checked="${contacto.activo == null or contacto.activo}">
                            <span class="custom-checkbox-control">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </span>
                            <span>Contacto activo</span>
                        </label>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" @click="$dispatch('close-modal')">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
