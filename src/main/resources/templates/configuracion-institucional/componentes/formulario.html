<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form-content">
    <style>
        .comp-eval-rubros {
            display: grid;
            gap: 0.55rem;
        }
        .comp-eval-rubro {
            display: grid;
            grid-template-columns: 10px minmax(0, 1fr) auto;
            gap: 0.75rem;
            align-items: center;
            padding: 0.55rem 0.8rem;
            border: 1px solid var(--border-solid, #e2e8f0);
            border-radius: 10px;
            background: #ffffff;
        }
        .comp-eval-rubro:focus-within {
            border-color: var(--primary);
        }
        .comp-eval-swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .comp-eval-rubro label {
            margin: 0;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .comp-eval-rubro label small {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            color: #475569;
        }
        .comp-eval-pct {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .comp-eval-pct .form-input {
            width: 86px;
            min-height: 40px;
            padding: 0.45rem 0.6rem;
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .comp-eval-bar-track {
            display: flex;
            height: 10px;
            margin-top: 0.8rem;
            border-radius: 999px;
            overflow: hidden;
            background: #e2e8f0;
        }
        .comp-eval-bar-track.is-over {
            background: #fecaca;
        }
        .comp-eval-total-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-top: 0.65rem;
            padding: 0.75rem 0.95rem;
            border-radius: 10px;
            border: 1px solid #86efac;
            background: #f0fdf4;
            color: #14532d;
            font-weight: 600;
        }
        .comp-eval-total-box.is-error {
            border-color: #fca5a5;
            background: #fef2f2;
            color: #991b1b;
        }
        .comp-eval-total-msg {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            margin-top: 2px;
        }
        .comp-eval-total-num {
            font-size: 1.3rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .comp-eval-aviso {
            margin: 0 0 1rem;
            padding: 0.75rem 0.95rem;
            border-radius: 10px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1e3a5f;
            font-size: 0.82rem;
            line-height: 1.5;
        }
    </style>
    <div class="modal-backdrop" onclick="if (event.target === this) cerrarModalInstitucional()">
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-componente-titulo">
            <div class="modal-loading-overlay htmx-indicator" id="modal-loading-overlay">
                <div class="spinner"></div>
                <span>Guardando componente...</span>
            </div>
            <div class="modal-header">
                <h3 class="modal-title" id="modal-componente-titulo"
                    th:text="${componente.id == null ? 'Registrar componente' : 'Editar componente'}">Componente</h3>
                <button type="button" class="close-btn" aria-label="Cerrar diálogo"
                        onclick="cerrarModalInstitucional()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-componente-eval"
                      hx-post="/configuracion-institucional/componentes"
                      hx-target="#institucional-componentes-panel"
                      hx-swap="outerHTML"
                      hx-indicator="#modal-loading-overlay"
                      hx-disabled-elt="find button[type='submit']"
                      oninput="actualizarTotalComponente(this)">
                    <input type="hidden" name="id" th:value="${componente.id}">
                    <div class="form-group">
                        <label class="form-label" for="componente-nombre">Nombre</label>
                        <input class="form-input" id="componente-nombre" name="nombre" maxlength="60" required
                               th:value="${componente.nombre}" placeholder="Ej. III Ciclo — Básicas">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="componente-descripcion">Descripción <span class="academic-help">(opcional)</span></label>
                        <input class="form-input" id="componente-descripcion" name="descripcion" maxlength="160"
                               th:value="${componente.descripcion}" placeholder="Ej. Art. 41 a) · Matemática, Español…">
                    </div>

                    <fieldset class="form-group" style="border: 0; padding: 0; margin: 0 0 1.25rem;">
                        <legend class="form-label" style="margin-bottom: 0.5rem;">Porcentaje de cada rubro (deben sumar 100%)</legend>
                        <div class="comp-eval-rubros">
                            <div class="comp-eval-rubro">
                                <span class="comp-eval-swatch" style="background:#2563eb;" aria-hidden="true"></span>
                                <label for="componente-cotidiano">Trabajo cotidiano<small>Indicadores evaluados en clase</small></label>
                                <div class="comp-eval-pct">
                                    <input class="form-input" id="componente-cotidiano" name="cotidiano" type="number"
                                           min="0" max="100" step="1" inputmode="numeric" required data-rubro="cot"
                                           th:value="${componente.cotidiano}">
                                    <span aria-hidden="true">%</span>
                                </div>
                            </div>
                            <div class="comp-eval-rubro">
                                <span class="comp-eval-swatch" style="background:#0891b2;" aria-hidden="true"></span>
                                <label for="componente-tareas">Tareas<small>Trabajos asignados fuera de la lección</small></label>
                                <div class="comp-eval-pct">
                                    <input class="form-input" id="componente-tareas" name="tareas" type="number"
                                           min="0" max="100" step="1" inputmode="numeric" required data-rubro="tar"
                                           th:value="${componente.tareas}">
                                    <span aria-hidden="true">%</span>
                                </div>
                            </div>
                            <div class="comp-eval-rubro">
                                <span class="comp-eval-swatch" style="background:#7c3aed;" aria-hidden="true"></span>
                                <label for="componente-proyecto">Proyecto<small>0% si no forma parte de la nota</small></label>
                                <div class="comp-eval-pct">
                                    <input class="form-input" id="componente-proyecto" name="proyecto" type="number"
                                           min="0" max="100" step="1" inputmode="numeric" required data-rubro="pro"
                                           th:value="${componente.proyecto}">
                                    <span aria-hidden="true">%</span>
                                </div>
                            </div>
                            <div class="comp-eval-rubro">
                                <span class="comp-eval-swatch" style="background:#ea580c;" aria-hidden="true"></span>
                                <label for="componente-pruebas">Pruebas<small>Pruebas escritas del período</small></label>
                                <div class="comp-eval-pct">
                                    <input class="form-input" id="componente-pruebas" name="pruebas" type="number"
                                           min="0" max="100" step="1" inputmode="numeric" required data-rubro="pru"
                                           th:value="${componente.pruebas}">
                                    <span aria-hidden="true">%</span>
                                </div>
                            </div>
                            <div class="comp-eval-rubro">
                                <span class="comp-eval-swatch" style="background:#16a34a;" aria-hidden="true"></span>
                                <label for="componente-asistencia">Asistencia
                                    <small th:if="${asistenciaCuenta}">Según la tabla del Art. 37</small>
                                    <small th:unless="${asistenciaCuenta}">En esta dirección rebaja la conducta: su porcentaje se reparte entre los demás rubros</small>
                                </label>
                                <div class="comp-eval-pct">
                                    <input class="form-input" id="componente-asistencia" name="asistencia" type="number"
                                           min="0" max="100" step="1" inputmode="numeric" required data-rubro="asi"
                                           th:value="${componente.asistencia}">
                                    <span aria-hidden="true">%</span>
                                </div>
                            </div>
                        </div>

                        <div class="comp-eval-bar-track" data-bar-track aria-hidden="true">
                            <span data-seg="cot" style="background:#2563eb;width:0%;"></span>
                            <span data-seg="tar" style="background:#0891b2;width:0%;"></span>
                            <span data-seg="pro" style="background:#7c3aed;width:0%;"></span>
                            <span data-seg="pru" style="background:#ea580c;width:0%;"></span>
                            <span data-seg="asi" style="background:#16a34a;width:0%;"></span>
                        </div>

                        <div class="comp-eval-total-box" data-total-box role="status" aria-live="polite">
                            <div>
                                <span>Suma de rubros</span>
                                <span class="comp-eval-total-msg" data-total-msg>Distribución completa (100%).</span>
                            </div>
                            <span class="comp-eval-total-num" data-total th:text="${componente.total + '%'}">100%</span>
                        </div>
                    </fieldset>

                    <input type="hidden" name="_activo" value="on">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" class="custom-checkbox" name="activo"
                                   th:checked="${componente.id == null or componente.activo}">
                            <span class="custom-checkbox-control">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </span>
                            <span>Componente activo (disponible al asignar materias)</span>
                        </label>
                    </div>

                    <p class="comp-eval-aviso" th:if="${materiasDelComponente > 0}">
                        Este componente lo usan <strong th:text="${materiasDelComponente == 1 ? '1 materia' : materiasDelComponente + ' materias'}">18 materias</strong>.
                        Al guardar, sus notas se calculan con los porcentajes nuevos.
                    </p>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="cerrarModalInstitucional()">Cancelar</button>
                        <button type="submit" class="btn-primary" data-guardar>Guardar componente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        function actualizarTotalComponente(form) {
            let total = 0;
            let hayNegativo = false;
            const valores = {};
            form.querySelectorAll('[data-rubro]').forEach(function (input) {
                const clave = input.getAttribute('data-rubro');
                const valor = Number(input.value);
                const valido = Number.isFinite(valor) ? valor : 0;
                if (valido < 0 || valido > 100) hayNegativo = true;
                valores[clave] = Math.max(0, valido);
                total += valido;
            });
            const escala = total > 100 ? total : 100;
            Object.keys(valores).forEach(function (clave) {
                const seg = form.querySelector('[data-seg="' + clave + '"]');
                if (seg) seg.style.width = ((valores[clave] / escala) * 100) + '%';
            });
            const track = form.querySelector('[data-bar-track]');
            if (track) track.classList.toggle('is-over', total > 100);

            const caja = form.querySelector('[data-total-box]');
            const msg = form.querySelector('[data-total-msg]');
            const invalido = total !== 100 || hayNegativo;
            form.querySelector('[data-total]').textContent = total + '%';
            caja.classList.toggle('is-error', invalido);
            if (msg) {
                if (hayNegativo) {
                    msg.textContent = 'Cada rubro debe estar entre 0% y 100%.';
                } else if (total === 100) {
                    msg.textContent = 'Distribución completa. Listo para guardar.';
                } else if (total < 100) {
                    msg.textContent = 'Faltan ' + (100 - total) + '% para llegar a 100%.';
                } else {
                    msg.textContent = 'Sobran ' + (total - 100) + '%. Reduce algún rubro para sumar 100%.';
                }
            }
            form.querySelector('[data-guardar]').disabled = invalido;
        }
        (function () {
            const form = document.getElementById('form-componente-eval');
            if (form) {
                actualizarTotalComponente(form);
            }
        })();
    </script>
</div>
</body>
</html>
