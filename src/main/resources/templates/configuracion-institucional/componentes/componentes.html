<div th:fragment="content" id="institucional-componentes-panel" xmlns:th="http://www.thymeleaf.org">
    <div class="card">
        <div class="card-header">
            <div>
                <h3 class="card-title">Componentes</h3>
                <p class="academic-help">Módulos y piezas de evaluación que usa esta institución.</p>
            </div>
        </div>
        <form class="institucional-form" onsubmit="return false;">
            <div class="institucional-grid">
                <div class="form-group">
                    <label class="form-label">Nombre del componente</label>
                    <input class="form-input" type="text" name="nombre" placeholder="Cotidiano, tareas, proyecto…">
                </div>
                <div class="form-group">
                    <label class="form-label">Estado</label>
                    <select class="form-select" name="activo">
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>
                </div>
            </div>
            <div class="institucional-actions">
                <button type="button" class="btn btn-primary">Guardar componentes</button>
            </div>
        </form>
    </div>
</div>
