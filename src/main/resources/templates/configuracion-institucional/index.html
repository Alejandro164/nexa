<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Configuración Institucional — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Configuración Institucional</h2>
    <p layout:fragment="page-subtitle">Jornada, componentes y lecciones bloqueadas o reservadas por tipo</p>

    <th:block th:fragment="htmx-content">
    <h2 id="topbar-page-title" hx-swap-oob="true">Configuración Institucional</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Jornada, componentes y lecciones bloqueadas o reservadas por tipo</p>
    <main layout:fragment="content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }
            .config-tabs-container::-webkit-scrollbar { display: none; }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 12px;
                font-size: 0.82rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .tab-pane { animation: fadeIn 0.35s ease-out; }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .academic-help {
                color: var(--text-secondary);
                font-size: 0.84rem;
                margin-top: 0.3rem;
            }
            .institucional-form {
                padding: 1.5rem;
            }
            .institucional-form .form-input,
            .institucional-form .form-select {
                padding-left: 0.75rem;
            }
            .institucional-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }
            .institucional-grid .span-2 { grid-column: span 2; }
            @media (max-width: 768px) {
                .institucional-grid,
                .institucional-grid .span-2 {
                    grid-template-columns: 1fr;
                    grid-column: span 1;
                }
            }
            .institucional-actions {
                display: flex;
                justify-content: flex-end;
                gap: 0.75rem;
                border-top: 1px solid var(--border);
                padding-top: 1.25rem;
                margin-top: 0.5rem;
            }
            .card.jornada-card {
                position: relative;
                overflow: visible;
            }
            .jornada-body {
                display: grid;
                grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.85fr);
                gap: 0;
                align-items: start;
            }
            .jornada-form {
                padding: 1.35rem 1.5rem 1.6rem;
                border-right: 1px solid var(--border);
            }
            .jornada-section + .jornada-section {
                margin-top: 1.6rem;
            }
            .jornada-section-head h4 {
                margin: 0;
                font-size: 0.92rem;
                font-weight: 700;
                color: var(--text-primary);
            }
            .jornada-section-head p {
                margin: 0.25rem 0 0.9rem;
                color: var(--text-secondary);
                font-size: 0.82rem;
                line-height: 1.45;
            }
            .jornada-days {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .jornada-day {
                position: relative;
                min-width: 58px;
                padding: 0.55rem 0.7rem;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: #fff;
                text-align: center;
                font-size: 0.82rem;
                font-weight: 700;
                color: var(--text-secondary);
                cursor: pointer;
                transition: border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
            }
            .jornada-day input {
                position: absolute;
                opacity: 0;
                pointer-events: none;
            }
            .jornada-day:hover {
                border-color: #cbd5e1;
            }
            .jornada-day.is-on {
                color: #fff;
                background: var(--primary);
                border-color: var(--primary);
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.22);
            }
            .jornada-fields {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }
            .jornada-total {
                grid-column: 1 / -1;
                display: flex;
                align-items: baseline;
                gap: 0.7rem;
                padding: 0.85rem 1rem;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: #f8fafc;
            }
            .jornada-total-num {
                font-size: 1.7rem;
                font-weight: 800;
                line-height: 1;
                font-variant-numeric: tabular-nums;
                color: var(--primary);
            }
            .jornada-total-label {
                font-size: 0.84rem;
                font-weight: 600;
                color: var(--text-secondary);
            }
            .jornada-bloques {
                display: grid;
                gap: 0.85rem;
            }
            .jornada-bloque {
                border: 1px solid var(--border);
                border-radius: 12px;
                background: #fff;
                padding: 0.9rem 1rem 1rem;
            }
            .jornada-bloque-head {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 0.75rem;
                margin-bottom: 0.85rem;
            }
            .jornada-bloque-head h5 {
                margin: 0;
                font-size: 0.86rem;
                font-weight: 700;
                color: var(--text-primary);
            }
            .jornada-bloque-head p {
                margin: 0.15rem 0 0;
                font-size: 0.78rem;
                color: var(--text-secondary);
            }
            .jornada-bloque-body {
                display: grid;
                grid-template-columns: 110px minmax(0, 1fr);
                gap: 0.9rem 1rem;
                align-items: start;
            }
            .jornada-bloque-pausa {
                display: grid;
                gap: 0.5rem;
            }
            .jornada-pausa-ops {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .jornada-pausa-ops button {
                border: 1px solid var(--border);
                background: #fff;
                color: var(--text-secondary);
                border-radius: 9px;
                padding: 0.38rem 0.7rem;
                font-size: 0.76rem;
                font-weight: 700;
                cursor: pointer;
                transition: border-color 0.2s, background 0.2s, color 0.2s;
            }
            .jornada-pausa-ops button:hover {
                border-color: #cbd5e1;
            }
            .jornada-pausa-ops button.is-on {
                color: #fff;
                background: var(--primary);
                border-color: var(--primary);
            }
            .jornada-bloque-fin {
                margin: 0.35rem 0 0;
                font-size: 0.8rem;
                font-weight: 700;
                color: var(--text-secondary);
            }
            .jornada-recreo-min {
                display: flex;
                align-items: center;
                gap: 0.45rem;
                max-width: 140px;
            }
            .jornada-recreo-min span {
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-secondary);
            }
            .jornada-add-bloque {
                margin-top: 0.9rem;
            }
            @media (max-width: 640px) {
                .jornada-bloque-body {
                    grid-template-columns: 1fr;
                }
            }
            .jornada-preview {
                display: flex;
                flex-direction: column;
                min-height: 0;
                padding: 1.35rem 1.35rem 1.6rem;
                background: #f8fafc;
                position: sticky;
                top: calc(var(--topbar-height) + 12px);
                z-index: 4;
                max-height: calc(100vh - var(--topbar-height) - 24px);
                border-bottom-right-radius: var(--radius);
                box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
            }
            .jornada-preview-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 0.75rem;
                margin: -1.35rem -1.35rem 0.9rem;
                padding: 0.95rem 1.35rem 0.85rem;
                flex-shrink: 0;
                background: #f8fafc;
                border-bottom: 1px solid var(--border);
            }
            .jornada-preview-head h4 {
                margin: 0;
                font-size: 0.92rem;
                font-weight: 700;
            }
            .jornada-preview-head span {
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-secondary);
            }
            .jornada-timeline {
                list-style: none;
                margin: 0;
                padding: 0;
                flex: 1 1 auto;
                min-height: 0;
                overflow: auto;
                overscroll-behavior: contain;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: #fff;
            }
            .jornada-timeline li {
                display: grid;
                grid-template-columns: 118px 1fr;
                gap: 0.6rem;
                align-items: center;
                padding: 0.55rem 0.8rem;
                border-bottom: 1px solid var(--border);
                font-size: 0.8rem;
            }
            .jornada-timeline li:last-child {
                border-bottom: 0;
            }
            .jornada-timeline .jornada-time {
                font-variant-numeric: tabular-nums;
                font-weight: 700;
                color: var(--text-secondary);
            }
            .jornada-timeline .is-lesson .jornada-label {
                font-weight: 600;
            }
            .jornada-timeline .is-break {
                background: #cfe0ef;
                color: #2d5a87;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                font-size: 0.72rem;
                font-weight: 700;
            }
            .jornada-timeline .is-lunch {
                background: #fff7ed;
                color: #c2410c;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                font-size: 0.72rem;
                font-weight: 700;
            }
            @media (max-width: 900px) {
                .jornada-body {
                    grid-template-columns: 1fr;
                }
                .jornada-form {
                    border-right: 0;
                    border-bottom: 1px solid var(--border);
                }
                .jornada-preview {
                    position: static;
                    max-height: none;
                    box-shadow: none;
                    border-bottom-left-radius: var(--radius);
                }
                .jornada-timeline {
                    max-height: min(520px, 70vh);
                }
            }
        </style>

        <div x-data>
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': $store.institucional.activeTab === 'jornada' }"
                            @click="$store.institucional.activeTab = 'jornada'">
                        Jornada
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': $store.institucional.activeTab === 'componentes' }"
                            @click="$store.institucional.activeTab = 'componentes'">
                        Componentes
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': $store.institucional.activeTab === 'bloqueo-leccion' }"
                            @click="$store.institucional.activeTab = 'bloqueo-leccion'">
                        Bloqueo lección
                    </button>
                </div>
            </div>

            <div x-show="$store.institucional.activeTab === 'jornada'" class="tab-pane">
                <div th:replace="~{configuracion-institucional/jornada/jornada :: content}"></div>
            </div>
            <div x-show="$store.institucional.activeTab === 'componentes'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-institucional/componentes/componentes :: content}"></div>
            </div>
            <div x-show="$store.institucional.activeTab === 'bloqueo-leccion'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-institucional/bloqueo-leccion/bloqueo-leccion :: content}"></div>
            </div>
        </div>

        <script>
            (function asegurarStoreInstitucional() {
                function crear() {
                    if (!window.Alpine || typeof Alpine.store !== 'function') {
                        return;
                    }
                    if (!Alpine.store('institucional')) {
                        Alpine.store('institucional', { activeTab: 'jornada' });
                    }
                }
                crear();
                document.addEventListener('alpine:init', crear);
            })();

            window.inicializarJornadaLectiva = function inicializarJornadaLectiva(el) {
                var panel = !el ? document.getElementById('institucional-jornada-panel')
                    : (el.id === 'institucional-jornada-panel' ? el
                        : el.querySelector && el.querySelector('#institucional-jornada-panel'));
                if (!panel || !window.Alpine || panel._x_dataStack) {
                    return;
                }
                Alpine.initTree(panel);
            };

            window.jornadaLectiva = function jornadaLectiva(el) {
                var d = el && el.dataset ? el.dataset : {};
                var maxLecciones = 16;
                var bloques = parseBloquesJornada(d.bloques, maxLecciones);
                return {
                    bloques: bloques,
                    siguienteId: bloques.reduce(function (max, bloque) {
                        return Math.max(max, Number(bloque.id) || 0);
                    }, 0) + 1,
                    inicioJornada: d.inicioJornada || '07:00',
                    minutosLeccion: Number(d.minutosLeccion || 40),
                    diasSeleccionados: (d.dias || '').split(',').filter(Boolean),
                    bloquesHtml: '',
                    init: function () {
                        this.pintarBloques();
                    },
                    get cantidadLecciones() {
                        return this.bloques.reduce(function (suma, bloque) {
                            return suma + (Number(bloque.lecciones) || 0);
                        }, 0);
                    },
                    get bloquesSerializados() {
                        var ultimo = this.bloques.length - 1;
                        return this.bloques.map(function (bloque, i) {
                            var pausa = i === ultimo ? 'ninguna' : (bloque.pausa || 'ninguna');
                            var minutos = Number(bloque.minutos);
                            if (i === ultimo || pausa === 'ninguna' || !Number.isFinite(minutos) || minutos <= 0) {
                                pausa = 'ninguna';
                                minutos = 0;
                            } else {
                                minutos = Math.min(Math.floor(minutos), pausa === 'almuerzo' ? 120 : 60);
                            }
                            var lecciones = Number(bloque.lecciones);
                            lecciones = Number.isFinite(lecciones) && lecciones > 0
                                ? Math.min(maxLecciones, Math.floor(lecciones))
                                : 1;
                            return lecciones + ':' + pausa + ':' + minutos;
                        }).join('|');
                    },
                    rangoBloque: function (index) {
                        var desde = 1;
                        for (var i = 0; i < index; i++) {
                            desde += Number(this.bloques[i].lecciones) || 0;
                        }
                        var hasta = desde + (Number(this.bloques[index].lecciones) || 0) - 1;
                        if (hasta < desde) {
                            return 'Sin lecciones';
                        }
                        if (desde === hasta) {
                            return 'Lección ' + desde;
                        }
                        if (hasta === desde + 1) {
                            return 'Lecciones ' + desde + ' y ' + hasta;
                        }
                        return 'Lecciones ' + desde + ' a ' + hasta;
                    },
                    maxLeccionesBloque: function (index) {
                        var propias = Number(this.bloques[index].lecciones) || 0;
                        return Math.max(1, maxLecciones - (this.cantidadLecciones - propias));
                    },
                    limitarLecciones: function (bloque) {
                        var n = Number(bloque.lecciones);
                        if (!Number.isFinite(n)) {
                            return;
                        }
                        var otros = this.bloques.reduce(function (suma, actual) {
                            return suma + (actual === bloque ? 0 : (Number(actual.lecciones) || 0));
                        }, 0);
                        var tope = Math.max(1, maxLecciones - otros);
                        if (n > tope) {
                            bloque.lecciones = tope;
                        }
                    },
                    normalizarLecciones: function (bloque) {
                        var n = Number(bloque.lecciones);
                        if (!Number.isFinite(n) || n < 1) {
                            n = 1;
                        }
                        var otros = this.bloques.reduce(function (suma, actual) {
                            return suma + (actual === bloque ? 0 : (Number(actual.lecciones) || 0));
                        }, 0);
                        bloque.lecciones = Math.min(Math.floor(n), Math.max(1, maxLecciones - otros));
                    },
                    agregarBloque: function () {
                        var restante = maxLecciones - this.cantidadLecciones;
                        if (restante <= 0) {
                            return;
                        }
                        var anterior = this.bloques[this.bloques.length - 1];
                        if (anterior && anterior.pausa === 'ninguna') {
                            this.asignarPausa(anterior, 'receso');
                        }
                        this.bloques.push({
                            id: this.siguienteId++,
                            lecciones: Math.min(2, restante),
                            pausa: 'ninguna',
                            minutos: 0
                        });
                        this.pintarBloques();
                    },
                    quitarBloque: function (index) {
                        if (this.bloques.length <= 1) {
                            return;
                        }
                        this.bloques.splice(index, 1);
                        this.pintarBloques();
                    },
                    asignarPausa: function (bloque, pausa) {
                        bloque.pausa = pausa;
                        if (pausa === 'ninguna') {
                            bloque.minutos = 0;
                            this.pintarBloques();
                            return;
                        }
                        if (!Number(bloque.minutos)) {
                            bloque.minutos = pausa === 'almuerzo' ? 40 : 10;
                        }
                        this.normalizarMinutos(bloque);
                        this.pintarBloques();
                    },
                    onBloquesClick: function (event) {
                        var boton = event.target.closest('[data-jornada-accion]');
                        if (!boton) {
                            return;
                        }
                        var index = Number(boton.getAttribute('data-jornada-index'));
                        var bloque = this.bloques[index];
                        if (!bloque) {
                            return;
                        }
                        if (boton.getAttribute('data-jornada-accion') === 'quitar') {
                            this.quitarBloque(index);
                            return;
                        }
                        if (boton.getAttribute('data-jornada-accion') === 'pausa') {
                            this.asignarPausa(bloque, boton.getAttribute('data-jornada-pausa'));
                        }
                    },
                    onBloquesInput: function (event) {
                        var campo = event.target.getAttribute('data-jornada-campo');
                        var index = Number(event.target.getAttribute('data-jornada-index'));
                        var bloque = this.bloques[index];
                        if (!bloque) {
                            return;
                        }
                        if (campo === 'lecciones') {
                            bloque.lecciones = Number(event.target.value);
                            this.limitarLecciones(bloque);
                            event.target.value = bloque.lecciones;
                        } else if (campo === 'minutos') {
                            bloque.minutos = Number(event.target.value);
                            this.limitarMinutos(bloque);
                            if (Number.isFinite(Number(bloque.minutos))) {
                                event.target.value = bloque.minutos;
                            }
                        }
                    },
                    onBloquesChange: function (event) {
                        var campo = event.target.getAttribute('data-jornada-campo');
                        var index = Number(event.target.getAttribute('data-jornada-index'));
                        var bloque = this.bloques[index];
                        if (!bloque) {
                            return;
                        }
                        if (campo === 'lecciones') {
                            this.normalizarLecciones(bloque);
                            this.pintarBloques();
                        } else if (campo === 'minutos') {
                            this.normalizarMinutos(bloque);
                            this.pintarBloques();
                        }
                    },
                    pintarBloques: function () {
                        var self = this;
                        var ultimo = this.bloques.length - 1;
                        this.bloquesHtml = this.bloques.map(function (bloque, i) {
                            var max = self.maxLeccionesBloque(i);
                            var html = '<article class="jornada-bloque">'
                                + '<header class="jornada-bloque-head"><div>'
                                + '<h5>Bloque ' + (i + 1) + '</h5>'
                                + '<p>' + escapeHtmlJornada(self.rangoBloque(i)) + '</p>'
                                + '</div>';
                            if (self.bloques.length > 1) {
                                html += '<button type="button" class="btn-xs btn-ghost" data-jornada-accion="quitar" data-jornada-index="' + i + '" title="Quitar bloque">Quitar</button>';
                            }
                            html += '</header><div class="jornada-bloque-body">'
                                + '<div class="form-group" style="margin: 0;">'
                                + '<label class="form-label" for="lecciones-bloque-' + bloque.id + '">Lecciones</label>'
                                + '<input class="form-input" type="number" min="1" max="' + max + '" id="lecciones-bloque-' + bloque.id + '"'
                                + ' data-jornada-campo="lecciones" data-jornada-index="' + i + '" value="' + (Number(bloque.lecciones) || 1) + '">'
                                + '</div>';
                            if (i < ultimo) {
                                html += '<div class="jornada-bloque-pausa">'
                                    + '<span class="form-label">Después del bloque</span>'
                                    + '<div class="jornada-pausa-ops" role="group" aria-label="Pausa del bloque ' + (i + 1) + '">'
                                    + '<button type="button" class="' + (bloque.pausa === 'receso' ? 'is-on' : '') + '" data-jornada-accion="pausa" data-jornada-pausa="receso" data-jornada-index="' + i + '">Receso</button>'
                                    + '<button type="button" class="' + (bloque.pausa === 'almuerzo' ? 'is-on' : '') + '" data-jornada-accion="pausa" data-jornada-pausa="almuerzo" data-jornada-index="' + i + '">Almuerzo</button>'
                                    + '<button type="button" class="' + (bloque.pausa === 'ninguna' ? 'is-on' : '') + '" data-jornada-accion="pausa" data-jornada-pausa="ninguna" data-jornada-index="' + i + '">Sin pausa</button>'
                                    + '</div>';
                                if (bloque.pausa !== 'ninguna') {
                                    html += '<div class="jornada-recreo-min">'
                                        + '<input class="form-input" type="number" min="0" max="' + (bloque.pausa === 'almuerzo' ? 120 : 60) + '"'
                                        + ' data-jornada-campo="minutos" data-jornada-index="' + i + '" value="' + (Number(bloque.minutos) || 0) + '">'
                                        + '<span>min</span></div>';
                                }
                                html += '</div>';
                            } else {
                                html += '<p class="jornada-bloque-fin">Fin de la jornada</p>';
                            }
                            html += '</div></article>';
                            return html;
                        }).join('');
                    },
                    normalizarMinutos: function (bloque) {
                        var max = bloque.pausa === 'almuerzo' ? 120 : 60;
                        var n = Number(bloque.minutos);
                        if (!Number.isFinite(n) || n < 0) {
                            n = 0;
                        }
                        bloque.minutos = Math.min(Math.floor(n), max);
                    },
                    limitarMinutos: function (bloque) {
                        var n = Number(bloque.minutos);
                        if (!Number.isFinite(n)) {
                            return;
                        }
                        var max = bloque.pausa === 'almuerzo' ? 120 : 60;
                        if (n > max) {
                            bloque.minutos = max;
                        } else if (n < 0) {
                            bloque.minutos = 0;
                        }
                    },
                    prepararEnvio: function (event) {
                        var self = this;
                        this.bloques.forEach(function (bloque) {
                            self.normalizarLecciones(bloque);
                            self.normalizarMinutos(bloque);
                        });
                        var minutos = Number(this.minutosLeccion);
                        if (!Number.isFinite(minutos) || minutos < 20) {
                            this.minutosLeccion = 20;
                        } else if (minutos > 90) {
                            this.minutosLeccion = 90;
                        }
                        if (this.diasSeleccionados.length === 0 || this.cantidadLecciones < 1) {
                            event.preventDefault();
                        }
                    },
                    sumarMinutos: function (hora, minutos) {
                        var partes = String(hora || '07:00').split(':');
                        var total = ((Number(partes[0]) || 0) * 60 + (Number(partes[1]) || 0) + Number(minutos || 0)) % 1440;
                        total = (total + 1440) % 1440;
                        return String(Math.floor(total / 60)).padStart(2, '0') + ':'
                            + String(total % 60).padStart(2, '0');
                    },
                    get lineas() {
                        var self = this;
                        var duracion = Number(this.minutosLeccion) || 0;
                        var cursor = this.inicioJornada || '07:00';
                        var out = [];
                        var numero = 1;
                        this.bloques.forEach(function (bloque, indice) {
                            var lecciones = Number(bloque.lecciones) || 0;
                            for (var i = 0; i < lecciones; i++) {
                                var ini = cursor;
                                var fin = self.sumarMinutos(ini, duracion);
                                out.push({
                                    clave: 'l-' + numero,
                                    tipo: 'leccion',
                                    inicio: ini,
                                    fin: fin,
                                    etiqueta: 'Lección ' + numero
                                });
                                cursor = fin;
                                numero += 1;
                            }
                            if (indice === self.bloques.length - 1) {
                                return;
                            }
                            var minutos = Number(bloque.minutos) || 0;
                            if (minutos <= 0 || bloque.pausa === 'ninguna') {
                                return;
                            }
                            var finPausa = self.sumarMinutos(cursor, minutos);
                            out.push({
                                clave: 'p-' + bloque.id,
                                tipo: bloque.pausa === 'almuerzo' ? 'almuerzo' : 'recreo',
                                inicio: cursor,
                                fin: finPausa,
                                etiqueta: (bloque.pausa === 'almuerzo' ? 'Almuerzo' : 'Receso') + ' · ' + minutos + ' min'
                            });
                            cursor = finPausa;
                        });
                        return out;
                    },
                    get finJornada() {
                        var lineas = this.lineas;
                        return lineas.length ? lineas[lineas.length - 1].fin : '—';
                    },
                    get lineasHtml() {
                        return this.lineas.map(function (linea) {
                            var clase = linea.tipo === 'recreo' ? 'is-break'
                                : (linea.tipo === 'almuerzo' ? 'is-lunch' : 'is-lesson');
                            return '<li class="' + clase + '">'
                                + '<span class="jornada-time">' + escapeHtmlJornada(linea.inicio) + ' – ' + escapeHtmlJornada(linea.fin) + '</span>'
                                + '<span class="jornada-label">' + escapeHtmlJornada(linea.etiqueta) + '</span>'
                                + '</li>';
                        }).join('');
                    }
                };
            };

            function escapeHtmlJornada(valor) {
                return String(valor == null ? '' : valor)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function parseBloquesJornada(raw, maxLecciones) {
                maxLecciones = maxLecciones || 16;
                if (!raw || !String(raw).trim()) {
                    return bloquesJornadaPredeterminados();
                }
                var bloques = [];
                String(raw).split('|').forEach(function (parte, i) {
                    var recorte = String(parte).trim();
                    if (!recorte) {
                        return;
                    }
                    var bits = recorte.split(':');
                    if (bits.length < 3) {
                        return;
                    }
                    var lecciones = Number(bits[0]);
                    var pausa = bits[1] === 'receso' || bits[1] === 'almuerzo' ? bits[1] : 'ninguna';
                    var minutos = Number(bits[2]);
                    if (!Number.isFinite(lecciones) || lecciones < 1) {
                        return;
                    }
                    if (pausa === 'ninguna' || !Number.isFinite(minutos) || minutos < 0) {
                        minutos = 0;
                    } else {
                        minutos = Math.min(Math.floor(minutos), pausa === 'almuerzo' ? 120 : 60);
                    }
                    bloques.push({
                        id: i + 1,
                        lecciones: Math.min(maxLecciones, Math.floor(lecciones)),
                        pausa: pausa,
                        minutos: minutos
                    });
                });
                return bloques.length ? bloques : bloquesJornadaPredeterminados();
            }

            function bloquesJornadaPredeterminados() {
                return [
                    { id: 1, lecciones: 2, pausa: 'receso', minutos: 15 },
                    { id: 2, lecciones: 2, pausa: 'receso', minutos: 20 },
                    { id: 3, lecciones: 2, pausa: 'almuerzo', minutos: 40 },
                    { id: 4, lecciones: 2, pausa: 'receso', minutos: 10 },
                    { id: 5, lecciones: 2, pausa: 'receso', minutos: 10 },
                    { id: 6, lecciones: 2, pausa: 'ninguna', minutos: 0 }
                ];
            }

            if (!window.institucionalEventsRegistrados) {
                document.body.addEventListener('htmx:afterSwap', function (event) {
                    var elt = event.detail && event.detail.elt;
                    if (!elt || typeof window.inicializarJornadaLectiva !== 'function') {
                        return;
                    }
                    if (elt.id === 'institucional-jornada-panel'
                            || (elt.querySelector && elt.querySelector('#institucional-jornada-panel'))) {
                        window.inicializarJornadaLectiva(elt);
                    }
                });
                document.addEventListener('institucionalGuardado', function (event) {
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje);
                    }
                });
                document.addEventListener('institucionalError', function (event) {
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje, 'error');
                    }
                });
                window.institucionalEventsRegistrados = true;
            }

            if (document.getElementById('institucional-jornada-panel')) {
                window.inicializarJornadaLectiva(document.getElementById('institucional-jornada-panel'));
            }
        </script>
    </main>
    </th:block>
