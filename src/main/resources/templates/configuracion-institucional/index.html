<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Configuración Institucional — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Configuración Institucional</h2>
    <p layout:fragment="page-subtitle">Jornada lectiva, componentes de evaluación, tipos de materia, escala de notas y asistencia</p>

    <th:block th:fragment="htmx-content">
    <h2 id="topbar-page-title" hx-swap-oob="true">Configuración Institucional</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Jornada lectiva, componentes de evaluación, tipos de materia, escala de notas y asistencia</p>
    <main layout:fragment="content" id="config-institucional-root">
        <style>
            #config-institucional-root :is(button, a, input, select, textarea, [tabindex]):focus-visible {
                outline: 2px solid var(--primary);
                outline-offset: 2px;
                box-shadow: 0 0 0 4px rgba(45, 90, 135, 0.16);
            }
            #config-institucional-root .form-input,
            #config-institucional-root .form-select {
                padding: 0.5rem 0.75rem;
            }
            #config-institucional-root .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            /* ── Tabs principales (WAI-ARIA) ── */
            .config-tabs-container {
                margin-bottom: 1.5rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }
            .config-tabs-container::-webkit-scrollbar { height: 6px; }
            .config-tabs-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
            .config-tabs {
                display: grid;
                grid-template-columns: repeat(4, minmax(150px, 1fr));
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                min-height: 48px;
                padding: 10px 14px;
                font-size: 0.85rem;
                font-weight: 600;
                color: #475569;
                text-decoration: none;
                border-radius: 10px;
                transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
                cursor: pointer;
                border: 1px solid transparent;
                background: transparent;
                white-space: nowrap;
                text-align: left;
            }
            .config-tab-btn svg {
                width: 18px;
                height: 18px;
                flex-shrink: 0;
                opacity: 0.85;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: #f1f5f9;
            }
            .config-tab-btn.active {
                color: #ffffff;
                background-color: var(--primary);
                box-shadow: 0 4px 12px rgba(45, 90, 135, 0.22);
            }
            .config-tab-btn.active svg {
                opacity: 1;
            }
            .config-tab-copy {
                display: flex;
                flex-direction: column;
                line-height: 1.2;
            }
            .config-tab-sub {
                font-size: 0.72rem;
                font-weight: 500;
                opacity: 0.78;
                margin-top: 2px;
            }
            .tab-pane {
                animation: configFadeIn 0.22s ease-out;
            }
            @keyframes configFadeIn {
                from { opacity: 0; transform: translateY(4px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @media (prefers-reduced-motion: reduce) {
                .tab-pane { animation: none; }
                .config-tab-btn, .jornada-day, .jornada-pausa-ops button { transition: none; }
            }

            /* ── Textos de ayuda y alertas inline ── */
            .academic-help {
                color: #475569;
                font-size: 0.84rem;
                line-height: 1.45;
                margin-top: 0.25rem;
            }
            .inst-alert {
                display: flex;
                align-items: flex-start;
                gap: 0.65rem;
                padding: 0.8rem 1rem;
                border-radius: 10px;
                font-size: 0.84rem;
                line-height: 1.45;
            }
            .inst-alert svg {
                width: 18px;
                height: 18px;
                flex-shrink: 0;
                margin-top: 1px;
            }
            .inst-alert--error {
                background: #fef2f2;
                border: 1px solid #fecaca;
                color: #991b1b;
            }
            .inst-alert--info {
                background: #eff6ff;
                border: 1px solid #bfdbfe;
                color: #1e3a5f;
            }
            .inst-alert--warning {
                background: #fffbeb;
                border: 1px solid #fde68a;
                color: #92400e;
            }
            .inst-icon-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 36px;
                min-height: 36px;
                padding: 0 8px;
                border-radius: 8px;
                border: 1px solid transparent;
                background: transparent;
                color: #475569;
                cursor: pointer;
                transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            }
            .inst-icon-btn:hover {
                background: #f1f5f9;
                color: var(--primary);
                border-color: #cbd5e1;
            }
            .inst-icon-btn--danger:hover {
                background: #fef2f2;
                color: #b91c1c;
                border-color: #fecaca;
            }
            .inst-icon-btn svg {
                width: 16px;
                height: 16px;
            }
            .inst-pill-count {
                display: inline-flex;
                align-items: center;
                padding: 2px 9px;
                border-radius: 999px;
                font-size: 0.74rem;
                font-weight: 700;
                background: #eff6ff;
                color: #1e40af;
                border: 1px solid #bfdbfe;
                vertical-align: middle;
                margin-left: 0.45rem;
            }
            .inst-unsaved-badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 4px 10px;
                border-radius: 999px;
                font-size: 0.76rem;
                font-weight: 600;
                background: #fffbeb;
                color: #92400e;
                border: 1px solid #fde68a;
            }
            .inst-unsaved-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #d97706;
            }

            /* ── Jornada lectiva ── */
            .card.jornada-card {
                position: relative;
                overflow: visible;
            }
            .jornada-header-actions {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.75rem;
            }
            .jornada-kpis {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 0.75rem;
                padding: 1rem 1.5rem;
                background: #f8fafc;
                border-bottom: 1px solid var(--border);
            }
            .jornada-kpi {
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 0.7rem 0.9rem;
            }
            .jornada-kpi-label {
                display: block;
                font-size: 0.72rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: #64748b;
            }
            .jornada-kpi-value {
                display: block;
                margin-top: 0.2rem;
                font-size: 1.15rem;
                font-weight: 800;
                font-variant-numeric: tabular-nums;
                color: var(--text-primary);
            }
            .jornada-kpi-sub {
                display: block;
                font-size: 0.74rem;
                color: #475569;
                margin-top: 1px;
            }
            .jornada-body {
                display: grid;
                grid-template-columns: minmax(0, 1.35fr) minmax(290px, 0.85fr);
                gap: 0;
                align-items: start;
            }
            .jornada-form {
                padding: 1.35rem 1.5rem 1.6rem;
                border-right: 1px solid var(--border);
            }
            .jornada-section {
                border: 0;
                margin: 0;
                padding: 0;
            }
            .jornada-section + .jornada-section {
                margin-top: 1.75rem;
                padding-top: 1.5rem;
                border-top: 1px solid var(--border);
            }
            .jornada-section-head {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 0.75rem;
                flex-wrap: wrap;
                margin-bottom: 0.85rem;
            }
            .jornada-section-head h4,
            .jornada-section-head legend {
                margin: 0;
                padding: 0;
                font-size: 0.95rem;
                font-weight: 700;
                color: var(--text-primary);
            }
            .jornada-section-head p {
                margin: 0.2rem 0 0;
                color: #475569;
                font-size: 0.82rem;
                line-height: 1.45;
            }
            .jornada-presets {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .jornada-preset-btn {
                min-height: 32px;
                padding: 4px 10px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: #f8fafc;
                color: #334155;
                font-size: 0.76rem;
                font-weight: 600;
                cursor: pointer;
            }
            .jornada-preset-btn:hover {
                border-color: var(--primary);
                color: var(--primary);
                background: #eff6ff;
            }
            .jornada-days {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .jornada-day {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                min-width: 72px;
                min-height: 44px;
                padding: 0.5rem 0.8rem;
                border: 1.5px solid #cbd5e1;
                border-radius: 10px;
                background: #ffffff;
                text-align: center;
                font-size: 0.84rem;
                font-weight: 700;
                color: #334155;
                cursor: pointer;
                user-select: none;
                transition: border-color 0.15s, background-color 0.15s, color 0.15s, box-shadow 0.15s;
            }
            .jornada-day input {
                position: absolute;
                opacity: 0;
                width: 1px;
                height: 1px;
                margin: 0;
            }
            .jornada-day:has(input:focus-visible) {
                outline: 2px solid var(--primary);
                outline-offset: 2px;
                box-shadow: 0 0 0 4px rgba(45, 90, 135, 0.18);
            }
            .jornada-day:hover {
                border-color: var(--primary);
                background: #f8fafc;
            }
            .jornada-day.is-on {
                color: #ffffff;
                background: var(--primary);
                border-color: var(--primary);
                box-shadow: 0 3px 10px rgba(45, 90, 135, 0.22);
            }
            .jornada-day-check {
                width: 14px;
                height: 14px;
                display: none;
            }
            .jornada-day.is-on .jornada-day-check {
                display: inline-block;
            }
            .jornada-fields {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }
            .jornada-fields .form-group {
                margin: 0;
            }
            .jornada-fields .form-input {
                min-height: 44px;
            }
            .jornada-field-hint {
                display: block;
                margin-top: 0.3rem;
                font-size: 0.76rem;
                color: #475569;
            }
            .jornada-bloques {
                display: grid;
                gap: 0.85rem;
            }
            .jornada-bloque {
                border: 1px solid #cbd5e1;
                border-radius: 12px;
                background: #ffffff;
                padding: 0.95rem 1rem 1rem;
                transition: border-color 0.15s ease;
            }
            .jornada-bloque:focus-within {
                border-color: var(--primary);
            }
            .jornada-bloque-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.75rem;
                margin-bottom: 0.85rem;
                padding-bottom: 0.65rem;
                border-bottom: 1px solid #f1f5f9;
            }
            .jornada-bloque-meta {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                flex-wrap: wrap;
            }
            .jornada-bloque-num {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 26px;
                height: 26px;
                padding: 0 8px;
                border-radius: 8px;
                background: #eff6ff;
                color: var(--primary);
                font-size: 0.76rem;
                font-weight: 800;
            }
            .jornada-bloque-head h5 {
                margin: 0;
                font-size: 0.88rem;
                font-weight: 700;
                color: var(--text-primary);
            }
            .jornada-bloque-rango {
                font-size: 0.78rem;
                color: #475569;
                font-variant-numeric: tabular-nums;
            }
            .jornada-bloque-body {
                display: grid;
                grid-template-columns: 160px minmax(0, 1fr);
                gap: 0.9rem 1.25rem;
                align-items: start;
            }
            .jornada-stepper {
                display: inline-flex;
                align-items: stretch;
                border: 1px solid #cbd5e1;
                border-radius: 10px;
                overflow: hidden;
                background: #ffffff;
            }
            .jornada-stepper button {
                width: 38px;
                min-height: 40px;
                border: 0;
                background: #f8fafc;
                color: #1e293b;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            .jornada-stepper button:hover:not(:disabled) {
                background: #e2e8f0;
            }
            .jornada-stepper button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            #config-institucional-root .jornada-stepper input.form-input {
                width: 64px;
                min-height: 40px;
                border: 0;
                border-left: 1px solid #e2e8f0;
                border-right: 1px solid #e2e8f0;
                border-radius: 0;
                text-align: center;
                padding: 0 6px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                box-shadow: none;
                -moz-appearance: textfield;
            }
            #config-institucional-root .jornada-stepper input.form-input::-webkit-outer-spin-button,
            #config-institucional-root .jornada-stepper input.form-input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            .jornada-bloque-pausa {
                display: grid;
                gap: 0.55rem;
            }
            .jornada-pausa-ops {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .jornada-pausa-ops button {
                min-height: 38px;
                border: 1px solid #cbd5e1;
                background: #ffffff;
                color: #334155;
                border-radius: 9px;
                padding: 0.38rem 0.78rem;
                font-size: 0.8rem;
                font-weight: 600;
                cursor: pointer;
                transition: border-color 0.15s, background-color 0.15s, color 0.15s;
            }
            .jornada-pausa-ops button:hover {
                border-color: var(--primary);
                color: var(--primary);
            }
            .jornada-pausa-ops button.is-on {
                color: #ffffff;
                background: var(--primary);
                border-color: var(--primary);
            }
            .jornada-bloque-fin {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin: 0.35rem 0 0;
                padding: 6px 10px;
                border-radius: 8px;
                background: #f8fafc;
                border: 1px dashed #cbd5e1;
                font-size: 0.8rem;
                font-weight: 600;
                color: #475569;
            }
            .jornada-recreo-min {
                display: flex;
                align-items: center;
                gap: 0.55rem;
                flex-wrap: wrap;
            }
            #config-institucional-root .jornada-recreo-min .form-input {
                width: 92px;
                min-height: 40px;
                padding: 0.45rem 0.65rem;
                text-align: center;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }
            .jornada-recreo-min span {
                font-size: 0.8rem;
                font-weight: 600;
                color: #475569;
            }
            .jornada-add-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 0.75rem;
                margin-top: 1rem;
            }
            .jornada-preview {
                display: flex;
                flex-direction: column;
                min-height: 0;
                padding: 1.35rem 1.35rem 1.6rem;
                background: #f8fafc;
                position: sticky;
                top: calc(var(--topbar-height) + 12px);
                z-index: 4;
                max-height: calc(100vh - var(--topbar-height) - 24px);
                border-bottom-right-radius: var(--radius);
            }
            .jornada-preview-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 0.75rem;
                margin: -1.35rem -1.35rem 0.9rem;
                padding: 0.95rem 1.35rem 0.85rem;
                flex-shrink: 0;
                background: #f8fafc;
                border-bottom: 1px solid var(--border);
            }
            .jornada-preview-head h4 {
                margin: 0;
                font-size: 0.92rem;
                font-weight: 700;
                color: var(--text-primary);
            }
            .jornada-preview-head span {
                font-size: 0.78rem;
                font-weight: 700;
                color: var(--primary);
                font-variant-numeric: tabular-nums;
            }
            .jornada-timeline {
                list-style: none;
                margin: 0;
                padding: 0;
                flex: 1 1 auto;
                min-height: 0;
                overflow: auto;
                overscroll-behavior: contain;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: #ffffff;
            }
            .jornada-timeline li {
                display: grid;
                grid-template-columns: 112px 1fr auto;
                gap: 0.55rem;
                align-items: center;
                padding: 0.58rem 0.85rem;
                border-bottom: 1px solid #f1f5f9;
                font-size: 0.81rem;
            }
            .jornada-timeline li:last-child { border-bottom: 0; }
            .jornada-timeline .jornada-time {
                font-variant-numeric: tabular-nums;
                font-weight: 700;
                color: #475569;
            }
            .jornada-timeline .is-lesson .jornada-label {
                font-weight: 600;
                color: var(--text-primary);
            }
            .jornada-timeline .is-break {
                background: #e0f2fe;
                color: #0c4a6e;
                font-weight: 700;
            }
            .jornada-timeline .is-lunch {
                background: #ffedd5;
                color: #9a3412;
                font-weight: 700;
            }
            .jornada-timeline .jornada-tag {
                font-size: 0.68rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                padding: 2px 7px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.75);
            }

            @media (max-width: 1024px) {
                .config-tabs {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
                .jornada-kpis {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }
            @media (max-width: 900px) {
                .jornada-body {
                    grid-template-columns: 1fr;
                }
                .jornada-form {
                    border-right: 0;
                    border-bottom: 1px solid var(--border);
                }
                .jornada-preview {
                    position: static;
                    max-height: none;
                    border-bottom-left-radius: var(--radius);
                }
                .jornada-timeline {
                    max-height: min(460px, 65vh);
                }
            }
            @media (max-width: 640px) {
                .config-tabs {
                    grid-template-columns: 1fr;
                }
                .jornada-fields,
                .jornada-bloque-body {
                    grid-template-columns: 1fr;
                }
            }
        </style>

        <div x-data="configInstitucionalTabs()" @keydown.window.escape="cerrarModalesSiAbiertos()">
            <div class="config-tabs-container">
                <div class="config-tabs" role="tablist" aria-label="Secciones de configuración institucional"
                     @keydown="onTabKeydown($event)">
                    <button type="button" role="tab" id="tab-jornada" class="config-tab-btn"
                            :class="{ 'active': activeTab === 'jornada' }"
                            :aria-selected="activeTab === 'jornada' ? 'true' : 'false'"
                            :tabindex="activeTab === 'jornada' ? 0 : -1"
                            aria-controls="panel-jornada"
                            @click="seleccionar('jornada')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span class="config-tab-copy">
                            <span>Jornada lectiva</span>
                            <span class="config-tab-sub">Días, reloj y pausas</span>
                        </span>
                    </button>
                    <button type="button" role="tab" id="tab-componentes" class="config-tab-btn"
                            :class="{ 'active': activeTab === 'componentes' }"
                            :aria-selected="activeTab === 'componentes' ? 'true' : 'false'"
                            :tabindex="activeTab === 'componentes' ? 0 : -1"
                            aria-controls="panel-componentes"
                            @click="seleccionar('componentes')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                            <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                        </svg>
                        <span class="config-tab-copy">
                            <span>Componentes</span>
                            <span class="config-tab-sub">Porcentajes de nota</span>
                        </span>
                    </button>
                    <button type="button" role="tab" id="tab-tipos-materia" class="config-tab-btn"
                            :class="{ 'active': activeTab === 'tipos-materia' }"
                            :aria-selected="activeTab === 'tipos-materia' ? 'true' : 'false'"
                            :tabindex="activeTab === 'tipos-materia' ? 0 : -1"
                            aria-controls="panel-tipos-materia"
                            @click="seleccionar('tipos-materia')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                            <line x1="7" y1="7" x2="7.01" y2="7"></line>
                        </svg>
                        <span class="config-tab-copy">
                            <span>Tipos de materia</span>
                            <span class="config-tab-sub">Categorías y bloqueos</span>
                        </span>
                    </button>
                    <button type="button" role="tab" id="tab-escala-notas" class="config-tab-btn"
                            :class="{ 'active': activeTab === 'escala-notas' }"
                            :aria-selected="activeTab === 'escala-notas' ? 'true' : 'false'"
                            :tabindex="activeTab === 'escala-notas' ? 0 : -1"
                            aria-controls="panel-escala-notas"
                            @click="seleccionar('escala-notas')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="4" y1="21" x2="4" y2="14"></line>
                            <line x1="4" y1="10" x2="4" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12" y2="3"></line>
                            <line x1="20" y1="21" x2="20" y2="16"></line>
                            <line x1="20" y1="12" x2="20" y2="3"></line>
                            <line x1="1" y1="14" x2="7" y2="14"></line>
                            <line x1="9" y1="8" x2="15" y2="8"></line>
                            <line x1="17" y1="16" x2="23" y2="16"></line>
                        </svg>
                        <span class="config-tab-copy">
                            <span>Escala y asistencia</span>
                            <span class="config-tab-sub">Notas y conducta</span>
                        </span>
                    </button>
                </div>
            </div>

            <div id="panel-jornada" role="tabpanel" aria-labelledby="tab-jornada"
                 x-show="activeTab === 'jornada'" class="tab-pane">
                <div th:replace="~{configuracion-institucional/jornada/jornada :: content}"></div>
            </div>
            <div id="panel-componentes" role="tabpanel" aria-labelledby="tab-componentes"
                 x-show="activeTab === 'componentes'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-institucional/componentes/componentes :: content}"></div>
            </div>
            <div id="panel-tipos-materia" role="tabpanel" aria-labelledby="tab-tipos-materia"
                 x-show="activeTab === 'tipos-materia'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-institucional/tipos-materia/tipos-materia :: content}"></div>
            </div>
            <div id="panel-escala-notas" role="tabpanel" aria-labelledby="tab-escala-notas"
                 x-show="activeTab === 'escala-notas'" class="tab-pane" x-cloak>
                <div th:replace="~{configuracion-institucional/escala-notas/escala-notas :: content}"></div>
            </div>
        </div>

        <script>
            window.configInstitucionalTabs = function configInstitucionalTabs() {
                const ORDEN = ['jornada', 'componentes', 'tipos-materia', 'escala-notas'];
                const hash = (window.location.hash || '').replace('#', '');
                const inicial = ORDEN.includes(hash) ? hash : 'jornada';
                return {
                    activeTab: inicial,
                    seleccionar: function (tab) {
                        if (!ORDEN.includes(tab)) return;
                        this.activeTab = tab;
                        try {
                            history.replaceState(null, '', '#' + tab);
                        } catch (e) {
                            // Ignorar si el historial está restringido
                        }
                    },
                    onTabKeydown: function (event) {
                        const teclas = ['ArrowRight', 'ArrowLeft', 'Home', 'End'];
                        if (!teclas.includes(event.key)) return;
                        const actual = ORDEN.indexOf(this.activeTab);
                        let siguiente = actual;
                        if (event.key === 'ArrowRight') siguiente = (actual + 1) % ORDEN.length;
                        if (event.key === 'ArrowLeft') siguiente = (actual - 1 + ORDEN.length) % ORDEN.length;
                        if (event.key === 'Home') siguiente = 0;
                        if (event.key === 'End') siguiente = ORDEN.length - 1;
                        event.preventDefault();
                        const destino = ORDEN[siguiente];
                        this.seleccionar(destino);
                        const btn = document.getElementById('tab-' + destino);
                        if (btn) btn.focus();
                    },
                    cerrarModalesSiAbiertos: function () {
                        const deleteModal = document.getElementById('academic-delete-modal');
                        if (deleteModal && deleteModal.style.display !== 'none' && typeof cerrarConfirmacionAcademica === 'function') {
                            cerrarConfirmacionAcademica();
                            return;
                        }
                        const modal = document.getElementById('modal-container');
                        if (modal && modal.classList.contains('show') && typeof cerrarModalInstitucional === 'function') {
                            cerrarModalInstitucional();
                        }
                    }
                };
            };

            window.jornadaLectiva = function jornadaLectiva(el) {
                const d = el && el.dataset ? el.dataset : {};
                const MAX_LECCIONES = 16;
                const bloques = parseBloquesJornada(d.bloques, MAX_LECCIONES);
                return {
                    bloques: bloques,
                    siguienteId: bloques.reduce(function (max, bloque) {
                        return Math.max(max, Number(bloque.id) || 0);
                    }, 0) + 1,
                    inicioJornada: d.inicioJornada || '07:00',
                    minutosLeccion: Number(d.minutosLeccion || 40),
                    diasSeleccionados: (d.dias || '').split(',').filter(Boolean),
                    sucio: false,
                    errorFormulario: '',

                    get cantidadLecciones() {
                        return this.bloques.reduce(function (suma, bloque) {
                            const n = Number(bloque.lecciones);
                            return suma + (Number.isFinite(n) && n > 0 ? Math.floor(n) : 0);
                        }, 0);
                    },
                    get leccionesDisponibles() {
                        return Math.max(0, MAX_LECCIONES - this.cantidadLecciones);
                    },
                    get bloquesSerializados() {
                        const ultimo = this.bloques.length - 1;
                        return this.bloques.map(function (bloque, i) {
                            let pausa = i === ultimo ? 'ninguna' : (bloque.pausa || 'ninguna');
                            let minutos = Number(bloque.minutos);
                            if (i === ultimo || pausa === 'ninguna' || !Number.isFinite(minutos) || minutos <= 0) {
                                pausa = 'ninguna';
                                minutos = 0;
                            } else {
                                minutos = Math.min(Math.floor(minutos), pausa === 'almuerzo' ? 120 : 60);
                            }
                            let lecciones = Number(bloque.lecciones);
                            lecciones = Number.isFinite(lecciones) && lecciones > 0
                                ? Math.min(MAX_LECCIONES, Math.floor(lecciones))
                                : 1;
                            return lecciones + ':' + pausa + ':' + minutos;
                        }).join('|');
                    },
                    get erroresJornada() {
                        const out = [];
                        if (this.diasSeleccionados.length === 0) {
                            out.push('Selecciona al menos un día laboral.');
                        }
                        if (!this.inicioJornada) {
                            out.push('Indica la hora de inicio de la jornada.');
                        }
                        const min = Number(this.minutosLeccion);
                        if (!Number.isFinite(min) || min < 20 || min > 90) {
                            out.push('La duración por lección debe estar entre 20 y 90 minutos.');
                        }
                        if (this.cantidadLecciones < 1 || this.cantidadLecciones > MAX_LECCIONES) {
                            out.push('El total de lecciones debe estar entre 1 y ' + MAX_LECCIONES + '.');
                        }
                        return out;
                    },
                    aplicarDiasPreset: function (lista) {
                        this.diasSeleccionados = lista.slice();
                        this.sucio = true;
                        this.errorFormulario = '';
                    },
                    rangoBloque: function (index) {
                        let desde = 1;
                        for (let i = 0; i < index; i++) {
                            const n = Number(this.bloques[i].lecciones);
                            desde += Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
                        }
                        const propias = Number(this.bloques[index] && this.bloques[index].lecciones);
                        const cant = Number.isFinite(propias) && propias > 0 ? Math.floor(propias) : 0;
                        const hasta = desde + cant - 1;
                        if (hasta < desde) return 'Sin lecciones';
                        if (desde === hasta) return 'Lección ' + desde;
                        if (hasta === desde + 1) return 'Lecciones ' + desde + ' y ' + hasta;
                        return 'Lecciones ' + desde + ' a ' + hasta;
                    },
                    horarioBloque: function (index) {
                        const duracion = Number(this.minutosLeccion) || 40;
                        let cursor = this.inicioJornada || '07:00';
                        for (let i = 0; i < this.bloques.length; i++) {
                            const b = this.bloques[i];
                            const lecs = Math.max(0, Math.floor(Number(b.lecciones) || 0));
                            const ini = cursor;
                            const fin = this.sumarMinutos(ini, lecs * duracion);
                            if (i === index) {
                                return lecs > 0 ? ini + ' – ' + fin : '—';
                            }
                            cursor = fin;
                            const minPausa = Number(b.minutos) || 0;
                            if (i < this.bloques.length - 1 && b.pausa !== 'ninguna' && minPausa > 0) {
                                cursor = this.sumarMinutos(cursor, minPausa);
                            }
                        }
                        return '—';
                    },
                    maxLeccionesBloque: function (index) {
                        const propias = Number(this.bloques[index] && this.bloques[index].lecciones) || 0;
                        return Math.max(1, MAX_LECCIONES - (this.cantidadLecciones - propias));
                    },
                    ajustarLecciones: function (index, delta) {
                        const bloque = this.bloques[index];
                        if (!bloque) return;
                        const actual = Number(bloque.lecciones) || 1;
                        const max = this.maxLeccionesBloque(index);
                        const nuevo = Math.min(max, Math.max(1, actual + delta));
                        if (nuevo !== actual) {
                            bloque.lecciones = nuevo;
                            this.sucio = true;
                        }
                    },
                    normalizarLecciones: function (index) {
                        const bloque = this.bloques[index];
                        if (!bloque) return;
                        let n = Number(bloque.lecciones);
                        if (!Number.isFinite(n) || n < 1) n = 1;
                        const otros = this.bloques.reduce(function (suma, actual, idx) {
                            const v = Number(actual.lecciones);
                            return suma + (idx === index ? 0 : (Number.isFinite(v) && v > 0 ? Math.floor(v) : 0));
                        }, 0);
                        bloque.lecciones = Math.min(Math.floor(n), Math.max(1, MAX_LECCIONES - otros));
                    },
                    agregarBloque: function () {
                        const restante = MAX_LECCIONES - this.cantidadLecciones;
                        if (restante <= 0) return;
                        const anterior = this.bloques[this.bloques.length - 1];
                        if (anterior && anterior.pausa === 'ninguna') {
                            this.asignarPausa(anterior, 'receso');
                        }
                        this.bloques.push({
                            id: this.siguienteId++,
                            lecciones: Math.min(2, restante),
                            pausa: 'ninguna',
                            minutos: 0
                        });
                        this.sucio = true;
                    },
                    quitarBloque: function (index) {
                        if (this.bloques.length <= 1) return;
                        this.bloques.splice(index, 1);
                        this.sucio = true;
                    },
                    asignarPausa: function (bloque, pausa) {
                        bloque.pausa = pausa;
                        this.sucio = true;
                        if (pausa === 'ninguna') {
                            bloque.minutos = 0;
                            return;
                        }
                        if (!Number(bloque.minutos)) {
                            bloque.minutos = pausa === 'almuerzo' ? 40 : 15;
                        }
                        this.normalizarMinutos(bloque);
                    },
                    normalizarMinutos: function (bloque) {
                        const max = bloque.pausa === 'almuerzo' ? 120 : 60;
                        let n = Number(bloque.minutos);
                        if (!Number.isFinite(n) || n < 0) n = 0;
                        bloque.minutos = Math.min(Math.floor(n), max);
                    },
                    normalizarMinutosLeccion: function () {
                        const m = Number(this.minutosLeccion);
                        if (!Number.isFinite(m) || m < 20) this.minutosLeccion = 20;
                        else if (m > 90) this.minutosLeccion = 90;
                        else this.minutosLeccion = Math.round(m);
                    },
                    prepararEnvio: function (event) {
                        const self = this;
                        this.bloques.forEach(function (bloque, idx) {
                            self.normalizarLecciones(idx);
                            self.normalizarMinutos(bloque);
                        });
                        this.normalizarMinutosLeccion();
                        const form = event.currentTarget || event.target;
                        if (form && form.querySelector) {
                            const hiddenBloques = form.querySelector('[name="bloquesJornada"]');
                            if (hiddenBloques) hiddenBloques.value = this.bloquesSerializados;
                            const minInput = form.querySelector('[name="minutosLeccion"]');
                            if (minInput) minInput.value = this.minutosLeccion;
                        }
                        const errores = this.erroresJornada;
                        if (errores.length > 0) {
                            this.errorFormulario = errores[0];
                            event.preventDefault();
                            event.stopPropagation();
                            document.dispatchEvent(new CustomEvent('institucionalError', {
                                detail: { mensaje: errores[0] }
                            }));
                            return;
                        }
                        this.errorFormulario = '';
                    },
                    sumarMinutos: function (hora, minutos) {
                        const partes = String(hora || '07:00').split(':');
                        let total = ((Number(partes[0]) || 0) * 60 + (Number(partes[1]) || 0) + Number(minutos || 0)) % 1440;
                        total = (total + 1440) % 1440;
                        return String(Math.floor(total / 60)).padStart(2, '0') + ':'
                            + String(total % 60).padStart(2, '0');
                    },
                    get lineas() {
                        const self = this;
                        const duracion = Math.max(1, Number(this.minutosLeccion) || 40);
                        let cursor = this.inicioJornada || '07:00';
                        const out = [];
                        let numero = 1;
                        this.bloques.forEach(function (bloque, indice) {
                            const lecciones = Math.max(0, Math.floor(Number(bloque.lecciones) || 0));
                            for (let i = 0; i < lecciones; i++) {
                                const ini = cursor;
                                const fin = self.sumarMinutos(ini, duracion);
                                out.push({
                                    clave: 'l-' + numero,
                                    tipo: 'leccion',
                                    inicio: ini,
                                    fin: fin,
                                    etiqueta: 'Lección ' + numero,
                                    badge: duracion + ' min'
                                });
                                cursor = fin;
                                numero += 1;
                            }
                            if (indice === self.bloques.length - 1) return;
                            const minutos = Math.max(0, Math.floor(Number(bloque.minutos) || 0));
                            if (minutos <= 0 || bloque.pausa === 'ninguna') return;
                            const finPausa = self.sumarMinutos(cursor, minutos);
                            out.push({
                                clave: 'p-' + bloque.id,
                                tipo: bloque.pausa === 'almuerzo' ? 'almuerzo' : 'recreo',
                                inicio: cursor,
                                fin: finPausa,
                                etiqueta: bloque.pausa === 'almuerzo' ? 'Almuerzo' : 'Receso',
                                badge: minutos + ' min'
                            });
                            cursor = finPausa;
                        });
                        return out;
                    },
                    get finJornada() {
                        const lineas = this.lineas;
                        return lineas.length ? lineas[lineas.length - 1].fin : '—';
                    },
                    get duracionTotalTexto() {
                        const duracion = Math.max(1, Number(this.minutosLeccion) || 40);
                        let totalMin = 0;
                        const ultimo = this.bloques.length - 1;
                        this.bloques.forEach(function (b, idx) {
                            totalMin += Math.max(0, Math.floor(Number(b.lecciones) || 0)) * duracion;
                            if (idx < ultimo && b.pausa !== 'ninguna') {
                                totalMin += Math.max(0, Math.floor(Number(b.minutos) || 0));
                            }
                        });
                        const h = Math.floor(totalMin / 60);
                        const m = totalMin % 60;
                        return h > 0 ? (m > 0 ? h + 'h ' + m + 'm' : h + 'h') : m + 'm';
                    }
                };
            };

            function parseBloquesJornada(raw, maxLecciones) {
                const limite = maxLecciones || 16;
                if (!raw || !String(raw).trim()) {
                    return bloquesJornadaPredeterminados();
                }
                const bloques = [];
                String(raw).split('|').forEach(function (parte, i) {
                    const recorte = String(parte).trim();
                    if (!recorte) return;
                    const bits = recorte.split(':');
                    if (bits.length < 3) return;
                    const lecciones = Number(bits[0]);
                    const pausa = bits[1] === 'receso' || bits[1] === 'almuerzo' ? bits[1] : 'ninguna';
                    let minutos = Number(bits[2]);
                    if (!Number.isFinite(lecciones) || lecciones < 1) return;
                    if (pausa === 'ninguna' || !Number.isFinite(minutos) || minutos < 0) {
                        minutos = 0;
                    } else {
                        minutos = Math.min(Math.floor(minutos), pausa === 'almuerzo' ? 120 : 60);
                    }
                    bloques.push({
                        id: i + 1,
                        lecciones: Math.min(limite, Math.floor(lecciones)),
                        pausa: pausa,
                        minutos: minutos
                    });
                });
                return bloques.length ? bloques : bloquesJornadaPredeterminados();
            }

            function bloquesJornadaPredeterminados() {
                return [
                    { id: 1, lecciones: 2, pausa: 'receso', minutos: 15 },
                    { id: 2, lecciones: 2, pausa: 'receso', minutos: 20 },
                    { id: 3, lecciones: 2, pausa: 'almuerzo', minutos: 40 },
                    { id: 4, lecciones: 2, pausa: 'receso', minutos: 10 },
                    { id: 5, lecciones: 2, pausa: 'receso', minutos: 10 },
                    { id: 6, lecciones: 2, pausa: 'ninguna', minutos: 0 }
                ];
            }

            window.__institucionalModalTimer = null;
            window.__institucionalUltimoFoco = null;

            function abrirModalInstitucional(trigger) {
                if (window.__institucionalModalTimer) {
                    window.clearTimeout(window.__institucionalModalTimer);
                    window.__institucionalModalTimer = null;
                }
                window.__institucionalUltimoFoco = trigger || document.activeElement;
                const modal = document.getElementById('modal-container');
                if (!modal) return;
                modal.classList.remove('modal-closing');
                modal.classList.add('show');
            }

            function cerrarModalInstitucional() {
                const modal = document.getElementById('modal-container');
                if (!modal || !modal.classList.contains('show')) return;
                modal.classList.add('modal-closing');
                window.__institucionalModalTimer = window.setTimeout(function () {
                    modal.classList.remove('show', 'modal-closing');
                    modal.innerHTML = '';
                    window.__institucionalModalTimer = null;
                    if (window.__institucionalUltimoFoco && typeof window.__institucionalUltimoFoco.focus === 'function'
                            && window.__institucionalUltimoFoco.isConnected) {
                        window.__institucionalUltimoFoco.focus();
                    }
                }, 180);
            }

            function abrirConfirmacionAcademica(trigger) {
                window.__institucionalUltimoFoco = trigger || document.activeElement;
                window.academicDeleteRequest = {
                    url: trigger.dataset.deleteUrl,
                    target: trigger.dataset.deleteTarget,
                    swap: trigger.dataset.deleteSwap || 'outerHTML'
                };
                document.getElementById('academic-delete-title').textContent =
                    trigger.dataset.deleteTitle || 'Confirmar eliminación';
                document.getElementById('academic-delete-message').textContent =
                    trigger.dataset.deleteMessage || '¿Deseas eliminar este registro?';
                const modal = document.getElementById('academic-delete-modal');
                modal.style.display = 'flex';
                modal.classList.remove('modal-visible', 'modal-closing');
                void modal.offsetWidth;
                modal.classList.add('modal-visible');
                const cancelar = modal.querySelector('.btn-secondary, .close-btn');
                if (cancelar) cancelar.focus();
            }

            function cerrarConfirmacionAcademica() {
                const modal = document.getElementById('academic-delete-modal');
                if (modal && modal.style.display !== 'none') {
                    modal.classList.remove('modal-visible');
                    modal.classList.add('modal-closing');
                    window.setTimeout(function () {
                        modal.style.display = 'none';
                        modal.classList.remove('modal-closing');
                        if (window.__institucionalUltimoFoco && typeof window.__institucionalUltimoFoco.focus === 'function'
                                && window.__institucionalUltimoFoco.isConnected) {
                            window.__institucionalUltimoFoco.focus();
                        }
                    }, 180);
                }
                window.academicDeleteRequest = null;
            }

            function confirmarEliminacionAcademica() {
                const request = window.academicDeleteRequest;
                if (!request || !request.url || !request.target) {
                    cerrarConfirmacionAcademica();
                    return;
                }
                htmx.ajax('DELETE', request.url, {
                    target: request.target,
                    swap: request.swap
                }).then(cerrarConfirmacionAcademica);
            }

            if (!window.institucionalEventsRegistrados) {
                document.addEventListener('institucionalGuardado', function (event) {
                    if (event.detail && event.detail.cerrarModal && typeof cerrarModalInstitucional === 'function') {
                        cerrarModalInstitucional();
                    }
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje);
                    }
                    // Si se actualizó escala/asistencia, sincroniza el aviso de asistencia en el tab de Componentes
                    if (event.detail && event.detail.mensaje && event.detail.mensaje.indexOf('Escala') === 0
                            && document.getElementById('institucional-componentes-panel')) {
                        htmx.ajax('GET', '/configuracion-institucional/componentes', {
                            target: '#institucional-componentes-panel',
                            swap: 'outerHTML'
                        });
                    }
                });
                document.addEventListener('institucionalError', function (event) {
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje, 'error');
                    }
                });
                document.addEventListener('htmx:afterSwap', function (event) {
                    const target = event.detail && event.detail.target;
                    if (!target || target.id !== 'modal-container') return;
                    const foco = target.querySelector('input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled]), button.close-btn');
                    if (foco) foco.focus();
                });
                window.institucionalEventsRegistrados = true;
            }

            function activarPanelInstitucional(id, metodo) {
                const el = document.getElementById(id);
                if (!el || !window.Alpine) return;
                const data = el._x_dataStack && el._x_dataStack[0];
                if (data && typeof data[metodo] === 'function') return;
                if (el._x_dataStack) {
                    Alpine.destroyTree(el);
                }
                Alpine.initTree(el);
            }
            activarPanelInstitucional('institucional-jornada-panel', 'agregarBloque');
            activarPanelInstitucional('institucional-escala-notas-panel', 'prepararEnvio');
        </script>
    </main>
    </th:block>
