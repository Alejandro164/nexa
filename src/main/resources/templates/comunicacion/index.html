<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Comunicación — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Canal de Comunicación</h2>
    <p layout:fragment="page-subtitle">Mensajes y comunicados para toda la comunidad educativa</p>

    <th:block th:fragment="htmx-content">
    <!-- OOB: al navegar por htmx solo se reemplaza .content-area, así que el título del topbar
         (fuera de ese contenedor) se sincroniza aparte para que no se quede con el de la página anterior. -->
    <h2 id="topbar-page-title" hx-swap-oob="true">Canal de Comunicación</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Mensajes y comunicados para toda la comunidad educativa</p>
    <main layout:fragment="content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .tab-pane {
                animation: fadeIn 0.35s ease-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .message-preview {
                display: flex;
                gap: 12px;
                padding: 1rem;
                border-bottom: 1px solid var(--border);
                cursor: pointer;
                transition: background-color 0.2s;
            }
            .message-preview:hover {
                background-color: var(--input-bg);
            }
        </style>

        <div x-data="{ activeTab: 'mensajeria' }">
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button type="button" class="config-tab-btn" :class="{ 'active': activeTab === 'mensajeria' }"
                            @click="activeTab = 'mensajeria'"
                            hx-get="/comunicacion/mensajeria" hx-target="#comunicacion-content" hx-swap="outerHTML">
                        💬 Mensajes
                    </button>
                    <button type="button" class="config-tab-btn" :class="{ 'active': activeTab === 'comunicados' }"
                            @click="activeTab = 'comunicados'"
                            hx-get="/comunicacion/comunicados" hx-target="#comunicacion-content" hx-swap="outerHTML">
                        📢 Comunicados
                    </button>
                </div>
            </div>

            <div id="comunicacion-content" th:replace="~{comunicacion/mensajeria/mensajeria :: content}"></div>
        </div>
    </main>
    </th:block>

</body>

</html>
