<div th:fragment="content" class="tab-pane" xmlns:th="http://www.thymeleaf.org">
    <div id="docentes-disponibilidad-container" th:fragment="disponibilidad-panel">
        <style>
            #docentes-disponibilidad-container .filters-bar .academic-select {
                min-width: 220px;
            }
            #docentes-disponibilidad-container .disp-docente-wrap .academic-select {
                min-width: 420px;
                width: 440px;
                max-width: min(520px, 100%);
            }
            #docentes-disponibilidad-container .disp-docente-wrap .academic-select-trigger span:first-child {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            @media (max-width: 700px) {
                #docentes-disponibilidad-container .disp-docente-wrap .academic-select {
                    min-width: 0;
                    width: 100%;
                }
            }
            #docentes-disponibilidad-container .schedule-scroll {
                padding: 1.5rem;
            }
            #docentes-disponibilidad-container .disp-report-btn {
                flex-shrink: 0;
                white-space: nowrap;
            }
            #docentes-disponibilidad-container .disp-report-btn svg {
                width: 16px;
                height: 16px;
            }
        </style>
        <div class="card">
            <div class="card-header">
                <form class="filters-bar">
                    <div class="disp-docente-wrap">
                        <select class="form-input" name="docenteId"
                                data-search
                                data-search-placeholder="Buscar por nombre o cédula..."
                                aria-label="Docente"
                                hx-get="/docentes/disponibilidad"
                                hx-trigger="change"
                                hx-target="#docentes-disponibilidad-container"
                                hx-swap="outerHTML"
                                hx-include="closest form">
                            <option value="" disabled th:selected="${docenteSeleccionado == null}">Seleccione un docente</option>
                            <option th:each="d : ${docentesDisponibilidad}"
                                    th:value="${d.id}"
                                    th:selected="${d.id == docenteSeleccionado}"
                                    th:text="${#strings.isEmpty(d.cedula) ? d.nombre : d.nombre + ' · ' + d.cedula}">Docente</option>
                        </select>
                    </div>
                    <select class="form-input" name="periodoId"
                            aria-label="Período"
                            hx-get="/docentes/disponibilidad"
                            hx-trigger="change"
                            hx-target="#docentes-disponibilidad-container"
                            hx-swap="outerHTML"
                            hx-include="closest form">
                        <option value="" disabled th:selected="${periodoSeleccionadoDisponibilidad == null}">Seleccione un período</option>
                        <option th:each="p : ${periodosActivosDisponibilidad}"
                                th:value="${p.id}"
                                th:selected="${p.id == periodoSeleccionadoDisponibilidad}"
                                th:text="|${p.codigo} - ${p.descripcion}|">2026-I</option>
                    </select>
                </form>
                <a class="btn-primary disp-report-btn"
                   th:if="${docenteSeleccionado != null and periodoSeleccionadoDisponibilidad != null}"
                   th:href="@{/docentes/disponibilidad/reporte(docenteId=${docenteSeleccionado}, periodoId=${periodoSeleccionadoDisponibilidad})}"
                   target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    Generar reporte
                </a>
                <button type="button" class="btn-primary disp-report-btn" disabled
                        th:unless="${docenteSeleccionado != null and periodoSeleccionadoDisponibilidad != null}">
                    Generar reporte
                </button>
            </div>

            <div th:if="${docentesDisponibilidad == null or docentesDisponibilidad.empty or periodosActivosDisponibilidad == null or periodosActivosDisponibilidad.empty}"
                 class="academic-empty academic-empty-block">
                Debe haber al menos un docente registrado y un período activo para ver la disponibilidad.
            </div>

            <div th:unless="${docentesDisponibilidad == null or docentesDisponibilidad.empty or periodosActivosDisponibilidad == null or periodosActivosDisponibilidad.empty}"
                 class="schedule-scroll">
                <style>
                    .disp-grid {
                        display: grid;
                        grid-template-columns: 90px repeat(5, 1fr);
                        border: 1px solid var(--border);
                        border-radius: 8px;
                        overflow: hidden;
                    }
                    .disp-header {
                        background: #f1f5f9;
                        padding: 8px;
                        text-align: center;
                        font-weight: 600;
                        font-size: 0.8rem;
                        border-right: 1px solid var(--border);
                        border-bottom: 1px solid var(--border);
                    }
                    .disp-cell {
                        padding: 10px;
                        text-align: center;
                        border-right: 1px solid var(--border);
                        border-bottom: 1px solid var(--border);
                        background: #ffffff;
                    }
                    .disp-cell.ocupado {
                        background: #fee2e2;
                        color: #b91c1c;
                        font-weight: 600;
                        font-size: 0.78rem;
                        line-height: 1.3;
                    }
                    .disp-cell.libre, .disp-cell.bloqueado {
                        width: 100%;
                        font-family: inherit;
                        cursor: pointer;
                        appearance: none;
                    }
                    .disp-cell.libre {
                        color: #16a34a;
                        font-size: 0.8rem;
                        background: #ffffff;
                    }
                    .disp-cell.libre:hover { background: #dcfce7; }
                    .disp-cell.bloqueado {
                        background: #ffedd5;
                        color: #c2410c;
                        font-weight: 600;
                        font-size: 0.8rem;
                    }
                    .disp-cell.bloqueado:hover { background: #fed7aa; }
                    .disp-legend {
                        display: flex;
                        gap: 1rem;
                        flex-wrap: wrap;
                        margin-top: 1rem;
                        font-size: 0.75rem;
                        color: var(--text-muted);
                    }
                    .disp-swatch {
                        display: inline-block;
                        width: 10px;
                        height: 10px;
                        border-radius: 3px;
                        margin-right: 5px;
                        vertical-align: -1px;
                        border: 1px solid var(--border);
                    }
                    .disp-time {
                        background: #f8fafc;
                        font-weight: 600;
                        color: var(--text-muted);
                        font-size: 0.75rem;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    }
                </style>

                <div class="disp-grid">
                    <div class="disp-header">Lección</div>
                    <div class="disp-header" th:each="dia : ${dias}"
                         th:text="${#strings.capitalize(#strings.toLowerCase(dia))}">Lunes</div>

                    <th:block th:each="numero : ${lecciones}">
                        <div class="disp-cell disp-time" th:text="|Lección ${numero}|">Lección 1</div>
                        <th:block th:each="dia : ${dias}"
                                  th:with="clave=${numero + '-' + dia}, items=${horarioDocente.get(numero + '-' + dia)}, bloqueado=${bloqueos != null and bloqueos.contains(clave)}">
                            <button th:if="${(items == null or items.empty) and !bloqueado}"
                                    type="button" class="disp-cell libre"
                                    th:attr="hx-post=@{/docentes/disponibilidad/bloqueo(docenteId=${docenteSeleccionado}, periodoId=${periodoSeleccionadoDisponibilidad}, dia=${dia}, numeroLeccion=${numero})}"
                                    hx-target="#docentes-disponibilidad-container"
                                    hx-swap="outerHTML"
                                    title="Clic para bloquear">✓ Disponible</button>
                            <button th:if="${(items == null or items.empty) and bloqueado}"
                                    type="button" class="disp-cell bloqueado"
                                    th:attr="hx-post=@{/docentes/disponibilidad/bloqueo(docenteId=${docenteSeleccionado}, periodoId=${periodoSeleccionadoDisponibilidad}, dia=${dia}, numeroLeccion=${numero})}"
                                    hx-target="#docentes-disponibilidad-container"
                                    hx-swap="outerHTML"
                                    title="Clic para liberar">Bloqueado</button>
                            <div th:unless="${items == null or items.empty}" class="disp-cell ocupado">
                                <div th:each="item : ${items}">
                                    <div th:text="${item.materia.nombre}">Materia</div>
                                    <div th:text="${item.nivel.nombreCompleto}" style="font-weight:400;">Sección</div>
                                </div>
                            </div>
                        </th:block>
                    </th:block>
                </div>
                <div class="disp-legend">
                    <span><span class="disp-swatch" style="background:#fff;"></span>Disponible — clic para bloquear</span>
                    <span><span class="disp-swatch" style="background:#ffedd5;"></span>Bloqueado</span>
                    <span><span class="disp-swatch" style="background:#fee2e2;"></span>Ocupado</span>
                </div>
            </div>
        </div>
    </div>
</div>
