<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Gestión de Docentes — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Gestión de Docentes</h2>
    <p layout:fragment="page-subtitle">Administra el personal académico, disponibilidad y carga laboral</p>

    <th:block th:fragment="htmx-content">
    <!-- OOB: al navegar por htmx solo se reemplaza .content-area, así que el título del topbar
         (fuera de ese contenedor) se sincroniza aparte para que no se quede con el de la página anterior. -->
    <h2 id="topbar-page-title" hx-swap-oob="true">Gestión de Docentes</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Administra el personal académico, disponibilidad y carga laboral</p>
    <main layout:fragment="content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow: visible;
            }
            .config-tabs-container::-webkit-scrollbar {
                display: none;
            }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .tab-pane {
                animation: fadeIn 0.35s ease-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
            #docentes-modal-container .modal-dialog { max-width: 580px; }
            #docentes-modal-container.dir-modal-visible .modal-backdrop,
            #docentes-ficha-container.dir-modal-visible .modal-backdrop {
                animation: academicModalBackdropIn 180ms ease-out both;
            }
            #docentes-modal-container.dir-modal-visible .modal-dialog,
            #docentes-ficha-container.dir-modal-visible .modal-dialog {
                animation: academicModalDialogIn 240ms cubic-bezier(.22,1,.36,1) both;
            }
            #docentes-modal-container.dir-modal-closing .modal-backdrop,
            #docentes-ficha-container.dir-modal-closing .modal-backdrop {
                animation: academicModalBackdropOut 180ms ease-in both;
            }
            #docentes-modal-container.dir-modal-closing .modal-dialog,
            #docentes-ficha-container.dir-modal-closing .modal-dialog {
                animation: academicModalDialogOut 180ms ease-in both;
            }
            .docente-materias-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .docente-materia-chip {
                --chip-color: #2d5a87;
                position: relative;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 6px 12px 6px 10px;
                border-radius: 999px;
                border: 1px solid color-mix(in srgb, var(--chip-color) 28%, #e2e8f0);
                background: #fff;
                color: #334155;
                font-size: 0.8rem;
                font-weight: 600;
                cursor: pointer;
                user-select: none;
                transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
            }
            .docente-materia-chip input {
                position: absolute;
                opacity: 0;
                pointer-events: none;
            }
            .docente-materia-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--chip-color);
                flex-shrink: 0;
            }
            .docente-materia-chip:hover {
                border-color: color-mix(in srgb, var(--chip-color) 50%, white);
            }
            .docente-materia-chip:has(input:checked),
            .docente-materia-chip-static {
                background: color-mix(in srgb, var(--chip-color) 14%, white);
                border-color: color-mix(in srgb, var(--chip-color) 45%, white);
                color: color-mix(in srgb, var(--chip-color) 78%, black);
            }
            .docente-materia-chip:has(input:checked) {
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--chip-color) 12%, transparent);
            }
            .docente-materia-chip-static {
                cursor: default;
                padding: 3px 10px 3px 8px;
                font-size: 0.72rem;
                text-transform: none;
            }
            .docente-seccion-chip {
                --chip-color: var(--primary, #2d5a87);
            }
            .docente-guia-secciones {
                display: none;
                margin-top: 0.15rem;
            }
            .docente-guia-block:has(input[name="profesorGuia"]:checked) .docente-guia-secciones {
                display: block;
            }
            .dir-card-header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.9rem;
            }
            .dir-header {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                margin-bottom: 0;
            }
            .dir-header .btn-primary {
                margin-left: auto;
                flex: 0 0 auto;
            }
            .dir-search {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .dir-search .search-box {
                flex: 0 0 66.666%;
                width: 66.666%;
                max-width: none;
            }
            .dir-search .search-icon {
                pointer-events: none;
            }
            .dir-lecciones-empty {
                color: #94a3b8;
                font-size: 0.8rem;
            }
            .dir-lecciones-badge {
                display: inline-flex;
                align-items: center;
                padding: 3px 9px;
                border-radius: 999px;
                background: #f1f5f9;
                border: 1px solid #e2e8f0;
                color: #334155;
                font-size: 0.75rem;
                font-weight: 700;
                white-space: nowrap;
            }
            .dir-count-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin-left: auto;
                min-height: 38px;
                padding: 0.4rem 0.95rem;
                border-radius: 999px;
                background: color-mix(in srgb, var(--primary) 10%, white);
                border: 1px solid color-mix(in srgb, var(--primary) 22%, #e2e8f0);
                color: var(--primary);
                font-size: 0.8rem;
                font-weight: 700;
                letter-spacing: 0.01em;
                white-space: nowrap;
            }
            @media (max-width: 700px) {
                .dir-header .btn-primary {
                    margin-left: 0;
                    width: 100%;
                }
                .dir-search {
                    flex-wrap: wrap;
                }
                .dir-search .search-box {
                    flex-basis: 100%;
                    width: 100%;
                }
                .dir-count-badge {
                    margin-left: 0;
                }
            }
        </style>

        <div x-data="{ activeTab: 'directorio' }">
            <!-- Menú Horizontal -->
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'directorio' }" @click="activeTab = 'directorio'">
                        📋 Directorio
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'disponibilidad' }" @click="activeTab = 'disponibilidad'; htmx.ajax('GET', '/docentes/disponibilidad', { target: '#docentes-disponibilidad-container', swap: 'outerHTML' })">
                        ⏳ Disponibilidad
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'asignaciones' }" @click="activeTab = 'asignaciones'; htmx.ajax('GET', '/docentes/asignaciones', { target: '#docentes-asignaciones-container', swap: 'outerHTML' })">
                        💼 Carga Laboral
                    </button>
                </div>
            </div>

            <!-- Contenidos -->
            <div x-show="activeTab === 'directorio'" class="tab-pane">
                <div th:replace="~{docentes/directorio/directorio :: content}"></div>
            </div>

            <div x-show="activeTab === 'disponibilidad'" class="tab-pane" x-cloak>
                <div th:replace="~{docentes/disponibilidad/disponibilidad :: content}"></div>
            </div>

            <div x-show="activeTab === 'asignaciones'" class="tab-pane" x-cloak>
                <div th:replace="~{docentes/asignaciones/asignaciones :: content}"></div>
            </div>

        </div>
    </main>
    </th:block>
</body>
</html>
