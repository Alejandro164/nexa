<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Gestión de Docentes — Nexa</title>
</head>

<body>

    <th:block layout:fragment="page-title">Gestión de Docentes</th:block>
    <th:block layout:fragment="page-subtitle">Administra el personal académico, especialidades y carga laboral</th:block>

    <main layout:fragment="content" th:fragment="htmx-content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow: visible;
            }
            .config-tabs-container::-webkit-scrollbar {
                display: none;
            }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .tab-pane {
                animation: fadeIn 0.35s ease-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>

        <div x-data="{ activeTab: 'directorio' }">
            <!-- Menú Horizontal -->
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'directorio' }" @click="activeTab = 'directorio'">
                        📋 Directorio
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'especialidades' }" @click="activeTab = 'especialidades'">
                        🎓 Especialidades
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'disponibilidad' }" @click="activeTab = 'disponibilidad'">
                        ⏳ Disponibilidad
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'asignaciones' }" @click="activeTab = 'asignaciones'">
                        💼 Carga Laboral
                    </button>
                </div>
            </div>

            <!-- Contenidos -->
            <div x-show="activeTab === 'directorio'" class="tab-pane">
                <div th:replace="~{docentes/directorio/directorio :: content}"></div>
            </div>

            <div x-show="activeTab === 'especialidades'" class="tab-pane" x-cloak>
                <div th:replace="~{docentes/especialidades/especialidades :: content}"></div>
            </div>

            <div x-show="activeTab === 'disponibilidad'" class="tab-pane" x-cloak>
                <div th:replace="~{docentes/disponibilidad/disponibilidad :: content}"></div>
            </div>

            <div x-show="activeTab === 'asignaciones'" class="tab-pane" x-cloak>
                <div th:replace="~{docentes/asignaciones/asignaciones :: content}"></div>
            </div>

        </div>
    </main>
</body>
</html>
