<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    layout:decorate="~{index}">

<head>
    <title>Entregas académicas — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Entregas académicas</h2>
    <p layout:fragment="page-subtitle">Entregas, pendientes y mantenimiento académico</p>

    <th:block th:fragment="htmx-content">
    <h2 id="topbar-page-title" hx-swap-oob="true">Entregas académicas</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Entregas, pendientes y mantenimiento académico</p>
    <main layout:fragment="content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }
            .config-tabs-container::-webkit-scrollbar { display: none; }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 12px;
                font-size: 0.82rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .tab-pane { animation: fadeIn 0.35s ease-out; }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .academic-help {
                color: var(--text-secondary);
                font-size: 0.84rem;
                margin-top: 0.3rem;
            }
            .entregas-form {
                padding: 1.5rem;
            }
            .entregas-form .form-input,
            .entregas-form .form-select {
                padding-left: 0.75rem;
            }
            .entregas-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1rem;
            }
            .entregas-grid .span-2 { grid-column: span 2; }
            @media (max-width: 768px) {
                .entregas-grid,
                .entregas-grid .span-2 {
                    grid-template-columns: 1fr;
                    grid-column: span 1;
                }
            }
            .entregas-actions {
                display: flex;
                justify-content: flex-end;
                gap: 0.75rem;
                border-top: 1px solid var(--border);
                padding-top: 1.25rem;
                margin-top: 0.5rem;
            }
            .entregas-dot {
                display: inline-block;
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #c2185b;
            }
            .entregas-dot.oculto { display: none; }
            .entregas-aviso {
                background: #fbf8e6;
                border-radius: 12px;
                padding: 0.9rem 1.25rem;
                margin-bottom: 0.75rem;
                font-size: 0.86rem;
                color: #3f3a1d;
            }
            .entregas-filtros {
                display: flex;
                flex-wrap: wrap;
                gap: 0.6rem;
                padding: 1rem 1.5rem;
                align-items: center;
            }
            .entregas-filtros .form-input { flex: 1; min-width: 180px; max-width: 280px; }
            .entregas-tabla th { font-size: 0.78rem; color: #64748b; font-weight: 500; }
            .entregas-tabla td { vertical-align: middle; }
            .entregas-estado {
                display: inline-block;
                padding: 4px 14px;
                border-radius: 8px;
                font-size: 0.78rem;
                font-weight: 600;
                background: #eef0f3;
                color: #475569;
            }
            .entregas-estado.borrador { background: #eef0f3; color: #475569; }
            .entregas-estado.presentada { background: #dbeafe; color: #1e40af; }
            .entregas-estado.devuelta { background: #fee2e2; color: #991b1b; }
            .entregas-estado.aprobada { background: #dcfce7; color: #166534; }
            .entregas-estado.sin-iniciar { background: #fef3c7; color: #92400e; }
            .plazo-en-plazo { color: #166534; font-size: 0.82rem; }
            .plazo-vencida { color: #b91c1c; font-size: 0.82rem; font-weight: 600; }
            .plazo-proxima { color: #64748b; font-size: 0.82rem; }
            .entregas-paginacion {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 1rem 1.5rem;
                font-size: 0.9rem;
                color: #475569;
            }
            .entregas-btn-accion {
                border: 1px solid #cbd5e1;
                background: #fff;
                color: #1e293b;
                border-radius: 999px;
                padding: 7px 20px;
                font-size: 0.85rem;
                font-weight: 700;
                font-family: inherit;
                cursor: pointer;
            }
            .entregas-btn-accion:hover { background: #f1f5f9; border-color: var(--primary); }
        </style>

        <div x-data="{ activeTab: 'pendientes' }">
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'pendientes' }"
                            @click="activeTab = 'pendientes'" hx-get="/entregas-academicas/pendientes"
                            hx-target="#entregas-content" hx-swap="innerHTML">
                        Pendientes
                        <span id="entregas-pendientes-dot" class="entregas-dot"
                              th:classappend="${pendientesCount == 0} ? 'oculto'"
                              th:title="${pendientesCount} + ' pendientes'"></span>
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'realizadas' }"
                            @click="activeTab = 'realizadas'" hx-get="/entregas-academicas/realizadas"
                            hx-target="#entregas-content" hx-swap="innerHTML">
                        Realizadas
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'mantenimiento' }"
                            @click="activeTab = 'mantenimiento'" hx-get="/entregas-academicas/mantenimiento"
                            hx-target="#entregas-content" hx-swap="innerHTML"
                            sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_DIRECTOR')">
                        Mantenimiento
                    </button>
                </div>
            </div>

            <div id="entregas-content" class="tab-pane" hx-get="/entregas-academicas/pendientes"
                 hx-trigger="load" hx-swap="innerHTML">
                <!-- El contenido de la pestaña se carga aquí -->
            </div>

            <!-- Modales: detalle de la entrega, formulario de mantenimiento y seguimiento -->
            <div id="entregas-modal-container" style="display:none;"></div>
        </div>
    </main>
    </th:block>

</body>

</html>
