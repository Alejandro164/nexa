<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Conducta</title>
</head>

<body>

    <h2 layout:fragment="page-title">📊 Registro de Conducta</h2>
    <p layout:fragment="page-subtitle">Seguimiento del comportamiento y disciplina estudiantil</p>

    <th:block th:fragment="htmx-content">
    <!-- OOB: al navegar por htmx solo se reemplaza .content-area, así que el título del topbar
         (fuera de ese contenedor) se sincroniza aparte para que no se quede con el de la página anterior. -->
    <h2 id="topbar-page-title" hx-swap-oob="true">📊 Registro de Conducta</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Seguimiento del comportamiento y disciplina estudiantil</p>
    <main layout:fragment="content">
        <style>
            /* ---- Tabs primarios (mismo patron que config-tabs) ---- */
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }
            .config-tabs-container::-webkit-scrollbar { display: none; }
            .config-tabs { display: flex; width: 100%; gap: 6px; }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover { color: var(--primary); background-color: var(--input-bg); }
            .config-tab-btn.active { color: white !important; background-color: var(--primary) !important; box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25); }
            .tab-pane { animation: fadeIn 0.35s ease-out; }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }

            /* ---- Stats ---- */
            .conducta-stats {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
                margin-bottom: 1.5rem;
            }
            .stat-card {
                background: #ffffff;
                border-radius: 12px;
                border: 1px solid var(--border);
                padding: 1.25rem 1.5rem;
                box-shadow: var(--shadow-sm);
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
            }
            .stat-card .stat-label {
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .stat-card .stat-value {
                font-size: 1.6rem;
                font-weight: 700;
                color: #0f172a;
            }
            .stat-card.positiva .stat-value { color: #15803d; }
            .stat-card.negativa .stat-value { color: #dc2626; }
            .stat-card.pendiente .stat-value { color: #a16207; }

            /* ---- Table ---- */
            .table-card {
                background: #ffffff;
                border-radius: 12px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow-sm);
                overflow: hidden;
            }
            .table-card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem 1.5rem;
                border-bottom: 1px solid var(--border);
            }
            .table-card-title {
                font-size: 1.05rem;
                font-weight: 700;
                color: #0f172a;
                margin: 0;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .table-card-count {
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--primary);
                background: rgba(45,90,135,0.08);
                padding: 3px 10px;
                border-radius: 20px;
            }

            .conducta-toolbar {
                display: flex;
                flex-direction: column;
                gap: 0.85rem;
                padding: 1rem 1.5rem 1.15rem;
                margin: 0;
                background: #f8fafc;
                border-bottom: 1px solid var(--border);
            }
            .conducta-filters-row {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: end;
                gap: 0.75rem;
            }
            .conducta-field {
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
                min-width: 0;
                flex: 1 1 0;
            }
            .conducta-filters-row .table-card-count {
                flex: 0 0 auto;
                align-self: end;
                margin-bottom: 7px;
                white-space: nowrap;
            }
            .conducta-field > span {
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: #64748b;
            }
            .conducta-field .form-input,
            .conducta-field .filter-input,
            .conducta-field .academic-select,
            .conducta-field .academic-select-trigger {
                width: 100% !important;
                min-width: 0 !important;
                min-height: 38px;
                box-sizing: border-box;
            }
            .conducta-field select.form-input {
                padding: 0.5rem 0.85rem;
            }
            .conducta-search-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.75rem;
                margin-top: 0.15rem;
                padding-top: 0.9rem;
                border-top: 1px solid var(--border);
            }
            .conducta-toolbar--simple .conducta-search-row {
                margin-top: 0;
                padding-top: 0;
                border-top: none;
            }
            .conducta-search-row .table-card-count {
                flex: 0 0 auto;
                white-space: nowrap;
            }
            .conducta-search {
                position: relative;
                display: flex;
                align-items: center;
                width: 28rem;
                flex: 0 1 28rem;
            }
            .conducta-search-icon {
                position: absolute;
                left: 12px;
                color: #94a3b8;
                pointer-events: none;
                flex-shrink: 0;
            }
            .conducta-search .filter-input {
                width: 100%;
                min-height: 38px;
                padding: 0.5rem 0.85rem 0.5rem 2.35rem;
                box-sizing: border-box;
            }
            .conducta-actions {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex-shrink: 0;
                margin-left: auto;
            }
            .conducta-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                height: 38px;
                padding: 0 14px;
                border-radius: 8px;
                font-size: 0.82rem;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
                white-space: nowrap;
                transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
            }
            .conducta-btn svg {
                flex-shrink: 0;
            }
            .conducta-btn-secondary {
                background: #ffffff;
                color: #334155;
                border: 1px solid var(--border);
            }
            .conducta-btn-secondary:hover {
                background: #f1f5f9;
                border-color: #cbd5e1;
            }
            .conducta-btn-primary {
                background: var(--primary);
                color: #fff;
                border: 1px solid transparent;
            }
            .conducta-btn-primary:hover {
                background: #1e3a5f;
            }
            .conducta-btn:disabled,
            .btn-xs:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }

            .conducta-table { width: 100%; border-collapse: collapse; }
            .conducta-table th {
                text-align: left;
                padding: 0.65rem 1rem;
                font-size: 0.72rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #64748b;
                background: #f8fafc;
                border-bottom: 2px solid var(--border);
            }
            .conducta-table td {
                padding: 0.75rem 1rem;
                font-size: 0.85rem;
                color: #334155;
                border-bottom: 1px solid #f1f5f9;
            }
            .conducta-table tr:hover td { background: #f8fafc; }
            .conducta-table tr:last-child td { border-bottom: none; }

            /* ---- Cells ---- */
            .student-cell {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .student-avatar {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 0.78rem;
                color: #fff;
                flex-shrink: 0;
            }

            /* ---- Badges ---- */
            .badge-xs {
                display: inline-block;
                padding: 3px 10px;
                border-radius: 8px;
                font-size: 0.7rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.3px;
            }
            .badge-excelente { background: #dcfce7; color: #166534; }
            .badge-bueno { background: #dbeafe; color: #1e40af; }
            .badge-regular { background: #fef3c7; color: #92400e; }
            .badge-deficiente { background: #fee2e2; color: #991b1b; }
            .badge-llamada { background: #fef3c7; color: #92400e; }
            .badge-boleta { background: #fce7f3; color: #9d174d; }
            .badge-pendiente { background: #fef3c7; color: #92400e; }
            .badge-enproceso { background: #dbeafe; color: #1e40af; }
            .badge-resuelto { background: #dcfce7; color: #166534; }
            .badge-apelado { background: #f3e8ff; color: #6b21a8; }

            .nota-num {
                font-weight: 700;
                font-size: 0.9rem;
            }
            .nota-excelente { color: #166534; }
            .nota-bueno { color: #1e40af; }
            .nota-regular { color: #92400e; }
            .nota-deficiente { color: #991b1b; }

            /* ---- Buttons ---- */
            .btn-xs {
                padding: 5px 12px;
                font-size: 0.75rem;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                border: none;
                display: inline-flex;
                align-items: center;
                gap: 4px;
                transition: all 0.2s;
            }
            .btn-ghost { background: transparent; color: var(--primary); }
            .btn-ghost:hover { background: rgba(45,90,135,0.08); }
            .btn-danger-ghost { background: transparent; color: #ef4444; }
            .btn-danger-ghost:hover { background: #fef2f2; }
            .btn-xs.primary { background: var(--primary); color: #fff; }
            .btn-xs.primary:hover { background: #1e3a5f; }

            .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }

            .empty-state {
                text-align: center;
                padding: 3rem !important;
                color: #94a3b8;
            }
            .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

            @media (max-width: 768px) {
                .conducta-stats { grid-template-columns: repeat(2, 1fr); }
            }
        </style>

        <!-- ==================== ALPINE STATE + TABS ==================== -->
        <div x-data="{ activeTab: 'notas' }">

            <!-- ==================== MENU HORIZONTAL ==================== -->
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'notas' }"
                            @click="activeTab = 'notas'">
                        Notas de Conducta
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'llamadas' }"
                            @click="activeTab = 'llamadas'">
                        Llamadas de Atención
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'boletas' }"
                            @click="activeTab = 'boletas'">
                        Boletas
                    </button>
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'lecciones-guia' }"
                            @click="activeTab = 'lecciones-guia'">
                        Lecciones Guía
                    </button>
                </div>
            </div>

            <div x-show="activeTab === 'notas'" class="tab-pane">
                <div id="notas-panel" hx-get="/conducta/notas" hx-trigger="load" hx-swap="innerHTML">
                    <div class="table-card">
                        <div style="padding: 2rem; text-align:center; color: var(--text-secondary);">Cargando notas de conducta…</div>
                    </div>
                </div>
            </div>

            <div x-show="activeTab === 'llamadas'" class="tab-pane" x-cloak>
                <div th:replace="~{conducta/llamadas/llamadas :: content}"></div>
            </div>

            <div x-show="activeTab === 'boletas'" class="tab-pane" x-cloak>
                <div th:replace="~{conducta/boletas/boletas :: content}"></div>
            </div>

            <div x-show="activeTab === 'lecciones-guia'" class="tab-pane" x-cloak>
                <div th:replace="~{conducta/lecciones-guia/lecciones-guia :: content}"></div>
            </div>

        </div>

        <script th:inline="none">
            if (!window.conductaEventsRegistrados) {
                document.addEventListener('academicoGuardado', function (event) {
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje);
                    }
                });
                document.addEventListener('academicoError', function (event) {
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje, 'error');
                    }
                });
                window.conductaEventsRegistrados = true;
            }
        </script>

    </main>
    </th:block>

</body>

</html>
