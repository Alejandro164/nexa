<div th:fragment="content" xmlns:th="http://www.thymeleaf.org" style="position: relative;">
    <div id="llamadas-loading" class="htmx-indicator panel-loading-overlay">
        <div class="spinner"></div>
        <span>Cargando...</span>
    </div>

    <div class="table-card">
        <div class="conducta-toolbar">
            <div class="conducta-filters-row llamadas-filtros">
                <label class="conducta-field">
                    <span>Período</span>
                    <select class="form-input" name="periodoId" aria-label="Período"
                            hx-get="/conducta/llamadas" hx-target="#llamadas-panel" hx-swap="innerHTML"
                            hx-include=".llamadas-filtros" hx-indicator="#llamadas-loading">
                        <option th:if="${periodos == null or periodos.empty}" value="" disabled selected>Sin períodos</option>
                        <option th:each="p : ${periodos}" th:value="${p.id}" th:text="${p.codigo}"
                                th:selected="${periodoId != null and periodoId == p.id}"></option>
                    </select>
                </label>
                <label class="conducta-field">
                    <span>Grado</span>
                    <select class="form-input" name="grado" aria-label="Grado"
                            hx-get="/conducta/llamadas" hx-target="#llamadas-panel" hx-swap="innerHTML"
                            hx-include=".llamadas-filtros" hx-indicator="#llamadas-loading">
                        <option value="">Todos los grados</option>
                        <option th:each="g : ${grados}" th:value="${g}" th:text="${g}"
                                th:selected="${grado != null and grado == g}"></option>
                    </select>
                </label>
                <label class="conducta-field">
                    <span>Sección</span>
                    <select class="form-input" name="nivelId" aria-label="Sección"
                            hx-get="/conducta/llamadas" hx-target="#llamadas-panel" hx-swap="innerHTML"
                            hx-include=".llamadas-filtros" hx-indicator="#llamadas-loading">
                        <option value="">Todas las secciones</option>
                        <option th:each="s : ${secciones}" th:value="${s.id}"
                                th:text="${s.grado + '-' + s.seccion}"
                                th:selected="${nivelId != null and nivelId == s.id}"></option>
                    </select>
                </label>
                <span class="table-card-count"
                      th:text="${(filas != null ? #lists.size(filas) : 0) + ' registros'}">0 registros</span>
            </div>
            <div class="conducta-search-row">
                <div class="conducta-search">
                    <svg class="conducta-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="llamadas-buscar" class="filter-input" type="search" placeholder="Nombre o cédula..."
                           aria-label="Buscar estudiante" autocomplete="off">
                </div>
                <div class="conducta-actions">
                    <button type="button" class="conducta-btn conducta-btn-primary"
                            th:disabled="${avisoPeriodo != null}"
                            hx-get="/conducta/llamadas/form"
                            hx-target="#modal-container"
                            hx-swap="innerHTML"
                            hx-include=".llamadas-filtros"
                            onclick="abrirModalAcademico()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Nueva Llamada
                    </button>
                </div>
            </div>
        </div>
        <div th:if="${avisoPeriodo}" class="form-alert-error" style="margin: 1rem 1.5rem;" th:text="${avisoPeriodo}"></div>
        <div style="overflow-x: auto;">
            <table class="conducta-table">
                <thead>
                    <tr>
                        <th>Estudiante</th>
                        <th>Sección</th>
                        <th>Fecha</th>
                        <th>Motivo</th>
                        <th>Docente</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="llamadas-tbody">
                    <tr th:if="${filas == null or filas.empty}">
                        <td colspan="7" class="empty-state">
                            <div class="empty-icon">📋</div>
                            <div th:text="${avisoPeriodo != null ? avisoPeriodo : 'No hay llamadas de atención en el filtro seleccionado.'}">
                                No hay llamadas
                            </div>
                        </td>
                    </tr>
                    <tr th:each="f : ${filas}"
                        th:attr="data-search=${#strings.toLowerCase(f.estudiante.nombre + ' ' + (f.estudiante.cedula != null ? f.estudiante.cedula : '') + ' ' + f.motivo)}">
                        <td>
                            <div class="student-cell">
                                <div class="student-avatar" th:style="${'background:' + f.colorAvatar}"
                                     th:text="${f.iniciales}">VS</div>
                                <div>
                                    <div style="font-weight:600;color:#0f172a;" th:text="${f.estudiante.nombre}">Nombre</div>
                                    <div style="font-size:0.75rem;color:var(--text-secondary);"
                                         th:text="${f.estudiante.cedula != null ? f.estudiante.cedula : 'Sin cédula'}">cédula</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${f.seccion}">1-A</td>
                        <td th:text="${f.fecha != null ? #temporals.format(f.fecha, 'dd/MM/yyyy') : '—'}">01/01/2026</td>
                        <td th:text="${f.motivo}">Motivo</td>
                        <td th:text="${f.docenteNombre}">Docente</td>
                        <td>
                            <span class="badge-xs" th:classappend="${'badge-' + f.estadoCss}"
                                  th:text="${f.estadoLabel}">Pendiente</span>
                        </td>
                        <td class="actions-cell">
                            <button type="button" class="btn-xs" th:if="${f.puedeResolver}"
                                    style="background:#fef3c7;color:#92400e;padding:5px 12px;border-radius:6px;font-weight:600;border:none;cursor:pointer;"
                                    hx-post="/conducta/llamadas/resolver"
                                    hx-target="#llamadas-panel" hx-swap="innerHTML"
                                    hx-include=".llamadas-filtros" hx-indicator="#llamadas-loading"
                                    hx-confirm="¿Marcar esta llamada de atención como resuelta?"
                                    th:attr="hx-vals=|js:{incidenteId: ${f.id}}|">Resolver</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        (function () {
            var input = document.getElementById('llamadas-buscar');
            var tbody = document.getElementById('llamadas-tbody');
            if (!input || !tbody) return;
            input.addEventListener('input', function () {
                var f = this.value.trim().toLowerCase();
                tbody.querySelectorAll('tr[data-search]').forEach(function (tr) {
                    var hay = !f || (tr.getAttribute('data-search') || '').indexOf(f) !== -1;
                    tr.style.display = hay ? '' : 'none';
                });
            });
        })();
    </script>
</div>
