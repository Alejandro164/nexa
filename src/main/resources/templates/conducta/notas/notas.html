<div th:fragment="content" xmlns:th="http://www.thymeleaf.org" style="position: relative;">
    <div id="notas-loading" class="htmx-indicator panel-loading-overlay">
        <div class="spinner"></div>
        <span>Cargando...</span>
    </div>

    <div class="conducta-stats">
        <div class="stat-card positiva">
            <span class="stat-label">Nota Promedio</span>
            <span class="stat-value" th:text="${resumen != null ? resumen.promedio : 0}">0</span>
            <span style="font-size:0.78rem;color:var(--text-secondary);">Promedio general de conducta</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">Llamadas de Atención</span>
            <span class="stat-value" th:text="${resumen != null ? resumen.llamadas : 0}">0</span>
            <span style="font-size:0.78rem;color:var(--text-secondary);">Este período</span>
        </div>
        <div class="stat-card negativa">
            <span class="stat-label">Boletas Emitidas</span>
            <span class="stat-value" th:text="${resumen != null ? resumen.boletas : 0}">0</span>
            <span style="font-size:0.78rem;color:var(--text-secondary);">Faltas graves</span>
        </div>
    </div>

    <div class="table-card">
        <div class="conducta-toolbar">
            <div class="conducta-filters-row notas-filtros">
                <label class="conducta-field">
                    <span>Período</span>
                    <select class="form-input" name="periodoId" aria-label="Período"
                            hx-get="/conducta/notas" hx-target="#notas-panel" hx-swap="innerHTML"
                            hx-include=".notas-filtros" hx-indicator="#notas-loading">
                        <option th:if="${periodos == null or periodos.empty}" value="" disabled selected>Sin períodos</option>
                        <option th:each="p : ${periodos}" th:value="${p.id}" th:text="${p.codigo}"
                                th:selected="${periodoId != null and periodoId == p.id}"></option>
                    </select>
                </label>
                <label class="conducta-field">
                    <span>Grado</span>
                    <select class="form-input" name="grado" aria-label="Grado"
                            hx-get="/conducta/notas" hx-target="#notas-panel" hx-swap="innerHTML"
                            hx-include=".notas-filtros" hx-indicator="#notas-loading">
                        <option value="">Todos los grados</option>
                        <option th:each="g : ${grados}" th:value="${g}" th:text="${g}"
                                th:selected="${grado != null and grado == g}"></option>
                    </select>
                </label>
                <label class="conducta-field">
                    <span>Sección</span>
                    <select class="form-input" name="nivelId" aria-label="Sección"
                            hx-get="/conducta/notas" hx-target="#notas-panel" hx-swap="innerHTML"
                            hx-include=".notas-filtros" hx-indicator="#notas-loading">
                        <option value="">Todas las secciones</option>
                        <option th:each="s : ${secciones}" th:value="${s.id}"
                                th:text="${s.grado + '-' + s.seccion}"
                                th:selected="${nivelId != null and nivelId == s.id}"></option>
                    </select>
                </label>
                <span class="table-card-count"
                      th:text="${(resumen != null ? resumen.totalEstudiantes : 0) + ' estudiantes'}">0 estudiantes</span>
            </div>
            <div class="conducta-search-row">
                <div class="conducta-search">
                    <svg class="conducta-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="notas-buscar" class="filter-input" type="search" placeholder="Nombre o cédula..."
                           aria-label="Buscar estudiante" autocomplete="off">
                </div>
                <div class="conducta-actions">
                    <button type="button" class="conducta-btn conducta-btn-secondary" onclick="window.print()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        Reporte
                    </button>
                    <button type="button" class="conducta-btn conducta-btn-primary"
                            th:disabled="${avisoPeriodo != null or filas == null or filas.empty}"
                            hx-post="/conducta/notas/enviar"
                            hx-target="#notas-panel" hx-swap="innerHTML"
                            hx-include=".notas-filtros" hx-indicator="#notas-loading"
                            hx-confirm="¿Enviar las notas de conducta del filtro actual a los encargados?">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        Enviar notas
                    </button>
                </div>
            </div>
        </div>
        <div th:if="${avisoPeriodo}" class="form-alert-error" style="margin: 1rem 1.5rem;" th:text="${avisoPeriodo}"></div>
        <div style="overflow-x: auto;">
            <table class="conducta-table">
                <thead>
                    <tr>
                        <th>Estudiante</th>
                        <th>Sección</th>
                        <th>Nota</th>
                        <th>Categoría</th>
                        <th>Observaciones</th>
                        <th>Período</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="notas-tbody">
                    <tr th:if="${filas == null or filas.empty}">
                        <td colspan="7" class="empty-state">
                            <div class="empty-icon">📋</div>
                            <div th:text="${avisoPeriodo != null ? avisoPeriodo : 'No hay estudiantes en el filtro seleccionado.'}">
                                No hay estudiantes
                            </div>
                        </td>
                    </tr>
                    <tr th:each="f : ${filas}"
                        th:attr="data-search=${#strings.toLowerCase(f.estudiante.nombre + ' ' + (f.estudiante.cedula != null ? f.estudiante.cedula : ''))}">
                        <td>
                            <div class="student-cell">
                                <div class="student-avatar" th:style="${'background:' + f.colorAvatar}"
                                     th:text="${f.iniciales}">VS</div>
                                <div>
                                    <div style="font-weight:600;color:#0f172a;" th:text="${f.estudiante.nombre}">Nombre</div>
                                    <div style="font-size:0.75rem;color:var(--text-secondary);"
                                         th:text="${f.estudiante.cedula != null ? f.estudiante.cedula : 'Sin cédula'}">cédula</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${f.seccion}">1-A</td>
                        <td>
                            <span class="nota-num" th:classappend="${'nota-' + f.categoriaCss}"
                                  th:text="${f.nota}">95</span>
                        </td>
                        <td>
                            <span class="badge-xs" th:classappend="${'badge-' + f.categoriaCss}"
                                  th:text="${f.categoria}">Excelente</span>
                        </td>
                        <td th:text="${f.observaciones}">Observaciones</td>
                        <td th:text="${f.periodoCodigo}">II-2026</td>
                        <td class="actions-cell">
                            <button type="button" class="btn-xs primary"
                                    th:title="${f.enviada ? 'Reenviar nota a los encargados' : 'Enviar nota a los encargados'}"
                                    th:text="${f.enviada ? 'Reenviar' : 'Enviar'}"
                                    th:disabled="${avisoPeriodo != null}"
                                    hx-post="/conducta/notas/enviar"
                                    hx-target="#notas-panel" hx-swap="innerHTML"
                                    hx-include=".notas-filtros" hx-indicator="#notas-loading"
                                    th:attr="hx-vals=|js:{estudianteId: ${f.estudiante.id}}|">Enviar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        (function () {
            var input = document.getElementById('notas-buscar');
            var tbody = document.getElementById('notas-tbody');
            if (!input || !tbody) return;
            input.addEventListener('input', function () {
                var f = this.value.trim().toLowerCase();
                tbody.querySelectorAll('tr[data-search]').forEach(function (tr) {
                    var hay = !f || (tr.getAttribute('data-search') || '').indexOf(f) !== -1;
                    tr.style.display = hay ? '' : 'none';
                });
            });
        })();
    </script>
</div>
