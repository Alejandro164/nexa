<!DOCTYPE html>
<!-- Correo de notificación. Estilos en línea y tablas: los clientes de correo ignoran <style> y flexbox. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Notificación</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Segoe UI', Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f1f5f9; padding: 32px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="max-width: 560px; background-color: #ffffff; border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0;">
                    <tr>
                        <td style="background-color: #2d5a87; padding: 22px 28px;">
                            <span style="font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: 0.3px;">Nexa</span>
                            <span style="font-size: 13px; color: #cbd5e1; padding-left: 8px;" th:text="${remitente}">Institución</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 28px 28px 8px;">
                            <h1 style="margin: 0 0 14px; font-size: 20px; line-height: 1.3; color: #0f172a;" th:text="${titulo}">Título</h1>
                            <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #334155; white-space: pre-line;"
                               th:text="${mensaje}">Mensaje</p>
                        </td>
                    </tr>
                    <tr th:if="${enlaceUrl != null}">
                        <td style="padding: 18px 28px 4px;">
                            <a th:href="${enlaceUrl}" th:text="${enlaceTexto}"
                               style="display: inline-block; background-color: #2d5a87; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 600; padding: 11px 22px; border-radius: 999px;">Abrir en Nexa</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 24px 28px 26px;">
                            <p style="margin: 0; padding-top: 16px; border-top: 1px solid #f1f5f9; font-size: 12px; line-height: 1.5; color: #94a3b8;">
                                Este es un mensaje automático de Nexa, por favor no respondas a este correo.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
