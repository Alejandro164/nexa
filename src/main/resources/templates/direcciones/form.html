<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="form-content">
        <div class="modal-backdrop">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h3 class="modal-title"
                        th:text="${institucion.id == null ? 'Nueva institución' : 'Editar institución'}">Institución</h3>
                    <button type="button" class="close-btn"
                        @click="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">&times;</button>
                </div>

                <div class="modal-body">
                    <p th:if="${error != null}"
                        style="margin:0 0 1rem; padding:0.75rem 1rem; border-radius:8px; background:#fef2f2; color:#b91c1c; font-size:0.85rem;"
                        th:text="${error}"></p>
                    <form th:action="@{/direcciones/save}" method="post" hx-post="/direcciones/save"
                        hx-target="#direcciones-list"
                        hx-swap="innerHTML"
                        hx-on::after-request="if (event.detail.successful &amp;&amp; !event.detail.xhr.getResponseHeader('HX-Retarget')) { document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300); }">

                        <input type="hidden" name="institucionId" th:value="${institucion.id}" />

                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label class="form-label"
                                style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Cédula jurídica</label>
                            <input type="text" name="cedula" id="direccion-cedula" class="form-input"
                                th:value="${institucion.cedula}" maxlength="20"
                                placeholder="3-101-123456"
                                onblur="consultarNombreHacienda()"
                                style="padding-left:14px;" />
                            <p id="hacienda-indicador"
                                style="margin:0.4rem 0 0; font-size:0.8rem; color:var(--text-secondary);"></p>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label class="form-label"
                                style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Nombre</label>
                            <input type="text" name="nombre" id="direccion-nombre" class="form-input"
                                th:value="${institucion.nombre}" required placeholder="Ej. Institución Educativa San José"
                                style="padding-left:14px;" />
                        </div>

                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label class="form-label"
                                style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Direcciones</label>
                            <p style="margin:0 0 0.75rem; font-size:0.8rem; color:var(--text-secondary);">
                                Marque las que tiene la institución. Cada una lleva su código presupuestario y queda aislada:
                                estudiantes, docentes y secciones no se copian a las demás.
                            </p>
                            <div th:each="oferta : ${ofertas}"
                                style="display:grid; grid-template-columns: 180px 1fr; gap:0.75rem; align-items:center; margin-bottom:0.75rem;">
                                <label class="checkbox-label">
                                    <input type="checkbox" class="custom-checkbox" name="ofertas"
                                        th:value="${oferta.name()}"
                                        th:checked="${elegidas != null and elegidas.contains(oferta.name())}" />
                                    <span class="custom-checkbox-control">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                            <polyline points="20 6 9 17 4 12"></polyline>
                                        </svg>
                                    </span>
                                    <span th:text="${oferta.etiqueta}">Preescolar</span>
                                </label>
                                <input type="text" class="form-input" th:name="${oferta.name()}"
                                    th:value="${codigos != null ? codigos.get(oferta.name()) : ''}"
                                    placeholder="Código presupuestario" style="padding-left:14px;" />
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label class="form-label"
                                style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Dirección física</label>
                            <input type="text" name="direccion" class="form-input" th:value="${institucion.direccion}"
                                placeholder="Dirección física" style="padding-left:14px;" />
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label"
                                    style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Teléfono</label>
                                <input type="text" name="telefono" class="form-input" th:value="${institucion.telefono}"
                                    placeholder="Ej. 2222-2222" style="padding-left:14px;" />
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label"
                                    style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Correo</label>
                                <input type="email" name="email" class="form-input" th:value="${institucion.email}"
                                    placeholder="correo@institucion.ed.cr" style="padding-left:14px;" />
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label class="checkbox-label">
                                <input type="checkbox" class="custom-checkbox" name="activa" value="true"
                                    th:checked="${institucion.id == null or institucion.activa}" />
                                <span class="custom-checkbox-control">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </span>
                                <span>Institución activa</span>
                            </label>
                        </div>

                        <div class="modal-footer"
                            style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:2rem;">
                            <button type="button" class="btn btn-secondary"
                                @click="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Guardar institución
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script>
            function normalizarIdentificacionHacienda(cedula) {
                var digits = (cedula || '').replace(/\D/g, '');
                if (digits.length < 9 || digits.length > 12) {
                    return null;
                }
                if (digits.length >= 11 && digits.charAt(0) === '3') {
                    return digits.substring(0, 10);
                }
                return digits;
            }

            window.consultarNombreHacienda = function () {
                var cedulaInput = document.getElementById('direccion-cedula');
                var nombreInput = document.getElementById('direccion-nombre');
                var msg = document.getElementById('hacienda-indicador');
                if (!cedulaInput || !nombreInput || !msg) {
                    return;
                }
                var crudo = cedulaInput.value.trim();
                if (!crudo) {
                    msg.textContent = '';
                    return;
                }
                var identificacion = normalizarIdentificacionHacienda(crudo);
                if (!identificacion) {
                    msg.style.color = '#b45309';
                    msg.textContent = 'Ingrese una cédula de 9 a 12 dígitos.';
                    return;
                }
                msg.style.color = 'var(--text-secondary)';
                msg.textContent = 'Consultando Hacienda…';
                fetch('https://api.hacienda.go.cr/fe/ae?identificacion=' + encodeURIComponent(identificacion), {
                    headers: { 'Accept': 'application/json' }
                }).then(function (respuesta) {
                    if (respuesta.status === 404) {
                        throw new Error('No hay contribuyente inscrito con esa cédula.');
                    }
                    if (respuesta.status === 429) {
                        throw new Error('Hacienda está limitando consultas. Intente en unos minutos.');
                    }
                    if (!respuesta.ok) {
                        throw new Error('No se pudo consultar Hacienda. Revise la cédula e intente de nuevo.');
                    }
                    return respuesta.json();
                }).then(function (data) {
                    if (!data || !data.nombre) {
                        msg.style.color = '#b45309';
                        msg.textContent = 'Hacienda no devolvió un nombre para esa cédula.';
                        return;
                    }
                    if (!nombreInput.value.trim()) {
                        nombreInput.value = data.nombre.trim();
                    }
                    msg.style.color = '#15803d';
                    msg.textContent = 'Nombre obtenido de Hacienda.';
                }).catch(function (error) {
                    msg.style.color = '#b45309';
                    msg.textContent = error.message || 'No se pudo contactar el API de Hacienda.';
                });
            };
        </script>
    </div>
</body>

</html>
