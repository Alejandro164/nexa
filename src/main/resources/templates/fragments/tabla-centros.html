<tbody th:fragment="tabla-contenido">
    <tr th:if="${#lists.isEmpty(empresas)}">
        <td colspan="5" class="text-center py-8 text-muted">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-4 text-muted"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                <p>No se encontraron centros educativos.</p>
            </div>
        </td>
    </tr>
    <tr th:each="empresa : ${empresas}" class="hover-bg transition-colors">
        <td>
            <div class="d-flex align-items-center">
                <div class="avatar-sm me-3" style="background: linear-gradient(135deg, var(--primary), var(--accent)); color: white;" th:text="${#strings.substring(empresa.nombre, 0, 1)}"></div>
                <div>
                    <div class="font-medium text-dark" th:text="${empresa.nombre}"></div>
                    <div class="text-sm text-muted" th:text="${empresa.direccion != null ? empresa.direccion : 'Sin dirección'}"></div>
                </div>
            </div>
        </td>
        <td>
            <span class="text-sm" th:text="${empresa.cedula != null ? empresa.cedula : '—'}"></span>
        </td>
        <td>
            <span class="text-sm" th:text="${#sets.size(empresa.usuarios)}"></span>
        </td>
        <td>
            <span class="status-indicator" th:classappend="${empresa.activa ? 'status-active' : 'status-inactive'}"></span>
            <span th:text="${empresa.activa ? 'Activo' : 'Inactivo'}"></span>
        </td>
        <td class="text-right">
            <button class="btn btn-icon text-muted hover-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn btn-icon text-muted hover-danger">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </td>
    </tr>
</tbody>
