<tbody th:fragment="tabla-contenido">
    <tr th:if="${#lists.isEmpty(usuarios)}">
        <td colspan="6" class="text-center py-8 text-muted">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-4 text-muted"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <p>No se encontraron usuarios que coincidan con la búsqueda.</p>
            </div>
        </td>
    </tr>
    <tr th:each="usuario : ${usuarios}" class="hover-bg transition-colors">
        <td>
            <div class="d-flex align-items-center">
                <div class="avatar-sm me-3" th:text="${#strings.substring(usuario.nombre, 0, 1)}"></div>
                <div>
                    <div class="font-medium text-dark" th:text="${usuario.nombre}"></div>
                    <div class="text-sm text-muted" th:text="${usuario.email}"></div>
                </div>
            </div>
        </td>
        <td>
            <span class="text-sm" th:text="${usuario.usuario}"></span>
        </td>
        <td>
            <span class="text-sm" th:text="${usuario.cedula != null ? usuario.cedula : '—'}"></span>
        </td>
        <td>
            <div class="d-flex flex-wrap gap-1">
                <span th:each="rol : ${usuario.roles}"
                      class="badge"
                      th:classappend="${rol.nombre == 'ROLE_ADMIN' ? 'badge-primary' : (rol.nombre == 'ROLE_DIRECTOR' ? 'badge-info' : (rol.nombre == 'ROLE_PADRE' ? 'badge-success' : (rol.nombre == 'ROLE_ESTUDIANTE' ? 'badge-warning' : 'badge-secondary')))}"
                      th:text="${rol.nombre.replace('ROLE_', '')}"></span>
            </div>
        </td>
        <td>
            <span class="status-indicator" th:classappend="${usuario.activo ? 'status-active' : 'status-inactive'}"></span>
            <span th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span>
        </td>
        <td class="text-right">
            <button class="btn btn-icon text-muted hover-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn btn-icon text-muted hover-danger">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </td>
    </tr>
</tbody>
