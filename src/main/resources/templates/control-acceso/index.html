<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Control de Acceso — Nexa</title>
</head>

<body>

    <th:block layout:fragment="page-title">Control de Acceso</th:block>
    <th:block layout:fragment="page-subtitle">Verifica citas, autoriza ingresos y registra visitas en tiempo real</th:block>

    <main layout:fragment="content" th:fragment="htmx-content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .tab-pane {
                animation: fadeIn 0.35s ease-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .search-card {
                background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
                border-radius: 16px;
                padding: 2rem;
                margin-bottom: 1.5rem;
                color: white;
            }
            .search-card h3 {
                font-size: 1.1rem;
                font-weight: 600;
                margin-bottom: 0.25rem;
            }
            .search-card p {
                font-size: 0.85rem;
                color: #94a3b8;
                margin-bottom: 1.25rem;
            }
            .search-input-group {
                display: flex;
                gap: 0.75rem;
                align-items: center;
            }
            .search-input-group input {
                flex: 1;
                padding: 0.85rem 1.25rem;
                border: 2px solid rgba(255,255,255,0.15);
                border-radius: 12px;
                background: rgba(255,255,255,0.08);
                color: white;
                font-size: 1rem;
                font-family: inherit;
                outline: none;
                transition: border-color 0.2s, background 0.2s;
            }
            .search-input-group input::placeholder {
                color: #64748b;
            }
            .search-input-group input:focus {
                border-color: #60a5fa;
                background: rgba(255,255,255,0.12);
            }
            .search-input-group button {
                padding: 0.85rem 1.5rem;
                background: #60a5fa;
                color: white;
                border: none;
                border-radius: 12px;
                font-weight: 600;
                font-size: 0.9rem;
                cursor: pointer;
                font-family: inherit;
                transition: background 0.2s, transform 0.15s;
                white-space: nowrap;
            }
            .search-input-group button:hover {
                background: #3b82f6;
                transform: translateY(-1px);
            }
            .resultado-visita {
                display: flex;
                align-items: center;
                gap: 1rem;
                padding: 1rem 1.25rem;
                border: 1px solid var(--border);
                border-radius: 12px;
                margin-bottom: 0.75rem;
                transition: background 0.15s;
            }
            .resultado-visita:hover {
                background: var(--input-bg);
            }
            .visita-avatar {
                width: 44px;
                height: 44px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 1.1rem;
                flex-shrink: 0;
            }
            .visita-info {
                flex: 1;
                min-width: 0;
            }
            .visita-info h4 {
                font-weight: 600;
                font-size: 0.95rem;
                margin-bottom: 2px;
            }
            .visita-info p {
                font-size: 0.8rem;
                color: var(--text-secondary);
            }
            .visita-acciones {
                display: flex;
                gap: 0.5rem;
                flex-shrink: 0;
            }
            .btn-accion {
                padding: 0.5rem 1rem;
                border-radius: 8px;
                font-size: 0.8rem;
                font-weight: 600;
                cursor: pointer;
                border: none;
                font-family: inherit;
                transition: all 0.15s;
            }
            .btn-autorizar {
                background: #22c55e;
                color: white;
            }
            .btn-autorizar:hover {
                background: #16a34a;
            }
            .btn-denegar {
                background: #ef4444;
                color: white;
            }
            .btn-denegar:hover {
                background: #dc2626;
            }
            .btn-salida {
                background: #f59e0b;
                color: white;
            }
            .btn-salida:hover {
                background: #d97706;
            }
            .sin-resultados {
                text-align: center;
                padding: 2rem;
                color: var(--text-secondary);
            }
            .form-visita {
                max-width: 600px;
            }
            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
                margin-bottom: 1rem;
            }
            @media (max-width: 640px) {
                .form-row {
                    grid-template-columns: 1fr;
                }
                .search-input-group {
                    flex-direction: column;
                }
                .search-input-group button {
                    width: 100%;
                }
            }
            .stats-row {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
                margin-bottom: 1.5rem;
            }
            @media (max-width: 768px) {
                .stats-row {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            .stat-card {
                background: var(--surface-solid);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 1.25rem;
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .stat-icon {
                width: 44px;
                height: 44px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.3rem;
            }
            .stat-value {
                font-size: 1.5rem;
                font-weight: 700;
            }
            .stat-label {
                font-size: 0.78rem;
                color: var(--text-secondary);
            }
            #resultados-busqueda {
                margin-top: 1rem;
            }
        </style>

        <div x-data="{ activeTab: 'verificar' }">

        <!-- Menú Horizontal -->
        <div class="config-tabs-container">
            <div class="config-tabs">
                <button class="config-tab-btn" :class="{ 'active': activeTab === 'verificar' }" @click="activeTab = 'verificar'">
                    🔍 Verificar Cita
                </button>
                <button class="config-tab-btn" :class="{ 'active': activeTab === 'registrar' }" @click="activeTab = 'registrar'">
                    📝 Registrar Visita
                </button>
                <button class="config-tab-btn" :class="{ 'active': activeTab === 'historial' }" @click="activeTab = 'historial'; htmx.ajax('GET', '/control-de-acceso/historial', { target: '#tabla-historial-container', swap: 'outerHTML' })">
                    📋 Historial del Día
                </button>
                <button class="config-tab-btn" :class="{ 'active': activeTab === 'asistencia' }" @click="activeTab = 'asistencia'; htmx.ajax('GET', '/control-de-acceso/asistencia/refresh', { target: '#tabla-asistencia-container', swap: 'outerHTML' })">
                    🕐 Asistencia Personal
                </button>
            </div>
        </div>

        <!-- Contenidos -->
        <div x-show="activeTab === 'verificar'" class="tab-pane">
            <div th:replace="~{control-acceso/verificar/verificar :: content}"></div>
        </div>

        <div x-show="activeTab === 'registrar'" class="tab-pane" x-cloak>
            <div th:replace="~{control-acceso/registrar/registrar :: content}"></div>
        </div>

        <div x-show="activeTab === 'historial'" class="tab-pane" x-cloak>
            <div th:replace="~{control-acceso/historial/historial :: content}"></div>
        </div>

        <div x-show="activeTab === 'asistencia'" class="tab-pane" x-cloak>
            <div th:replace="~{control-acceso/asistencia/asistencia :: content}"></div>
        </div>

        </div>

    </main>

</body>

</html>
