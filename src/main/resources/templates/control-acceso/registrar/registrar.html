<div th:fragment="content">
    <div class="card form-visita" style="margin:0 auto;">
        <div class="card-header">
            <h3 class="card-title">Nueva Visita</h3>
        </div>
        <div style="padding: 2rem;">
            <form th:action="@{/control-de-acceso/registrar}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Identificación (Cédula)</label>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="text" id="identificacionVisita" name="identificacion" class="form-input"
                                style="padding-left:0.75rem; flex:1;" placeholder="Ej: 1-1234-0567">
                            <button type="button" class="btn btn-secondary" style="white-space:nowrap;"
                                    onclick="buscarPadrePorCedula()">🔍 Buscar</button>
                        </div>
                        <p id="buscarPadreMsg" style="font-size:0.8rem; margin-top:4px; min-height:1em;"></p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nombre del Visitante *</label>
                        <input type="text" id="nombreVisitante" name="nombreVisitante" class="form-input" style="padding-left:0.75rem;"
                            required placeholder="Nombre completo">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Motivo de la Visita *</label>
                    <input type="text" name="motivo" class="form-input" style="padding-left:0.75rem;"
                        required placeholder="Ej: Reunión, entregar documentos, etc.">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tipo de Persona a Visitar *</label>
                        <select name="tipoDestinatario" class="form-input" style="padding-left:0.75rem;" required
                                hx-get="/control-de-acceso/personas" hx-trigger="change"
                                hx-target="#campo-persona-container" hx-swap="outerHTML">
                            <option value="DIRECTORA">Directora</option>
                            <option value="DOCENTE" selected>Docente</option>
                            <option value="ADMINISTRATIVO">Administrativo</option>
                        </select>
                    </div>
                    <div class="form-group" id="campo-persona-container" th:fragment="campo-persona">
                        <label class="form-label">Nombre de la Persona *</label>
                        <select name="personaVisitadaId" class="form-input" style="padding-left:0.75rem;" required
                                th:if="${personas != null}">
                            <option value="" disabled selected>Seleccione...</option>
                            <option th:each="p : ${personas}" th:value="${p.id}" th:text="${p.nombre}"></option>
                        </select>
                        <p th:if="${personas != null and personas.empty}"
                           style="font-size:0.8rem; color:var(--text-light); margin-top:4px;">
                            No hay personal disponible de este tipo en la institución.
                        </p>
                    </div>
                </div>
                <div class="form-group" style="display:flex; align-items:center; gap:0.75rem;">
                    <input type="checkbox" name="tieneCita" id="tieneCita" value="true" style="width:18px; height:18px;">
                    <label for="tieneCita" style="font-weight:500; font-size:0.9rem;">¿Tiene cita previa?</label>
                </div>
                <div class="form-group">
                    <label class="form-label">Observaciones</label>
                    <textarea name="observaciones" class="form-input" style="padding-left:0.75rem; min-height:80px; resize:vertical;"
                        placeholder="Información adicional relevante..."></textarea>
                </div>
                <div style="margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem; font-size:0.95rem;">
                        Registrar Visita
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function buscarPadrePorCedula() {
            const cedula = document.getElementById('identificacionVisita').value.trim();
            const msg = document.getElementById('buscarPadreMsg');
            if (!cedula) {
                msg.style.color = 'var(--danger)';
                msg.textContent = 'Ingresá una cédula para buscar.';
                return;
            }
            msg.style.color = 'var(--text-light)';
            msg.textContent = 'Buscando...';
            fetch('/control-de-acceso/buscar-padre?cedula=' + encodeURIComponent(cedula))
                .then(r => r.json())
                .then(data => {
                    if (data.encontrado) {
                        document.getElementById('nombreVisitante').value = data.nombre;
                        document.getElementById('identificacionVisita').value = data.identificacion;
                        msg.style.color = 'var(--success)';
                        msg.textContent = '✅ Padre encontrado: ' + data.nombre;
                        return;
                    }
                    // No es un padre registrado — probamos si ya visitó antes (visitante recurrente).
                    fetch('/control-de-acceso/buscar-visitante?identificacion=' + encodeURIComponent(cedula))
                        .then(r => r.json())
                        .then(v => {
                            if (v.encontrado) {
                                document.getElementById('nombreVisitante').value = v.nombre;
                                msg.style.color = 'var(--success)';
                                msg.textContent = '✅ Visitante ya registrado antes: ' + v.nombre;
                                return;
                            }
                            // Tampoco es un visitante recurrente — probamos con Hacienda (situación tributaria).
                            msg.style.color = 'var(--text-light)';
                            msg.textContent = 'Consultando Hacienda...';
                            fetch('/control-de-acceso/buscar-hacienda?identificacion=' + encodeURIComponent(cedula))
                                .then(r => r.json())
                                .then(h => {
                                    if (h.encontrado) {
                                        document.getElementById('nombreVisitante').value = h.nombre;
                                        msg.style.color = 'var(--success)';
                                        msg.textContent = '✅ Encontrado en Hacienda: ' + h.nombre;
                                    } else {
                                        msg.style.color = 'var(--danger)';
                                        msg.textContent = '⚠️ No se encontró a nadie con esa identificación. Completá el nombre manualmente.';
                                    }
                                })
                                .catch(() => {
                                    msg.style.color = 'var(--danger)';
                                    msg.textContent = '⚠️ No se encontró localmente y Hacienda no respondió. Completá el nombre manualmente.';
                                });
                        });
                })
                .catch(() => {
                    msg.style.color = 'var(--danger)';
                    msg.textContent = 'Error al buscar. Intentá de nuevo.';
                });
        }
    </script>
</div>
