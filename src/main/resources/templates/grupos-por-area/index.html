<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Grupos por Área — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Grupos por Área</h2>
    <p layout:fragment="page-subtitle">Organiza los grupos de cada área académica</p>

    <th:block th:fragment="htmx-content">
    <h2 id="topbar-page-title" hx-swap-oob="true">Grupos por Área</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Organiza los grupos de cada área académica</p>
    <main layout:fragment="content">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Grupos por área</h3>
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Área</th>
                            <th>Grupo</th>
                            <th>Nivel</th>
                            <th>Estudiantes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" class="table-empty">No hay grupos por área.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    </th:block>

</body>

</html>
