<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Configuración — EstudiaFácil</title>
</head>

<body>

    <th:block layout:fragment="page-title">Configuración Institucional</th:block>
    <th:block layout:fragment="page-subtitle">Administra las preferencias, periodos y estructura académica de la institución</th:block>

    <main layout:fragment="content" th:fragment="htmx-content">
        <style>
            /* CSS for the horizontal settings tabs */
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .config-tabs-container::-webkit-scrollbar {
                display: none;
            }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .config-tab-btn svg {
                width: 18px;
                height: 18px;
                flex-shrink: 0;
            }
            .config-tab-fade-in {
                animation: configTabFadeIn 0.35s ease-out;
            }
            @keyframes configTabFadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>

        <div class="configuracion-container" x-data="{ activeTab: '[[${activeTab}]]' || 'centro-educativo' }">
            
            <!-- Horizontal Navigation Tabs -->
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <!-- Tab Centro Educativo -->
                    <a href="#" 
                       class="config-tab-btn"
                       :class="{ 'active': activeTab === 'centro-educativo' }"
                       @click.prevent="activeTab = 'centro-educativo'">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                        <span>Centro Educativo</span>
                    </a>
                    
                    <!-- Tab Año Lectivo -->
                    <a href="#" 
                       class="config-tab-btn"
                       :class="{ 'active': activeTab === 'ano-lectivo' }"
                       @click.prevent="activeTab = 'ano-lectivo'">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <span>Año Lectivo</span>
                    </a>
                    
                    <!-- Tab Períodos -->
                    <a href="#" 
                       class="config-tab-btn"
                       :class="{ 'active': activeTab === 'periodos' }"
                       @click.prevent="activeTab = 'periodos'">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Períodos</span>
                    </a>
                    
                    <!-- Tab Estructura Académica -->
                    <a href="#" 
                       class="config-tab-btn"
                       :class="{ 'active': activeTab === 'estructura-academica' }"
                       @click.prevent="activeTab = 'estructura-academica'">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                        <span>Estructura Académica</span>
                    </a>

                    <!-- Tab Grupos y Secciones -->
                    <a href="#" 
                       class="config-tab-btn"
                       :class="{ 'active': activeTab === 'grupos-secciones' }"
                       @click.prevent="activeTab = 'grupos-secciones'">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <span>Grupos y Secciones</span>
                    </a>

                    <!-- Tab Espacios Físicos -->
                    <a href="#" 
                       class="config-tab-btn"
                       :class="{ 'active': activeTab === 'espacios-fisicos' }"
                       @click.prevent="activeTab = 'espacios-fisicos'">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        <span>Espacios Físicos</span>
                    </a>
                </div>
            </div>

            <!-- Content Area -->
            <div id="configuracion-content" class="config-tab-fade-in">
                <div x-show="activeTab === 'centro-educativo'">
                    <div th:replace="~{configuracion/centro-educativo/centro-educativo :: content}"></div>
                </div>
                <div x-show="activeTab === 'ano-lectivo'" x-cloak>
                    <div th:replace="~{configuracion/ano-lectivo/ano-lectivo :: content}"></div>
                </div>
                <div x-show="activeTab === 'periodos'" x-cloak>
                    <div th:replace="~{configuracion/periodos/periodos :: content}"></div>
                </div>
                <div x-show="activeTab === 'estructura-academica'" x-cloak>
                    <div th:replace="~{configuracion/estructura-academica/estructura-academica :: content}"></div>
                </div>
                <div x-show="activeTab === 'grupos-secciones'" x-cloak>
                    <div th:replace="~{configuracion/grupos-secciones/grupos-secciones :: content}"></div>
                </div>
                <div x-show="activeTab === 'espacios-fisicos'" x-cloak>
                    <div th:replace="~{configuracion/espacios-fisicos/espacios-fisicos :: content}"></div>
                </div>
            </div>

        </div>
    </main>

</body>

</html>
