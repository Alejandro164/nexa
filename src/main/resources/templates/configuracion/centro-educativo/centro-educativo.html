<div th:fragment="content" class="config-tab-fade-in" xmlns:th="http://www.thymeleaf.org">
    
    <style>
        .institution-logo-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding: 1.25rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .institution-logo-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--info));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            box-shadow: var(--shadow);
        }

        .config-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .config-form-grid {
                grid-template-columns: 1fr;
            }
        }

        .config-field-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .config-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .config-input-text {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            background: #ffffff;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .config-input-text:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1);
        }
    </style>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Datos del Centro Educativo</h3>
            <span class="badge badge-primary">Pestaña Activa</span>
        </div>
        <div style="padding: 2rem;">
            
            <div class="institution-logo-container">
                <div class="institution-logo-placeholder">EF</div>
                <div>
                    <h4 style="font-weight: 600; color: var(--text-dark); margin-bottom: 4px;">Logotipo Institucional</h4>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 10px;">Suba una imagen PNG o JPG de máximo 2MB.</p>
                    <div style="display:flex; gap: 8px;">
                        <button class="btn btn-primary" id="btn-upload-logo" style="padding: 6px 12px; font-size: 0.8rem;">Subir nueva imagen</button>
                        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">Eliminar</button>
                    </div>
                </div>
            </div>

            <form id="form-centro-educativo" onsubmit="event.preventDefault();">
                <div class="config-form-grid">
                    <div class="config-field-group">
                        <label class="config-label">Nombre Oficial de la Institución</label>
                        <input type="text" class="config-input-text" id="centro-nombre" value="Liceo Académico EstudiaFácil">
                    </div>
                    
                    <div class="config-field-group">
                        <label class="config-label">Código del Ministerio de Educación</label>
                        <input type="text" class="config-input-text" id="centro-codigo" value="MEP-8842-EF">
                    </div>
                    
                    <div class="config-field-group">
                        <label class="config-label">Correo Electrónico de Contacto</label>
                        <input type="email" class="config-input-text" value="contacto@estudiafacil.ed.cr">
                    </div>
                    
                    <div class="config-field-group">
                        <label class="config-label">Teléfono Principal</label>
                        <input type="text" class="config-input-text" value="+506 2280-4500">
                    </div>

                    <div class="config-field-group" style="grid-column: span 2;">
                        <label class="config-label">Dirección Física Completa</label>
                        <input type="text" class="config-input-text" value="100 metros Norte de la Iglesia Católica, Sabanilla, Montes de Oca, San José, Costa Rica.">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; border-top: 1px solid var(--border); padding-top: 1.5rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" id="btn-save-centro">Guardar Cambios</button>
                </div>
            </form>

        </div>
    </div>

    <!-- Import modular javascript for this page -->
    <script th:src="@{/js/configuracion/centro-educativo/centro-educativo.js}" defer></script>
</div>
