<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="form-content">
        <div class="modal-backdrop">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h3 class="modal-title"
                        th:text="${institucion.id == null ? 'Nueva Institución' : 'Editar Institución'}">Institución
                    </h3>
                    <button type="button" class="close-btn"
                        @click="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">&times;</button>
                </div>

                <div class="modal-body">
                    <form th:action="@{/instituciones/save}" method="post" hx-post="/instituciones/save"
                        hx-target="#instituciones-list"
                        @submit="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">

                        <input type="hidden" name="id" th:value="${institucion.id}" />

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label"
                                    style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Nombre</label>
                                <input type="text" name="nombre" class="form-input" th:value="${institucion.nombre}"
                                    required placeholder="Ej. CTP de San José" style="padding-left:14px;" />
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label"
                                    style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Código
                                    Presupuestario</label>
                                <input type="text" name="codigo" class="form-input" th:value="${institucion.codigo}"
                                    required placeholder="Ej. 4022" style="padding-left:14px;" />
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label class="form-label"
                                style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Dirección</label>
                            <input type="text" name="direccion" class="form-input" th:value="${institucion.direccion}"
                                placeholder="Dirección física" style="padding-left:14px;" />
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label"
                                    style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Teléfono</label>
                                <input type="text" name="telefono" class="form-input" th:value="${institucion.telefono}"
                                    placeholder="Ej. 2222-2222" style="padding-left:14px;" />
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="form-label"
                                    style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500;">Correo
                                    Electrónico</label>
                                <input type="email" name="email" class="form-input" th:value="${institucion.email}"
                                    placeholder="correo@institucion.ed.cr" style="padding-left:14px;" />
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 1.25rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" name="activa"
                                    th:checked="${institucion.id == null ? true : institucion.activa}"
                                    style="width: 16px; height: 16px; cursor: pointer;" />
                                <span
                                    style="font-weight: 500; color: var(--text-primary); font-size: 0.875rem;">Institución
                                    Activa</span>
                            </label>
                        </div>

                        <div class="modal-footer"
                            style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:2rem;">
                            <button type="button" class="btn btn-secondary"
                                @click="document.getElementById('modal-container').classList.remove('show'); setTimeout(() => document.getElementById('modal-container').innerHTML = '', 300)">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Guardar Institución
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
