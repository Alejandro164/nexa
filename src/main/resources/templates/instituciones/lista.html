<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="tabla-instituciones">
        <div class="module-card">
            <div class="module-card-header">
                <h3 class="module-card-title" th:text="'Centros (' + ${centros != null ? #lists.size(centros) : 0} + ')'">Centros (0)</h3>
                <button class="btn-primary"
                        hx-get="/instituciones/form" hx-target="#modal-container" hx-swap="innerHTML"
                        @click="document.getElementById('modal-container').classList.add('show')"
                        style="font-size:0.85rem;padding:8px 16px;">+ Nuevo centro</button>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Direcciones</th>
                        <th>Ubicación</th>
                        <th>Estado</th>
                        <th style="text-align:right;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${centros == null or centros.empty}">
                        <td colspan="5" class="table-empty">No hay centros registrados.</td>
                    </tr>
                    <tr th:each="centro : ${centros}">
                        <td>
                            <div style="font-weight:600;color:#0f172a;" th:text="${centro.nombre}">Centro</div>
                            <div style="font-size:0.8rem;color:#94a3b8;"
                                th:text="${centro.cedula != null ? centro.cedula : centro.email}">cédula</div>
                        </td>
                        <td>
                            <span th:each="inst : ${centro.instituciones}" class="badge-xs badge-activo"
                                  style="margin-right:4px;"
                                  th:text="${inst.oferta != null ? inst.oferta.etiqueta : 'Sin clasificar'}">Primaria</span>
                        </td>
                        <td th:text="${centro.direccion}" style="color:#64748b;">Dirección</td>
                        <td>
                            <span class="badge-xs" th:classappend="${centro.activa ? 'badge-activo' : 'badge-inactivo'}"
                                  th:text="${centro.activa ? 'Activo' : 'Inactivo'}">Estado</span>
                        </td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-xs btn-ghost"
                                        th:attr="hx-get=@{/instituciones/form/{id}(id=${centro.id})}"
                                        hx-target="#modal-container" hx-swap="innerHTML"
                                        @click="document.getElementById('modal-container').classList.add('show')"
                                        title="Editar">✏️</button>
                                <button class="btn-xs btn-danger-ghost"
                                        onclick="abrirConfirmacionAcademica(this)"
                                        th:attr="data-delete-url=@{/instituciones/{id}(id=${centro.id})},data-delete-target='#instituciones-list',data-delete-title='Eliminar centro',data-delete-message='¿Deseas eliminar permanentemente el centro ' + ${centro.nombre} + '? Solo se puede si sus direcciones no tienen personas ni secciones.'"
                                        title="Eliminar">🗑️</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
