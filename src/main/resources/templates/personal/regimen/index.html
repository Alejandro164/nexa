<div th:fragment="content" class="tab-pane" xmlns:th="http://www.thymeleaf.org" x-data="{ subTab: 'TODOS', modalOpen: false,
    abrirForm(id) {
        this.modalOpen = true;
        const url = id ? '/personal/regimen/form/' + id : '/personal/regimen/form';
        htmx.ajax('GET', url, { target: '#modal-container', swap: 'innerHTML' });
    },
    eliminar(id) {
        if (!confirm('¿Eliminar este registro?')) return;
        htmx.ajax('DELETE', '/personal/regimen/' + id, { target: '#regimen-content', swap: 'innerHTML' });
    },
    cambiarEstado(id, estado) {
        htmx.ajax('PUT', '/personal/regimen/' + id + '/estado?estado=' + estado, { target: '.reg-tabla', swap: 'outerHTML' });
    }
}">
    <style>
        .reg-tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
        .reg-tab { flex: 1; text-align: center; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); border-radius: 7px; cursor: pointer; border: none; background: transparent; transition: all 0.2s; white-space: nowrap; }
        .reg-tab:hover { color: var(--primary); background: var(--input-bg); }
        .reg-tab.active { color: #fff; background: var(--primary); }
        .reg-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .reg-card-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
        .reg-card-title { font-size: 1.05rem; font-weight: 700; color: #0f172a; margin: 0; }
        .reg-table { width: 100%; border-collapse: collapse; }
        .reg-table th { text-align: left; padding: 0.65rem 1rem; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; background: #f8fafc; border-bottom: 1px solid var(--border); }
        .reg-table td { padding: 0.7rem 1rem; font-size: 0.84rem; color: #334155; border-bottom: 1px solid #f1f5f9; }
        .reg-table tr:hover td { background: #f8fafc; }
        .reg-empty { text-align: center; padding: 2.5rem !important; color: #94a3b8; font-style: italic; }
        .badge-xs { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; }
        .badge-llamada { background: #fef3c7; color: #92400e; }
        .badge-amonestacion { background: #fee2e2; color: #991b1b; }
        .badge-proceso { background: #fce7f3; color: #9d174d; }
        .badge-pendiente { background: #fef3c7; color: #92400e; }
        .badge-enproceso { background: #dbeafe; color: #1e40af; }
        .badge-resuelto { background: #dcfce7; color: #166534; }
        .badge-apelado { background: #f3e8ff; color: #6b21a8; }
        .btn-xs { padding: 4px 10px; font-size: 0.75rem; border-radius: 6px; font-weight: 500; cursor: pointer; border: none; }
        .btn-ghost { background: transparent; color: var(--primary); }
        .btn-ghost:hover { background: var(--input-bg); }
        .btn-danger-ghost { background: transparent; color: #ef4444; }
        .btn-danger-ghost:hover { background: #fef2f2; }
        .actions-cell { display: flex; gap: 4px; justify-content: flex-end; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .modal-dialog { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid #e2e8f0; }
        .modal-title { margin: 0; font-size: 1.15rem; font-weight: 700; color: #0f172a; }
        .modal-body { padding: 1.5rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; background: #f8fafc; }
        .close-btn { background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 1.4rem; line-height: 1; padding: 4px 8px; border-radius: 6px; }
        .close-btn:hover { color: #0f172a; background: #f1f5f9; }
        .form-group { margin-bottom: 0.9rem; }
        .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: #334155; margin-bottom: 4px; }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; font-family: inherit; }
        .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1); }
        .form-textarea { resize: vertical; min-height: 70px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .btn-primary { padding: 9px 18px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-primary:hover { background: #1e3a5f; }
        .btn-secondary { padding: 9px 18px; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-secondary:hover { background: #e2e8f0; }
    </style>

    <div class="reg-tabs">
        <button class="reg-tab" :class="{ 'active': subTab === 'TODOS' }"
                @click="subTab = 'TODOS'"
                hx-get="/personal/regimen/todos" hx-target="#regimen-content" hx-swap="innerHTML">📋 Todos</button>
        <button class="reg-tab" :class="{ 'active': subTab === 'LLAMADA_ATENCION' }"
                @click="subTab = 'LLAMADA_ATENCION'"
                hx-get="/personal/regimen/llamadas" hx-target="#regimen-content" hx-swap="innerHTML">🟡 Llamadas</button>
        <button class="reg-tab" :class="{ 'active': subTab === 'AMONESTACION' }"
                @click="subTab = 'AMONESTACION'"
                hx-get="/personal/regimen/amonestaciones" hx-target="#regimen-content" hx-swap="innerHTML">🔴 Amonestaciones</button>
        <button class="reg-tab" :class="{ 'active': subTab === 'PROCESO_DISCIPLINARIO' }"
                @click="subTab = 'PROCESO_DISCIPLINARIO'"
                hx-get="/personal/regimen/procesos" hx-target="#regimen-content" hx-swap="innerHTML">⚖️ Procesos</button>
    </div>

    <div id="regimen-content" th:replace="~{personal/regimen/todos/todos :: content}"></div>

    <div id="modal-container" x-show="modalOpen" x-cloak style="display: none;"
         @close-modal.window="modalOpen = false" @keydown.escape.window="modalOpen = false"></div>
</div>
