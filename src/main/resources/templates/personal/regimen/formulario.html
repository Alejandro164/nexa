<div th:fragment="form-content">
    <div class="modal-backdrop" @click.self="$dispatch('close-modal')">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 class="modal-title" th:text="${registro.id == null ? 'Nuevo Registro' : 'Editar Registro'}">Nuevo Registro</h3>
                <button type="button" class="close-btn" @click="$dispatch('close-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form th:action="@{/personal/regimen}" method="post" hx-post="/personal/regimen"
                      hx-target="#regimen-content" hx-swap="innerHTML" @submit="$dispatch('close-modal')">
                    <input type="hidden" name="id" th:value="${registro.id}">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Tipo *</label>
                            <select class="form-select" name="tipo" required>
                                <option value="LLAMADA_ATENCION" th:selected="${registro.tipo != null && registro.tipo.name() == 'LLAMADA_ATENCION'}">Llamada de Atención</option>
                                <option value="AMONESTACION" th:selected="${registro.tipo != null && registro.tipo.name() == 'AMONESTACION'}">Amonestación</option>
                                <option value="PROCESO_DISCIPLINARIO" th:selected="${registro.tipo != null && registro.tipo.name() == 'PROCESO_DISCIPLINARIO'}">Proceso Disciplinario</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Fecha *</label>
                            <input class="form-input" type="date" name="fecha" required th:value="${registro.fecha}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Funcionario *</label>
                        <select class="form-select" name="funcionario.id" required>
                            <option value="" disabled selected>-- Seleccionar --</option>
                            <option th:each="f : ${funcionarios}" th:value="${f.id}"
                                    th:selected="${registro.funcionario != null && registro.funcionario.id == f.id}"
                                    th:text="${f.nombre}">Nombre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Motivo *</label>
                        <input class="form-input" type="text" name="motivo" maxlength="500" required th:value="${registro.motivo}" placeholder="Motivo del registro">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-textarea" name="descripcion" maxlength="2000" th:text="${registro.descripcion}" placeholder="Detalles adicionales..."></textarea>
                    </div>
                    <div class="form-group" th:if="${registro.id != null}">
                        <label class="form-label">Resolución</label>
                        <textarea class="form-textarea" name="resolucion" maxlength="2000" th:text="${registro.resolucion}" placeholder="Resolución del caso..."></textarea>
                    </div>
                    <div class="form-group" th:if="${registro.id != null}">
                        <label class="form-label">Fecha Resolución</label>
                        <input class="form-input" type="date" name="fechaResolucion" th:value="${registro.fechaResolucion}">
                    </div>
                    <div class="modal-footer" style="margin:0 -1.5rem -1.5rem;">
                        <button type="button" class="btn-secondary" @click="$dispatch('close-modal')">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
