<div th:fragment="content" class="tab-pane" xmlns:th="http://www.thymeleaf.org"
     x-data="{
         openModal() {
             const el = document.getElementById('dir-modal-container');
             el.style.display = 'block';
             setTimeout(() => {
                 void el.offsetWidth;
                 el.classList.remove('dir-modal-closing');
                 el.classList.add('dir-modal-visible');
             }, 0);
         },
         closeModal() {
             const el = document.getElementById('dir-modal-container');
             el.classList.remove('dir-modal-visible');
             el.classList.add('dir-modal-closing');
             setTimeout(() => {
                 el.style.display = 'none';
                 el.classList.remove('dir-modal-closing');
             }, 180);
         }
     }">
    <style>
        .dir-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .dir-card-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
        .dir-card-title { font-size: 1.05rem; font-weight: 700; color: #0f172a; margin: 0; }
        .dir-table { width: 100%; border-collapse: collapse; }
        .dir-table th { text-align: left; padding: 0.65rem 1rem; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; background: #f8fafc; border-bottom: 1px solid var(--border); }
        .dir-table td { padding: 0.7rem 1rem; font-size: 0.84rem; color: #334155; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .dir-table tr:hover td { background: #f8fafc; }
        .dir-empty { text-align: center; padding: 2.5rem !important; color: #94a3b8; font-style: italic; }
        .badge-xs { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; margin: 1px; }
        .badge-admin { background: #dbeafe; color: #1e40af; }
        .badge-director { background: #e0f2fe; color: #0369a1; }
        .badge-docente { background: #f1f5f9; color: #475569; }
        .badge-activo { background: #dcfce7; color: #166534; }
        .badge-inactivo { background: #fee2e2; color: #991b1b; }
        .actions-cell { display: flex; gap: 4px; justify-content: flex-end; align-items: center; }
        .btn-xs { padding: 4px 10px; font-size: 0.75rem; border-radius: 6px; font-weight: 500; cursor: pointer; border: none; }
        .btn-ghost { background: transparent; color: var(--primary); }
        .btn-ghost:hover { background: var(--input-bg); }
        .btn-danger-ghost { background: transparent; color: #ef4444; }
        .btn-danger-ghost:hover { background: #fef2f2; }
        .btn-primary { padding: 9px 18px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-primary:hover { background: #1e3a5f; }
        .btn-secondary { padding: 9px 18px; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-secondary:hover { background: #e2e8f0; }
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .modal-dialog { background: #fff; border-radius: 14px; width: 100%; max-width: 540px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid #e2e8f0; }
        .modal-title { margin: 0; font-size: 1.15rem; font-weight: 700; color: #0f172a; }
        .modal-body { padding: 1.5rem; max-height: 70vh; overflow-y: auto; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; background: #f8fafc; }
        .close-btn { background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 1.4rem; line-height: 1; padding: 4px 8px; border-radius: 6px; }
        .close-btn:hover { color: #0f172a; background: #f1f5f9; }
        .form-group { margin-bottom: 0.9rem; }
        .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: #334155; margin-bottom: 4px; }
        .form-input, .form-select { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; font-family: inherit; box-sizing: border-box; }
        .form-input:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1); }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        #dir-modal-container.dir-modal-visible .modal-backdrop { animation: academicModalBackdropIn 180ms ease-out both; }
        #dir-modal-container.dir-modal-visible .modal-dialog { animation: academicModalDialogIn 240ms cubic-bezier(.22, 1, .36, 1) both; }
        #dir-modal-container.dir-modal-closing .modal-backdrop { animation: academicModalBackdropOut 180ms ease-in both; }
        #dir-modal-container.dir-modal-closing .modal-dialog { animation: academicModalDialogOut 180ms ease-in both; }
    </style>

    <div id="dir-content" th:insert="~{personal/directorio/lista :: content}"></div>

    <div id="dir-modal-container" style="display:none;"
         @close-modal.window="closeModal()"
         @open-modal.window="openModal()"
         @keydown.escape.window="closeModal()"></div>
</div>
