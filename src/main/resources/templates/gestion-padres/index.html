<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Padres — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Módulo de Padres</h2>
    <p layout:fragment="page-subtitle">Gestiona los padres de familia registrados en la institución</p>

    <th:block th:fragment="htmx-content">
    <!-- OOB: al navegar por htmx solo se reemplaza .content-area, así que el título del topbar
         (fuera de ese contenedor) se sincroniza aparte para que no se quede con el de la página anterior. -->
    <h2 id="topbar-page-title" hx-swap-oob="true">Módulo de Padres</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Gestiona los padres de familia registrados en la institución</p>
    <main layout:fragment="content">
        <style>
            .config-tabs-container {
                margin-bottom: 2rem;
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 6px;
                display: flex;
                width: 100%;
                box-shadow: var(--shadow-sm);
                overflow-x: auto;
            }
            .config-tabs {
                display: flex;
                width: 100%;
                gap: 6px;
            }
            .config-tab-btn {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-secondary);
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.25s ease;
                cursor: pointer;
                border: none;
                background: transparent;
                white-space: nowrap;
            }
            .config-tab-btn:hover {
                color: var(--primary);
                background-color: var(--input-bg);
            }
            .config-tab-btn.active {
                color: white !important;
                background-color: var(--primary) !important;
                box-shadow: 0 4px 14px rgba(45, 90, 135, 0.25);
            }
            .tab-pane {
                animation: fadeIn 0.35s ease-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>

        <div x-data="{ activeTab: 'registrados' }">
            <div class="config-tabs-container">
                <div class="config-tabs">
                    <button class="config-tab-btn" :class="{ 'active': activeTab === 'registrados' }"
                            @click="activeTab = 'registrados'"
                            hx-get="/padres/registrados" hx-target="#padres-content" hx-swap="innerHTML">
                        👨‍👩‍👧 Padres Registrados
                    </button>
                </div>
            </div>

            <div id="padres-content" class="tab-pane" hx-get="/padres/registrados" hx-trigger="load" hx-swap="innerHTML">
            </div>
        </div>

        <div th:replace="~{configuracion-academica/components/confirmar-eliminacion :: modal}"></div>
    </main>
    </th:block>

</body>

</html>
