<div th:fragment="content" id="impresiones-imprimir-panel" xmlns:th="http://www.thymeleaf.org">
    <div class="card">
        <div class="card-header">
            <div>
                <h3 class="card-title">Imprimir</h3>
                <p class="academic-help">Documentos que el departamento tiene que imprimir.</p>
            </div>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>Documento</th>
                        <th>Tipo</th>
                        <th>Copias</th>
                        <th>Tamaño</th>
                        <th>Para cuándo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="table-empty">No hay documentos para imprimir.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
