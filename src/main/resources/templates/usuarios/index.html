<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Usuarios — Nexa</title>
</head>

<body>

    <h2 layout:fragment="page-title">Usuarios</h2>
    <p layout:fragment="page-subtitle">Gestión de cuentas de usuario de todas las instituciones</p>

    <th:block th:fragment="htmx-content">
    <!-- OOB: al navegar por htmx solo se reemplaza .content-area, así que el título del topbar
         (fuera de ese contenedor) se sincroniza aparte para que no se quede con el de la página anterior. -->
    <h2 id="topbar-page-title" hx-swap-oob="true">Usuarios</h2>
    <p id="topbar-page-subtitle" hx-swap-oob="true">Gestión de cuentas de usuario de todas las instituciones</p>
    <main layout:fragment="content"
          x-data="{
              openModal(id) {
                  const el = document.getElementById(id);
                  el.style.display = 'block';
                  setTimeout(() => {
                      void el.offsetWidth;
                      el.classList.remove('dir-modal-closing');
                      el.classList.add('dir-modal-visible');
                  }, 0);
              },
              closeModal(id) {
                  const el = document.getElementById(id);
                  el.classList.remove('dir-modal-visible');
                  el.classList.add('dir-modal-closing');
                  setTimeout(() => {
                      el.style.display = 'none';
                      el.classList.remove('dir-modal-closing');
                  }, 180);
              }
          }"
          @open-modal.window="openModal('usuarios-modal-container')"
          @close-modal.window="closeModal('usuarios-modal-container')"
          @keydown.escape.window="closeModal('usuarios-modal-container')">

        <div class="card" style="margin-bottom:1rem;">
            <div class="card-header">
                <h3 class="card-title">Buscar Usuario</h3>
                <div class="search-box">
                    <input type="text" class="form-input" name="q" placeholder="Buscar por nombre, email o cédula..."
                           th:value="${q}"
                           hx-get="/usuarios/lista"
                           hx-trigger="keyup changed delay:400ms, search"
                           hx-target="#usuarios-content" hx-swap="innerHTML">
                </div>
            </div>
        </div>

        <div id="usuarios-content" th:insert="~{usuarios/lista :: content}"></div>

        <div id="usuarios-modal-container" style="display:none;"></div>

        <script>
            if (!window.usuariosEventsRegistrados) {
                document.addEventListener('usuarioError', function (event) {
                    if (typeof showNotification === 'function' && event.detail && event.detail.mensaje) {
                        showNotification(event.detail.mensaje, 'error');
                    }
                });
                window.usuariosEventsRegistrados = true;
            }
        </script>

    </main>
    </th:block>

</body>

</html>
