<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{index}">

<head>
    <title>Nube Nexa</title>
</head>

<body>

    <th:block layout:fragment="page-title">☁️ Nube Nexa</th:block>
    <th:block layout:fragment="page-subtitle">Gestiona tus documentos, plantillas y archivos institucionales en la nube</th:block>

    <main layout:fragment="content" th:fragment="htmx-content">
        <style>
            /* Nube Nexa UI Styles */
            .nube-container {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 70vh;
            }

            .nube-toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #ffffff;
                padding: 1rem 1.5rem;
                border-radius: 12px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow-sm);
            }

            .nube-breadcrumbs {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.95rem;
                font-weight: 500;
                color: var(--text-secondary);
            }

            .nube-breadcrumbs a {
                color: var(--text-secondary);
                text-decoration: none;
                transition: color 0.2s;
                cursor: pointer;
            }

            .nube-breadcrumbs a:hover {
                color: var(--primary);
            }

            .nube-breadcrumbs .active {
                color: var(--text-primary);
                font-weight: 600;
            }

            .nube-actions {
                display: flex;
                gap: 1rem;
                align-items: center;
            }

            .nube-search {
                position: relative;
                width: 300px;
            }

            .nube-search input {
                width: 100%;
                padding: 8px 16px 8px 36px;
                border-radius: 20px;
                border: 1px solid var(--border);
                background: var(--input-bg);
                font-size: 0.9rem;
                transition: all 0.2s;
            }

            .nube-search input:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(45, 90, 135, 0.1);
            }

            .nube-search svg {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-light);
            }

            /* Grid Layout for Files/Folders */
            .nube-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1.5rem;
            }

            /* Section Titles */
            .nube-section-title {
                font-size: 1rem;
                font-weight: 600;
                color: var(--text-secondary);
                margin-bottom: 0.5rem;
                margin-top: 1rem;
                border-bottom: 1px solid var(--border);
                padding-bottom: 0.5rem;
            }

            /* Cards */
            .item-card {
                background: #ffffff;
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1.25rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                cursor: pointer;
                transition: all 0.2s ease;
                position: relative;
            }

            .item-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
                border-color: var(--primary);
            }

            .item-card.folder-card {
                flex-direction: row;
                padding: 1rem 1.25rem;
                align-items: center;
                justify-content: flex-start;
            }

            .item-icon {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .folder-card .item-icon svg {
                width: 32px;
                height: 32px;
                color: #0ea5e9;
                fill: rgba(14, 165, 233, 0.2);
            }

            .file-card .item-icon svg {
                width: 48px;
                height: 48px;
            }

            .item-details {
                text-align: center;
                width: 100%;
            }

            .folder-card .item-details {
                text-align: left;
            }

            .item-name {
                font-size: 0.9rem;
                font-weight: 600;
                color: var(--text-primary);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                width: 100%;
            }

            .item-meta {
                font-size: 0.75rem;
                color: var(--text-secondary);
                margin-top: 4px;
            }

            /* Context Menu Icon */
            .item-options {
                position: absolute;
                top: 8px;
                right: 8px;
                color: var(--text-light);
                padding: 4px;
                border-radius: 50%;
                opacity: 0;
                transition: opacity 0.2s, background 0.2s;
            }

            .item-card:hover .item-options {
                opacity: 1;
            }

            .item-options:hover {
                background: var(--input-bg);
                color: var(--text-primary);
            }

        </style>

        <div class="nube-container" id="nube-container">
            
            <div th:fragment="nube-content-area" id="nube-content-area" style="width: 100%;">
                <!-- Toolbar -->
                <div class="nube-toolbar">
                    <div class="nube-breadcrumbs">
                        <a hx-get="/nube-nexa" hx-target="#nube-content-area" hx-swap="outerHTML">Mi Unidad</a>
                        
                        <th:block th:if="${breadcrumbs != null}">
                            <th:block th:each="bc : ${breadcrumbs}">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                <a th:hx-get="@{/nube-nexa/carpeta/{id}(id=${bc.id})}" hx-target="#nube-content-area" hx-swap="outerHTML"
                                   th:text="${bc.nombre}"
                                   th:class="${bc.id == carpetaActual?.id ? 'active' : ''}">Carpeta</a>
                            </th:block>
                        </th:block>
                    </div>

                    <div class="nube-actions">
                        <div class="nube-search">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" placeholder="Buscar en Nube Nexa...">
                        </div>
                        
                        <!-- Simple Form to Create Folder -->
                        <form hx-post="/nube-nexa/crear-carpeta" hx-target="#nube-content-area" hx-swap="outerHTML" style="display: flex; gap: 8px;">
                            <input type="hidden" name="padreId" th:value="${carpetaActual?.id}">
                            <input type="text" name="nombre" placeholder="Nombre carpeta" required 
                                   style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);">
                            <button type="submit" class="btn btn-primary" style="display: flex; align-items: center; gap: 8px; border-radius: 8px; padding: 8px 16px;">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                Crear
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Content Area -->
                <div style="margin-top: 1.5rem;">
                    
                    <div class="nube-section-title" th:if="${!carpetas.isEmpty()}">Carpetas</div>
                    <div class="nube-grid" th:if="${!carpetas.isEmpty()}">
                        
                        <!-- Folder Items -->
                        <div class="item-card folder-card" th:each="carpeta : ${carpetas}" 
                             th:hx-get="@{/nube-nexa/carpeta/{id}(id=${carpeta.id})}" 
                             hx-target="#nube-content-area" hx-swap="outerHTML">
                            <div class="item-icon">
                                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                            <div class="item-details">
                                <div class="item-name" th:text="${carpeta.nombre}">Nombre</div>
                                <div class="item-meta">
                                    <div th:text="${#temporals.format(carpeta.fechaCreacion, 'dd MMM yyyy')}" style="margin-bottom: 2px;">12 May 2026</div>
                                    <div th:text="${carpeta.hijos.size() == 0 ? 'Vacía' : (carpeta.hijos.size() + ' elemento' + (carpeta.hijos.size() > 1 ? 's' : ''))}" style="color: var(--primary); font-weight: 500;">3 elementos</div>
                                </div>
                            </div>
                            <div class="item-options" onclick="event.stopPropagation()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                            </div>
                        </div>

                    </div>

                    <div class="nube-section-title" style="margin-top: 2rem;" th:if="${!archivos.isEmpty()}">Archivos</div>
                    <div class="nube-grid" th:if="${!archivos.isEmpty()}">
                        
                        <!-- File Items -->
                        <div class="item-card file-card" th:each="archivo : ${archivos}">
                            <div class="item-options">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                            </div>
                            
                            <!-- Default Icon for now -->
                            <div class="item-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            </div>
                            <div class="item-details">
                                <div class="item-name" th:title="${archivo.nombre}" th:text="${archivo.nombre}">Archivo</div>
                                <div class="item-meta" th:text="${archivo.extension + ' • ' + (archivo.tamanoBytes != null ? (archivo.tamanoBytes/1024) + ' KB' : '0 KB')}">PDF • 2 MB</div>
                            </div>
                        </div>

                    </div>
                    
                    <!-- Empty State -->
                    <div th:if="${carpetas.isEmpty() and archivos.isEmpty()}" style="text-align: center; padding: 4rem 2rem; color: var(--text-secondary);">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 1rem; opacity: 0.5;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        <p style="font-size: 1.1rem; font-weight: 500;">Esta carpeta está vacía</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">Crea una nueva carpeta para empezar a organizar.</p>
                    </div>

                </div>
            </div>
        </div>
    </main>

</body>

</html>
