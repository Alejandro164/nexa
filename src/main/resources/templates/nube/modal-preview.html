<!-- Modal Preview Fragment -->
<div th:fragment="modal">
    <div class="modal-overlay" x-show="previewModalOpen" style="display: none; z-index: 1000;" :class="{ 'show-modal': previewModalOpen }">
        <div class="modal-content" style="max-width: 90vw; width: 900px; max-height: 90vh; display: flex; flex-direction: column;" @click.outside="closePreviewModal()">
            <div class="modal-header" style="flex-shrink: 0; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
                <h3 style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 90%;" x-text="previewName">Vista Previa</h3>
                <button @click="closePreviewModal()" class="close-btn" type="button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="modal-body" style="flex-grow: 1; overflow: hidden; display: flex; justify-content: center; align-items: center; padding: 1rem 0 0 0; min-height: 400px; background-color: #f8fafc; border-radius: 0 0 12px 12px;">
                
                <!-- PDF / Text Viewer -->
                <template x-if="['pdf', 'text'].includes(previewType) && previewId">
                    <iframe :src="'/nube-nexa/ver/' + previewId" style="width: 100%; height: 70vh; border: none; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);"></iframe>
                </template>

                <!-- Image Viewer -->
                <template x-if="previewType === 'image' && previewId">
                    <img :src="'/nube-nexa/ver/' + previewId" style="max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
                </template>

                <!-- Video Viewer -->
                <template x-if="previewType === 'video' && previewId">
                    <video :src="'/nube-nexa/ver/' + previewId" controls style="max-width: 100%; max-height: 70vh; border-radius: 8px; width: 100%; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); background: black;"></video>
                </template>

                <!-- Audio Viewer -->
                <template x-if="previewType === 'audio' && previewId">
                    <div style="width: 100%; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center;">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                        <audio :src="'/nube-nexa/ver/' + previewId" controls style="width: 100%;"></audio>
                    </div>
                </template>

                <!-- Unsupported / Office Viewer -->
                <template x-if="previewType === 'unsupported' && previewId">
                    <div style="text-align: center; padding: 4rem 2rem;">
                        <div style="width: 80px; height: 80px; background-color: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                        </div>
                        <h4 style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;">Vista previa no disponible</h4>
                        <p style="color: var(--text-secondary); max-width: 400px; margin: 0 auto 2rem auto; line-height: 1.5;">
                            El navegador no soporta la vista previa nativa para archivos <strong><span x-text="previewExtension"></span></strong> de manera local. Por favor, descarga el archivo para verlo.
                        </p>
                        <a :href="'/nube-nexa/descargar/' + previewId" class="btn-create" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.5rem; font-weight: 500;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            Descargar Archivo
                        </a>
                    </div>
                </template>

            </div>
        </div>
    </div>
</div>
