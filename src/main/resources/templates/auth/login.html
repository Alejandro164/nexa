<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — AdminPro</title>
    <meta name="description" content="Accede a tu panel de administración de forma segura.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:       hsl(250, 84%, 65%);
            --primary-dark:  hsl(250, 84%, 50%);
            --primary-glow:  hsl(250, 84%, 65%, 0.35);
            --accent:        hsl(195, 85%, 60%);
            --bg-dark:       hsl(230, 25%, 8%);
            --bg-card:       hsl(230, 20%, 13%);
            --border:        hsl(230, 20%, 22%);
            --text-primary:  hsl(220, 15%, 95%);
            --text-muted:    hsl(220, 10%, 60%);
            --success:       hsl(145, 65%, 52%);
            --error:         hsl(355, 75%, 60%);
            --input-bg:      hsl(230, 20%, 17%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* ── Fondo animado ── */
        .bg-orbs {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: drift 18s ease-in-out infinite;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--primary); top: -120px; left: -150px; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: var(--accent); bottom: -100px; right: -100px; animation-delay: -6s; }
        .orb-3 { width: 300px; height: 300px; background: hsl(320,80%,60%); top: 40%; left: 55%; animation-delay: -12s; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%       { transform: translate(30px, -20px) scale(1.05); }
            66%       { transform: translate(-20px, 30px) scale(0.97); }
        }

        /* ── Card ── */
        .login-card {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            background: linear-gradient(135deg,
                hsl(230,20%,15%,0.9) 0%,
                hsl(230,20%,11%,0.95) 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 40px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px hsl(250,84%,65%,0.08),
                0 24px 60px hsl(0,0%,0%,0.5);
            animation: slideUp 0.5s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Logo ── */
        .logo-wrap {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .logo-text { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.5px; }
        .logo-text span { color: var(--primary); }

        h1 { font-size: 1.55rem; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; }

        /* ── Alerts ── */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .alert-error  { background: hsl(355,75%,60%,0.12); border: 1px solid hsl(355,75%,60%,0.3); color: hsl(355,75%,75%); }
        .alert-success{ background: hsl(145,65%,52%,0.12); border: 1px solid hsl(145,65%,52%,0.3); color: hsl(145,65%,68%); }

        /* ── Form ── */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.4px; text-transform: uppercase; }

        .input-wrap { position: relative; }
        .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); transition: color .2s;
            pointer-events: none;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border-color .2s, box-shadow .2s;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        input:focus + .input-icon, /* fallback order fix: icon after input in DOM */
        .input-wrap:focus-within .input-icon { color: var(--primary); }

        /* Password toggle */
        .pwd-toggle {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); transition: color .2s; padding: 4px;
        }
        .pwd-toggle:hover { color: var(--text-primary); }

        /* ── Submit button ── */
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: opacity .2s, transform .1s, box-shadow .2s;
            box-shadow: 0 4px 20px var(--primary-glow);
            margin-top: 8px;
        }
        .btn-login:hover  { opacity: 0.92; box-shadow: 0 6px 28px var(--primary-glow); }
        .btn-login:active { transform: scale(0.985); }

        /* ── Footer ── */
        .card-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="login-card" x-data="{ showPassword: false }">

        <div class="logo-wrap">
            <div class="logo-icon">🚀</div>
            <div class="logo-text">Admin<span>Pro</span></div>
        </div>

        <h1>Bienvenido de nuevo</h1>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <!-- Mensaje de error -->
        <div th:if="${errorMsg}" class="alert alert-error" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${errorMsg}"></span>
        </div>

        <!-- Mensaje de logout -->
        <div th:if="${logoutMsg}" class="alert alert-success" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${logoutMsg}"></span>
        </div>

        <form id="login-form" th:action="@{/login}" method="post" autocomplete="on">
            <!-- CSRF Token (Spring Security lo inyecta automáticamente con Thymeleaf) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <div class="input-wrap">
                    <input
                        id="email"
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="usuario@empresa.com"
                        required
                        autofocus>
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <input
                        id="password"
                        :type="showPassword ? 'text' : 'password'"
                        name="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required>
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <button type="button" class="pwd-toggle" @click="showPassword = !showPassword"
                            :aria-label="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                        <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg x-show="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button id="btn-iniciar-sesion" type="submit" class="btn-login">
                Iniciar sesión
            </button>
        </form>

        <div class="card-footer">
            &copy; 2025 AdminPro — Panel de Administración
        </div>
    </div>

</body>
</html>
