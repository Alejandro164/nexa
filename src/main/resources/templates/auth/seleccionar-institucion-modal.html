<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="modal-content">
        <div class="inst-modal-backdrop">
            <div class="inst-modal-card">
                <div class="inst-modal-header">
                    <div class="inst-modal-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                             stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </div>
                    <h2>Selecciona tu institución</h2>
                    <p>Tu cuenta tiene acceso a varias instituciones. Elige con cuál deseas trabajar.</p>
                </div>

                <div th:if="${instituciones == null or instituciones.empty}" class="inst-modal-empty">
                    No tienes instituciones asignadas.
                </div>

                <div class="inst-modal-list" th:if="${instituciones != null and not instituciones.empty}">
                    <form th:each="inst : ${instituciones}" th:action="@{/inicio/cambiar-institucion}" method="post"
                          class="inst-modal-item-form">
                        <input type="hidden" name="institucionId" th:value="${inst.id}" />
                        <button type="submit" class="inst-modal-item">
                            <div class="inst-modal-item-icon">
                                <span th:text="${#strings.substring(inst.nombre, 0, 1)}">I</span>
                            </div>
                            <div class="inst-modal-item-info">
                                <div class="inst-modal-item-name" th:text="${inst.nombre}">Nombre</div>
                                <div class="inst-modal-item-code" th:text="${inst.codigo}">Código</div>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 style="flex-shrink: 0;">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </form>
                </div>

                <div class="inst-modal-footer">
                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="inst-modal-cancel">¿No es tu cuenta? Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
