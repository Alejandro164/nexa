# =============================================
# Perfil DESARROLLO
# Activo cuando SPRING_PROFILES_ACTIVE=dev
# =============================================

server.port=8080

# Base de datos (dentro de Docker usa el hostname "db")
spring.datasource.url=jdbc:postgresql://localhost:5432/nexa
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# HikariCP
spring.datasource.hikari.pool-name=JuntasHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# Sesión en memoria — sin Redis en desarrollo
spring.session.store-type=none

# Cache deshabilitado en desarrollo
spring.cache.type=none

# --- CONFIGURACIÓN EXPERTA PARA HOT-RELOAD EN DOCKER ---
# Desactivar cache de plantillas para ver cambios en HTML al refrescar
spring.thymeleaf.cache=false

# Leer directamente del código fuente (ideal para Docker con volumen montado)
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.web.resources.static-locations=file:src/main/resources/static/

# DevTools: restart habilitado para hot-reload de código Java
# (sin Redis en sesiones no hay ClassCastException con RestartClassLoader)
spring.devtools.restart.enabled=true
# Polling porque los eventos inotify no atraviesan el volumen montado en Mac/Windows
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
# Rutas adicionales a vigilar
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
# LiveReload para el navegador
spring.devtools.livereload.enabled=true

# Desactivar cache de recursos estáticos (CSS, JS) en el navegador para dev
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true

# Ruta de archivos (montada como volumen en Docker)
ruta.recursos=/home/datos-nexa

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
