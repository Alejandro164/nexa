# =============================================
# Perfil PRODUCCIÓN
# Activo cuando SPRING_PROFILES_ACTIVE=prod
# =============================================

server.port=8080

# Base de datos (inyectada vía variables de entorno en docker-compose.prod.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — el esquema se gestiona por migración, no se autogenera en prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HikariCP
spring.datasource.hikari.pool-name=NexaHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# Redis — sesión y caché
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.session.store-type=redis

# Thymeleaf — cache de plantillas activo
spring.thymeleaf.cache=true

# Recursos estáticos — cache en navegador (1 día)
spring.web.resources.cache.period=86400

# Compresión de respuestas (gzip)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Ruta de archivos (volumen persistente en Docker)
ruta.recursos=/home/datos-nexa

# SMTP para envío de correo (ej. emisión de Oficios). Configurar estas variables de
# entorno en el servidor con las credenciales reales del proveedor SMTP antes de emitir oficios.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
mail.from.address=${MAIL_FROM_ADDRESS:noreply@nexa.local}
mail.from.name=${MAIL_FROM_NAME:Nexa}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
