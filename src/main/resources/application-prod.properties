# =============================================
# Perfil PRODUCCIÓN
# Activo cuando SPRING_PROFILES_ACTIVE=prod
# =============================================

server.port=8080

# Base de datos (hostname "db" dentro del compose)
spring.datasource.url=jdbc:postgresql://db:5432/project_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool optimizado para producción
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf con caché activado
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# DevTools desactivado en producción
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Logs mínimos en producción
logging.level.root=WARN
logging.level.com.empresa=INFO

# Redis — contenedor Docker (hostname "redis" en compose)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
