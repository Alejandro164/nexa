# Configuración base compartida entre todos los perfiles
# Las propiedades específicas de Redis están en application-prod.properties
spring.application.name=nexa

# Perfil activo por defecto (sobreescrito por SPRING_PROFILES_ACTIVE en Docker)
spring.profiles.active=dev

# Session del contenedor — 1 hora con expiración deslizante
server.servlet.session.timeout=60m
server.servlet.session.cookie.max-age=60m

# Limites de subida de archivos (necesario para PDFs y archivos grandes)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Desactivar Open Session in View (OSIV) para evitar retener conexiones de base de datos
# spring.jpa.open-in-view=false     --Se requiero configurarlo para qeu se pueda aplicar---

