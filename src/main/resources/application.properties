# Configuración base — las propiedades específicas
# están en application-dev.properties y application-prod.properties
spring.application.name=proyecto

# Perfil activo por defecto (sobreescrito por SPRING_PROFILES_ACTIVE en Docker)
spring.profiles.active=dev

# Spring Session — almacenamiento en Redis
spring.session.store-type=redis
spring.session.timeout=60m
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# Session del contenedor — 1 hora con expiración deslizante
server.servlet.session.timeout=60m
server.servlet.session.cookie.max-age=60m

# Spring Cache — TTL por defecto (sobrescrito en CacheConfig si es necesario)
spring.cache.redis.time-to-live=15m
spring.cache.redis.cache-null-values=false
