name: Deploy a producción

on:
  # Sábado 00:00 hora de Costa Rica (UTC-6) = sábado 06:00 UTC
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag o rama a desplegar (vacío = último build exitoso en main)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolver la versión a desplegar
        id: ultimo_build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_MANUAL: ${{ github.event.inputs.ref }}
        run: |
          if [ -n "$REF_MANUAL" ]; then
            sha="$REF_MANUAL"
            echo "Versión elegida manualmente: $sha"
          else
            sha=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha')
            if [ -z "$sha" ] || [ "$sha" = "null" ]; then
              echo "No hay ningún build exitoso registrado en main todavía." >&2
              exit 1
            fi
            echo "Último build exitoso: $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout (versión resuelta arriba)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ultimo_build.outputs.sha }}

      - name: Cargar llave SSH de despliegue
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Confiar en el host remoto
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sincronizar código (sin secretos ni build)
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            --exclude '.git/' \
            --exclude 'target/' \
            --exclude '.idea/' \
            --exclude '.vscode/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.log' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.REMOTE_DIR }}/"

      - name: Escribir .env de producción en el servidor
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "umask 077; cat > '${{ secrets.REMOTE_DIR }}/.env' <<'EOF'
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          APP_PORT=${{ vars.APP_PORT || '8082' }}
          EOF
          chmod 600 '${{ secrets.REMOTE_DIR }}/.env'"

      - name: Build y arranque (docker compose)
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.REMOTE_DIR }}' && \
             docker compose -f docker-compose.prod.yml --env-file .env up -d --build --remove-orphans && \
             docker compose -f docker-compose.prod.yml ps"
