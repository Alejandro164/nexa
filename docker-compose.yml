version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: project_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: project_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: project_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: proyecto_dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/project_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DEVTOOLS_RESTART_ENABLED: false
    ports:
      - "8082:8080" # App (host:container)
      - "5005:5005" # Debug remoto (IntelliJ / VS Code)
    volumes:
      # Monta el código fuente completo para hot reload
      - .:/app
      # Cache de Maven para no descargar en cada rebuild
      - maven_cache:/root/.m2
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data:
  maven_cache:
