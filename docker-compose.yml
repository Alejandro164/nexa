services:
  db:
    image: postgres:15-alpine
    container_name: nexa_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: nexa
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      # Script de seed: se ejecuta automáticamente la primera vez (volumen vacío)
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexa_redis_dev
    profiles: ["prod"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: nexa_mailpit_dev
    ports:
      - "8025:8025" # UI web: ver los correos capturados
      - "1025:1025" # SMTP
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nexa_dev
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nexa
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DEVTOOLS_RESTART_ENABLED: true
      # Correo de pruebas: Mailpit captura lo que se "envía" en dev, no sale a internet.
      # Ver los correos en http://localhost:8025
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8082:8080" # App (host:container)
      - "5005:5005" # Debug remoto (IntelliJ / VS Code)
    volumes:
      # Monta el código fuente completo para hot reload
      - .:/app
      # Cache de Maven para no descargar en cada rebuild
      - maven_cache:/root/.m2
      # Archivos de NubeNexa y uploads — volumen persistente dentro de Docker (sin bind mount al host)
      - datos_nexa_dev:/home/datos-nexa
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data:
  maven_cache:
  datos_nexa_dev:
